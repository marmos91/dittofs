# Every row the journal's conformance suite answers to, mapped to the tests that check it, to
# the epic that owns it, or to both when the row is split. trace_test.go parses the rows from
# the RFC files and the tests from the conformance package, and fails on a row with no entry,
# an entry for a row that is gone, a test that does not exist, or a test in no entry. A test
# that turns green leaves known.yaml and stays here. "pending: 2.x" names the subtask whose
# test is not written yet; the subtask removes it when the test lands.
