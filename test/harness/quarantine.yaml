# test/harness/quarantine.yaml: flaky tests, failing on some runs and not others. A test listed
# here still runs and its result is recorded, graded quarantined, but its failure never fails a run
# and never alerts. Each entry names the test's suite (its options included), the test (matched as
# a known file's entry is), the issue tracking the flake, and the date the entry expires: from that
# day it excuses nothing, and dt doctor and the lint fail on it.
#
#   - { suite: integration, test: TestName, issue: "#1234", expires: 2026-12-31 }
