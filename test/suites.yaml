# test/suites.yaml: every test suite, one entry each. `dt list` prints it; `dt plan` expands it.
# Format and rules: docs/internals/rfcs/rfc-29-test-harness.md.
version: 1

defaults:            # any suite field; a suite's own value wins
  format: exit       # how results are read
  tier: merge        # the smallest tier that runs the suite: pr < merge < nightly; manual never auto
  timeout: { test: 30m, cell: 60m }   # each test, and the whole cell

groups:              # `dt run GROUP` runs every suite in it
  lint: [lint-go, lint-repo, shellcheck]
  go: [unit, integration, e2e, operator]
  conformance: [pjdfstest, pynfs, wpts, smbtorture]
  perf: [fio-verify, bench-smoke]

suites:
  # Lint. `job` keeps the check names the develop ruleset requires. Every command of a list
  # runs even after one fails, so a red job reports every check that failed.
  lint-go:
    job: Go Checks
    tier: pr
    cmd:
      - go mod verify                         # the module cache still matches go.sum
      - { sh: 'test -z "$(gofmt -s -l .)" || { gofmt -s -l .; exit 1; }' }
      - go vet ./...
      # Tagged tests compile in no other check, so one could stop compiling without anything
      # going red. None of these tags excludes another.
      - go vet -tags=e2e,integration,ad_dc,portmap_system,kerberos,stress ./...
      - go run ./test/spec-citations          # the MS-FSCC, MS-FSA and MS-SMB2 citations
      # The tests that pin an authorization or encryption gate, run by name: the edit that
      # reopens a gate can delete its test in the same change.
      - test/required-tests.sh
      - golangci-lint run --timeout=5m
  lint-repo:
    job: Repo Checks
    tier: pr
    cmd:
      - test/harness/bin/dt docs --check       # the documentation's suite tables match the registry
      - test/harness/bin/dt doctor             # fails on an expired quarantine entry, here alone
      - test/conformance/run_test.sh
      - test/common/known-failures_test.sh
      - test/new-package-tests.sh {base}       # a new package carries a test of its own
      # A docs: commit changes only documentation, and no commit credits an AI tool. Both run
      # on pushes too, since planning commits reach develop without a pull request.
      - test/commit-type-matches-diff.sh {base}
      - test/no-ai-attribution.sh {base}
      - .github/scripts/run-e2e-selftest.sh    # the e2e wrapper against failing, hung and false-green stand-ins
      - go test ./test/harness/...              # dt's own tests
  # Every shell script: the *.sh files, and the executables without an extension whose first
  # line is a shell's shebang.
  shellcheck:
    job: ShellCheck
    tier: pr
    cmd:
      sh: |
        git -c core.quotePath=false ls-files -s | while read -r mode _ _ f; do
          [ -f "$f" ] || continue
          case "${f##*/}" in
            *.sh) ;;
            *.*) continue ;;
            *) [ "$mode" = 100755 ] && head -n1 "$f" | grep -Eq '^#! */[^ ]*/(env *)?[abk]*sh' || continue ;;
          esac
          printf '%s\0' "$f"
        done | xargs -0 shellcheck --severity=warning
  unit:
    job: Unit Tests (1.26.x)
    format: go-json
    # Its coverage profile goes beside the cell's results, for the coverage report.
    cmd: go test -race {args} -timeout=25m -coverprofile={out}/coverage.txt ./pkg/... ./internal/... ./cmd/... ./test/...
    args: { pr: "-short" }
    tier: pr
    options:
      windows:
        cmd: go test -short -race -p 2 -timeout=25m ./...
        needs: [windows]
        blocking: { pr: false }
      nonrace:
        # Not the aggregate random-write gate: with no baseline it passes whatever it measures.
        cmd: "go test -timeout=25m -run=^(TestBLAKE3FasterThanSHA256|TestSealChunk_AllocBounded)$ ./pkg/block/ ./pkg/block/middleware/compression/"
        tier: nightly
  integration:
    job: Integration Tests (1.26.x)
    format: go-json
    cmd: go test -tags=integration -p 1 -timeout=20m {packages}
    packages: { tag: integration }
    tier: pr
    needs: [docker, "service:postgres", "service:kmip"]
    options:
      portmap:  { cmd: go test -tags=portmap_system -timeout=2m ./test/integration/portmap/..., needs: [linux, rpcbind] }
      kerberos: { cmd: go test -tags=kerberos -timeout=5m ./test/integration/kerberos/, needs: [docker] }
      ad-dc:    { cmd: go test -tags=ad_dc -timeout=20m ./test/integration/ad-dc/, needs: [linux, docker, smb-client], tier: merge }
  operator:
    dir: k8s/dittofs-operator
    cmd:
      - make test
      - make lint
      - make manifests-verify
      - kubectl kustomize config/default
    tier: pr
  e2e:
    format: go-json
    cmd: go test -tags=e2e -timeout=30m ./test/e2e/...
    env:
      DITTOFS_E2E_REQUIRE_NLM: "1"
      DITTOFS_E2E_REQUIRE_KERBEROS: "1"
      nightly: { DITTOFS_E2E_NIGHTLY: "1" }
    needs: [linux, root, nfs-client, smb-client, nfs4-acl-tools, "service:localstack"]
    options:
      stress: { cmd: "go test -tags=e2e,stress -timeout=60m ./test/e2e/...", tier: nightly }
      kerberos:                         # the Kerberos mounts, on pull requests that can affect them
        cmd: go test -tags=e2e -run Kerberos -timeout=30m ./test/e2e/
        tier: pr
        paths:
          - internal/adapter/**
          - pkg/adapter/**
          - pkg/metadata/**
          - internal/auth/**
          - pkg/auth/**
          - pkg/identity/**
          - pkg/controlplane/**             # export auth policy, users and identity mappings
          - internal/controlplane/**        # the identity mapping and provider API
          - pkg/config/**                   # the Kerberos keytab and principal
          - cmd/dfs/**                      # the server's Kerberos capability at start
          - "test/e2e/*kerberos*"
          - test/e2e/framework/kerberos.go
          - test/integration/kerberos/**

  # Conformance runs the production profile, badger-s3, only.
  pjdfstest:
    format: tap
    cmd: prove -v {test}
    dir: "{mount}"
    tests: "{tools}/pjdfstest/tests/*/*.t"
    matrix: { profile: [badger-s3], nfs: ["3", "4", "4.1"] }
    fixture:
      profile: "{profile}"
      nfs: { version: "{nfs}", options: "noac,sync,lookupcache=none" }
      squash: none                      # root keeps its privileges, as pjdfstest needs
      users: [65532, 65533, 65534]
      delegations: false
    known: test/posix/known.yaml
    tier: pr
    needs: [linux, root, nfs-client]
  pynfs:
    format: junit
    cmd: "{tools}/pynfs/bin/pynfs-4.{minor} {server}:{nfs-port}/export --minorversion {minor} --security sys --uid 0 --gid 0 --rundeps --maketree --xml {out}/junit.xml {names}"
    names: all                          # what {names} holds when a run names no tests
    matrix: { profile: [badger-s3], minor: ["0", "1"] }
    fixture: { profile: "{profile}", nfs: export, squash: none, lease: 30s, users: [1] }   # uid 1 is pynfs's second client
    known: test/nfs-conformance/pynfs/known.yaml
    tier: pr
    needs: [linux]
    options:
      knfsd:                            # the same tests against the kernel's NFS server, for comparison
        matrix: { minor: ["0", "1"] }
        fixture: { server: knfsd, nfs: export, squash: none, lease: 30s }
        tier: manual
        blocking: false
  wpts:
    format: trx
    image: mcr.microsoft.com/windowsprotocoltestsuites:fileserver-v8
    # Its entrypoint only lists the tests unless DryRun is false, and writes these over the
    # config's own values, so they repeat the fixture's.
    env:
      Usage: RunTestCases
      Filter: TestCategory=BVT
      DryRun: "false"
      SutComputerName: "{server}"
      SutIPAddress: "{server}"
      # A value without a dot keeps WPTS in workgroup mode, as the fixture has no domain
      # controller. The server's address won't do: WPTS reads it as a domain's name once
      # its last byte has two digits.
      DomainName: localhost
      AdminUserName: "{user}"
      PasswordForAllUsers: "{password}"
    matrix: { profile: [badger-s3] }
    fixture:
      profile: "{profile}"
      smb: { encryption: preferred, port: 445 }
      shares: test/smb-conformance/shares.yaml
    templates: test/smb-conformance/ptfconfig/*.template
    volumes: { "{out}/config": /data/fileserver }
    known: test/smb-conformance/known.yaml
    tier: pr
    needs: [linux, docker]
  smbtorture:
    format: subunit
    image: quay.io/samba.org/samba-toolbox:v0.8
    # smbtorture's second connections, to IPC$, fail unless its NetBIOS name resolves, as
    # localhost does. smb2.maxfid opens handles until the server refuses one, 65520 by
    # default, which no limit fits: 2000 is far past any real client, so a pass means 2000
    # handles work, not that the server's ceiling was found. smb2.ea.acl_xattr writes the
    # xattr name the server keeps for its ACLs. A space splits arguments, so the options'
    # names have none: smbtorture ignores them in a name.
    cmd: >-
      smbtorture //{server}/{share} -p {smb-port} -U{user}%{password}
      --option=netbiosname=localhost --option=clientminprotocol=SMB2_02
      --option=clientmaxprotocol=SMB3 --option=torture:smbd=false
      --option=torture:maxopenfiles=2000 --option=torture:acl_xattr_name=security.NTACL {test}
    tests: test/smb-conformance/smbtorture/tests.txt
    # One limit for every line of the list: it stops a hang, it doesn't grade speed. The
    # slowest suite took 193 s, and one suite 22 s on one profile and 112 s on another.
    timeout: { test: 5m }
    matrix: { profile: [badger-s3] }
    # smb2.multichannel.bugs.bug_15346 opens its extra connections to 445, whatever -p says.
    fixture: { profile: "{profile}", smb: { port: 445 }, shares: test/smb-conformance/shares.yaml, reset: each }
    known: test/smb-conformance/smbtorture/known.yaml
    tier: pr
    # Over two runners: in one cell it takes about 20 minutes, the pr tier's whole budget.
    # decision: in every tier, since shards isn't set per tier.
    shards: 2
    needs: [linux, docker]
    options:
      # The suite's options, with Kerberos required. smbtorture finds the KDC in the fixture's
      # krb5.conf, and asks it for a ticket to cifs/{server}, a name here. Its tests are session
      # setup, and read and lock, where a truncated or garbled session key shows too.
      # smb2.create isn't one: known-kerberos.yaml doesn't list its known failures.
      kerberos:
        cmd: >-
          smbtorture //{server}/{share} -p {smb-port} -U{user}@{realm}%{password} --use-kerberos=required
          --option=netbiosname=localhost --option=clientminprotocol=SMB2_02
          --option=clientmaxprotocol=SMB3 --option=torture:smbd=false
          --option=torture:maxopenfiles=2000 --option=torture:acl_xattr_name=security.NTACL {test}
        volumes: { "{krb5-conf}": /etc/krb5.conf }
        tests: [smb2.session, smb2.read, smb2.lock]
        timeout: { test: 20m }
        matrix: {}
        fixture: { profile: badger-s3, smb: true, shares: test/smb-conformance/shares.yaml, kerberos: true }
        known: test/smb-conformance/smbtorture/known-kerberos.yaml
        tier: merge
        shards: 1                       # its three tests in one cell

  # What a kernel client sees through an untuned mount, one change at a time: the named
  # mount-option sets. Both run as the user dt runs as, on a client in a network namespace
  # of its own, so an NFSv3 lock reaches the server's lock manager through the host's rpcbind.
  cthon04:
    tests: test/nfs-mount/cthon04/tests.txt   # each program on its own, with its command line
    cmd: "{test-args}"
    dir: "{tools}/cthon04"
    matrix:
      profile: [badger-s3]
      mount-options:
        - default: ""                   # none: the kernel negotiates NFSv4.2 against DittoFS
        - v3: vers=3,tcp,mountproto=tcp
        - v4.0: vers=4.0
        - v4.1: vers=4.1
        - v4.1-noac: vers=4.1,noac
        - v4.1-smallio: vers=4.1,rsize=32768,wsize=32768
    fixture:
      profile: "{profile}"
      nfs: { options: "{mount-options}" }    # mounted at {mount}, at the version vers= gives
      shares: test/nfs-mount/shares.yaml
      users: [self]
      client: namespace
      rpcbind: host
    known: test/nfs-mount/cthon04/known.yaml
    timeout: { test: 10m }
    tier: pr
    needs: [linux]
  nfstest:
    format: nfstest
    tests: test/nfs-mount/nfstest/tests.txt   # the modules, each with the sets it runs on
    # nfstest mounts by itself, at the version it's told, so a set gives its flags.
    cmd: "{tools}/nfstest/bin/nfstest_{test} --server {server} --port {nfs-port} --export /export --nfsversion {nfs} --mtpoint /tmp/dittofs-test --mtopts {mtopts} --rmtraces --notty {test-args}"
    matrix:
      profile: [badger-s3]
      mount-options:
        - default: { nfs: "4.2", mtopts: hard }
        - v3: { nfs: "3", mtopts: "hard,tcp,mountproto=tcp" }
        - v4.0: { nfs: "4.0", mtopts: hard }
        - v4.1: { nfs: "4.1", mtopts: hard }
        - v4.1-noac: { nfs: "4.1", mtopts: "hard,noac" }
        - v4.1-smallio: { nfs: "4.1", mtopts: "hard,rsize=32768,wsize=32768" }
    fixture: { profile: "{profile}", nfs: export, shares: test/nfs-mount/shares.yaml, users: [self], client: namespace, clients: 2, rpcbind: host }
    known: test/nfs-mount/nfstest/known.yaml
    timeout: { test: 20m }
    tier: nightly
    needs: [linux]

  # Each platform's own client mounts the fixture's share over SMB, and the workloads run over the
  # mount: on each, the checks of smb-client-compat.yml's job there, which this replaces once its
  # results match. The suite itself runs on linux, and also sees its blocks reach the bucket.
  clients:
    tests: [test/clients/files.sh, test/clients/rename.sh, test/clients/s3.sh]
    cmd: "{test} {mount} {bucket}"   # s3.sh reads the bucket's listing; the others take the mount alone
    fixture: { profile: badger-s3, smb: { mount: true } }
    needs: [linux, root, smb-client]
    tier: nightly
    # decision: reported, never failing the gate, until the three cells' results match
    # smb-client-compat.yml's; they become blocking in the change that removes that workflow.
    blocking: false
    # decision: macOS and Windows stay on memory, since badger-s3 needs Localstack, a Linux
    # container, and their hosted runners run none: macOS's have no Docker, Windows's run Windows
    # containers only. Move them to badger-s3 once an S3 endpoint runs there.
    options:
      macos:
        tests: [test/clients/files.sh, test/clients/xattr.sh]
        cmd: "{test} {mount}"
        env: { SMB_URL: "//{user}:{password}@{server}:{smb-port}/{share}" }   # xattr.sh mounts the share again
        needs: [macos]
        fixture: { profile: memory, smb: { mount: true } }
      windows:
        tests: [test/clients/files.ps1]
        cmd: powershell -NoProfile -ExecutionPolicy Bypass -File {test} {mount}
        needs: [windows]
        fixture: { profile: memory, smb: { mount: true } }

  # The system scenarios: a real server in a container, real clients, faults injected.
  # setup.sh takes a scenario by its file name, in its own directory. A run through dt is reported
  # by dt, and never posts to the scenarios' Slack channel.
  system:
    cmd: { sh: 'test/scenarios/setup.sh "$(basename {test})"' }
    tests: test/scenarios/[0-9][0-9]-*.sh
    select: { merge: "[0-8]?-*.sh" }
    env: { SLACK_DIR: /nonexistent }
    known: test/scenarios/known.yaml
    needs: [linux, podman]
    needs_by_test:
      "9?-*.sh": ["host:dedicated", "disk:110"]
    timeout: { test: size, cell: 90m }
    shards: 4
    # decision: reported, never failing the gate, since each scenario's setup runs apt-get update,
    # which stalls for minutes on hosted runners. It becomes blocking once setup.sh stops stalling
    # there, a change to setup.sh, which its owner makes.
    blocking: false
  fio-verify:
    # The job files are templates, as dfsbench's are: fio doesn't expand their ${VAR:-default}s, so
    # perl fills them from the environment into a copy below {out}, which fio runs.
    cmd:
      - cp {test} {out}/{test}
      - perl -pi -e s/\$\{(\w+):-([^}]*)\}/$ENV{$1}||$2/ge {out}/{test}
      - fio --output-format=json --output={out}/{test}.json {out}/{test}
    tests: bench/*/*.fio   # dfsbench's workloads, and the verify jobs, which read their data back
    exclude: [bench/workloads/layout.fio]
    fixture: { profile: badger-s3, nfs: "4.1", squash: none }   # fio runs as root, which keeps its privileges
    env: { BENCH_DIR: "{mount}" }
    metrics: fio-json
    tier: nightly
    needs: [linux, root, nfs-client]
    options:
      smb: { fixture: { profile: badger-s3, smb: { mount: true } }, needs: [linux, root, smb-client] }
  bench-smoke: { cmd: go run ./cmd/bench run --smoke, metrics: dfsbench-json, tier: pr, blocking: false }
