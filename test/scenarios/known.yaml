# The system scenarios that fail today, each at its first failing check, with the issue it
# reproduces. A scenario that starts to pass is an unexpected pass: remove its entry in the fix.
- test: test/scenarios/10-smb-store-options-xs.sh
  status: fail
  fix: planned
  category: bug
  reason: 'A misspelt block-store config key ("compresion") is accepted and ignored, at `test -e /tmp/b4.rc`. Past it, a used store''s bucket and prefix edits are accepted too.'
  issue: '#3048'
- test: test/scenarios/11-smb-2stores-same-bucket-xs.sh
  status: fail
  fix: planned
  category: bug
  reason: 'A second block store on the same bucket and prefix is accepted, at `test "$Y" = refused`.'
  issue: '#3036'
- test: test/scenarios/13-smb-compression-frame-magic-xs.sh
  status: fail
  fix: planned
  category: bug
  reason: 'With compression, a file starting with the DFCMP magic reads back wrong once evicted, at `cmp /tmp/z/magic.bin /tmp/back/magic.bin`.'
  issue: '#2897'
- test: test/scenarios/20-smb-nfs-case-across-adapters-xs.sh
  status: fail
  fix: planned
  category: bug
  reason: 'NFS is case-sensitive and SMB is not on the same share, and an SMB create of Readme overwrites README, at the name count check.'
  issue: '#3037'
- test: test/scenarios/22-smb-share-modes-s.sh
  status: fail
  fix: planned
