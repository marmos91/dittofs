- test: smb2.scan.scan
  status: fail
  fix: wontfix
  category: permanent
  reason: 'Opcode-fuzzer that walks every SMB2 command id. At opcode 12 (SMB2_OPLOCK_BREAK) the smbtorture 4.22.6 **client** aborts inside its own signing code: `smb2_signing_calc_signature` asserts `opcode[12] msg_id == 0` and `smb_panic()`s (`libcli/smb/smb2_signing.c:576`). The backtrace is entirely client-side (`smb2_signing_sign_pdu` → `smb2cli_req_compound_submit`); DittoFS is pure Go, is not in the backtrace, and correctly returns `NT_STATUS_INVALID_PARAMETER` for the bogus opcodes it does receive. The crash surfaces as docker exit ≥129 and previously red''d the whole `smbtorture / memory` job (the recurring "exit 139 / smb2.scan" flake). Skipped by `run.sh` per-subtest split; the other three scan subtests (getinfo/setinfo/find) pass. Drop once the upstream client crash is fixed (or we move past smbtorture 4.22.6).'
