  category: proto
  reason: '**Measured 15/15 failures on `0c590d546`**: not intermittent, and never observed passing. Upstream-class: the partial-surrogate subcase fails in the smbtorture **client''s** own `iconv` (UTF-16→UTF-8 of an unpaired surrogate returns `EILSEQ` client-side, which Samba maps to `NT_STATUS_NO_MEMORY`; same against reference Samba). The verdict line is `failure: charset.Testing partial surrogate` at `charset.c:174`; the other three `Testing` subcases pass. DittoFS round-trips valid UTF-16; the unpaired-surrogate case is not a server feature gap. Tracked under #740 for the wide-A collision sub-behaviour. The harness used to report this row as "now passing" on every run, because its flake pre-filter reclassified any block mentioning `NT_STATUS_NO_MEMORY` as a skip; that excuse is now anchored to a co-occurring connection-setup diagnostic, so this assertion grades as the failure it is.'
