- test: smb2.notify.rec
  status: fail
  fix: planned
  category: bug
  reason: '**Re-measured after the empty-filter refusal was fixed.** The test now fails further on, at `notify.c:644`: `wrong value for notify.smb2.out.num_changes 0x5 should be 0x9`. It previously failed at `notify.c:642` with `NT_STATUS_INVALID_PARAMETER`, because `smb2_notify_send` at `notify.c:627` arms a recursive CHANGE_NOTIFY with `completion_filter = 0` and DittoFS refused an empty filter outright; the filter armed by the earlier request on the same handle now applies ([MS-FSA] 2.1.5.11), so the request is accepted and the test advances. What remains is the count: the test expects all nine buffered changes in one reply and gets five. Samba also carries this test as a known failure (`^samba3.smb2.notify.rec` in `selftest/knownfail`), and fails it at the same assertion.'
  issue: '#2164'
- test: smb2.oplock.batch22b
  status: fail
  fix: planned
  category: bug
  reason: 'The test blocks the holder''s transport so no ack can arrive and requires the second open to complete within smbtorture''s `oplocktimeout` (35s). DittoFS takes 36s: `oplock.c:2715` reports `te got 36 - should be between 0 and 35`. The wait itself is by design; overshooting the ceiling is not. Pre-existing, and unobservable while the suite was truncated.'
  issue: '#2115'
- test: smb2.charset.Testing
  status: fail
