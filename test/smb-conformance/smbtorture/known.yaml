- test: smb2.durable-open.delete_on_close2
  status: fail
  fix: wontfix
  category: permanent
  reason: 'Reopens a durable handle that was opened with FILE_DELETE_ON_CLOSE, then asserts the post-reconnect delete-on-close + truncate-on-overwrite interaction matches Windows verbatim. Explicitly listed in Samba''s own selftest knownfail (`selftest/knownfail`: `^samba3.smb2.durable-open.delete_on_close2`): fails against Samba''s own file-backed share, not just DittoFS. The disconnect path intentionally does NOT persist a durable handle carrying delete-on-close (the open is fully closed instead, so the stored content is not resurrected on reconnect); reproducing the exact Windows ordering of DOC-survives-reconnect has no MS-SMB2 spec mapping and is upstream-skipped.'
- test: smb2.notify.mask-change
  status: fail
  fix: wontfix
  category: permanent
  reason: '**The rationale below has now been reached and observed for the first time.** The test fails at `notify.c:834`, on the `smb2_notify_recv` at `:833` answering `NT_STATUS_CANCELLED` where `NT_STATUS_OK` is required: the re-issued CHANGE_NOTIFY did not observe the mask armed by the earlier request on the same handle. The rmdir refusal this row previously recorded at `notify.c:829` is fixed: both rmdirs and the unlink at `notify.c:827`/`:829`/`:831` now return `NT_STATUS_OK`. That was the second deferral of this rationale, and the test now sits on the assertion the rationale describes, so this row''s placement here is supported by observation rather than assumed. Rationale: asserts that, once a CHANGE_NOTIFY completion-filter mask has been armed on a directory handle, re-issuing CHANGE_NOTIFY with a different mask MUST observe the original mask until the handle is closed (test source: `source4/torture/smb2/notify.c:771-772`: "Now try and change the mask to include other events. This should not work - once the mask is set on a directory h1 it seems to be fixed until the fnum is closed"). MS-SMB2 §3.3.5.19 does not specify mask-coalescing across separate CHANGE_NOTIFY requests on the same handle, and the test has a long-standing "never passed individually" history against DittoFS independent of test order. Surrounding scenarios (cross-tree dir/file rename plumbing, recursion-flag-mixed reqs on the same FID) are also Samba implementation conventions. **Skipped by `run.sh` per-subtest split.** Once a directory handle could hold several outstanding CHANGE_NOTIFY requests, the two this test issues both stay pending: correctly, since the sticky mask matches none of the events it generates: and it blocks in `smb2_notify_recv` until the suite budget expires, leaving every later subtest UNGRADED. It previously ended in milliseconds only because the second request evicted the first with `STATUS_CANCELLED`, which was itself the defect. Same workaround shape as `scan.scan` and `dirlease.oplocks`.'
