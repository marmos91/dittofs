  fix: planned
  category: feature
  reason: 'Epic 6: recovery re-applies existence at start; also Write, Read, Overlay and Allocation (epic 3). Fails at the fixture until the journal has Init, Open, WriteAt, ReadAt, Sync and Since.'
  issue: '#3589'
