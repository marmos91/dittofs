- test: 'posix/read: file st_atime should be updated'
  status: fail
  fix: planned
  category: bug
  reason: reading a file does not update its atime; may be deliberate
  issue: '#2982'
- test: 'dio/*: WRITEs should be cached for buffered I/O'
  status: fail
  fix: wontfix
  category: proto
  reason: buffered writes reach the server before close under `v4.1-noac`, where the client writes through; knfsd fails 16 of 20 there on the same kernel and DittoFS passes them on every other set (`baseline-knfsd.md`, `6.17.0-1022-azure`)
  where: {mount-options: [v4.1-noac]}
- test: 'cache/*: Hard link count should have *'
  status: fail
  fix: planned
  category: bug
  reason: a directory's nlink reads one short right after a local MKDIR, so the test's baseline is stale; every file-cache check passes
  issue: '#3099'
  where: {mount-options: [v3]}
- test: 'cache/*: Directory listing should have *'
  status: fail
  fix: wontfix
  category: proto
  reason: the client sees the second client's new subdirectory before the directory cache expires; knfsd fails 7 of 11 of these on the same kernel (`baseline-knfsd.md`, `6.17.0-1022-azure`)
  where: {mount-options: [v3]}
