- test: 'delegation/recall*: CB_RECALL should be sent to the client after a conflicting * is received from a second client'
  status: fail
  fix: planned
  category: bug
  reason: no recall when a second client chmods, renames or removes the delegated file; a conflicting OPEN is recalled
  issue: '#3098'
  where: {mount-options: [default, v4.0, v4.1, v4.1-noac, v4.1-smallio]}
- test: 'delegation/recall*: CB_RECALL should recall * delegation granted to client'
