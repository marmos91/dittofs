# DittoFS configuration with S3 backend preparation
# Infrastructure-only config - S3 stores configured via REST API after deployment
#
# Prerequisites:
# 1. Create secrets: kubectl apply -f dittofs_secrets.yaml
#
# After deployment:
# 1. Login: dfsctl login --server http://localhost:8080 --username admin
# 2. Create metadata store: dfsctl store metadata add --name meta --type badger \
#    --db-path /data/store/metadata
# 3. Create S3 block store: dfsctl store block add --name s3-content --type s3 \
#    --bucket dittofs-bucket --region us-east-1 --access-key ... --secret-key ...
# 4. Create share: dfsctl share create --name /s3 \
#    --metadata meta --block-store s3-content
#
apiVersion: dittofs.dittofs.com/v1alpha1
kind: DittoServer
metadata:
  labels:
    app.kubernetes.io/name: dittofs-operator
    app.kubernetes.io/managed-by: kustomize
  name: dittoserver-aws-s3
  namespace: dittofs
spec:
  image: marmos91c/dittofs:latest
  replicas: 1

  # Storage for internal server data
  storage:
    metadataSize: "10Gi"
    # Backs blockstore.journal.path; every share needs it, S3-backed included.
    contentSize: "10Gi"

  # Identity configuration (required)
  identity:
    jwt:
      secretRef:
        name: dittofs-jwt-secret
        key: secret
    admin:
      username: admin
      passwordSecretRef:
        name: dittofs-admin-secret
        key: password

  # Control plane database
  database:
    type: sqlite
    sqlite:
      path: "/data/controlplane/controlplane.db"


  # Control plane REST API
  controlPlane:
    port: 8080

  # NFS server port

  # Service configuration
  service:
    type: ClusterIP

  # Resource configuration for S3 workloads
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
