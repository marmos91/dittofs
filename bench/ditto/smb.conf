# The Samba baseline of night.sh: its own smbd, started for the run and stopped after it, on
# loopback only and its own port, with all its state under /var/tmp/dittofs-perf/samba. The host's
# own Samba (/etc/samba/smb.conf, /var/lib/samba) is not used. night.sh holds the same port and paths.
[global]
    server role = standalone server
    interfaces = 127.0.0.1/8
    bind interfaces only = yes
    smb ports = 18446
    disable netbios = yes
    server min protocol = SMB3_11
    # As on the DittoFS side: signing on, encryption off, and a client flush reaches the disk.
    server signing = mandatory
    server smb encrypt = off
    strict sync = yes
    map to guest = never
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    usershare max shares = 0
    passdb backend = tdbsam:/var/tmp/dittofs-perf/samba/private/passdb.tdb
    private dir = /var/tmp/dittofs-perf/samba/private
    lock directory = /var/tmp/dittofs-perf/samba/lock
    state directory = /var/tmp/dittofs-perf/samba/state
    cache directory = /var/tmp/dittofs-perf/samba/cache
    pid directory = /var/tmp/dittofs-perf/samba/run
    ncalrpc dir = /var/tmp/dittofs-perf/samba/run/ncalrpc
    binddns dir = /var/tmp/dittofs-perf/samba/bind-dns
    log file = /var/tmp/dittofs-perf/samba/smbd.log
    log level = 1

[perf]
    path = /srv/perf/data/samba
    read only = no
