name: Unit Tests

on:
  push:
    branches: [develop, feat/storage-v2]
  pull_request:
    branches: [develop, main, feat/storage-v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel only a superseded pull-request run. A push is a distinct commit
  # someone wants tested, and cancelling it leaves the branch with no result to
  # compare a red run against. This protects a push run that is already
  # executing, not one still queued: a newer run replaces the pending one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # go test caps itself at 25m, which covers a wedged test but not a wedged
    # setup-go or module download; those would otherwise hold a slot for the
    # six-hour default.
    timeout-minutes: 35

    strategy:
      matrix:
        go-version: ["1.26.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so dorny/paths-filter can resolve the previous commit
          # on push events; a shallow clone can miss it on a multi-commit push.
          fetch-depth: 0

      # decision: the Go-change filter lives inside the job rather than in the
      # workflow's `paths:`. A workflow skipped by path filtering leaves its
      # check in "Pending" forever, so requiring this check would block every
      # pull request that touches no Go file — a job whose steps are skipped
      # reports "Success" instead. The filter is not allowed to fail quietly: a
      # failure fails this job, so the check can never go green having run
      # nothing. Overturn this if the check stops being required, or if the
      # workflow gains a merge_group trigger, which needs the filter's answer
      # for a base the merge queue supplies rather than a pull request.
      - name: Check for Go changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - 'cmd/**/*.go'
              - 'pkg/**/*.go'
              - 'pkg/metadata/store/*/migrations/*.sql'
              - 'internal/**/*.go'
              - 'internal/dfsbench/backend/smb.conf.tmpl'
              - 'go.mod'
              - 'go.sum'
              - 'bench/workloads/**'
              - '.github/workflows/unit-tests.yml'

      - name: Set up Go
        if: github.event_name != 'pull_request' || steps.filter.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true  # Built-in caching (replaces actions/cache)
      # The tests compile fdbkv, which links libfdb_c on Linux.
      - name: Install the FoundationDB client
        if: github.event_name != 'pull_request' || steps.filter.outputs.go == 'true'
        uses: ./.github/actions/fdb-client


      - name: Download dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.go == 'true'
        run: go mod download

      - name: Verify dependencies
        if: github.event_name != 'pull_request' || steps.filter.outputs.go == 'true'
        run: go mod verify

      # A pull request runs the short suite; the push to develop runs the full
      # one. The guarded tests still run on the same pull request under the
      # integration job, which passes no -short — but it passes no -race either,
      # so the race detector stops covering them between opening a pull request
      # and merging it. Drop the split if a race ever reaches develop that the
      # full run would have caught during review. The coverage profile below
      # narrows with the suite, so a pull request measures a short run against a
      # full-run baseline; that comparison is only meaningful once both sides
      # run the same set.
      - name: Run unit tests
        if: github.event_name != 'pull_request' || steps.filter.outputs.go == 'true'
        run: |
          go test -v -race ${{ github.event_name == 'pull_request' && '-short' || '' }} \
            -timeout=25m -coverprofile=coverage.txt -covermode=atomic \
            ./pkg/... \
            ./internal/... \
            ./cmd/...

      # The journal index's memory and allocation checks skip under -race,
      # which the step above always uses, so the package runs again without
      # it, and without -short so the 10^6-extent checks run. The second
      # command builds the index with a bug planted in its split and runs only
      # the test that requires the model-based fuzz to find it: every other
      # test of the package fails on that build by design.
      - name: Run the journal index checks without -race
        if: github.event_name != 'pull_request' || steps.filter.outputs.go == 'true'
        run: |
          go test -count=1 -timeout=15m ./pkg/block/journalv2/internal/index/
          go test -count=1 -timeout=5m -tags journalv2_plant_split -run '^TestFuzzFindsPlantedSplit$' ./pkg/block/journalv2/internal/index/

      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || steps.filter.outputs.go == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.txt
          flags: unittests
          name: codecov-unit-tests
        continue-on-error: true

      # Building stays — go vet type-checks cmd/dfs but never links it, so this
      # is where a link error surfaces. Uploading goes: every download-artifact
      # in the repo names dfs-binaries, so nothing has ever fetched what this
      # step stored.
      - name: Build binary
        if: github.event_name != 'pull_request' || steps.filter.outputs.go == 'true'
        run: go build -v -o dfs cmd/dfs/main.go

  fdb:
    name: FoundationDB backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The same in-job filter as the unit tests, for the same reason: a job
      # whose steps are skipped reports success instead of pending forever.
      - name: Check for metadata store changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            kv:
              - 'pkg/metadata/kv/**'
              - 'pkg/metadata/kvstore/**'
              - 'pkg/metadata/entity/**'
              - 'test/fdb/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/actions/fdb-client/**'
              - '.github/workflows/unit-tests.yml'

      - name: Set up Go
        if: github.event_name != 'pull_request' || steps.filter.outputs.kv == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install the FoundationDB client
        if: github.event_name != 'pull_request' || steps.filter.outputs.kv == 'true'
        uses: ./.github/actions/fdb-client

      - name: Start a one-process FoundationDB
        if: github.event_name != 'pull_request' || steps.filter.outputs.kv == 'true'
        run: test/fdb/cluster.sh up 1

      # The backend's conformance suite and the store's suites, on the cluster
      # above: what the unit tests skip for want of a server.
      - name: Run the suites on FoundationDB
        if: github.event_name != 'pull_request' || steps.filter.outputs.kv == 'true'
        run: >
          DITTOFS_FDB_CLUSTER_FILE="$HOME/.cache/dittofs-fdb/data/fdb.cluster"
          go test -race -count=1 -timeout=20m
          -run '^(TestConformance|TestNowAcrossNodes|TestUnknownCommitOutcomeNotReapplied|TestSweepClearsOnlyOldMarks|TestOpenIsolatesAndClears|TestStoreConformanceFDB|TestStoreConformanceFDBFrozenClock|FuzzNamespaceFDB)$'
          ./pkg/metadata/kv/fdbkv/... ./pkg/metadata/kvstore/
