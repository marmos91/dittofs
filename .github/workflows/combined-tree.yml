# Combined Tree — build the tree two green PRs actually produce.
#
# What it selects and why the filter is package intersection is documented once,
# at the top of .github/scripts/combined-tree.sh. This file decides only when it
# runs and what it is allowed to spend.
#
# Scheduled rather than per-push: the eligible set changes on the timescale of
# merges, not commits, so a per-push trigger would spend slots re-deciding that
# it is empty. Most runs select nothing and stop after a shallow checkout and a
# couple of API calls per open PR; the Go toolchain, the full clone and the PR
# head fetches are paid for only when there is a combination to build.
name: Combined Tree

on:
  schedule:
    # Across the working day in UTC, deliberately clear of the 04:00 nightly
    # block where conformance, E2E, pynfs and the AD-DC suite all start.
    - cron: '20 7-19/3 * * *'
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/combined-tree.yml'
      - '.github/scripts/combined-tree.sh'

permissions:
  contents: read
  pull-requests: read
  # The selection reads each PR's check rollup to date its last matrix, and
  # GitHub resolves that field against Checks, not Pull requests. Without this
  # the listing errors outright rather than returning the PRs without it.
  checks: read

concurrency:
  # Scheduled runs queue behind each other; a pull request's self-test does not
  # queue behind a 45-minute build it has nothing to do with.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'scheduled' }}
  # A scheduled run that is already merging and building is the run with the
  # answer; a newer one would only start over.
  cancel-in-progress: false

jobs:
  # A gate that has never refused anything is unverified, and this one refuses
  # rarely by design. The self-test builds a fixture that merges cleanly and
  # does not compile, and fails if the run mode accepts it.
  selftest:
    name: Self-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: Run self-test
        run: .github/scripts/combined-tree.sh selftest

  combined-tree:
    name: Combined Tree
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Bounded by MAX_COMBOS combinations, each building and testing only the
    # packages the two sides share.
    timeout-minutes: 45
    steps:
      # Shallow on purpose: selection reads the GitHub API and touches no
      # history, and most runs end at the next step.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Select combinations
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          # Outside the work tree: the run step resets and cleans the checkout
          # between combinations, which would take this file with it.
          .github/scripts/combined-tree.sh select | tee "$RUNNER_TEMP/combos.jsonl"
          if [ -s "$RUNNER_TEMP/combos.jsonl" ]; then
            echo "any=true" >>"$GITHUB_OUTPUT"
            echo "Selected $(wc -l <"$RUNNER_TEMP/combos.jsonl") combination(s)."
          else
            echo "No combination is eligible; nothing to build."
          fi

      - name: Fetch the trees to merge
        if: steps.select.outputs.any == 'true'
        run: |
          # Deepening the shallow checkout is what lets the merges find a
          # common ancestor, and the same fetch refreshes the base branch,
          # which may have moved between the checkout and the selection.
          # Guarded, because --unshallow on a complete clone is an error, and a
          # fetch that quietly did nothing would surface later as every
          # combination "conflicting" rather than as the fetch failing.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow --quiet origin
          else
            git fetch --quiet origin
          fi
          jq -r '.prs[].n' "$RUNNER_TEMP/combos.jsonl" | sort -u | while read -r n; do
            git fetch --quiet origin "refs/pull/$n/head"
          done

      # No module cache: this job runs a handful of times a day and the shared
      # GHA cache budget is already contended. A cold build is cheaper than a
      # new entry competing for eviction.
      - name: Set up Go
        if: steps.select.outputs.any == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build each combination
        if: steps.select.outputs.any == 'true'
        run: .github/scripts/combined-tree.sh run <"$RUNNER_TEMP/combos.jsonl"
