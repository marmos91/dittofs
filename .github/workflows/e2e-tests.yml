# End-to-End Tests for DittoFS
#
# Tests aspects NOT covered by pjdfstest POSIX compliance:
# - Scalability (large files, many files)
# - Store interoperability (all 8 configurations)
# - Protocol interoperability (NFS and SMB cross-protocol)
# - Cache behavior
# - Server configurations
# - SMB3 client tests (go-smb2, smbclient, Kerberos)
#
# See test/e2e/README.md for test philosophy and structure.

name: E2E Tests

# The full suite takes ~45-75m, so it is NOT run per-PR (that would make every
# PR slow). It runs only on push to develop/main and nightly — develop is the
# gate. A red develop run fires the ci-health email + P0 develop-red issue, and
# warn-on-pr flags open PRs, forcing a fix-forward. Run manually on a PR with
# workflow_dispatch when needed.
#
# The exception is Kerberos: a PR that touches Kerberos code runs only the
# Kerberos tests (NFS krb5/krb5i/krb5p over v3 and v4, SMB, cross-protocol),
# about 5 minutes, with a failed Kerberos mount failing the test.

on:
  push:
    branches: [develop, main, feat/storage-v2]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '**.png'
      - '**.jpg'
      - '**.svg'
  pull_request:
    branches: [develop, main, feat/storage-v2]
    paths:
      - 'internal/auth/kerberos/**'
      - 'pkg/auth/kerberos/**'
      - 'pkg/identity/kerberos/**'
      - 'internal/adapter/nfs/rpc/gss/**'
      - 'internal/adapter/nfs/rpc/auth.go'
      - 'internal/adapter/nfs/auth/**'
      - 'internal/adapter/nfs/v4/handlers/secinfo.go'
      - 'internal/adapter/smb/auth/**'
      - 'internal/adapter/smb/handlers/kerberos_auth.go'
      - 'internal/adapter/smb/handlers/session_setup.go'
      - 'internal/adapter/smb/handlers/identity_resolver.go'
      - 'test/e2e/*kerberos*'
      - 'test/e2e/framework/kerberos.go'
      - 'test/integration/kerberos/**'
      - '.github/workflows/e2e-tests.yml'
  schedule:
    # Nightly at 04:07 UTC, staggered from the other protocol suites.
    - cron: '7 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # This workflow has no pull_request trigger, so the expression is always
  # false: a develop run is never cancelled. Each develop push is a distinct
  # commit someone wants tested, and cancelling it means it never is -- which
  # left most develop runs cancelled and the develop-red alarm blind. The cost
  # is runner contention: develop runs now queue instead of superseding, bounded
  # by the single running + single pending slot GitHub keeps per group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Backstop only. The test step bounds itself at E2E_WALL (45m) so that a
    # wedge fails the step; this number just has to stay comfortably above
    # setup + that wall + the grace period, because a job killed by its own
    # timeout concludes `cancelled` and every alarm that keys on `failure`
    # stays silent.
    timeout-minutes: 75

    services:
      localstack:
        image: localstack/localstack:4.13.1
        env:
          SERVICES: s3
          EAGER_SERVICE_LOADING: "1"
          GATEWAY_LISTEN: "0.0.0.0:4566"
          DISABLE_CORS_CHECKS: "1"
          DISABLE_CUSTOM_CORS_S3: "1"
          DEBUG: "0"
          LOCALSTACK_HOST: localhost:4566
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf https://localhost:4566/_localstack/health -k || curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Tell tests to use pre-existing services instead of starting containers
      LOCALSTACK_ENDPOINT: http://localhost:4566

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # The .#ci shell includes pynfs and pjdfstest. Their conformance jobs
      # publish both derivations on matching trusted pushes, so this job only
      # configures public reads and does not receive publishing credentials.
      - name: Setup Nix cache
        uses: ./.github/actions/nix-cache

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # rpcbind: required by the real-NLM lock-interop tests, which run a
          # kernel NFSv3 client (no `nolock`) in an isolated network namespace.
          sudo apt-get install -y nfs-common cifs-utils smbclient krb5-user rpcbind
          # No rpc-gssd start here: the unit needs /etc/krb5.keytab, which
          # only exists once a Kerberos test installs it, and those tests
          # restart rpc-gssd themselves.

      - name: Build DittoFS
        run: nix develop .#ci --command go build -o dfs cmd/dfs/main.go

      - name: Run E2E tests
        env:
          E2E_LOG: ${{ github.workspace }}/e2e.log
          # 30m of test timeout plus room for the sudo-side dependency
          # fetch+compile, the panic dump, and the remaining packages. The
          # observed worst case is 30m16s of productive work, so this fails a
          # wedge roughly 15m past a legitimately slow run rather than letting
          # it run out the job.
          E2E_WALL: 45m
          EVENT: ${{ github.event_name }}
        run: |
          # sudo resolves commands via secure_path (which omits the Nix
          # profile), so `nix` was "command not found" under sudo and go test
          # never ran. Pass the caller's PATH through so `nix` resolves; keep -E
          # for the external-service env vars the suite reads.
          # DITTOFS_E2E_REQUIRE_NLM=1: the real-NLM lock-interop test hard-fails
          # (instead of skipping) if its prerequisites are missing, so a
          # misconfigured runner can't silently drop that coverage.
          # DITTOFS_E2E_REQUIRE_KERBEROS=1: a failed Kerberos mount in the
          # SMB and cross-protocol Kerberos tests fails the test instead of
          # skipping it.
          # Full mode: all configurations including Docker-based stores.
          #
          # The harness owns redirection and grading — see the header of
          # run-e2e.sh for why the output must not go through a pipe.
          #
          # A pull request is here because it touched Kerberos code (the paths
          # under on.pull_request), so it runs only the Kerberos tests.
          tests=(./test/e2e/...)
          if [ "$EVENT" = pull_request ]; then
            tests=(-run Kerberos ./test/e2e/)
          fi
          .github/scripts/run-e2e.sh \
            sudo -E env "PATH=$PATH" "DITTOFS_E2E_REQUIRE_NLM=1" "DITTOFS_E2E_REQUIRE_KERBEROS=1" nix develop .#ci --command \
            go test -tags=e2e -v -timeout 30m "${tests[@]}"

      - name: Generate summary
        if: always()
        run: |
          # No log means tests never ran (run cancelled, or build failed first).
          # Bail cleanly — a bare `cat` on the missing file under `bash -e` would
          # exit 1 and paint a red step on an otherwise-benign cancelled run.
          if [ ! -f "$GITHUB_WORKSPACE/e2e.log" ]; then
            echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
            echo ":grey_question: No test log — run was cancelled or failed before tests ran." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if grep -qE "^ok[[:space:]]" "$GITHUB_WORKSPACE/e2e.log" && ! grep -qE "^FAIL" "$GITHUB_WORKSPACE/e2e.log"; then
            echo ":white_check_mark: All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Some tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Suites" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          for suite in Server Users Groups Shares Permissions MetadataStores BlockStores Adapters Portmapper Backup Context FileOperations CrossProtocol StoreMatrix Kerberos SMB3 SMB3_Kerberos; do
            if grep -q "Test${suite}.*PASS" "$GITHUB_WORKSPACE/e2e.log"; then
              echo "| ${suite} | :white_check_mark: |" >> $GITHUB_STEP_SUMMARY
            elif grep -q "Test${suite}.*FAIL" "$GITHUB_WORKSPACE/e2e.log"; then
              echo "| ${suite} | :x: |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ${suite} | :grey_question: |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Full Test Output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat "$GITHUB_WORKSPACE/e2e.log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Upload logs
        if: always()
        # A lost diagnostics zip must not invert a verdict the suite has already
        # produced: the run step above decides pass or fail, this upload only
        # preserves the evidence.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: ${{ github.workspace }}/e2e.log
          retention-days: 30
