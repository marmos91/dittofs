# The journal's tests on macOS and Windows, which the Linux unit tests do not
# cover: each platform's storage, its sync and allocation calls, and every
# other journal test, under the race detector.
#
# Pull requests into feat/storage-v2 and pushes to it only: the journal is not
# on develop yet.
name: Journal platforms

on:
  push:
    branches: [feat/storage-v2]
  pull_request:
    branches: [feat/storage-v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel only a superseded pull-request run. A push is a distinct commit
  # someone wants tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  journal:
    name: Journal tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # go test caps itself at 25m; this covers a wedged setup-go or module
    # download.
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so dorny/paths-filter can resolve the previous commit
          # on push events; a shallow clone can miss it on a multi-commit push.
          fetch-depth: 0

      # decision: the path filter lives inside the job rather than in the
      # workflow's `paths:`, as in unit-tests.yml. A workflow skipped by path
      # filtering leaves its check pending forever, so the check could never
      # be made required; a job whose steps are skipped reports success
      # instead. A failure of the filter fails the job, so the check never goes
      # green having run nothing.
      - name: Check for journal changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            journal:
              - 'pkg/block/journal/**'
              - 'pkg/sim/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/journal-platforms.yml'

      - name: Set up Go
        if: github.event_name != 'pull_request' || steps.filter.outputs.journal == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true  # Built-in caching (replaces actions/cache)

      # -p 2, as in windows-build.yml: each -race test binary reserves a large
      # shadow arena, and several at once can exhaust a Windows runner's
      # commit limit. Bash on both runners, so one command serves both.
      - name: Run the journal tests
        if: github.event_name != 'pull_request' || steps.filter.outputs.journal == 'true'
        shell: bash
        run: go test -race -count=1 -p 2 -timeout=25m ./pkg/block/journal/...
