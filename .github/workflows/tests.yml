# Every registered suite of test/suites.yaml, through dt
# (docs/internals/rfcs/rfc-29-test-harness.md).
#
# plan lists the tier's cells with dt plan. Each cell runs as a job of its own,
# dt run CELL, on the runner the plan names: the blocking cells in run, the
# others in non-blocking, which nothing waits for. gate waits for plan and run,
# always runs, and is the check that decides.
#
# The suites move in from their own workflows one at a time. A conformance
# suite runs here beside its old job until their results match on 5
# consecutive runs; unit, integration, operator and lint, whose old jobs ran
# the commands dt runs, move in at once. plan keeps only the cells of those
# that have moved: pynfs, pjdfstest, WPTS, smbtorture without its Kerberos
# option, operator, the Windows unit run, and the suites with a job of their
# own. A suite joins by being added to the select in plan, with any step its
# cells need that run doesn't give yet, such as another service; the select
# goes once every suite runs here.
#
# The suites with a job of their own, named as the checks the develop ruleset
# requires, run in the jobs after non-blocking, which gate waits for too.
name: Tests

on:
  pull_request:
    branches: [develop, main, feat/storage-v2]
  # A push to any of them runs the merge tier; only develop's results alert
  # or post.
  push:
    branches: [develop, main, feat/storage-v2]
  schedule:
    # Nightly at 22:13 UTC, staggered from the other suites' runs.
    - cron: '13 22 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: The tier to run
        type: choice
        options: [pr, merge, nightly, manual]
        default: merge

permissions:
  contents: read

concurrency:
  # A scheduled run has a group of its own, so it and a push never replace
  # each other. A newer pull-request run cancels the one in progress.
  # decision: a push waits for the run in progress, and a newer push replaces
  # it while it waits, so pushes that land faster than a run are tested
  # together by the next one, and the one replaced, cancelled, has no result.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The tier of the run, and the retry: a test that fails is run once more after
# a merge and on the schedule, and never on a pull request, so a pull request
# can't merge a flaky test it introduced.
env:
  TIER: ${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'push' && 'merge' || github.event_name == 'schedule' && 'nightly' || inputs.tier }}
  RETRY: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && '1' || '0' }}

# Every run step in bash, whatever shell its runner would pick.
defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      blocking: ${{ steps.plan.outputs.blocking }}
      non-blocking: ${{ steps.plan.outputs.non-blocking }}
      fixed: ${{ steps.plan.outputs.fixed }}
    steps:
      # Full history: on a pull request, dt plan --base compares the branch
      # with where it left its base, so a docs-only change plans no cell.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Build dt
        run: go build -o "$RUNNER_TEMP/dt" ./cmd/dt

      # Each cell gets its name as one path element, for its artifact's name,
      # and the tools dt builds for it as nix installables, for the cache. A
      # cell with a job of its own runs there, so fixed lists their suites
      # rather than either matrix.
      - name: Plan the cells
        id: plan
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          set -o pipefail
          "$RUNNER_TEMP/dt" plan --tier "$TIER" ${BASE:+--base "$BASE"} --json |
            jq -c '[(.cells // [])[] | select(.job or .suite == "pynfs" or .suite == "pjdfstest" or .suite == "wpts" or .suite == "operator"
                or (.suite == "smbtorture" and .option == null) or .name == "unit/windows")
              | .slug = (.name | gsub("/"; "-")) | .nix = ((.tools // []) | map(".#" + .) | join(" "))]' > "$RUNNER_TEMP/cells.json"
          jq . "$RUNNER_TEMP/cells.json"
          {
            echo "blocking=$(jq -c 'map(select(.blocking and .job == null))' "$RUNNER_TEMP/cells.json")"
            echo "non-blocking=$(jq -c 'map(select(.blocking | not))' "$RUNNER_TEMP/cells.json")"
            echo "fixed=$(jq -c 'map(select(.job) | .suite)' "$RUNNER_TEMP/cells.json")"
          } >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.blocking != '[]'
    runs-on: ${{ matrix.place }}-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.blocking) }}

    # An empty image starts no service: a cell gets the ones its needs name.
    services: &services
      localstack:
        image: ${{ contains(matrix.needs, 'service:localstack') && 'localstack/localstack:4.13.1' || '' }}
        env:
          SERVICES: s3
          EAGER_SERVICE_LOADING: "1"
          GATEWAY_LISTEN: "0.0.0.0:4566"
          DISABLE_CORS_CHECKS: "1"
          DISABLE_CUSTOM_CORS_S3: "1"
          DEBUG: "0"
          LOCALSTACK_HOST: localhost:4566
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf https://localhost:4566/_localstack/health -k || curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps: &cell
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      # The kernel NFS client, for a cell whose fixture mounts the share.
      - name: Install NFS client utilities
        if: contains(matrix.needs, 'nfs-client')
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-common

      # dt builds the test tools a cell names under {tools} with nix, at the
      # revisions flake.lock pins. On a push the cache's setup realizes them
      # and publishes them; a pull request or a dispatch only reads the cache.
      # Only a publishing job receives the credentials: an unused input can
      # still be read by the checked-out action.
      - name: Install Nix
        if: matrix.nix != ''
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        if: matrix.nix != ''
        uses: ./.github/actions/nix-cache
        with:
          push: ${{ github.event_name == 'push' }}
          paths: ${{ matrix.nix }}
          access-key-id: ${{ github.event_name == 'push' && secrets.NIX_CACHE_ACCESS_KEY_ID || '' }}
          secret-access-key: ${{ github.event_name == 'push' && secrets.NIX_CACHE_SECRET_ACCESS_KEY || '' }}
          signing-key: ${{ github.event_name == 'push' && secrets.NIX_CACHE_SIGNING_KEY || '' }}

      - name: Build dt
        id: build
        run: go build -o "$RUNNER_TEMP/dt" ./cmd/dt

      - name: Run ${{ matrix.name }}
        env:
          CELL: ${{ matrix.name }}
        run: '"$RUNNER_TEMP/dt" run "$CELL" --tier "$TIER" --ci --retry "$RETRY"'

      - name: Report
        if: always() && steps.build.outcome == 'success'
        run: '"$RUNNER_TEMP/dt" report --format md >> "$GITHUB_STEP_SUMMARY"'

      # Under the job's own name, which gate's download picks the blocking
      # cells' by, and each attempt's apart, as dt's RUN-a2 directory keeps
      # them. Without the binaries dt built and the tools it linked.
      - name: Upload results
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: dt-${{ github.job }}-${{ matrix.slug }}-${{ github.run_attempt }}
          path: |
            test/harness/results/
            !test/harness/results/*/bin/
            !test/harness/results/*/tools/
          if-no-files-found: ignore

  # Reported and annotated like the blocking cells, and a failed one shows as
  # failed on the pull request, but gate doesn't wait for it, and it doesn't
  # fail the run, whose result is what CI Health reads for develop.
  non-blocking:
    name: ${{ matrix.name }} (non-blocking)
    needs: plan
    if: needs.plan.outputs.non-blocking != '[]'
    continue-on-error: true
    runs-on: ${{ matrix.place }}-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.non-blocking) }}
    services: *services
    steps: *cell

  # The suites with a job of their own, each named for the check the develop
  # ruleset requires, with its suite's name as its id. Each runs its suite as
  # a cell runs, dt run SUITE with the run's tier and retry, and names its
  # results as a run cell's, so gate reports them with the rest.
  #
  # decision: the lint jobs don't wait for plan, so a docs-only change, which
  # plans no cell, still has its commits and the suite tables checked.
  lint-go:
    name: Go Checks
    runs-on: ubuntu-latest
    # A hang detector, not a budget: its checks have summed to about 380s.
    timeout-minutes: 20
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7

      # Its Go problem matcher turns vet and golangci-lint findings in dt's
      # output into annotations on the pull request.
      - &go
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
          # Analyse cold every run. The action restores and saves its analysis
          # cache even when it only installs, and dt's run reads it. Its cache
          # key covers go.mod, but its restore-key fallback does not: when a
          # dependency bump changes go.mod the run misses its own key, restores
          # the pre-bump analysis cache, and then saves a fact set built from it
          # under the new key. Every later run gets an exact hit on that entry,
          # and staticcheck loses the cross-package fact that t.Fatal never
          # returns, which turns every `if x == nil { t.Fatal(...) }` guard into
          # a spurious SA5011 nil-dereference report. Restoring is what breaks
          # it, so the cache is skipped rather than pinned: costs ~20s.
          skip-cache: true

      - &build
        name: Build dt
        id: build
        run: go build -o "$RUNNER_TEMP/dt" ./cmd/dt

      - &suite
        name: Run ${{ github.job }}
        run: '"$RUNNER_TEMP/dt" run "$GITHUB_JOB" --tier "$TIER" --ci --retry "$RETRY"'

      # Every run of the job: integration's has three.
      - &report
        name: Report
        if: always() && steps.build.outcome == 'success'
        run: |
          for run in test/harness/results/*/; do
            "$RUNNER_TEMP/dt" report "$run" --format md
          done >> "$GITHUB_STEP_SUMMARY"

      - &upload
        name: Upload results
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: dt-run-${{ github.job }}-${{ github.run_attempt }}
          path: test/harness/results/
          if-no-files-found: ignore

  lint-repo:
    name: Repo Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the checks that compare with {base} diff against a
      # merge base. On a push that base is the commit before it, which is
      # how commits pushed straight to develop are checked too.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only to build dt and run its own tests, which need a few modules, so
      # no cache to restore.
      - &go-uncached
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - *build
      - *suite
      - *report
      - *upload

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *go-uncached

      # Pinned by version and checksum, so a new release can't turn the job
      # red on its own.
      - name: Install ShellCheck
        env:
          VERSION: v0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSLo "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/$VERSION/shellcheck-$VERSION.linux.x86_64.tar.xz"
          echo "$SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$VERSION" >> "$GITHUB_PATH"

      - *build
      - *suite
      - *report
      - *upload

  # unit and integration skip when the plan has no cell of theirs, as for a
  # docs-only change, and a skipped job passes the check the ruleset requires.
  # decision: they run when plan fails, so a check the ruleset requires never
  # passes on a plan that wasn't made.
  unit:
    name: Unit Tests (1.26.x)
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || contains(fromJSON(needs.plan.outputs.fixed), 'unit')) }}
    runs-on: ubuntu-latest
    # go test caps itself at 25m; this catches a wedged setup.
    timeout-minutes: 35
    steps:
      - *checkout
      - *go
      - *build
      - *suite
      - *report
      - *upload

      # A retry rewrites the coverage profile with the retried tests' alone,
      # so a run that retried uploads none.
      - name: Upload coverage to Codecov
        if: hashFiles('test/harness/results/*/unit/go-test-*-retry-*.json') == ''
        uses: codecov/codecov-action@v7
        with:
          files: test/harness/results/*/unit/coverage.txt
          flags: unittests
          name: codecov-unit-tests
        continue-on-error: true

  integration:
    name: Integration Tests (1.26.x)
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result != 'success' || contains(fromJSON(needs.plan.outputs.fixed), 'integration')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - *checkout
      - *go
      - *build

      # The services its needs name, which dt run checks answer before the
      # tests start.
      - name: Start PostgreSQL and PyKMIP
        run: '"$RUNNER_TEMP/dt" services up postgres kmip'

      - *suite

      # decision: integration's Kerberos and portmap options run as steps of
      # the job the ruleset requires, after the suite, rather than as run
      # cells, which only gate waits for. They go back to being plan cells when
      # the ruleset requires gate. Each runs even when a step before it
      # failed, so the job reports every failure.
      - name: Run integration/kerberos
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: '"$RUNNER_TEMP/dt" run integration/kerberos --tier "$TIER" --ci --retry "$RETRY"'

      # The image has no rpcbind. apt and needrestart both prompt on a machine
      # without a terminal if left to their defaults, and a prompt blocks with
      # no output until the job's limit.
      - name: Install rpcbind
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y rpcbind
          sudo systemctl start rpcbind || sudo rpcbind

      - name: Run integration/portmap
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: '"$RUNNER_TEMP/dt" run integration/portmap --tier "$TIER" --ci --retry "$RETRY"'

      - *report
      - *upload

  # Fails unless plan passed and every other job it needs passed or skipped:
  # a run job passes only when its cell's dt run exited 0, and a fixed job
  # skips when the plan has no cell of its suite. A plan with no blocking
  # cell, as a docs-only change gives, passes.
  gate:
    name: gate
    needs: [plan, run, lint-go, lint-repo, shellcheck, unit, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the results
        uses: actions/download-artifact@v7
        with:
          pattern: dt-run-*
          path: ${{ runner.temp }}/results

      # Every blocking cell's report.md, which is what dt report prints for it,
      # from its latest attempt: a job re-run uploads one of its own.
      - name: Report
        if: always()
        run: |
          shopt -s nullglob
          declare -A latest   # each cell's artifact, dt-run-CELL-ATTEMPT, by CELL
          for d in $(printf '%s\n' "$RUNNER_TEMP"/results/dt-run-* | sort -V); do
            latest[${d%-*}]=$d
          done
          reports=()
          for d in $(printf '%s\n' "${latest[@]}" | sort); do
            reports+=("$d"/*/report.md)
          done
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No blocking cell reported." >> "$GITHUB_STEP_SUMMARY"
          fi
          for r in "${reports[@]}"; do
            cat "$r"
            echo
          done >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '.plan.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
