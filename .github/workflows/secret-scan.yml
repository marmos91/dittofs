name: Secret Scan

on:
  push:
    branches: [develop, main, feat/storage-v2]
  pull_request:
    branches: [develop, main, feat/storage-v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel only a superseded pull-request run. A push is a distinct commit
  # someone wants tested, and cancelling it leaves the branch with no result to
  # compare a red run against. This protects a push run that is already
  # executing, not one still queued: a newer run replaces the pending one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0

      # decision: the gitleaks binary rather than gitleaks-action, which refuses
      # to run on an organization's repositories without a license key. Pinned by
      # version and checksum, so a new release can't turn the job red on its own.
      # Overturned if the scan needs what only the action adds: the SARIF upload
      # and the job summary.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # The commits the event brings, as the action scanned them: a pull request's
      # own commits, or a push's. A push whose old tip isn't in the history (a new
      # branch, a force push) scans its new tip alone.
      - name: Run gitleaks
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            commits="--no-merges --first-parent $BASE..$HEAD"
          else
            commits="-1 $HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="$commits" .
