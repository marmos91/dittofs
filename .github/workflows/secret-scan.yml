name: Secret Scan

on:
  push:
    branches: [develop, main, feat/storage-v2]
  pull_request:
    branches: [develop, main, feat/storage-v2]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel only a superseded pull-request run. A push is a distinct commit
  # someone wants tested, and cancelling it leaves the branch with no result to
  # compare a red run against. This protects a push run that is already
  # executing, not one still queued: a newer run replaces the pending one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so gitleaks scans every commit, not just the tip.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # SHA-256 of the linux_x64 tarball, from the release's checksums file.
          # Bump it together with GITLEAKS_VERSION.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$tarball" gitleaks

      # Picks up .gitleaks.toml from the repository root. Exits non-zero on a finding.
      - name: Run gitleaks
        run: gitleaks git --redact --verbose --no-banner .
