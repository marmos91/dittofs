# pynfs against the kernel's own NFS server, knfsd, for comparison: the evidence
# behind pynfs's known failures that no server passes. It measures a
# third-party server, so its verdict says nothing about a commit, and it runs
# on dispatch only. pynfs against DittoFS runs in tests.yml.

name: pynfs knfsd baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: knfsd baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Read-only. This job measures a third-party server, so what it realizes
      # is nothing the cache should ever serve back.
      - name: Setup Nix cache
        uses: ./.github/actions/nix-cache

      - name: Install kernel NFS server
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-kernel-server
          sudo modprobe nfsd || echo "WARNING: could not load nfsd"

      - name: Run pynfs against knfsd
        run: sudo -E env "PATH=$PATH" ./test/nfs-conformance/pynfs/baseline-knfsd.sh

      - name: Upload baseline
        if: always()
        # A lost diagnostics zip must not invert a verdict the suite has already
        # produced: the run step above decides pass or fail, this upload only
        # preserves the evidence.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pynfs-knfsd-baseline
          path: |
            test/nfs-conformance/pynfs/baseline-knfsd.md
            test/nfs-conformance/pynfs/results/
          retention-days: 30
