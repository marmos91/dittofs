# AD-DC PAC Integration Test (AD-1, #1233)
#
# Validates that an Active Directory ticket's Kerberos PAC group SIDs flow
# through the shared KerberosService into the AuthResult — the property AD-1
# delivers (DecodePAC + group-SID threading). Uses a real Samba AD-DC in
# Docker (test/integration/ad-dc), which issues PAC-bearing tickets that a
# plain MIT KDC cannot.
#
# Tiered by EVENT, matching the smbtorture-kerberos job:
#   postsubmit (push develop) + nightly cron + manual dispatch only.
# OFF presubmit: building + provisioning a fresh Samba AD domain is expensive
# (minutes) and AD is rarely the regressing surface on an ordinary PR.

name: AD-DC PAC Test

on:
  push:
    branches: [develop, feat/storage-v2]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '**.png'
      - '**.jpg'
      - '**.svg'
  schedule:
    - cron: '43 4 * * *'  # Nightly 04:43 UTC, staggered from the protocol suites.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A scheduled run has a group of its own, so it and a push never replace
  # each other. A re-run keeps its event, and so its group.
  group: ad-dc-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  # No pull_request trigger, so there is nothing to supersede: every run is a
  # push, a schedule or a manual dispatch, and each is a distinct commit
  # someone wants tested. This protects a run that is already executing, not
  # one still queued: a newer run replaces the pending one.
  cancel-in-progress: false

jobs:
  ad-dc:
    name: AD PAC group SIDs
    runs-on: ubuntu-latest
    # The samba-ad-dc image build + domain provision dominates the wall clock.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Install smbclient (for NTLM e2e test)
        run: sudo apt-get update && sudo apt-get install -y smbclient

      - name: Run AD-DC PAC integration test
        run: |
          cd test/integration/ad-dc
          chmod +x run.sh
          ./run.sh -v
