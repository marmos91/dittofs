name: Integration Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
    paths:
      - 'cmd/**/*.go'
      - 'pkg/**/*.go'
      - 'pkg/metadata/store/*/migrations/*.sql'
      - 'internal/**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'test/integration/**'
      - 'test/kmip/**'
      - '.github/workflows/integration-tests.yml'
      # The job's command is the harness's (dt), so a change to it alone must run the job.
      - 'test/harness/bin/dt'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel only a superseded pull-request run. A push is a distinct commit
  # someone wants tested, and cancelling it leaves the branch with no result to
  # compare a red run against. This protects a push run that is already
  # executing, not one still queued: a newer run replaces the pending one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Without a cap this job inherits the six-hour default, so a hang holds a
    # required check for the rest of the day instead of failing and retrying.
    timeout-minutes: 45

    strategy:
      matrix:
        go-version: ["1.26.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # PostgreSQL for the metadata-store integration + conformance suites.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true  # Built-in caching (replaces actions/cache)

      - name: Download dependencies
        run: go mod download

      # The local harness's command (test/harness/bin/dt integration), so a run on
      # a laptop is this run. It starts what the tests need as plain containers,
      # retrying each image pull (Actions cannot retry a `services:` pull, and a
      # transient Docker Hub error there failed the job before any step ran):
      #   - Postgres 16 on 127.0.0.1:15432, postgres/postgres, db dittofs_test,
      #     with DITTOFS_TEST_POSTGRES_DSN and DITTOFS_TEST_PG_* pointing at it;
      #   - PyKMIP on 127.0.0.1:5696, with certificates, one key per state the
      #     provider reacts to, and the DITTOFS_TEST_KMIP_* variables.
      # It runs the packages test/integration/packages.sh derives (see its
      # header for why derived, and why only those) with -tags=integration -p 1,
      # then the KMIP interop tests in pkg/block/middleware/encryption/keyprovider,
      # which carry no integration tag and so are on no derived list.
      - name: Run the integration tests
        run: test/harness/bin/dt integration -v

      - name: Install and start rpcbind
        env:
          # apt and needrestart both prompt on a tty-less runner if left to
          # their defaults, and a prompt here blocks with no output until the
          # job's wall clock runs out.
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y rpcbind
          sudo systemctl start rpcbind || sudo rpcbind

      - name: Run portmap system integration tests
        run: |
          # Tests RPC client against system rpcbind
          # Skips automatically if rpcbind unavailable or NFS already registered
          go test -tags=portmap_system -v -timeout=2m ./test/integration/portmap/...

      - name: Dump PyKMIP logs on failure
        if: failure()
        run: docker logs dittofs-pykmip || true

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs-${{ matrix.go-version }}
          path: |
            /tmp/dittofs-*
            test/harness/logs/
          retention-days: 3
          if-no-files-found: ignore
