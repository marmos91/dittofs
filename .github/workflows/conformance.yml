# Conformance Suites
#
# Every protocol-conformance suite runs from here, and which profiles each one
# runs per event comes from test/conformance/suites.json rather than from a
# ternary copy-pasted into a workflow per suite. Adding a suite is a manifest
# entry; changing a tier is a manifest edit.
#
# Tiered by EVENT, not by path. A change to shared code — a metadata store, the
# runtime — can break any protocol from underneath, so conformance runs on all
# non-docs PRs. Path filters skip docs-only changes only. Kerberos mounts are
# tested by the e2e suite (e2e-tests.yml), which runs its Kerberos tests on PRs
# that touch Kerberos code.
#
# The jobs differ in what they need around the suite — Docker Compose, a kernel
# NFS mount and root, a localstack service — because the suites
# genuinely differ there. What they share is the manifest, test/conformance/run.sh,
# and the KNOWN_FAILURES grading contract.

name: Conformance Suites

on:
  push:
    branches: [develop, main, feat/storage-v2]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '**.png'
      - '**.jpg'
      - '**.svg'
  pull_request:
    branches: [develop, main, feat/storage-v2]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '**.png'
      - '**.jpg'
      - '**.svg'
  schedule:
    # Nightly at 22:19 UTC, staggered from the other protocol suites. GitHub
    # starts scheduled runs hours late, which lands this one before the
    # working day rather than inside it.
    - cron: '19 22 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Single suite to run (blank runs the full postsubmit set)'
        type: choice
        options:
          - ''
          - wpts
          - smbtorture
          - pjdfstest
          - cthon04
          - nfstest
        default: ''

permissions:
  contents: read

concurrency:
  # A scheduled run has a group of its own, so it and a push never replace
  # each other. A re-run keeps its event, and so its group.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  # Cancel a superseded PR run: a new commit replaces the old one, and only the
  # tip matters. Do NOT cancel a develop run: each push is a distinct commit
  # someone wants tested, and cancelling it means it never is -- which left most
  # develop runs cancelled and the develop-red alarm blind. The cost is runner
  # contention: develop runs now queue instead of superseding, bounded by the
  # single running + single pending slot GitHub keeps per group.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DITTOFS_MOUNT: /tmp/dittofs-test
  # The tier the parity jobs' dt runs at, as the scripts' jobs pick theirs: a
  # dispatch naming a suite as the schedule, a blank one as after a merge.
  TIER: ${{ (github.event_name == 'schedule' || inputs.suite != '') && 'nightly' || 'merge' }}

jobs:
  # ---------------------------------------------------------------------------
  # The manifest decides what runs. Everything below reads its matrix from here.
  # ---------------------------------------------------------------------------
  matrix:
    name: Resolve suite matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wpts: ${{ steps.resolve.outputs.wpts }}
      smbtorture: ${{ steps.resolve.outputs.smbtorture }}
      pjdfstest: ${{ steps.resolve.outputs.pjdfstest }}
      pynfs: ${{ steps.resolve.outputs.pynfs }}
      # cthon04 and nfstest share one job, so their cells are also published
      # together; the per-suite outputs above still exist for both.
      nfs_mount: ${{ steps.resolve.outputs.nfs_mount }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the matrix from the manifest
        id: resolve
        env:
          # workflow_dispatch has no tier of its own. A blank dispatch runs like
          # a postsubmit one. A dispatch naming one suite runs that suite's
          # nightly set instead: a nightly-only suite has an empty push tier,
          # and asking for it by name would otherwise run nothing.
          EVENT: >-
            ${{ github.event_name == 'pull_request' && 'pull_request'
                || github.event_name == 'schedule' && 'schedule'
                || (github.event_name == 'workflow_dispatch' && inputs.suite != '') && 'schedule'
                || 'push' }}
          ONLY: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          FULL="$(./test/conformance/run.sh --matrix "$EVENT")"
          echo "$FULL" | jq .
          for suite in $(jq -r '.suites | keys_unsorted[]' test/conformance/suites.json); do
            if [ -n "$ONLY" ] && [ "$ONLY" != "$suite" ]; then
              echo "${suite//-/_}=[]" >> "$GITHUB_OUTPUT"
              continue
            fi
            cells="$(jq -c --arg s "$suite" '[.include[] | select(.suite == $s)]' <<<"$FULL")"
            echo "${suite//-/_}=${cells}" >> "$GITHUB_OUTPUT"
          done
          cells="$(jq -c --arg only "$ONLY" '[.include[]
            | select(.suite == "cthon04" or .suite == "nfstest")
            | select($only == "" or .suite == $only)]' <<<"$FULL")"
          echo "nfs_mount=${cells}" >> "$GITHUB_OUTPUT"

  # The graders decide whether a suite is red at all, so they are guarded on
  # their own in about a second rather than only through a 40-minute run that
  # would have to fail first to reveal a grading regression. The common
  # runner's, the known-failures parser's and the admission lease's tests run
  # in Repo Checks (lint.yml).
  graders:
    name: Grading logic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test the POSIX grader
        run: ./test/posix/parse-results_test.sh

      - name: Test the smbtorture grader
        run: ./test/smb-conformance/smbtorture/parse-results_test.sh

      - name: Test the cthon04 grader
        run: ./test/nfs-mount/cthon04/parse-results_test.sh

      - name: Test the nfstest grader
        run: ./test/nfs-mount/nfstest/parse-results_test.sh

      - name: Install the TRX parser
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet

      - name: Test grader exit-status boundaries
        run: ./test/conformance/grader-exit-status_test.sh

  # ---------------------------------------------------------------------------
  # SMB — Docker Compose, no host services, no root.
  # ---------------------------------------------------------------------------
  wpts:
    name: WPTS BVT / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    needs: matrix
    if: needs.matrix.outputs.wpts != '[]'
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.wpts) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y xmlstarlet gettext-base

      - name: Run WPTS BVT
        run: ./test/conformance/run.sh --suite wpts --profile ${{ matrix.profile }}

      - name: Add step summary
        if: always()
        run: |
          RESULTS_DIR=$(ls -td test/smb-conformance/results/*/ 2>/dev/null | head -1)
          TRX_FILE=""
          [ -n "$RESULTS_DIR" ] && TRX_FILE=$(find "$RESULTS_DIR" -name "*.trx" -type f 2>/dev/null | head -1)
          if [ -z "$TRX_FILE" ]; then
            {
              echo "## WPTS BVT: ${{ matrix.profile }}"
              echo "No TRX results found."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          NS="http://microsoft.com/schemas/VisualStudio/TeamTest/2010"
          TOTAL=$(xmlstarlet sel -N t="$NS" -t -v "//t:Counters/@total" "$TRX_FILE" 2>/dev/null || echo "0")
          PASSED=$(xmlstarlet sel -N t="$NS" -t -v "//t:Counters/@passed" "$TRX_FILE" 2>/dev/null || echo "0")
          FAILED=$(xmlstarlet sel -N t="$NS" -t -v "//t:Counters/@failed" "$TRX_FILE" 2>/dev/null || echo "0")
          NOT_EXEC=$(xmlstarlet sel -N t="$NS" -t -v "//t:Counters/@notExecuted" "$TRX_FILE" 2>/dev/null || echo "0")

          {
            echo "## WPTS BVT: ${{ matrix.profile }}"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Total | ${TOTAL} |"
            echo "| Passed | ${PASSED} |"
            echo "| Failed | ${FAILED} |"
            echo "| Skipped | ${NOT_EXEC} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        # A lost diagnostics zip must not invert a verdict the suite has already
        # produced: the run step above decides pass or fail, this upload only
        # preserves the evidence.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wpts-${{ matrix.profile }}
          path: |
            test/smb-conformance/results/
            test/conformance/results/
          retention-days: 30

  smbtorture:
    name: smbtorture / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    needs: matrix
    if: needs.matrix.outputs.smbtorture != '[]'
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.smbtorture) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run smbtorture
        run: ./test/conformance/run.sh --suite smbtorture --profile ${{ matrix.profile }}

      - name: Add step summary
        if: always()
        run: |
          # Launched through the common runner, which injects its own results
          # directory — so the runner writes here rather than into its
          # timestamped one. The fallback keeps a direct invocation working.
          RESULTS_DIR="test/conformance/results/smbtorture/${{ matrix.profile }}"
          if [ ! -f "$RESULTS_DIR/summary.txt" ]; then
            RESULTS_DIR=$(ls -td test/smb-conformance/results/smbtorture-*/ 2>/dev/null | head -1 || true)
          fi
          {
            echo "## smbtorture: ${{ matrix.profile }}"
            if [ -n "$RESULTS_DIR" ] && [ -f "$RESULTS_DIR/summary.txt" ]; then
              cat "$RESULTS_DIR/summary.txt"
            else
              echo "No results found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        # A lost diagnostics zip must not invert a verdict the suite has already
        # produced: the run step above decides pass or fail, this upload only
        # preserves the evidence.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: smbtorture-${{ matrix.profile }}
          path: |
            test/smb-conformance/results/smbtorture-*/
            test/conformance/results/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # POSIX — kernel NFS mount, root, and the backing services required by the
  # profile. Service selection matches the stores created by setup-posix.sh.
  # ---------------------------------------------------------------------------
  pjdfstest:
    name: NFS v${{ matrix.variant }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    needs: matrix
    if: needs.matrix.outputs.pjdfstest != '[]'
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.pjdfstest) }}

    # An empty image means the service is not started; the matrix profile
    # decides which services this cell gets.
    services:
      localstack:
        image: ${{ endsWith(matrix.profile, '-s3') && 'localstack/localstack:4.13.1' || '' }}
        env:
          SERVICES: s3
          EAGER_SERVICE_LOADING: "1"
          GATEWAY_LISTEN: "0.0.0.0:4566"
          DISABLE_CORS_CHECKS: "1"
          DISABLE_CUSTOM_CORS_S3: "1"
          DEBUG: "0"
          LOCALSTACK_HOST: localhost:4566
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf https://localhost:4566/_localstack/health -k || curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: ./.github/actions/nix-cache
        with:
          # Every cell uses the same pjdfstest derivation. One cell publishes
          # it on a push to develop or main; the rest only read the shared cache.
          push: ${{ github.event_name == 'push' && strategy.job-index == 0 }}
          # Publish only this suite: naming a sibling suite would make this
          # job realize an unrelated derivation too.
          paths: .#pjdfstest
          # Only the publishing cell receives credentials: an unused input
          # can still be read by the checked-out action.
          access-key-id: ${{ github.event_name == 'push' && strategy.job-index == 0 && secrets.NIX_CACHE_ACCESS_KEY_ID || '' }}
          secret-access-key: ${{ github.event_name == 'push' && strategy.job-index == 0 && secrets.NIX_CACHE_SECRET_ACCESS_KEY || '' }}
          signing-key: ${{ github.event_name == 'push' && strategy.job-index == 0 && secrets.NIX_CACHE_SIGNING_KEY || '' }}

      - name: Install NFS client utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-common

      - name: Build pjdfstest in Nix
        run: |
          PJDFSTEST=$(nix build .#pjdfstest --print-out-paths)
          echo "PJDFSTEST_DIR=$PJDFSTEST" >> $GITHUB_ENV
          echo "$PJDFSTEST/bin" >> $GITHUB_PATH

      # setup-posix.sh builds both binaries from the checkout before starting
      # the server, so no prebuilt artifact is needed.
      - name: Run pjdfstest
        run: |
          ./test/conformance/run.sh \
            --suite pjdfstest \
            --profile ${{ matrix.profile }} \
            --variant ${{ matrix.variant }}

      - name: Show the server log on failure
        if: failure()
        run: |
          echo "=== Server log ==="
          cat /tmp/dittofs-posix-server.log 2>/dev/null || echo "no server log"
          echo "=== Listeners ==="
          ss -tlnp | grep -E '8080|12049' || echo "nothing on 8080/12049"

      - name: Upload results
        if: always()
        # A lost diagnostics zip must not invert a verdict the suite has already
        # produced: the run step above decides pass or fail, this upload only
        # preserves the evidence.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pjdfstest-v${{ matrix.variant }}-${{ matrix.profile }}
          path: |
            test/conformance/results/
            /tmp/dittofs-posix-server.log
          retention-days: 30

  # ---------------------------------------------------------------------------
  # NFS mount-option suites — cthon04 and nfstest against a kernel mount with
  # each named option set in test/nfs-mount/option-sets.sh. Same shape as
  # pjdfstest: a dfs on the host adapter, sudo for the mount. Both suites run
  # in this one job; the matrix cell names which. Mostly nightly: PRs get
  # cthon04, merges get nothing (tiers in suites.json).
  # ---------------------------------------------------------------------------
  nfs-mount:
    name: ${{ matrix.suite }} ${{ matrix.variant }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    needs: matrix
    if: needs.matrix.outputs.nfs_mount != '[]'
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.nfs_mount) }}

    services:
      localstack:
        image: ${{ endsWith(matrix.profile, '-s3') && 'localstack/localstack:4.13.1' || '' }}
        env:
          SERVICES: s3
          EAGER_SERVICE_LOADING: "1"
          GATEWAY_LISTEN: "0.0.0.0:4566"
          DISABLE_CORS_CHECKS: "1"
          DISABLE_CUSTOM_CORS_S3: "1"
          DEBUG: "0"
          LOCALSTACK_HOST: localhost:4566
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf https://localhost:4566/_localstack/health -k || curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # cthon04 builds against libtirpc and its general group shells out to
      # time(1); nfstest captures packets with tcpdump.
      - name: Install NFS client and suite dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-common rpcbind openssh-server iproute2 libtirpc-dev pkg-config time tcpdump

      # The suites come from git.linux-nfs.org over git://. Caching them keys
      # on fetch.sh, which holds the pinned revisions, so a re-pin refetches
      # and an unchanged pin never touches the network.
      - name: Cache the upstream suites
        uses: actions/cache@v6
        with:
          path: test/nfs-mount/.cache
          key: nfs-mount-suites-${{ hashFiles('test/nfs-mount/fetch.sh') }}

      # setup-posix.sh builds both binaries from the checkout before starting
      # the server, so no prebuilt artifact is needed.
      - name: Run ${{ matrix.suite }}
        run: |
          ./test/conformance/run.sh \
            --suite ${{ matrix.suite }} \
            --profile ${{ matrix.profile }} \
            --variant ${{ matrix.variant }}

      - name: Show the server log on failure
        if: failure()
        run: |
          echo "=== Server log ==="
          cat /tmp/dittofs-posix-server.log 2>/dev/null || echo "no server log"

      - name: Upload results
        if: always()
        # A lost diagnostics zip must not invert a verdict the suite has already
        # produced: the run step above decides pass or fail, this upload only
        # preserves the evidence.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite }}-${{ matrix.variant }}-${{ matrix.profile }}
          path: |
            test/conformance/results/
            /tmp/dittofs-posix-server.log
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Extra SMB jobs that are not a profile cell of any suite.
  # ---------------------------------------------------------------------------
  smbtorture-kerberos:
    name: smbtorture Kerberos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Off on presubmit: Kerberos is expensive and rarely regressing on an
    # ordinary PR. Runs on push to develop, nightly, and manual dispatch.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The self-contained KDC (test/smb-conformance/kdc) is started via the
      # docker-compose "kerberos" profile by run.sh --kerberos, and Localstack
      # with the bucket for badger-s3, the production profile, which dt's
      # kerberos option runs too. No external KDC or secrets required.
      #
      # The filters cover Kerberos-sensitive operations, not just session setup:
      # a truncated or garbled GSS session key surfaces on read and lock too.
      # run.sh takes a single --filter, so iterate — one suite per invocation —
      # to keep each run inside the harness's per-suite timeout budget.
      #
      # smb2.create is deliberately excluded: its known failures are catalogued
      # only in the non-Kerberos KNOWN_FAILURES.md, so they would grade as NEW
      # failures under --kerberos. Re-add once the Kerberos list covers it.
      - name: Run smbtorture Kerberos
        run: |
          cd test/smb-conformance/smbtorture
          rc=0
          for f in smb2.session smb2.read smb2.lock; do
            ./run.sh --profile badger-s3 --kerberos --filter "$f" --verbose || rc=$?
          done
          exit "$rc"

      - name: Add step summary
        if: always()
        run: |
          RESULTS_DIR=$(ls -td test/smb-conformance/results/smbtorture-*/ 2>/dev/null | head -1 || true)
          {
            echo "## smbtorture Kerberos"
            if [ -n "$RESULTS_DIR" ] && [ -f "$RESULTS_DIR/summary.txt" ]; then
              cat "$RESULTS_DIR/summary.txt"
            else
              echo "No results found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        # A lost diagnostics zip must not invert a verdict the suite has already
        # produced: the run step above decides pass or fail, this upload only
        # preserves the evidence.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: smbtorture-kerberos
          path: test/smb-conformance/results/smbtorture-*/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Parity: the same suites' cells through dt, beside the scripts' jobs, until
  # the two give the same results on 5 consecutive runs
  # (docs/internals/rfcs/rfc-29-test-harness.md). Never blocking: a red cell
  # or a difference fails its own job, and never the workflow run. They go
  # when the suites move into tests.yml.
  # ---------------------------------------------------------------------------
  dt-plan:
    name: dt plan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.plan.outputs.cells }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      # This workflow's suites, narrowed as a dispatch naming one narrows the
      # scripts' jobs. Options are left out, as the harness RFC's parity has them.
      - name: Plan the cells
        id: plan
        env:
          ONLY: ${{ inputs.suite }}
        run: |
          set -o pipefail
          cells="$(go run ./cmd/dt plan --tier "$TIER" --json | jq -c --arg only "$ONLY" '[.cells[]
            | select(.option == null and (.suite == "pjdfstest" or .suite == "wpts" or .suite == "smbtorture"))
            | select($only == "" or .suite == $only)]')"
          echo "$cells" | jq .
          echo "cells=${cells}" >> "$GITHUB_OUTPUT"

  dt:
    name: dt ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: dt-plan
    if: needs.dt-plan.outputs.cells != '[]'
    timeout-minutes: ${{ matrix.timeout_minutes }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.dt-plan.outputs.cells) }}

    services:
      localstack:
        image: ${{ contains(matrix.needs, 'service:localstack') && 'localstack/localstack:4.13.1' || '' }}
        env:
          SERVICES: s3
          EAGER_SERVICE_LOADING: "1"
          GATEWAY_LISTEN: "0.0.0.0:4566"
          DISABLE_CORS_CHECKS: "1"
          DISABLE_CUSTOM_CORS_S3: "1"
          DEBUG: "0"
          LOCALSTACK_HOST: localhost:4566
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf https://localhost:4566/_localstack/health -k || curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      # dt builds pjdfstest from flake.lock with nix, as the scripts' job does.
      - name: Install Nix
        if: matrix.suite == 'pjdfstest'
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        if: matrix.suite == 'pjdfstest'
        uses: ./.github/actions/nix-cache

      - name: Install NFS client utilities
        if: contains(matrix.needs, 'nfs-client')
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-common

      # And the cell's name as one path element, for its artifact's name.
      - name: Build dt
        id: build
        env:
          CELL: ${{ matrix.name }}
        run: |
          go build -o "$RUNNER_TEMP/dt" ./cmd/dt
          echo "SLUG=${CELL//\//-}" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.name }}
        env:
          CELL: ${{ matrix.name }}
        run: '"$RUNNER_TEMP/dt" run "$CELL" --tier "$TIER" --ci'

      - name: Report
        if: always() && steps.build.outcome == 'success'
        run: '"$RUNNER_TEMP/dt" report --format md >> "$GITHUB_STEP_SUMMARY"'

      # One artifact per cell, replaced by a re-run, so the last job compares
      # each cell's latest run. Without the binaries dt built and the tools it
      # linked, about 90 MB a cell.
      - name: Upload results
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: dt-results-${{ env.SLUG }}
          path: |
            test/harness/results/
            !test/harness/results/*/bin/
            !test/harness/results/*/tools/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30

  # Compares each cell's results through dt with its results through the
  # scripts. Its result is what the 5 consecutive runs count.
  parity:
    name: dt and the scripts, cell by cell
    runs-on: ubuntu-latest
    needs: [dt-plan, dt, wpts, smbtorture, pjdfstest]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Download the results
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/results

      # Against the plan, so a cell missing on either side, or none at all, differs.
      - name: Compare
        env:
          CELLS: ${{ needs.dt-plan.outputs.cells }}
        run: |
          set -o pipefail
          go run ./test/conformance/parity --plan "$CELLS" "$RUNNER_TEMP/results" pjdfstest wpts smbtorture | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  summary:
    name: Conformance summary
    runs-on: ubuntu-latest
    # Not on a cancelled run: its cells report `cancelled`, which says nothing
    # about the code.
    if: ${{ !cancelled() }}
    needs: [matrix, graders, wpts, smbtorture, pjdfstest, nfs-mount, smbtorture-kerberos]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Summarise
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Conformance Suites"
            echo ""
            echo "| Suite | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$RESULTS"
            echo ""
            echo "Profiles, variants and per-event tiering come from"
            echo "\`test/conformance/suites.json\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if a suite failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # `skipped` is a legitimate outcome (a suite with no cells for this
          # event, or a path-scoped one); `failure` and `cancelled` are not.
          bad=$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<<"$RESULTS")
          if [ -n "$bad" ]; then
            echo "failed suites: $bad" >&2
            exit 1
          fi
