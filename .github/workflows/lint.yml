name: Lint

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Cancel only a superseded pull-request run. A push is a distinct commit
  # someone wants tested, and cancelling it leaves the branch with no result to
  # compare a red run against. This protects a push run that is already
  # executing, not one still queued: a newer run replaces the pending one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The tier each job's suite runs at: pr on pull requests, merge on pushes.
env:
  TIER: ${{ github.event_name == 'pull_request' && 'pr' || 'merge' }}

# Ten jobs became three. Each one held a runner slot in a fan-out that queues
# far longer than it executes, and seven of them spent most of their wall-clock
# checking out and installing a Go toolchain to run a check lasting seconds.
#
# Each job runs one lint suite of test/suites.yaml with dt, which holds the
# checks and their order. The grouping is by what a check needs, not by what
# it does: Go Checks runs everything that analyses Go, Repo Checks everything
# that needs a full clone, ShellCheck the shell scripts. Sharing one Go build
# cache means `go vet ./...` warms the compile that required-tests.sh would
# otherwise pay for again. dt runs every command of a suite even after one
# fails, so a red job reports every check that failed, the signal ten separate
# jobs used to give, and names each in the job summary.
jobs:
  go-checks:
    name: Go Checks
    runs-on: ubuntu-latest
    # Five checks that each used to own a job; the slowest four have summed to
    # about 380s. Twenty minutes is a hang detector, not a budget.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Its Go problem matcher turns vet and golangci-lint findings in dt's
      # output into annotations on the pull request.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true  # Built-in Go module caching

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
          # Analyse cold every run. The action restores and saves its analysis
          # cache even when it only installs, and dt's run reads it. Its cache
          # key covers go.mod, but its restore-key fallback does not: when a
          # dependency bump changes go.mod the run misses its own key, restores
          # the pre-bump analysis cache, and then saves a fact set built from it
          # under the new key. Every later run gets an exact hit on that entry,
          # and staticcheck loses the cross-package fact that t.Fatal never
          # returns, which turns every `if x == nil { t.Fatal(...) }` guard into
          # a spurious SA5011 nil-dereference report. Restoring is what breaks
          # it, so the cache is skipped rather than pinned: costs ~20s.
          skip-cache: true

      - name: Build dt
        run: go build -o "$RUNNER_TEMP/dt" ./cmd/dt

      - name: Run lint-go
        run: '"$RUNNER_TEMP/dt" run lint-go --tier "$TIER" --ci'

  repo-checks:
    name: Repo Checks
    runs-on: ubuntu-latest
    # Checks whose separately measured maxima sum to about 90s: the
    # conformance manifest 16s, the E2E harness self-test 34s, dt's own tests
    # about 20s, and the three diff checks under 10s apiece.
    timeout-minutes: 10

    steps:
      # Full history: the checks that compare with {base} diff against a
      # merge base. On a push that base is the commit before it, which is
      # how commits pushed straight to develop are checked too.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # To build dt and run its own tests, which need a few modules, so no cache
      # to restore.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Build dt
        run: go build -o "$RUNNER_TEMP/dt" ./cmd/dt

      - name: Run lint-repo
        run: '"$RUNNER_TEMP/dt" run lint-repo --tier "$TIER" --ci'

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Only to build dt, which needs a few modules, so no cache to restore.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      # Pinned by version and checksum, so a new release can't turn the job
      # red on its own.
      - name: Install ShellCheck
        env:
          VERSION: v0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSLo "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/$VERSION/shellcheck-$VERSION.linux.x86_64.tar.xz"
          echo "$SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$VERSION" >> "$GITHUB_PATH"

      - name: Build dt
        run: go build -o "$RUNNER_TEMP/dt" ./cmd/dt

      # On every change: the scan takes seconds, and a filter on *.sh paths
      # would miss the scripts without an extension.
      - name: Run shellcheck
        run: '"$RUNNER_TEMP/dt" run shellcheck --tier "$TIER" --ci'
