<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <pattern id="dead" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f4f6f8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c3cad3" stroke-width="2"/>
    </pattern>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why  { font-size: 11px; fill: #b04a4a }
      .ok   { font-size: 11px; font-weight: 600; fill: #2f6f4f }
    </style>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="16" y="26" class="t">A boundary decision depends on exactly 64 preceding bytes.</text>
  <text x="16" y="46" class="s">One candidate chunk. Not to scale: the hatched region is Min bytes, the window is 64.</text>

  <rect x="150" y="80" width="470" height="44" rx="3" class="x" fill="url(#dead)" stroke="#9aa4b2" stroke-width="1.1"/>
  <rect x="620" y="80" width="60"  height="44" rx="3" fill="#fde8c8" stroke="#c98f2e" stroke-width="1.5"/>
  <rect x="680" y="80" width="170" height="44" rx="3" fill="#dce9f7" stroke="#4a7fb5" stroke-width="1.5"/>

  <text x="150" y="142" class="m">0</text>
  <text x="596" y="142" class="m">Min&#8722;64</text>
  <text x="662" y="142" class="m">Min</text>
  <text x="820" y="142" class="m">boundary</text>

  <text x="300" y="107" class="s">warmed, affects nothing</text>
  <text x="628" y="107" class="m">64 B</text>
  <text x="712" y="107" class="s">tested positions</text>

  <text x="16" y="182" class="rl">Why</text>
  <text x="16" y="204" class="m">fp&#7522; = &#931;&#11388;&#8804;&#7522;  g[b&#11388;] &#8810; (i &#8722; j)     (mod 2&#8310;&#8308;)</text>
  <text x="16" y="226" class="l">Every term with i &#8722; j &#8805; 64 is a 64-bit value shifted left by at least 64 bits, so it is exactly zero.</text>
  <text x="16" y="246" class="l">Nothing earlier than 64 bytes back can reach the decision.</text>

  <line x1="16" y1="272" x2="884" y2="272" stroke="#c3cad3"/>
  <text x="16" y="296" class="rl">Cost of warming the whole hatched region anyway</text>

  <rect x="150" y="310" width="330" height="26" rx="3" fill="#fbfcfd" stroke="#c3cad3"/>
  <text x="16"  y="328" class="s">from chunk start</text>
  <text x="162" y="328" class="m">758.7 &#181;s / boundary</text>
  <text x="330" y="328" class="m">1.38 GB/s</text>

  <rect x="150" y="344" width="330" height="26" rx="3" fill="#eaf4ec" stroke="#2f6f4f"/>
  <text x="16"  y="362" class="s">declared window</text>
  <text x="162" y="362" class="m">65.8 &#181;s / boundary</text>
  <text x="330" y="362" class="m">15.9 GB/s</text>

  <text x="500" y="330" class="ok">11.6&#215; &#8212; and bit-identical boundaries</text>
  <text x="500" y="348" class="s">verified on Min of 4 KiB, 64 KiB, 1 MiB</text>
  <text x="500" y="364" class="s">200 random inputs each, both end-of-stream values</text>

  <text x="16" y="394" class="s">At the shipped profile the scan ends ~32 KiB past Min, so ~97% of the gear hashing decides nothing.</text>
</svg>
