<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7fb5"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .ours  { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.5 }
      .other { fill: #eceff2; stroke: #9aa4b2; stroke-width: 1.1 }
      .seg   { fill: none; stroke: #5b6472; stroke-width: 1.3 }
      .link  { stroke: #4a7fb5; stroke-width: 1.1; fill: none; marker-end: url(#p); opacity: .85 }
    </style>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="16" y="26" class="t">File order is not storage order, and a record is not a chunk.</text>

  <text x="16" y="70" class="rl">report.pdf — held extents, in file order</text>
  <rect x="120" y="84" width="150" height="38" rx="3" class="ours"/><text x="130" y="100" class="m">[0, 2M)</text><text x="130" y="115" class="s">written first</text>
  <rect x="300" y="84" width="150" height="38" rx="3" class="ours"/><text x="310" y="100" class="m">[4M, 6M)</text><text x="310" y="115" class="s">written third</text>
  <rect x="480" y="84" width="150" height="38" rx="3" class="ours"/><text x="490" y="100" class="m">[7M, 8M)</text><text x="490" y="115" class="s">written second</text>

  <text x="16" y="248" class="rl">segments — records in append order</text>
  <text x="16" y="264" class="s">interleaved with other files</text>

  <rect x="120" y="272" width="230" height="52" rx="4" class="seg"/>
  <text x="120" y="266" class="s">0000017.seg</text>
  <rect x="130" y="282" width="96" height="32" rx="3" class="ours"/><text x="138" y="302" class="m">[0, 2M)</text>
  <rect x="232" y="282" width="108" height="32" rx="3" class="other"/><text x="240" y="302" class="s">other file</text>

  <rect x="380" y="272" width="230" height="52" rx="4" class="seg"/>
  <text x="380" y="266" class="s">0000018.seg</text>
  <rect x="390" y="282" width="100" height="32" rx="3" class="other"/><text x="398" y="302" class="s">other file</text>
  <rect x="496" y="282" width="104" height="32" rx="3" class="ours"/><text x="504" y="302" class="m">[7M, 8M)</text>

  <rect x="640" y="272" width="180" height="52" rx="4" class="seg"/>
  <text x="640" y="266" class="s">0000019.seg</text>
  <rect x="650" y="282" width="104" height="32" rx="3" class="ours"/><text x="658" y="302" class="m">[4M, 6M)</text>
  <rect x="760" y="282" width="50" height="32" rx="3" class="other"/>

  <path d="M195,126 C195,190 178,220 178,278" class="link"/>
  <path d="M375,126 C375,190 702,215 702,278" class="link"/>
  <path d="M555,126 C555,190 548,215 548,278" class="link"/>

  <text x="16" y="182" class="l">The placement index maps each held extent to a record location. It is the only thing</text>
  <text x="16" y="200" class="l">that knows the correspondence, and it is rebuilt from the segments at startup.</text>

  <text x="16" y="358" class="l">Extents land wherever the append stream was when they were written, so a file's bytes scatter.</text>
  <text x="16" y="376" class="s">A record holds whatever one write staged. Chunk boundaries are found later, by the carver, over the extents flush offers.</text>
  <text x="16" y="394" class="s">No record corresponds to a chunk, and no segment corresponds to a block.</text>
</svg>
