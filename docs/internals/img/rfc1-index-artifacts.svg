<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7fb5"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:13px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
      .live{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.8}
      .disk{fill:#f4f6f8;stroke:#9aa4b2;stroke-width:1.3}
      .a{stroke:#4a7fb5;stroke-width:1.4;fill:none;marker-end:url(#up)}
      .warn{font-size:11px;fill:#b04a4a}
    </style>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="16" y="26" class="t">Three artifacts. Only one of them answers a read.</text>

  <rect x="290" y="56" width="320" height="76" rx="5" class="live"/>
  <text x="306" y="80" class="h">placement index</text>
  <text x="306" y="99" class="s">in memory · the whole store · held extents only</text>
  <text x="306" y="117" class="s" font-weight="600">every read goes here, and nowhere else</text>

  <rect x="80" y="252" width="310" height="92" rx="5" class="disk"/>
  <text x="96" y="276" class="h">segment catalog</text>
  <text x="96" y="295" class="s">in each sealed segment's footer</text>
  <text x="96" y="313" class="s">describes <tspan font-weight="600">records</tspan> — live or superseded</text>
  <text x="96" y="331" class="s">one per sealed segment · immutable</text>

  <rect x="510" y="252" width="310" height="92" rx="5" class="disk"/>
  <text x="526" y="276" class="h">placement cache</text>
  <text x="526" y="295" class="s">one file · the whole store</text>
  <text x="526" y="313" class="s">the placement index, as it was</text>
  <text x="526" y="331" class="s">validated by one stat per segment</text>

  <path d="M290,248 C290,190 380,180 400,140" class="a"/>
  <path d="M610,248 C610,190 520,180 500,140" class="a"/>
  <text x="300" y="196" class="s" fill="#4a7fb5">built from</text>
  <text x="560" y="196" class="s" fill="#4a7fb5">or restored from</text>

  <text x="16" y="164" class="s">neither is</text><text x="16" y="180" class="s">built from it</text>

  <line x1="16" y1="368" x2="884" y2="368" stroke="#c3cad3"/>
  <text x="16" y="392" class="warn">A catalog entry need not have a placement index entry —</text>
  <text x="470" y="392" class="s">a record superseded by one in another segment.</text>
  <text x="16" y="412" class="warn">A placement index entry need not have a catalog entry —</text>
  <text x="470" y="412" class="s">an extent in an active segment, which has no catalog yet.</text>
  <text x="16" y="432" class="s">Neither artifact is authoritative. Where either disagrees with the records, the records win.</text>
</svg>
