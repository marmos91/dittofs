<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why { font-size: 11px; fill: #b04a4a }
      .bx { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .bg { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.4 }
      .bn { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.1 }
    </style>
    <marker id="a4r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="16" y="26" class="t">Four records, each keyed by one thing, none holding a list that grows with its file</text>
  <text x="16" y="46" class="s">The write path writes only the left column. The flush commit writes the other three and reads only the epoch.</text>

  <rect x="16" y="76" width="190" height="112" rx="3" class="bn"/>
  <text x="28" y="98" class="rl">Existence</text>
  <text x="28" y="116" class="m">key: FileID</text>
  <text x="28" y="140" class="m">size</text>
  <text x="28" y="156" class="m">holes</text>
  <text x="28" y="172" class="m">epoch</text>

  <rect x="246" y="76" width="190" height="112" rx="3" class="bx"/>
  <text x="258" y="98" class="rl">Ref</text>
  <text x="258" y="116" class="m">key: (FileID, offset)</text>
  <text x="258" y="140" class="m">hash</text>
  <text x="258" y="156" class="m">skip, length</text>

  <rect x="476" y="76" width="190" height="112" rx="3" class="bx"/>
  <text x="488" y="98" class="rl">Chunk</text>
  <text x="488" y="116" class="m">key: hash</text>
  <text x="488" y="140" class="m">block, position, length</text>
  <text x="488" y="156" class="m">refcount</text>

  <rect x="706" y="76" width="178" height="112" rx="3" class="bg"/>
  <text x="718" y="98" class="rl">Block</text>
  <text x="718" y="116" class="m">key: remote key</text>
  <text x="718" y="140" class="m">live</text>
  <text x="718" y="172" class="s">exists only once durable</text>

  <line x1="436" y1="146" x2="474" y2="146" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a4r)"/>
  <line x1="666" y1="146" x2="704" y2="146" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a4r)"/>

  <text x="246" y="212" class="s">many refs, any files</text>
  <text x="476" y="212" class="s">one per hash; refcount = refs naming it</text>
  <text x="706" y="212" class="s">live = chunks with refcount &gt; 0</text>

  <line x1="16" y1="236" x2="884" y2="236" stroke="#eef1f4"/>

  <text x="16" y="262" class="rl">What each question reads</text>
  <text x="16" y="284" class="l">Does content exist at this offset? — Existence, then Ref. A hole and uncarved content are both "no ref"; only Existence tells them apart.</text>
  <text x="16" y="302" class="l">Which chunk, which block? — Ref, then Chunk. Is it durable? — a Chunk record exists, so yes.</text>
  <text x="16" y="320" class="l">May this block be deleted? — Block.live, evaluated inside the transaction that deletes it.</text>
  <text x="16" y="352" class="why">Not here: whether the bytes are on local disk. That is the journal's question, and residency joins the two answers rather than storing one.</text>
</svg>
