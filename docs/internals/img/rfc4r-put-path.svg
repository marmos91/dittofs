<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .h  { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .io  { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.1 }
      .up  { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.2 }
      .dn  { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .line { stroke: #b04a4a; stroke-width: 1.5; stroke-dasharray: 6 4 }
      .arr { stroke: #5b6472; stroke-width: 1.3; fill: none }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>

  <text x="16" y="26" class="t">A put: encode one chunk at a time into a spool, write the header last, send both.</text>

  <rect x="16"  y="56" width="150" height="46" rx="3" class="io"/><text x="28" y="76" class="l">journal chunks</text><text x="28" y="92" class="s">one at a time</text>
  <rect x="200" y="56" width="170" height="46" rx="3" class="up"/><text x="212" y="76" class="h">codec + chain</text><text x="212" y="92" class="s">transform each chunk</text>
  <rect x="404" y="56" width="170" height="46" rx="3" class="io"/><text x="416" y="76" class="l">spool file (disk)</text><text x="416" y="92" class="s">bodies, in order</text>
  <rect x="608" y="56" width="276" height="46" rx="3" class="up"/><text x="620" y="76" class="h">header built from body lengths</text><text x="620" y="92" class="s">only the header is held in memory</text>
  <path d="M166,79 L198,79" class="arr" marker-end="url(#a)"/>
  <path d="M370,79 L402,79" class="arr" marker-end="url(#a)"/>
  <path d="M574,79 L606,79" class="arr" marker-end="url(#a)"/>

  <rect x="200" y="132" width="480" height="40" rx="3" class="up"/>
  <text x="212" y="157" class="l">Put(name, header ‖ spool, size): a known length, re-readable for a retry</text>
  <path d="M746,102 L746,118 L440,118 L440,130" class="arr" marker-end="url(#a)"/>

  <line x1="16" y1="196" x2="884" y2="196" class="line"/>
  <text x="16" y="190" class="s">the store contract</text>

  <rect x="200" y="214" width="480" height="40" rx="3" class="dn"/>
  <text x="212" y="239" class="l">remote store: one request, with the integrity check its profile chose</text>
  <path d="M440,172 L440,212" class="arr" marker-end="url(#a)"/>

  <text x="16" y="284" class="l">The service rejects a body whose checksum does not match, or the store compares the digest the service</text>
  <text x="16" y="302" class="l">reports with its own. Either way a mismatch is ErrCorrupt, and the syncer's retry overwrites it.</text>
</svg>
