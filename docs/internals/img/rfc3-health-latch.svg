<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why  { font-size: 11px; fill: #b04a4a }
      .ok   { font-size: 11px; font-weight: 600; fill: #2f6f4f }
      .bx { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .bg { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.4 }
      .br { fill: #fbecec; stroke: #b04a4a; stroke-width: 1.4 }
    </style>
    <marker id="a3h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="16" y="26" class="t">A flag set by failure and cleared by success cannot clear itself.</text>
  <text x="16" y="46" class="s">Both panels: the remote fails, then recovers, with no operator present.</text>

  <text x="16" y="86" class="rl">Latched</text>
  <rect x="120" y="70" width="126" height="32" rx="3" class="br"/><text x="136" y="91" class="m">failure seen</text>
  <line x1="246" y1="86" x2="284" y2="86" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a3h)"/>
  <rect x="288" y="70" width="126" height="32" rx="3" class="br"/><text x="304" y="91" class="m">flag set</text>
  <line x1="414" y1="86" x2="452" y2="86" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a3h)"/>
  <rect x="456" y="70" width="152" height="32" rx="3" class="br"/><text x="472" y="91" class="m">attempts suppressed</text>
  <path d="M608,86 L640,86 L640,124 L288,124 L288,106" fill="none" stroke="#b04a4a" stroke-width="1.4" marker-end="url(#a3h)"/>
  <text x="330" y="144" class="why">nothing retries &#8594; nothing observes the recovery &#8594; the flag is never cleared</text>
  <text x="120" y="166" class="why">the remote has been healthy for hours; the journal fills anyway, and writes are refused</text>

  <line x1="16" y1="190" x2="884" y2="190" stroke="#eef1f4"/>

  <text x="16" y="228" class="rl">Derived</text>
  <rect x="120" y="212" width="126" height="32" rx="3" class="br"/><text x="136" y="233" class="m">failure seen</text>
  <line x1="246" y1="228" x2="284" y2="228" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a3h)"/>
  <rect x="288" y="212" width="126" height="32" rx="3" class="bx"/><text x="300" y="233" class="m">probe, on a timer</text>
  <line x1="414" y1="228" x2="452" y2="228" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a3h)"/>
  <rect x="456" y="212" width="152" height="32" rx="3" class="bg"/><text x="472" y="233" class="m">one success &#8594; usable</text>
  <path d="M288,244 L288,264 L352,264 L352,244" fill="none" stroke="#4a7fb5" stroke-width="1.4"/>
  <text x="120" y="284" class="ok">the probe does not depend on there being work to do, so the recovery is observed whether or not anything is being uploaded</text>

  <line x1="16" y1="308" x2="884" y2="308" stroke="#c3cad3"/>
  <text x="16" y="332" class="l">The difference is not how quickly failure is noticed. Both notice it. The difference is what has to happen</text>
  <text x="16" y="350" class="l">for the system to stop believing it &#8212; an attempt that the belief itself is suppressing, or a probe that runs regardless.</text>
  <text x="16" y="380" class="why">State you store can go stale; state you derive cannot.</text>
</svg>
