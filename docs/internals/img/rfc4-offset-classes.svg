<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why { font-size: 11px; fill: #b04a4a }
      .ok  { font-size: 11px; font-weight: 600; fill: #2f6f4f }
      .bx { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .bu { fill: #fdf1dc; stroke: #b5842f; stroke-width: 1.4 }
      .bn { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.1; stroke-dasharray: 4 3 }
    </style>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>

  <text x="16" y="26" class="t">Every offset below size is a hole, uncarved, or carved, and metadata must say which</text>
  <text x="16" y="46" class="s">A file of 10 units. Refs cover what the last flush committed; the uncarved run was written and acknowledged after it.</text>

  <rect x="16"  y="74" width="240" height="40" rx="2" class="bx"/>
  <text x="26" y="98" class="m">ref  ref  ref</text>
  <rect x="256" y="74" width="160" height="40" rx="2" class="bn"/>
  <text x="266" y="98" class="m">hole</text>
  <rect x="416" y="74" width="160" height="40" rx="2" class="bx"/>
  <text x="426" y="98" class="m">ref  ref</text>
  <rect x="576" y="74" width="224" height="40" rx="2" class="bu"/>
  <text x="586" y="98" class="m">uncarved</text>
  <line x1="800" y1="64" x2="800" y2="124" stroke="#1b1f24" stroke-width="1.6"/>
  <text x="808" y="98" class="m">size</text>

  <text x="16"  y="136" class="rl">carved</text>
  <text x="256" y="136" class="rl">hole</text>
  <text x="576" y="136" class="rl">uncarved</text>

  <text x="16"  y="156" class="s">journal holds it: Resident</text>
  <text x="16"  y="172" class="s">journal does not: Remote — fetch</text>
  <text x="256" y="156" class="s">Absent — zeros,</text>
  <text x="256" y="172" class="s">whatever the journal says</text>
  <text x="576" y="156" class="s">journal holds it: Dirty</text>
  <text x="576" y="172" class="s">journal does not: Lost — fail</text>

  <line x1="16" y1="196" x2="884" y2="196" stroke="#eef1f4"/>

  <text x="16" y="222" class="rl">Derive holes as the gaps between refs, and the last two columns merge</text>
  <rect x="16"  y="236" width="240" height="30" rx="2" class="bx"/>
  <rect x="256" y="236" width="160" height="30" rx="2" class="bn"/>
  <rect x="416" y="236" width="160" height="30" rx="2" class="bx"/>
  <rect x="576" y="236" width="224" height="30" rx="2" class="bn"/>
  <text x="586" y="256" class="m">"hole"</text>
  <text x="16" y="290" class="why">The journal loses the uncarved run — a corrupt record, a lost device — and it reads back as zeros. The client was</text>
  <text x="16" y="306" class="why">acknowledged for those bytes. SEEK_HOLE reports the same run as a hole even while the journal still holds it.</text>
  <text x="16" y="336" class="ok">Record existence at write time, and uncarved-and-gone resolves to Lost, which fails loudly instead.</text>
</svg>
