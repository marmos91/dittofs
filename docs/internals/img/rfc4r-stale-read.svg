<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .h  { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .why { font-size: 11px; fill: #b04a4a }
      .step { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.3 }
      .bad  { fill: #fbeaea; stroke: #b04a4a; stroke-width: 1.3 }
      .ok   { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.3 }
      .arr  { stroke: #5b6472; stroke-width: 1.3; fill: none }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
  </defs>
  <rect width="900" height="350" fill="#ffffff"/>

  <text x="16" y="26" class="t">A read at a stale position is repaired from the block's header, once.</text>
  <text x="16" y="46" class="s">The block was rewritten under the same name with another layout (a codec change, a relocation that re-encoded).</text>

  <rect x="16"  y="70" width="190" height="46" rx="3" class="step"/><text x="28" y="90" class="h">1. ranged get</text><text x="28" y="106" class="s">at the recorded position</text>
  <rect x="240" y="70" width="190" height="46" rx="3" class="bad"/><text x="252" y="90" class="h">hash fails, or past end</text><text x="252" y="106" class="s">position is stale</text>
  <rect x="464" y="70" width="190" height="46" rx="3" class="step"/><text x="476" y="90" class="h">2. get the header</text><text x="476" y="106" class="s">one ranged request</text>
  <rect x="688" y="70" width="196" height="46" rx="3" class="step"/><text x="700" y="90" class="h">3. get at the header's</text><text x="700" y="106" class="h">position</text>
  <path d="M206,93 L238,93" class="arr" marker-end="url(#a)"/>
  <path d="M430,93 L462,93" class="arr" marker-end="url(#a)"/>
  <path d="M654,93 L686,93" class="arr" marker-end="url(#a)"/>

  <rect x="464" y="160" width="190" height="46" rx="3" class="ok"/><text x="476" y="180" class="h">hash matches</text><text x="476" y="196" class="s">return the chunk</text>
  <rect x="688" y="160" width="196" height="46" rx="3" class="ok"/><text x="700" y="180" class="h">4. rewrite the position</text><text x="700" y="196" class="s">if the record still names this block</text>
  <path d="M786,116 L786,130 L560,130 L560,158" class="arr" marker-end="url(#a)"/>
  <path d="M654,183 L686,183" class="arr" marker-end="url(#a)"/>

  <rect x="240" y="160" width="190" height="46" rx="3" class="bad"/><text x="252" y="180" class="h">fails again, or chunk</text><text x="252" y="196" class="h">not in the header</text>
  <path d="M740,116 L740,138 L336,138 L336,158" class="arr" marker-end="url(#a)"/>
  <text x="252" y="226" class="why">the chunk is corrupt</text>

  <text x="16" y="266" class="l">A block that is absent is a different case: the chunk may have moved to another block, so the engine looks</text>
  <text x="16" y="284" class="l">it up again in block metadata once. A transport error or a timeout triggers neither.</text>
  <text x="16" y="318" class="s">The next read of the chunk goes straight to the repaired position, so the extra requests are paid once per rewrite.</text>
</svg>
