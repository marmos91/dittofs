<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why  { font-size: 11px; fill: #b04a4a }
      .ok   { font-size: 11px; font-weight: 600; fill: #2f6f4f }
      .bad  { font-size: 11px; font-weight: 600; fill: #b04a4a }
      .bx { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .bg { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.4 }
      .br { fill: #fbecec; stroke: #b04a4a; stroke-width: 1.4 }
    </style>
    <marker id="a3k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>

  <text x="16" y="26" class="t">Where the key comes from decides what a crash leaves behind.</text>
  <text x="16" y="46" class="s">One block, one transfer, one crash at the worst moment.</text>

  <text x="16" y="86" class="rl">A. allocate a key, record it, then transfer</text>
  <rect x="300" y="70" width="128" height="30" rx="3" class="bx"/><text x="316" y="90" class="m">record key</text>
  <line x1="428" y1="85" x2="466" y2="85" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a3k)"/>
  <rect x="470" y="70" width="128" height="30" rx="3" class="br"/><text x="508" y="90" class="m">crash</text>
  <line x1="598" y1="85" x2="636" y2="85" stroke="#c3cad3" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="640" y="70" width="128" height="30" rx="3" fill="#f4f6f8" stroke="#9aa4b2" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="664" y="90" class="m">put (never)</text>
  <text x="300" y="118" class="bad">a reference to an object that was never written &#8212; the read fails, the data is gone</text>

  <line x1="16" y1="140" x2="884" y2="140" stroke="#eef1f4"/>

  <text x="16" y="176" class="rl">B. allocate a key, transfer, then record</text>
  <text x="16" y="194" class="s">what is shipped today</text>
  <rect x="300" y="160" width="128" height="30" rx="3" class="bx"/><text x="336" y="180" class="m">put</text>
  <line x1="428" y1="175" x2="466" y2="175" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a3k)"/>
  <rect x="470" y="160" width="128" height="30" rx="3" class="br"/><text x="508" y="180" class="m">crash</text>
  <line x1="598" y1="175" x2="636" y2="175" stroke="#c3cad3" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="640" y="160" width="128" height="30" rx="3" fill="#f4f6f8" stroke="#9aa4b2" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="656" y="180" class="m">record (never)</text>
  <text x="300" y="208" class="why">an object nothing references &#8212; no refcount reaches it, so the sweep cannot see it</text>
  <text x="300" y="226" class="s">closed instead by listing the whole prefix and deleting what has no record and is old enough</text>

  <line x1="16" y1="248" x2="884" y2="248" stroke="#eef1f4"/>

  <text x="16" y="284" class="rl">C. key = f(content)</text>
  <text x="16" y="302" class="s">what RFC 2 what RFC 2 &#167;4.2 requires#167;4.2 requires</text>
  <rect x="300" y="268" width="128" height="30" rx="3" class="bg"/><text x="336" y="288" class="m">put</text>
  <line x1="428" y1="283" x2="466" y2="283" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a3k)"/>
  <rect x="470" y="268" width="128" height="30" rx="3" class="br"/><text x="508" y="288" class="m">crash</text>
  <line x1="598" y1="283" x2="636" y2="283" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a3k)"/>
  <rect x="640" y="268" width="128" height="30" rx="3" class="bg"/><text x="682" y="288" class="m">put</text>
  <text x="300" y="316" class="ok">the second put names the same key and writes the same bytes</text>
  <text x="300" y="334" class="s">indistinguishable from having written them once: no orphan to find, no reference to dangle</text>

  <line x1="16" y1="358" x2="884" y2="358" stroke="#c3cad3"/>
  <text x="16" y="382" class="rl">Why B needs machinery that C does not</text>
  <text x="16" y="404" class="l">B must enumerate the remote to find what it lost track of, and must guess from age whether an</text>
  <text x="16" y="422" class="l">uncommitted object is abandoned or still in flight. C reaches the object from the content, so there is</text>
  <text x="16" y="440" class="l">nothing to enumerate and nothing to guess.</text>
  <text x="16" y="462" class="why">The age guess is wrong in one direction: a commit slower than the window has its object deleted from under it.</text>
</svg>
