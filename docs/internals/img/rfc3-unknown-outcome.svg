<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why  { font-size: 11px; fill: #b04a4a }
      .ok   { font-size: 11px; font-weight: 600; fill: #2f6f4f }
      .bx { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .bg { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.4 }
      .bn { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.1 }
    </style>
    <marker id="a3u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="16" y="26" class="t">The request was sent. The response was lost. Three remote states, one recovery.</text>
  <text x="16" y="46" class="s">Nothing observable distinguishes them from here, which is what makes the outcome unknown rather than merely unreported.</text>

  <rect x="16" y="86" width="120" height="34" rx="3" class="bx"/><text x="52" y="108" class="m">put</text>
  <line x1="136" y1="103" x2="196" y2="103" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a3u)"/>
  <text x="142" y="96" class="s">bytes sent</text>
  <line x1="300" y1="103" x2="236" y2="103" stroke="#b04a4a" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="180" y="126" class="why">response lost</text>

  <rect x="300" y="70" width="230" height="34" rx="3" class="bn"/><text x="316" y="92" class="m">stored, acknowledged</text>
  <rect x="300" y="112" width="230" height="34" rx="3" class="bn"/><text x="316" y="134" class="m">stored, not yet acknowledged</text>
  <rect x="300" y="154" width="230" height="34" rx="3" class="bn"/><text x="316" y="176" class="m">not stored</text>

  <text x="550" y="92" class="s">the put succeeded</text>
  <text x="550" y="134" class="s">the put is succeeding</text>
  <text x="550" y="176" class="s">the put failed</text>

  <line x1="16" y1="212" x2="884" y2="212" stroke="#eef1f4"/>

  <text x="16" y="240" class="rl">Report it as not durable, then retry</text>
  <rect x="300" y="226" width="230" height="34" rx="3" class="bg"/><text x="316" y="248" class="m">put, same key, same bytes</text>
  <text x="550" y="248" class="ok">all three converge to one object</text>

  <text x="16" y="286" class="l">Resolving an unknown outcome as durable would be a guess that loses data when it is wrong. Resolving</text>
  <text x="16" y="304" class="l">it as not durable costs one redundant upload when it is wrong, and nothing else &#8212; but only because</text>
  <text x="16" y="322" class="l">the key is a function of the content, so the retry cannot create a second object.</text>
  <text x="16" y="352" class="why">With an allocated key the same retry writes a new object, and the first one &#8212; which may exist and may be complete &#8212; is referenced</text>
  <text x="16" y="370" class="why">by nothing. The rule and the addressing scheme are one decision, not two.</text>
</svg>
