<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
    <marker id="ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
      .box{fill:#f4f6f8;stroke:#9aa4b2;stroke-width:1.3}
      .j{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}
      .a{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#f)}
      .r{stroke:#b04a4a;stroke-width:2;fill:none;marker-end:url(#ret)}
      .st{font-size:11px;font-weight:700}
    </style>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="16" y="26" class="t">The write path, and the one edge everything depends on.</text>

  <rect x="40" y="62" width="130" height="44" rx="4" class="box"/><text x="64" y="89" class="m">client</text>
  <rect x="240" y="62" width="150" height="44" rx="4" class="j"/><text x="258" y="89" class="m">journal</text>
  <path d="M174,84 L236,84" class="a"/><text x="176" y="76" class="s">WriteAt</text>
  <path d="M236,106 C200,130 200,130 174,106" class="a"/><text x="176" y="130" class="s">ack — before anything is chunked or uploaded</text>
  <text x="400" y="80" class="st" fill="#b5874a">state: Dirty</text>
  <text x="400" y="97" class="s">local only; no other copy exists</text>

  <line x1="16" y1="156" x2="884" y2="156" stroke="#c3cad3"/>
  <text x="16" y="180" class="h">later, on a flush the engine schedules</text>

  <rect x="240" y="200" width="150" height="44" rx="4" class="j"/><text x="258" y="227" class="m">journal</text>
  <text x="240" y="196" class="s">offers its dirty extents</text>

  <rect x="470" y="196" width="390" height="130" rx="5" fill="#fbfcfd" stroke="#c3cad3"/>
  <text x="486" y="218" class="h">the callback</text>
  <rect x="486" y="228" width="110" height="34" rx="3" class="box"/><text x="500" y="250" class="m">carver</text>
  <rect x="606" y="228" width="110" height="34" rx="3" class="box"/><text x="620" y="250" class="m">syncer</text>
  <rect x="726" y="228" width="118" height="34" rx="3" class="box"/><text x="740" y="250" class="m">metadata</text>
  <text x="486" y="282" class="s">cut chunks · box into blocks · put · record durability</text>
  <text x="486" y="304" class="s">then return the extents that are now durable</text>

  <path d="M394,214 L466,214" class="a"/>
  <path d="M466,300 C430,300 420,270 394,240" class="r"/>
  <text x="300" y="286" class="s" fill="#b04a4a" font-weight="600">the return edge</text>
  <text x="300" y="302" class="s" fill="#b04a4a">journal marks exactly these</text>

  <text x="240" y="268" class="st" fill="#4c8a58">then: Resident</text>

  <line x1="16" y1="350" x2="884" y2="350" stroke="#c3cad3"/>
  <text x="16" y="374" class="l"><tspan font-weight="600">Nothing becomes Resident except by the journal being told.</tspan> Durability is reported, never inferred —</text>
  <text x="16" y="394" class="l">not from a transfer completing, not from the absence of an error, not from elapsed time.</text>
  <text x="16" y="422" class="l">Flush is a callback rather than a pipeline stage because a linear write → carve → put has nowhere to</text>
  <text x="16" y="442" class="l">put that acknowledgement, and dropping it is how a range becomes evictable while only older bytes exist remotely.</text>
  <text x="16" y="464" class="s">A flush that fails leaves every affected extent Dirty, and retrying is safe because chunking is deterministic.</text>
</svg>
