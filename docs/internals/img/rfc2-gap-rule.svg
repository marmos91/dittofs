<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <pattern id="gap2" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f4f6f8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c3cad3" stroke-width="2"/>
    </pattern>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why  { font-size: 11px; fill: #b04a4a }
      .ok   { font-size: 11px; font-weight: 600; fill: #2f6f4f }
      .ch { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
    </style>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="16" y="26" class="t">A chunk must not span a gap. A block may, and normally does.</text>
  <text x="16" y="46" class="s">Two held extents of one file, with an unheld gap between them.</text>

  <text x="16" y="94" class="rl">stream A</text>
  <text x="440" y="94" class="s">gap</text>
  <text x="530" y="94" class="rl">stream B</text>

  <rect x="150" y="104" width="90"  height="38" rx="3" class="ch"/><text x="180" y="128" class="m">c1</text>
  <rect x="240" y="104" width="90"  height="38" rx="3" class="ch"/><text x="270" y="128" class="m">c2</text>
  <rect x="330" y="104" width="52"  height="38" rx="3" class="ch"/><text x="346" y="128" class="m">c3</text>
  <rect x="382" y="104" width="118" height="38" rx="3" fill="url(#gap2)" stroke="#9aa4b2" stroke-width="1.1" stroke-dasharray="4 3"/>
  <rect x="500" y="104" width="90"  height="38" rx="3" class="ch"/><text x="530" y="128" class="m">c4</text>
  <rect x="590" y="104" width="90"  height="38" rx="3" class="ch"/><text x="620" y="128" class="m">c5</text>
  <rect x="680" y="104" width="60"  height="38" rx="3" class="ch"/><text x="698" y="128" class="m">c6</text>

  <text x="330" y="164" class="ok">c3 is cut short at the stream end</text>
  <text x="330" y="180" class="s">below Min, and that is allowed &#8212; it is a final chunk</text>

  <path d="M150,212 L150,204 L740,204 L740,212" fill="none" stroke="#2f6f4f" stroke-width="1.6"/>
  <text x="378" y="230" class="ok">one block: c1 &#8230; c6</text>
  <text x="330" y="248" class="s">the batch carries across the gap; the rolling state does not</text>

  <line x1="16" y1="276" x2="884" y2="276" stroke="#c3cad3"/>
  <text x="16" y="300" class="rl">Two separate obligations at a stream end</text>
  <text x="16" y="322" class="l">1. Cut the residual as a final chunk, so no chunk hashes non-adjacent bytes.</text>
  <text x="16" y="342" class="l">2. Reset the rolling state, so stream B's first boundary does not depend on stream A's bytes.</text>
  <text x="16" y="368" class="why">Flushing the residual without resetting the state satisfies 1 and silently breaks 2 &#8212; B is then chunked differently than if fed alone, with no error anywhere.</text>
</svg>
