<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .h  { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .sec { fill: #fbeaea; stroke: #b04a4a; stroke-width: 1.3 }
      .st  { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.1 }
      .op  { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .out { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.3 }
      .arr { stroke: #5b6472; stroke-width: 1.3; fill: none }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>

  <text x="16" y="26" class="t">Encrypting one chunk: a fresh key per chunk, derived, never stored.</text>

  <rect x="16"  y="56"  width="170" height="34" rx="3" class="sec"/><text x="28" y="77" class="l">master key (provider)</text>
  <rect x="16"  y="104" width="170" height="34" rx="3" class="st"/><text x="28" y="125" class="l">salt: 32 random bytes</text>
  <rect x="236" y="80"  width="130" height="34" rx="3" class="op"/><text x="248" y="101" class="h">HKDF-SHA256</text>
  <rect x="416" y="80"  width="140" height="34" rx="3" class="sec"/><text x="428" y="101" class="l">data key (1 chunk)</text>
  <path d="M186,73 L234,93" class="arr" marker-end="url(#a)"/>
  <path d="M186,121 L234,103" class="arr" marker-end="url(#a)"/>
  <path d="M366,97 L414,97" class="arr" marker-end="url(#a)"/>

  <rect x="416" y="160" width="140" height="34" rx="3" class="st"/><text x="428" y="181" class="l">chunk plaintext</text>
  <rect x="606" y="120" width="130" height="34" rx="3" class="op"/><text x="618" y="141" class="h">AES-256-GCM</text>
  <text x="606" y="100" class="s">nonce 0: each key is</text>
  <text x="606" y="112" class="s">used only once</text>
  <path d="M556,97 C590,97 590,128 604,132" class="arr" marker-end="url(#a)"/>
  <path d="M556,177 C590,177 590,142 604,140" class="arr" marker-end="url(#a)"/>

  <rect x="236" y="220" width="370" height="34" rx="3" class="st"/>
  <text x="248" y="241" class="m">AAD: transform ID ‖ version ‖ key ID ‖ salt ‖ hash</text>
  <path d="M606,237 C650,237 671,200 671,154" class="arr" marker-end="url(#a)"/>

  <rect x="766" y="118" width="118" height="34" rx="3" class="out"/><text x="778" y="139" class="l">ciphertext + tag</text>
  <path d="M736,135 L764,135" class="arr" marker-end="url(#a)"/>

  <text x="16" y="292" class="l">Stored in the body: version, key ID, salt, ciphertext, tag. Never stored: the master key, the data key.</text>
  <text x="16" y="312" class="s">Changing any stored byte, or presenting the body as another chunk (another hash), fails the tag.</text>
</svg>
