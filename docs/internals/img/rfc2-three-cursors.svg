<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <pattern id="unread" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f4f6f8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c3cad3" stroke-width="2"/>
    </pattern>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why  { font-size: 11px; fill: #b04a4a }
    </style>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="16" y="26" class="t">Three cursors, advancing at three rates.</text>
  <text x="16" y="46" class="s">One file, mid-pass. Each cursor names a different question.</text>

  <rect x="150" y="84" width="200" height="40" rx="3" fill="#cfe3d4" stroke="#2f6f4f" stroke-width="1.5"/>
  <rect x="350" y="84" width="180" height="40" rx="3" fill="#dce9f7" stroke="#4a7fb5" stroke-width="1.5"/>
  <rect x="530" y="84" width="90"  height="40" rx="3" fill="#fde8c8" stroke="#c98f2e" stroke-width="1.5"/>
  <rect x="620" y="84" width="230" height="40" rx="3" fill="url(#unread)" stroke="#9aa4b2" stroke-width="1.1"/>

  <text x="196" y="109" class="s">in blocks handed back</text>
  <text x="378" y="109" class="s">cut into chunks</text>
  <text x="540" y="109" class="s">residual</text>
  <text x="690" y="109" class="s">not yet read</text>

  <g stroke="#1b1f24" stroke-width="1.2">
    <line x1="350" y1="128" x2="350" y2="146"/>
    <line x1="530" y1="128" x2="530" y2="146"/>
    <line x1="620" y1="128" x2="620" y2="146"/>
  </g>
  <text x="326" y="162" class="m">emitted</text>
  <text x="514" y="162" class="m">cut</text>
  <text x="608" y="162" class="m">fed</text>

  <text x="16" y="196" class="rl">What each one is for</text>
  <text x="16" y="220" class="m">fed</text>
  <text x="90" y="220" class="l">the next byte to read from storage &#8212; advances by bytes handed in</text>
  <text x="16" y="242" class="m">cut</text>
  <text x="90" y="242" class="l">the first byte of the residual &#8212; the offset chunks are cut at</text>
  <text x="16" y="264" class="m">emitted</text>
  <text x="90" y="264" class="l">what the caller may report durable &#8212; advances a whole block at a time</text>

  <text x="16" y="296" class="l">fed leads cut because a residual below Min is held until more bytes arrive or the stream ends.</text>
  <text x="16" y="316" class="l">cut leads emitted because a batch is not a block until it reaches the target.</text>

  <line x1="16" y1="340" x2="884" y2="340" stroke="#c3cad3"/>
  <text x="16" y="364" class="why">Drive the read position from cut instead of fed, and the residual is fed a second time:</text>
  <text x="16" y="384" class="why">every re-fed byte is tiled into two chunks, and the file's content is wrong from the first one on.</text>
</svg>
