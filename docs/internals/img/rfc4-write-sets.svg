<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why { font-size: 11px; fill: #b04a4a }
      .ok  { font-size: 11px; font-weight: 600; fill: #2f6f4f }
      .bx { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .bg { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.4 }
      .br { fill: #f8e3e3; stroke: #b04a4a; stroke-width: 1.4 }
      .bn { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.1 }
    </style>
    <marker id="a4w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="a4x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="16" y="26" class="t">A record written by both a client stream and a background pass is a livelock, not a slowdown</text>

  <text x="16" y="62" class="rl">One per-file record holding size and the ref list</text>
  <rect x="16" y="76" width="150" height="34" rx="3" class="bn"/><text x="28" y="98" class="m">writer: append</text>
  <rect x="16" y="130" width="150" height="34" rx="3" class="bn"/><text x="28" y="152" class="m">flush: commit</text>
  <rect x="300" y="100" width="190" height="40" rx="3" class="br"/><text x="312" y="124" class="m">file record</text>
  <line x1="166" y1="93" x2="298" y2="112" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a4w)"/>
  <line x1="166" y1="147" x2="298" y2="130" stroke="#b04a4a" stroke-width="1.4" marker-end="url(#a4x)"/>
  <text x="520" y="100" class="why">every append changes size, so every append</text>
  <text x="520" y="116" class="why">conflicts with the commit; the retry re-reads</text>
  <text x="520" y="132" class="why">the record the writer is still changing, and</text>
  <text x="520" y="148" class="why">conflicts again — the commit never lands</text>

  <text x="16" y="194" class="s">nothing flushed → nothing evictable → journal fills → writes refused, from a remote that is healthy</text>

  <line x1="16" y1="214" x2="884" y2="214" stroke="#eef1f4"/>

  <text x="16" y="242" class="rl">Disjoint write sets</text>
  <rect x="16" y="256" width="150" height="34" rx="3" class="bn"/><text x="28" y="278" class="m">writer: append</text>
  <rect x="16" y="318" width="150" height="34" rx="3" class="bn"/><text x="28" y="340" class="m">flush: commit</text>
  <rect x="300" y="256" width="190" height="34" rx="3" class="bg"/><text x="312" y="278" class="m">Existence: size, holes</text>
  <rect x="300" y="318" width="190" height="34" rx="3" class="bx"/><text x="312" y="340" class="m">Refs, Chunks, Blocks</text>
  <line x1="166" y1="273" x2="298" y2="273" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a4w)"/>
  <line x1="166" y1="335" x2="298" y2="335" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a4w)"/>
  <line x1="395" y1="318" x2="395" y2="292" stroke="#9aa4b2" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a4w)"/>
  <text x="404" y="308" class="s">reads epoch only</text>
  <text x="520" y="278" class="ok">no record in common</text>
  <text x="520" y="298" class="l">epoch moves only on truncate and deallocate,</text>
  <text x="520" y="314" class="l">so the commit's one read conflicts with exactly</text>
  <text x="520" y="330" class="l">the operations it has to be refused by</text>
  <text x="16" y="384" class="s">Per-ref records also make the commit cost what it changed, not what the file holds (§5.2).</text>
</svg>
