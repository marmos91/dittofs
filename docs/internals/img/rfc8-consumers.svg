<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why  { font-size: 11px; fill: #b04a4a }
      .ok   { font-size: 11px; font-weight: 600; fill: #2f6f4f }
      .up { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .cg { fill: #ffffff; stroke: #9aa4b2; stroke-width: 1.1 }
      .dn { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.4 }
    </style>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>

  <text x="16" y="26" class="t">The syncer is one consumer of this contract, not its owner.</text>
  <text x="16" y="46" class="s">Each consumer declares the operations it needs in its own package; all of them inherit their meaning from here.</text>

  <rect x="16"  y="78" width="140" height="44" rx="3" class="up"/><text x="32"  y="99" class="m">the syncer</text><text x="32" y="115" class="s">put, read, delete</text>
  <rect x="164" y="78" width="150" height="44" rx="3" class="up"/><text x="180" y="99" class="m">compaction</text><text x="180" y="115" class="s">read, put, delete</text>
  <rect x="322" y="78" width="150" height="44" rx="3" class="up"/><text x="338" y="99" class="m">snapshot verify</text><text x="338" y="115" class="s">presence</text>

  <rect x="500" y="78" width="160" height="44" rx="3" class="cg" stroke-dasharray="4 3"/><text x="516" y="99" class="m">orphan reclaim</text><text x="516" y="115" class="s">enumerate, delete</text>
  <rect x="668" y="78" width="150" height="44" rx="3" class="cg" stroke-dasharray="4 3"/><text x="684" y="99" class="m">reconcile</text><text x="684" y="115" class="s">enumerate</text>
  <text x="430" y="142" class="why">dashed: needed only because keys are allocated, not content-derived</text>

  <line x1="16" y1="176" x2="884" y2="176" stroke="#1b1f24" stroke-width="2"/>
  <text x="16" y="196" class="rl">the contract</text>
  <text x="130" y="196" class="s">what the operations mean: idempotent delete, verified read, a closed error set, no state across calls</text>

  <rect x="16"  y="218" width="180" height="34" rx="3" class="dn"/><text x="32"  y="240" class="m">S3</text>
  <rect x="204" y="218" width="180" height="34" rx="3" class="dn"/><text x="220" y="240" class="m">in-memory</text>
  <rect x="392" y="218" width="240" height="34" rx="3" class="dn" stroke-dasharray="4 3"/><text x="408" y="240" class="m">one that loses and corrupts</text>
  <text x="648" y="240" class="ok">the reason the seam exists</text>

  <line x1="16" y1="282" x2="884" y2="282" stroke="#c3cad3"/>
  <text x="16" y="306" class="rl">Two things follow from there being more than one consumer</text>
  <text x="16" y="328" class="l">A rule that makes sense only for uploads &#8212; a window, a put-tuned retry policy, a flag set by a failed flush &#8212;</text>
  <text x="16" y="346" class="l">would be inherited by a compaction repack that wants none of it. So none of them belong below the line.</text>
  <text x="16" y="372" class="l">And the format is read and rewritten by components that are not the syncer and never will be, so it cannot</text>
  <text x="16" y="390" class="l">be owned by the syncer either.</text>
</svg>
