<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .pre { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.1 }
      .idx { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.2 }
      .rec { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .arr { stroke: #4a7fb5; stroke-width: 1.3; fill: none }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a7fb5"/></marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>

  <text x="16" y="26" class="t">A block: a header that indexes its chunks, then the chunk bodies.</text>
  <text x="16" y="46" class="s">Written and read by the block codec. The store keeps the bytes and never parses them.</text>

  <text x="16" y="98" class="rl">header</text>
  <rect x="90"  y="78" width="118" height="34" rx="3" class="pre"/><text x="102" y="99" class="m">marker+version</text>
  <rect x="208" y="78" width="100" height="34" rx="3" class="pre"/><text x="220" y="99" class="m">header len</text>
  <rect x="308" y="78" width="100" height="34" rx="3" class="pre"/><text x="320" y="99" class="m">block name</text>
  <rect x="408" y="78" width="130" height="34" rx="3" class="idx"/><text x="420" y="99" class="m">hash₀ off₀ len₀</text>
  <rect x="538" y="78" width="130" height="34" rx="3" class="idx"/><text x="550" y="99" class="m">hash₁ off₁ len₁</text>
  <rect x="668" y="78" width="60"  height="34" rx="3" class="idx"/><text x="690" y="99" class="m">…</text>

  <text x="90"  y="130" class="s">fail loudly on the wrong</text>
  <text x="90"  y="144" class="s">version or a non-block</text>
  <text x="208" y="130" class="s">one request</text>
  <text x="208" y="144" class="s">fetches it all</text>
  <text x="308" y="130" class="s">catches a block</text>
  <text x="308" y="144" class="s">under the wrong key</text>
  <text x="408" y="130" class="s">chunk index: plaintext hash to verify against,</text>
  <text x="408" y="144" class="s">offset and length in the encoded block</text>

  <text x="16" y="214" class="rl">bodies</text>
  <rect x="90"  y="194" width="210" height="34" rx="3" class="rec"/><text x="102" y="215" class="m">body₀</text>
  <rect x="300" y="194" width="140" height="34" rx="3" class="rec"/><text x="312" y="215" class="m">body₁</text>
  <rect x="440" y="194" width="250" height="34" rx="3" class="rec"/><text x="452" y="215" class="m">body₂</text>
  <rect x="690" y="194" width="60"  height="34" rx="3" class="rec"/><text x="712" y="215" class="m">…</text>

  <path d="M600,112 C600,160 370,160 370,192" class="arr" marker-end="url(#a)"/>
  <text x="560" y="170" class="l">off₁, len₁ → one ranged get</text>

  <text x="16" y="266" class="l">Each body is one chunk, compressed and encrypted if the chain is configured, and decodable on its own:</text>
  <text x="16" y="284" class="l">a corrupt body loses one chunk, not the block. Offsets describe the encoded block, so they differ from</text>
  <text x="16" y="302" class="l">the chunk's offsets in the journal; block metadata records these.</text>
</svg>
