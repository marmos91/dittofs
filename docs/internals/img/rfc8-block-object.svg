<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why  { font-size: 11px; fill: #b04a4a }
      .ok   { font-size: 11px; font-weight: 600; fill: #2f6f4f }
      .pre { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.1 }
      .rec { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .hd  { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.2 }
    </style>
  </defs>
  <rect width="900" height="420" fill="#ffffff"/>

  <text x="16" y="26" class="t">What a stored object must make recoverable from its own bytes.</text>
  <text x="16" y="46" class="s">Elements, not a byte layout &#8212; several layouts satisfy this, and the choice between them is not load-bearing.</text>

  <text x="16" y="96" class="rl">preamble</text>
  <rect x="120" y="78" width="112" height="34" rx="3" class="pre"/><text x="136" y="100" class="m">version</text>
  <rect x="232" y="78" width="132" height="34" rx="3" class="pre"/><text x="248" y="100" class="m">its own name</text>
  <rect x="364" y="78" width="150" height="34" rx="3" class="pre"/><text x="380" y="100" class="m">are records sealed?</text>

  <text x="530" y="92" class="s">read before anything else is interpreted</text>
  <text x="530" y="110" class="s">so a wrong key and a wrong version both fail loudly</text>

  <text x="16" y="170" class="rl">one record</text>
  <text x="16" y="188" class="s">per chunk</text>
  <rect x="120" y="152" width="150" height="34" rx="3" class="hd"/><text x="136" y="174" class="m">plaintext hash</text>
  <rect x="270" y="152" width="120" height="34" rx="3" class="hd"/><text x="286" y="174" class="m">body length</text>
  <rect x="390" y="152" width="230" height="34" rx="3" class="rec"/><text x="406" y="174" class="m">transformed body</text>

  <text x="640" y="166" class="ok">the verification anchor</text>
  <text x="640" y="184" class="s">and what makes the next record findable</text>

  <text x="16" y="248" class="rl">the object</text>
  <rect x="120" y="230" width="60"  height="30" rx="3" class="pre"/>
  <rect x="180" y="230" width="150" height="30" rx="3" class="rec"/><text x="238" y="250" class="m">r0</text>
  <rect x="330" y="230" width="120" height="30" rx="3" class="rec"/><text x="378" y="250" class="m">r1</text>
  <rect x="450" y="230" width="180" height="30" rx="3" class="rec"/><text x="524" y="250" class="m">r2</text>
  <rect x="630" y="230" width="130" height="30" rx="3" class="rec"/><text x="684" y="250" class="m">r3</text>

  <path d="M330,278 L330,270 L450,270 L450,278" fill="none" stroke="#2f6f4f" stroke-width="1.6"/>
  <text x="330" y="296" class="ok">a locator names one record by offset and length</text>
  <text x="330" y="314" class="s">which is the whole reason a partial retrieval is possible</text>

  <line x1="16" y1="338" x2="884" y2="338" stroke="#c3cad3"/>
  <text x="16" y="362" class="l">Where records are sealed, the object&#8217;s name and the record&#8217;s position are both bound into the seal.</text>
  <text x="16" y="386" class="why">Binding neither lets a record be moved between objects; binding only the name lets records be reordered within one.</text>
  <text x="16" y="404" class="why">Either produces an object that verifies and is wrong.</text>
</svg>
