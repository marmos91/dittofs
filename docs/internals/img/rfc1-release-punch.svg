<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <pattern id="freed" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c3cad3" stroke-width="2"/>
    </pattern>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .keep { fill: #eceff2; stroke: #9aa4b2; stroke-width: 1.1 }
      .go   { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.5 }
      .hole { fill: url(#freed); stroke: #9aa4b2; stroke-width: 1.1; stroke-dasharray: 4 3 }
      .seg  { fill: none; stroke: #5b6472; stroke-width: 1.3 }
      .ax   { stroke: #9aa4b2; stroke-width: 1 }
    </style>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="16" y="26" class="t">Releasing an extent frees its storage. Everything else keeps its offset.</text>
  <text x="16" y="46" class="s">Segment offsets run left to right. The segment file's length never changes.</text>

  <!-- before -->
  <text x="16" y="96" class="rl">before</text>
  <rect x="100" y="76" width="700" height="46" rx="4" class="seg"/>
  <rect x="108" y="84" width="150" height="30" rx="2" class="keep"/><text x="116" y="104" class="s">other file</text>
  <rect x="262" y="84" width="180" height="30" rx="2" class="go"/><text x="270" y="104" class="m">ours [4M, 6M)</text>
  <rect x="446" y="84" width="130" height="30" rx="2" class="keep"/><text x="454" y="104" class="s">other file</text>
  <rect x="580" y="84" width="212" height="30" rx="2" class="keep"/><text x="588" y="104" class="m">ours [7M, 8M)</text>

  <text x="100" y="146" class="l">Release(id, [4M, 6M)) — permitted only because that extent's flush bit is set.</text>

  <!-- after -->
  <text x="16" y="216" class="rl">after</text>
  <rect x="100" y="196" width="700" height="46" rx="4" class="seg"/>
  <rect x="108" y="204" width="150" height="30" rx="2" class="keep"/><text x="116" y="224" class="s">other file</text>
  <rect x="262" y="204" width="180" height="30" rx="2" class="hole"/><text x="288" y="224" class="s">storage freed</text>
  <rect x="446" y="204" width="130" height="30" rx="2" class="keep"/><text x="454" y="224" class="s">other file</text>
  <rect x="580" y="204" width="212" height="30" rx="2" class="keep"/><text x="588" y="224" class="m">ours [7M, 8M)</text>

  <line x1="262" y1="252" x2="262" y2="264" class="ax"/>
  <line x1="442" y1="252" x2="442" y2="264" class="ax"/>
  <line x1="262" y1="264" x2="442" y2="264" class="ax"/>
  <text x="290" y="280" class="s">extents released</text>

  <text x="100" y="308" class="l">No record moved, so no entry in the placement index had to be rewritten, and no</text>
  <text x="100" y="326" class="l">surviving record had to be copied. The file is now sparse.</text>
  <text x="100" y="350" class="s">Accounted footprint must therefore come from allocated blocks, not from file length — by length, nothing was freed.</text>
  <text x="100" y="368" class="s">A segment left holding no extent at all is unlinked instead.</text>
</svg>
