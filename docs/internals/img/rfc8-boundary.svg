<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why  { font-size: 11px; fill: #b04a4a }
      .ok   { font-size: 11px; font-weight: 600; fill: #2f6f4f }
      .up { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .dn { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.4 }
      .nu { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.1 }
    </style>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>

  <text x="16" y="26" class="t">The same three operations all the way down. What differs is what remembers.</text>
  <text x="16" y="46" class="s">Every layer takes a put, a read or a delete and yields a put, a read or a delete &#8212; so every layer is a decorator, not a new interface.</text>

  <rect x="150" y="72" width="330" height="30" rx="3" class="nu"/><text x="166" y="92" class="m">engine &#8212; decides what and when</text>

  <rect x="150" y="116" width="330" height="30" rx="3" class="up"/><text x="166" y="136" class="m">retry, and the unknown-outcome rule</text>
  <rect x="150" y="152" width="330" height="30" rx="3" class="up"/><text x="166" y="172" class="m">the concurrency window</text>
  <rect x="150" y="188" width="330" height="30" rx="3" class="up"/><text x="166" y="208" class="m">health, derived from recent attempts</text>

  <line x1="120" y1="234" x2="620" y2="234" stroke="#1b1f24" stroke-width="2"/>
  <text x="624" y="238" class="rl">the contract</text>

  <rect x="150" y="248" width="330" height="30" rx="3" class="dn"/><text x="166" y="268" class="m">the transform chain</text>
  <rect x="150" y="284" width="330" height="30" rx="3" class="dn"/><text x="166" y="304" class="m">one backend, one round trip</text>

  <path d="M500,116 L512,116 L512,218 L500,218" fill="none" stroke="#4a7fb5" stroke-width="1.4"/>
  <text x="522" y="160" class="rl">the syncer</text>
  <text x="522" y="178" class="s">state that spans transfers</text>
  <text x="522" y="196" class="s">almost nothing but memory</text>

  <path d="M500,248 L512,248 L512,314 L500,314" fill="none" stroke="#2f6f4f" stroke-width="1.4"/>
  <text x="522" y="278" class="rl">the remote tier</text>
  <text x="522" y="296" class="s">no memory between calls</text>

  <line x1="16" y1="346" x2="884" y2="346" stroke="#c3cad3"/>
  <text x="16" y="370" class="rl">The test for a new concern</text>
  <text x="16" y="392" class="l">Would its absence change the outcome of one transfer, or only be noticed across many?</text>
  <text x="16" y="414" class="ok">one transfer &#8594; below the line</text>
  <text x="240" y="414" class="rl">&#183;</text>
  <text x="260" y="414" class="ok">only across transfers &#8594; above it</text>
  <text x="16" y="444" class="l">Because the shape is the same on both sides, the seam needs no vocabulary of its own: no capability probe,</text>
  <text x="16" y="462" class="l">no type assertion, and one verified read rather than three ways to fetch bytes.</text>
</svg>
