<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a58"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
      .lk{fill:#eceff2;stroke:#5b6472;stroke-width:1.4}
      .bad{stroke:#b04a4a;stroke-width:1.6;fill:none;marker-end:url(#r)}
      .good{stroke:#4c8a58;stroke-width:1.6;fill:none;marker-end:url(#g)}
      .no{font-size:18px;font-weight:700;fill:#b04a4a}
      .yes{font-size:18px;font-weight:700;fill:#4c8a58}
    </style>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="16" y="26" class="t">The one deadlock the lock order exists to forbid.</text>

  <text x="60" y="66" class="h">the cycle</text>
  <rect x="60" y="82" width="150" height="46" rx="4" class="lk"/><text x="76" y="110" class="m">file index</text>
  <rect x="300" y="82" width="150" height="46" rx="4" class="lk"/><text x="316" y="110" class="m">storage guard</text>

  <path d="M212,96 L296,96" class="bad"/>
  <text x="196" y="88" class="s" fill="#b04a4a">reader holds index, wants guard</text>
  <path d="M298,118 L214,118" class="bad"/>
  <text x="196" y="146" class="s" fill="#b04a4a">reclaimer holds guard, wants index</text>
  <text x="470" y="112" class="no">✗ deadlock</text>

  <text x="60" y="206" class="h">the rule</text>
  <text x="60" y="228" class="l">capacity → file index → append → storage guard</text>

  <rect x="60" y="248" width="150" height="46" rx="4" class="lk"/><text x="76" y="276" class="m">file index</text>
  <rect x="300" y="248" width="150" height="46" rx="4" class="lk"/><text x="316" y="276" class="m">storage guard</text>
  <path d="M212,262 L296,262" class="good"/>
  <text x="196" y="254" class="s" fill="#4c8a58">resolve, copy the location, RELEASE the index</text>
  <path d="M212,284 L296,284" class="good"/>
  <text x="196" y="312" class="s" fill="#4c8a58">only then take the guard</text>
  <text x="470" y="278" class="yes">✓</text>

  <line x1="16" y1="330" x2="884" y2="330" stroke="#c3cad3"/>
  <text x="16" y="352" class="l">Two further rules, for the same reason: <tspan font-weight="600">no lock is held across the Flush callback or a Recorder call</tspan>,</text>
  <text x="16" y="372" class="l">and <tspan font-weight="600">no I/O happens under the file index</tspan> — that would turn disk latency into index contention.</text>
</svg>
