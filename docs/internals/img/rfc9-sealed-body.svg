<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why  { font-size: 11px; fill: #b04a4a }
      .ok   { font-size: 11px; font-weight: 600; fill: #2f6f4f }
      .pre { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.1 }
      .pt  { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.4 }
      .tr  { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .un  { fill: #fbf1dc; stroke: #b5894a; stroke-width: 1.2 }
    </style>
    <marker id="a9s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="900" height="450" fill="#ffffff"/>

  <text x="16" y="26" class="t">One sealed chunk body: two keys, two tags, and the fields neither tag covers.</text>
  <text x="16" y="46" class="s">The encryption frame as written today (version 1). The compression frame, when present, is inside the ciphertext.</text>

  <text x="16" y="96" class="rl">keys</text>
  <rect x="96"  y="78" width="176" height="34" rx="3" class="pre"/><text x="108" y="100" class="m">master key (provider)</text>
  <line x1="272" y1="95" x2="330" y2="95" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a9s)"/>
  <text x="282" y="88" class="s">wraps</text>
  <rect x="334" y="78" width="184" height="34" rx="3" class="tr"/><text x="346" y="100" class="m">data key, one per chunk</text>
  <line x1="518" y1="95" x2="576" y2="95" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a9s)"/>
  <text x="528" y="88" class="s">seals</text>
  <rect x="580" y="78" width="120" height="34" rx="3" class="pt"/><text x="594" y="100" class="m">chunk body</text>
  <text x="712" y="92" class="ok">AAD = plaintext hash</text>
  <text x="712" y="108" class="s">and nothing else</text>

  <text x="16" y="136" class="s">The data key is fresh from crypto/rand for every chunk, so its random nonce can never repeat under it.</text>
  <text x="16" y="152" class="s">The master key wraps every data key with a random 96-bit nonce, so it is the key with a nonce budget (&#167;4.5).</text>

  <line x1="16" y1="168" x2="884" y2="168" stroke="#c3cad3"/>

  <text x="16" y="206" class="rl">frame v1</text>
  <rect x="96"  y="188" width="70"  height="34" rx="3" class="pre"/><text x="106" y="210" class="m">DFENC</text>
  <rect x="166" y="188" width="64"  height="34" rx="3" class="un"/><text x="176" y="210" class="m">ver</text>
  <rect x="230" y="188" width="64"  height="34" rx="3" class="un"/><text x="240" y="210" class="m">aead</text>
  <rect x="294" y="188" width="60"  height="34" rx="3" class="un"/><text x="304" y="210" class="m">wrap</text>
  <rect x="354" y="188" width="110" height="34" rx="3" class="un"/><text x="364" y="210" class="m">key id</text>
  <rect x="464" y="188" width="130" height="34" rx="3" class="tr"/><text x="474" y="210" class="m">wrapped key</text>
  <rect x="594" y="188" width="80"  height="34" rx="3" class="un"/><text x="604" y="210" class="m">nonce</text>
  <rect x="674" y="188" width="200" height="34" rx="3" class="pt"/><text x="684" y="210" class="m">ciphertext + tag</text>

  <path d="M774,222 L774,258 L396,258 L396,284" fill="none" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a9s)"/>
  <text x="412" y="252" class="s">decrypts to</text>

  <text x="16" y="310" class="rl">inside</text>
  <rect x="96"  y="288" width="70"  height="34" rx="3" class="pre"/><text x="106" y="310" class="m">DFCMP</text>
  <rect x="166" y="288" width="60"  height="34" rx="3" class="pre"/><text x="176" y="310" class="m">algo</text>
  <rect x="226" y="288" width="70"  height="34" rx="3" class="pre"/><text x="236" y="310" class="m">size</text>
  <rect x="296" y="288" width="200" height="34" rx="3" class="pre"/><text x="306" y="310" class="m">compressed body</text>
  <text x="512" y="302" class="s">or, when compressing would not shrink it,</text>
  <text x="512" y="318" class="s">the plaintext itself, with no marker</text>

  <text x="16" y="350" class="why">An unmarked body that happens to begin with DFCMP is decoded as a frame and fails: written, acknowledged, never readable (&#167;3.3).</text>

  <line x1="16" y1="366" x2="884" y2="366" stroke="#c3cad3"/>

  <rect x="96"  y="380" width="12" height="12" rx="2" class="un"/><text x="114" y="390" class="s">outside every tag; a change fails the read</text>
  <rect x="380" y="380" width="12" height="12" rx="2" class="tr"/><text x="398" y="390" class="s">covered by the master-key wrap&#8217;s tag</text>
  <rect x="620" y="380" width="12" height="12" rx="2" class="pt"/><text x="638" y="390" class="s">covered by the data-key tag</text>

  <text x="16" y="418" class="l">No header field is in the AAD. Each one feeds key recovery or decryption, so altering it makes the read fail;</text>
  <text x="16" y="436" class="l">none of them can select a different plaintext. That property is incidental today and is made explicit in &#167;4.3.</text>
</svg>
