<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why { font-size: 11px; fill: #b04a4a }
      .ok  { font-size: 11px; font-weight: 600; fill: #2f6f4f }
      .bx { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .bg { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.4 }
      .br { fill: #f8e3e3; stroke: #b04a4a; stroke-width: 1.4 }
      .bn { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.1 }
    </style>
    <marker id="a7t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="16" y="26" class="t">A sweep decided from a snapshot misses a late adoption; a conditional retirement cannot</text>
  <text x="16" y="46" class="s">One chunk h, carried by block B, referenced by nothing. Time runs left to right.</text>

  <text x="16" y="76" class="rl">Decide from a snapshot</text>
  <line x1="120" y1="84" x2="884" y2="84" stroke="#9aa4b2" stroke-width="1.1" marker-end="url(#a7t)"/>
  <text x="16" y="110" class="s">sweep</text>
  <rect x="120" y="94" width="212" height="26" rx="3" class="bn"/><text x="130" y="111" class="m">mark: read live set, h absent</text>
  <rect x="640" y="94" width="130" height="26" rx="3" class="br"/><text x="650" y="111" class="m">delete B</text>
  <text x="16" y="150" class="s">carve</text>
  <rect x="340" y="134" width="150" height="26" rx="3" class="bn"/><text x="350" y="151" class="m">adopt h: "durable"</text>
  <rect x="500" y="134" width="130" height="26" rx="3" class="bn"/><text x="510" y="151" class="m">commit ref → h</text>
  <text x="120" y="182" class="why">The ref did not exist when the live set was read, so no observation was wrong and the file now names bytes that are gone.</text>
  <text x="120" y="198" class="why">What stands between the two is an in-memory table: one process, one hour.</text>

  <line x1="16" y1="216" x2="884" y2="216" stroke="#eef1f4"/>

  <text x="16" y="242" class="rl">Decide inside the transaction</text>
  <text x="16" y="270" class="s">adopt first</text>
  <rect x="120" y="254" width="250" height="26" rx="3" class="bx"/><text x="130" y="271" class="m">adopt h: refcount 0→1, live 0→1</text>
  <rect x="390" y="254" width="220" height="26" rx="3" class="bg"/><text x="400" y="271" class="m">Retire(B): live ≠ 0, refuse</text>
  <text x="630" y="271" class="ok">B survives with the new ref</text>

  <text x="16" y="314" class="s">retire first</text>
  <rect x="120" y="298" width="250" height="26" rx="3" class="bx"/><text x="130" y="315" class="m">Retire(B): live = 0, records gone</text>
  <rect x="390" y="298" width="220" height="26" rx="3" class="bg"/><text x="400" y="315" class="m">adopt h: no record, fail</text>
  <text x="630" y="315" class="ok">pass re-uploads h's bytes</text>

  <text x="16" y="356" class="l">Both transactions write h's chunk record and B's block record, so the store serializes them.</text>
  <text x="16" y="374" class="l">Neither order needs a clock, a lock held in memory, or a list of things to spare.</text>
  <text x="16" y="394" class="s">The object is deleted only after its records are retired, so a delete never outruns the decision (§3.1).</text>
</svg>
