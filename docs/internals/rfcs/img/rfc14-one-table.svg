<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 448" width="900" height="448" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a58"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.ok{font-size:11px;font-weight:600;fill:#4c8a58}
      .no{font-size:12px;font-weight:700;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.4}
      .dr{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .gl{stroke:#4c8a58;stroke-width:1.8;fill:none;marker-end:url(#g)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .life{stroke:#9aa3ad;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="448" fill="#ffffff"/>
  <text x="16" y="26" class="t">Both protocols reach one table per file, at the file's primary, where every conflict is decided.</text>

  <rect x="24" y="44" width="260" height="62" rx="5" class="pr"/>
  <text x="36" y="63" class="h">alice-pc (SMB), 08:30</text>
  <text x="36" y="80" class="s">open o1: read+write, deny write</text>
  <text x="36" y="95" class="s">persistent, lease L1 (read+write+handle)</text>
  <rect x="320" y="44" width="260" height="62" rx="5" class="pr"/>
  <text x="332" y="63" class="h">second desktop (SMB), 14:00</text>
  <text x="332" y="80" class="s">open for write, the same file</text>
  <text x="332" y="95" class="s">alice signs in a second time</text>
  <rect x="616" y="44" width="260" height="62" rx="5" class="pr"/>
  <text x="628" y="63" class="h">build01 (NFS)</text>
  <text x="628" y="80" class="s">READ and WRITE on the same file</text>
  <text x="628" y="95" class="s">NFSv3 I/O runs on an anonymous open</text>
  <path d="M154,108 L154,128" class="ln"/><path d="M450,108 L450,128" class="ln"/><path d="M746,108 L746,128" class="ln"/>

  <rect x="24" y="130" width="852" height="34" rx="5" class="sv"/>
  <text x="36" y="151" class="m">vfs.Service</text>
  <text x="130" y="151" class="s">routes every call for the file to its primary, N1; no adapter holds any of the state below (RFC 17)</text>
  <path d="M304,166 L304,188" class="ln"/>

  <rect x="24" y="190" width="560" height="206" rx="6" class="st"/>
  <text x="36" y="210" class="h">N1, primary: the table for profiles/alice/ODFC_alice.vhdx, in memory</text>
  <text x="44" y="236" class="m" xml:space="preserve">client   alice-pc</text>
  <text x="44" y="254" class="m" xml:space="preserve">open     o1  read+write  deny write  persistent</text>
  <text x="44" y="272" class="m" xml:space="preserve">grant    L1  read+write+handle  epoch 3</text>
  <text x="44" y="290" class="m" xml:space="preserve">locks    none</text>
  <text x="44" y="308" class="m" xml:space="preserve">waiters  none</text>
  <text x="36" y="330" class="s">The same process runs the file's I/O, so nothing lands between a conflict</text>
  <text x="36" y="345" class="s">check and the write it admits. Keyed by file: a rename, a second hard link</text>
  <text x="36" y="360" class="s">or a second handle to the file all meet the same entries (§3).</text>
  <text x="36" y="384" class="e">build01's NFSv3 WRITE runs on no open of its own: o1's deny write refuses it (§6).</text>

  <rect x="610" y="190" width="266" height="62" rx="6" class="bad"/>
  <text x="622" y="209" class="no">second desktop's open: refused</text>
  <text x="622" y="226" class="s">o1 denies write: ErrShareViolation,</text>
  <text x="622" y="241" class="s">never a read-only open it did not ask for</text>
  <rect x="610" y="262" width="266" height="62" rx="6" class="pr"/>
  <text x="622" y="281" class="h">same app instance ID?</text>
  <text x="622" y="298" class="s">o1, its locks and lease are closed first,</text>
  <text x="622" y="313" class="s">then the new open is granted (§8.1)</text>
  <rect x="610" y="334" width="266" height="62" rx="6" class="dr"/>
  <text x="622" y="353" class="h">N1 restarts</text>
  <text x="622" y="370" class="s">the table is gone: grace admits only</text>
  <text x="622" y="385" class="s">reclaims; alice-pc reclaims o1 (§4.2)</text>
  <path d="M586,221 L608,221" class="ln"/><path d="M586,293 L608,293" class="ln"/><path d="M586,365 L608,365" class="ln"/>

  <text x="16" y="418" class="s">Written to the metadata store here: alice-pc's client record, and o1's record because o1 is persistent.</text>
  <text x="16" y="433" class="s">A plain open of a file that has a name writes nothing (§8); grants, locks and waiters live only in the table.</text>
</svg>
