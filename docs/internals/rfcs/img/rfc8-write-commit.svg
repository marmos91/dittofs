<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}.meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
.data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}.ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
.p{fill:#ffffff;stroke:#1b1f24;stroke-width:1.1}.k{fill:#fbefd9;stroke:#a8741f;stroke-width:1.3}.r{fill:#f8e3e6;stroke:#a33a4d;stroke-width:1.3}
.a{fill:#eaf4ec;stroke:#2f6f4f;stroke-width:1.3}
.arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#h)}.dash{stroke:#a33a4d;stroke-width:1.2;stroke-dasharray:5 3;fill:none;marker-end:url(#h)}
.lane{stroke:#c3cad3;stroke-width:1;stroke-dasharray:3 3}
</style><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker></defs>
<rect width="900" height="560" fill="#ffffff"/>
<text x="16" y="26" class="t">A write is acknowledged when the journal holds it; existence commits at the stability point.</text>
<rect x="30" y="44" width="120" height="30" rx="4" class="ext"/><text x="72" y="64" class="h">client</text>
<rect x="190" y="44" width="140" height="30" rx="4" class="vfs"/><text x="202" y="64" class="h">filesystem service</text>
<rect x="370" y="44" width="120" height="30" rx="4" class="data"/><text x="408" y="64" class="h">engine</text>
<rect x="530" y="44" width="120" height="30" rx="4" class="data"/><text x="566" y="64" class="h">journal</text>
<rect x="690" y="44" width="160" height="30" rx="4" class="meta"/><text x="714" y="64" class="h">metadata store</text>
<path d="M90 76V505" class="lane"/><path d="M260 76V505" class="lane"/><path d="M430 76V505" class="lane"/><path d="M590 76V505" class="lane"/><path d="M770 76V505" class="lane"/>
<rect x="14" y="92" width="872" height="190" rx="4" fill="#eaf4ec" fill-opacity="0.45" stroke="none"/>
<text x="24" y="110" class="h">write</text>
<path d="M92 120H256" class="arr"/><text x="104" y="115" class="s">WRITE 4 KiB @ 1 MiB</text>
<path d="M262 138H426" class="arr"/><text x="274" y="133" class="s">Write (authorised)</text>
<text x="440" y="150" class="s">admit: CapacityGovernor</text>
<path d="M432 170H586" class="arr"/><text x="444" y="165" class="s">stage → version 7</text>
<path d="M588 188H434" class="arr"/><text x="500" y="183" class="s">held</text>
<text x="440" y="206" class="s">post Dirty(f) to the work queue</text>
<path d="M428 222H264" class="arr"/><text x="290" y="217" class="s">ok, verifier</text>
<path d="M258 240H94" class="arr"/><text x="104" y="235" class="s">UNSTABLE, verifier</text>
<text x="606" y="236" class="s">no metadata write,</text><text x="606" y="252" class="s">no offload, no remote</text>
<text x="24" y="272" class="s">Until the stability point the journal is the authority: Read, Overlay and Allocation apply its uncommitted operations.</text>
<rect x="14" y="288" width="872" height="214" rx="4" fill="#fbefd9" fill-opacity="0.45" stroke="none"/>
<text x="24" y="304" class="h">commit: the stability point</text>
<path d="M92 326H256" class="arr"/><text x="104" y="321" class="s">COMMIT / fsync</text>
<path d="M262 344H426" class="arr"/><text x="274" y="339" class="s">Commit</text>
<path d="M432 362H586" class="arr"/><text x="444" y="357" class="s">Sync(f), every member</text>
<path d="M588 380H434" class="arr"/><text x="500" y="375" class="s">synced</text>
<path d="M432 400H766" class="arr"/><text x="444" y="395" class="s">group commit: size, holes, times, applied, version</text>
<text x="600" y="418" class="s">one bounded transaction per journal;</text>
<text x="600" y="434" class="s">a conflict retries only its own files</text>
<path d="M766 452H434" class="arr"/><text x="450" y="447" class="s">committed</text>
<path d="M428 470H264" class="arr"/><text x="290" y="465" class="s">ok, verifier</text>
<path d="M258 488H94" class="arr"/><text x="104" y="483" class="s">stable, verifier</text>
<text x="16" y="528" class="l">Offload runs later, from the work queue, on its own schedule. Neither path waits for a put.</text>
<text x="16" y="548" class="s">The verifier is the owner epoch plus a process instance ID: it changes exactly when an unstable write can have been lost.</text>
</svg>
