<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#1b1f24}.s{font-size:11px;fill:#5b6472}
      .k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#3d444d}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .dl{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:4 3;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="900" height="450" fill="#ffffff"/>
  <text x="16" y="26" class="t">One write: one transaction in the store. Every node learns of it by generation and reports what it applied.</text>

  <rect x="24" y="52" width="210" height="62" rx="6" class="pr"/>
  <text x="38" y="72" class="h">the CLI</text>
  <text x="38" y="90" class="k">PUT …/settings/…</text>
  <text x="38" y="105" class="k">If-Match: "the tag read"</text>

  <rect x="340" y="52" width="250" height="78" rx="6" class="sv"/>
  <text x="354" y="72" class="h">the API on N1</text>
  <text x="354" y="89" class="s">authenticate; check the account's role</text>
  <text x="354" y="104" class="s">validate with the component's validator</text>
  <text x="354" y="119" class="s">compare If-Match inside the transaction</text>

  <path d="M236,74 L336,74" class="ln"/>
  <path d="M338,108 L238,108" class="ln"/><text x="244" y="124" class="k">200 · new ETag</text>

  <rect x="200" y="168" width="500" height="62" rx="6" class="st"/>
  <text x="214" y="188" class="h">metadata store: one transaction</text>
  <text x="214" y="205" class="s">the record, its tag moved on · the settings generation raised</text>
  <text x="214" y="220" class="s">the audit record · nothing commits without the others</text>
  <path d="M465,132 L465,164" class="ln"/>

  <rect x="610" y="52" width="270" height="78" rx="6" class="sv"/>
  <text x="624" y="72" class="h">GET on any API node</text>
  <text x="624" y="89" class="s">joins the node-status records into</text>
  <text x="624" y="104" class="s">the resource's status:</text>
  <text x="624" y="119" class="k">applied: 3 of 3 nodes</text>
  <path d="M700,166 L740,134" class="ln"/>

  <rect x="80" y="300" width="190" height="62" rx="6" class="sv"/>
  <text x="94" y="322" class="h">N1</text>
  <rect x="355" y="300" width="190" height="62" rx="6" class="pr"/>
  <text x="369" y="322" class="h">N2</text>
  <rect x="630" y="300" width="190" height="62" rx="6" class="pr"/>
  <text x="644" y="322" class="h">N3</text>
  <text x="94" y="342" class="s">reads the generation</text>
  <text x="369" y="342" class="s">reads the generation</text>
  <text x="644" y="342" class="s">reads the generation</text>
  <text x="94" y="356" class="s">applies by class</text>
  <text x="369" y="356" class="s">applies by class</text>
  <text x="644" y="356" class="s">applies by class</text>

  <path d="M290,232 L180,296" class="dl"/>
  <path d="M450,232 L450,296" class="dl"/>
  <path d="M610,232 L720,296" class="dl"/>

  <text x="40" y="392" class="s">Every node reads the generation each second, so a live change applies within 5 s.</text>
  <text x="40" y="410" class="s">Each node then writes the position it has reconciled through, and any record it refused, to its node-status record.</text>
</svg>
