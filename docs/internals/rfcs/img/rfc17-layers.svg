<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a58"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.ok{font-size:11px;font-weight:600;fill:#4c8a58}
      .no{font-size:12px;font-weight:700;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.4}
      .dr{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .gl{stroke:#4c8a58;stroke-width:1.8;fill:none;marker-end:url(#g)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .life{stroke:#9aa3ad;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="16" y="26" class="t">Adapters see one API. The service alone calls the stores below and orders each call.</text>

  <rect x="24" y="44" width="200" height="48" rx="5" class="pr"/>
  <text x="36" y="63" class="h">NFS adapter</text><text x="36" y="80" class="s">NFSv3, NFSv4, NLM, MOUNT</text>
  <rect x="250" y="44" width="200" height="48" rx="5" class="pr"/>
  <text x="262" y="63" class="h">SMB adapter</text><text x="262" y="80" class="s">SMB2/3</text>
  <rect x="476" y="44" width="200" height="48" rx="5" class="pr"/>
  <text x="488" y="63" class="h">IPC$ RPC</text><text x="488" y="80" class="s">srvsvc, lsarpc (SMB)</text>
  <path d="M124,94 L124,128" class="ln"/><path d="M350,94 L350,128" class="ln"/><path d="M576,94 L576,128" class="ln"/>

  <rect x="24" y="130" width="652" height="150" rx="8" class="sv"/>
  <text x="36" y="150" class="m">vfs.Service</text><text x="126" y="150" class="s">— six area interfaces; a gateway routes each call, the filesystem at the primary decides it</text>
  <rect x="36" y="162" width="150" height="48" rx="4" class="pr"/>
  <text x="46" y="180" class="h">clients</text><text x="46" y="197" class="s">Connect, Renew, Destroy</text>
  <rect x="196" y="162" width="150" height="48" rx="4" class="pr"/>
  <text x="206" y="180" class="h">names</text><text x="206" y="197" class="s">Lookup, Create, Rename</text>
  <rect x="356" y="162" width="150" height="48" rx="4" class="pr"/>
  <text x="366" y="180" class="h">attributes</text><text x="366" y="197" class="s">GetAttr, SetACL, Access</text>
  <rect x="516" y="162" width="150" height="48" rx="4" class="pr"/>
  <text x="526" y="180" class="h">data</text><text x="526" y="197" class="s">Open, Read, Write, Clone</text>
  <rect x="36" y="220" width="150" height="48" rx="4" class="pr"/>
  <text x="46" y="238" class="h">locks</text><text x="46" y="255" class="s">locks, grants, watches</text>
  <rect x="196" y="220" width="150" height="48" rx="4" class="pr"/>
  <text x="206" y="238" class="h">principals</text><text x="206" y="255" class="s">Spell, Find</text>
  <rect x="356" y="220" width="310" height="48" rx="4" class="pr"/>
  <text x="366" y="238" class="h">shares and volumes</text><text x="366" y="255" class="s">Root, SecInfo, ListShares, StatFS, Quota</text>

  <rect x="700" y="44" width="176" height="96" rx="6" class="dr"/>
  <text x="712" y="63" class="h">Callbacks</text>
  <text x="712" y="80" class="s">implemented by adapters:</text>
  <text x="712" y="96" class="s">RecallGrant, Notify,</text>
  <text x="712" y="111" class="s">Revoked, LockWaitOver</text>
  <text x="712" y="127" class="s">no adapter is imported</text>
  <path d="M676,160 L788,160 L788,142" class="cb"/>
  <path d="M700,68 L678,68" class="cb"/>

  <rect x="700" y="196" width="176" height="84" rx="6" class="dr"/>
  <text x="712" y="215" class="h">Events sink</text>
  <text x="712" y="232" class="s">Quota, Access (audit)</text>
  <text x="712" y="248" class="s">emitted only here;</text>
  <text x="712" y="264" class="s">never waited on</text>
  <path d="M678,238 L698,238" class="ln"/>

  <path d="M100,282 L100,318" class="ln"/><path d="M267,282 L267,318" class="ln"/>
  <path d="M434,282 L434,318" class="ln"/><path d="M601,282 L601,318" class="ln"/>
  <rect x="24" y="320" width="152" height="58" rx="5" class="st"/>
  <text x="36" y="340" class="h">metadata store</text><text x="36" y="356" class="s">RFC 16 · namespace,</text><text x="36" y="370" class="s">Authorize chokepoint</text>
  <rect x="191" y="320" width="152" height="58" rx="5" class="st"/>
  <text x="203" y="340" class="h">content engine</text><text x="203" y="356" class="s">RFC 8 · journal,</text><text x="203" y="370" class="s">write verifier</text>
  <rect x="358" y="320" width="152" height="58" rx="5" class="st"/>
  <text x="370" y="340" class="h">open state</text><text x="370" y="356" class="s">RFC 14 · opens, locks,</text><text x="370" y="370" class="s">deny modes, grants</text>
  <rect x="525" y="320" width="152" height="58" rx="5" class="st"/>
  <text x="537" y="340" class="h">identity</text><text x="537" y="356" class="s">RFC 18 · resolves the</text><text x="537" y="370" class="s">caller per share</text>
  <text x="700" y="340" class="s">the service is the only</text>
  <text x="700" y="356" class="s">caller of all four; an</text>
  <text x="700" y="372" class="s">adapter never sees them</text>

  <text x="16" y="400" class="s">Adapters are wire only: framing, compounds, replay caches, error codes — no share list, no permission logic (§4.2).</text>
  <text x="16" y="418" class="s">Whether a file's primary is this node or another is the gateway's to route and never reaches an adapter (§2).</text>
</svg>
