<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a58"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.ok{font-size:11px;font-weight:600;fill:#4c8a58}
      .no{font-size:12px;font-weight:700;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.4}
      .dr{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .gl{stroke:#4c8a58;stroke-width:1.8;fill:none;marker-end:url(#g)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .life{stroke:#9aa3ad;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="456" fill="#ffffff"/>
  <text x="16" y="26" class="t">Open state's entities: each names its client and its file; the colour says what is written down.</text>

  <rect x="24" y="48" width="210" height="124" rx="6" class="st"/>
  <text x="36" y="67" class="h">Client</text>
  <text x="36" y="85" class="s">ID, Protocol, Owner, Verifier,</text>
  <text x="36" y="100" class="s">Principal, MachCred, CSSeq</text>
  <text x="36" y="115" class="s">LeaseOwner, Callback, Shards</text>
  <text x="36" y="133" class="s">found by (protocol, owner);</text>
  <text x="36" y="148" class="s">durable except Expires, which</text>
  <text x="36" y="163" class="s">the lease owner holds (§2.1)</text>

  <rect x="24" y="192" width="210" height="72" rx="6" class="pr"/>
  <text x="36" y="211" class="h">Unconfirmed</text>
  <text x="36" y="228" class="s">SETCLIENTID or EXCHANGE_ID not</text>
  <text x="36" y="243" class="s">yet confirmed; held in open state on</text>
  <text x="36" y="258" class="s">the node that answered (§2.9)</text>
  <path d="M129,190 L129,174" class="cb"/>
  <text x="136" y="186" class="s">confirm: Connect</text>

  <rect x="24" y="284" width="210" height="72" rx="6" class="pr"/>
  <text x="36" y="303" class="h">OwnerSeq, NFSv4.0</text>
  <text x="36" y="320" class="s">the next seqid of an open-owner</text>
  <text x="36" y="335" class="s">or lock-owner, at its home</text>
  <text x="36" y="350" class="s">primary (§2.8)</text>

  <rect x="270" y="48" width="226" height="124" rx="6" class="dr"/>
  <text x="282" y="67" class="h">Open</text>
  <text x="282" y="85" class="s">Access, Deny, Durability, Principal</text>
  <text x="282" y="100" class="s">DeleteOnClose, DeleteBy, Via</text>
  <text x="282" y="115" class="s">StateSeq, Nonce: its stateid</text>
  <text x="282" y="133" class="s">SMB: CreateGUID, AppInstance,</text>
  <text x="282" y="148" class="s">Timeout, LockSeq, ChannelSeq,</text>
  <text x="282" y="163" class="s">LossSeen, Session (§2.2)</text>
  <path d="M236,90 L268,90" class="ln"/>
  <text x="238" y="84" class="s">holds</text>

  <rect x="270" y="192" width="226" height="72" rx="6" class="dr"/>
  <text x="282" y="211" class="h">Lock, LockState</text>
  <text x="282" y="228" class="s">Owner, Range, Exclusive; taken</text>
  <text x="282" y="243" class="s">under an open, released by its</text>
  <text x="282" y="258" class="s">close. NLM: no open (§2.3)</text>
  <path d="M383,174 L383,190" class="ln"/>

  <rect x="270" y="284" width="226" height="72" rx="6" class="pr"/>
  <text x="282" y="303" class="h">LockWaiter</text>
  <text x="282" y="320" class="s">a conflicting request that waits:</text>
  <text x="282" y="335" class="s">first in, first out per range,</text>
  <text x="282" y="350" class="s">holding no worker (§2.10)</text>

  <rect x="532" y="48" width="222" height="88" rx="6" class="pr"/>
  <text x="544" y="67" class="h">CachingGrant</text>
  <text x="544" y="85" class="s">covers opens; read, write, handle</text>
  <text x="544" y="100" class="s">SMB: Key, ParentKey, Epoch</text>
  <text x="544" y="115" class="s">Recall: a deadline in flight</text>
  <text x="544" y="130" class="s">one per (client, lease key, file)</text>
  <path d="M530,100 L498,100" class="cb"/>

  <rect x="532" y="150" width="222" height="60" rx="6" class="pr"/>
  <text x="544" y="169" class="h">Watch</text>
  <text x="544" y="186" class="s">a directory, Recursive, Filter;</text>
  <text x="544" y="201" class="s">never reclaimed (§2.5)</text>

  <rect x="532" y="224" width="222" height="60" rx="6" class="zone"/>
  <text x="544" y="243" class="h">Layout</text>
  <text x="544" y="260" class="s">reserved (cluster), §2.6</text>


  <rect x="782" y="48" width="94" height="308" rx="6" class="zone"/>
  <text x="794" y="67" class="h">File</text>
  <text x="794" y="85" class="s">RFC 7's.</text>
  <text x="794" y="103" class="s">Every entry</text>
  <text x="794" y="118" class="s">is keyed by</text>
  <text x="794" y="133" class="s">its FileID,</text>
  <text x="794" y="148" class="s">never by a</text>
  <text x="794" y="163" class="s">name or a</text>
  <text x="794" y="178" class="s">handle; a</text>
  <text x="794" y="193" class="s">stream's are</text>
  <text x="794" y="208" class="s">its base</text>
  <text x="794" y="223" class="s">file's (§3)</text>
  <path d="M756,92 L780,92" class="ln"/><path d="M756,180 L780,180" class="ln"/>
  <path d="M756,254 L780,254" class="ln"/>

  <rect x="24" y="378" width="14" height="14" rx="2" class="st"/>
  <text x="46" y="389" class="s">durable: written to the metadata store (§8)</text>
  <rect x="330" y="378" width="14" height="14" rx="2" class="dr"/>
  <text x="352" y="389" class="s">durable only for a persistent open, or one keeping an unlinked file alive</text>
  <rect x="24" y="402" width="14" height="14" rx="2" class="pr"/>
  <text x="46" y="413" class="s">volatile: held in the file's table at its primary, lost with it, then reclaimed in grace or asked for again</text>
  <text x="16" y="440" class="s">A client's expiry or revoke releases every Open, Lock, LockWaiter, CachingGrant and Watch it holds, at every shard, in one step (§4.3).</text>
</svg>
