<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .h  { font-size: 13px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .up { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.2 }
      .dn { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .line { stroke: #b04a4a; stroke-width: 1.5; stroke-dasharray: 6 4 }
    </style>
  </defs>
  <rect width="900" height="350" fill="#ffffff"/>

  <text x="16" y="26" class="t">One call, no memory, below the line. Everything that spans calls, above it.</text>

  <rect x="16"  y="48" width="270" height="118" rx="4" class="up"/>
  <text x="30"  y="70" class="h">engine and GC</text>
  <text x="30"  y="92" class="l">decide what to transfer and delete</text>
  <text x="30"  y="110" class="l">block codec: encode, transforms,</text>
  <text x="30"  y="128" class="l">verify every chunk read</text>

  <rect x="306" y="48" width="270" height="118" rx="4" class="up"/>
  <text x="320" y="70" class="h">syncer</text>
  <text x="320" y="92" class="l">worker pools: concurrency, fairness,</text>
  <text x="320" y="110" class="l">memory bound; retries and their bound;</text>
  <text x="320" y="128" class="l">health derived from probes and outcomes</text>

  <rect x="596" y="48" width="288" height="118" rx="4" class="up"/>
  <text x="610" y="70" class="h">the test for a new concern</text>
  <text x="610" y="92" class="l">noticed only across calls → above</text>
  <text x="610" y="110" class="l">changes the outcome of one call → below</text>

  <line x1="16" y1="190" x2="884" y2="190" class="line"/>
  <text x="16" y="182" class="s">the store contract: put · get · delete · list · health</text>

  <rect x="16"  y="210" width="270" height="110" rx="4" class="dn"/>
  <text x="30"  y="232" class="h">S3-compatible store</text>
  <text x="30"  y="254" class="l">name → bucket, prefix, key</text>
  <text x="30"  y="272" class="l">one attempt; put checksum</text>
  <text x="30"  y="290" class="l">statuses → closed error set</text>

  <rect x="306" y="210" width="270" height="110" rx="4" class="dn"/>
  <text x="320" y="232" class="h">another store</text>
  <text x="320" y="254" class="l">its own location mapping</text>
  <text x="320" y="272" class="l">and its own service checks</text>

  <rect x="596" y="210" width="288" height="110" rx="4" class="dn"/>
  <text x="610" y="232" class="h">fault-injecting store (tests)</text>
  <text x="610" y="254" class="l">drops, delays, corrupts, truncates,</text>
  <text x="610" y="272" class="l">clamps ranges, ignores checksums</text>
</svg>
