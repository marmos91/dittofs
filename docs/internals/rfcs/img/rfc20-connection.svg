<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .wk{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
      .q{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.3;fill:none;marker-end:url(#r);stroke-dasharray:5 3}
    </style>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="16" y="26" class="t">One connection: one reader, bounded work in flight, one writer. A slow client stalls only itself.</text>

  <rect x="24" y="130" width="90" height="60" rx="6" fill="#ffffff" stroke="#5b6472" stroke-width="1.3"/>
  <text x="44" y="156" class="m">socket</text><text x="40" y="174" class="s">build01</text>

  <rect x="150" y="130" width="130" height="60" rx="6" class="pr"/>
  <text x="178" y="156" class="m">reader</text><text x="160" y="174" class="s">frame · header · admit</text>
  <path d="M116,160 L146,160" class="ln"/>

  <rect x="320" y="56" width="180" height="40" rx="5" class="wk"/><text x="338" y="80" class="m">worker · WRITE @0</text>
  <rect x="320" y="106" width="180" height="40" rx="5" class="wk"/><text x="338" y="130" class="m">worker · WRITE @1 MiB</text>
  <rect x="320" y="156" width="180" height="40" rx="5" class="wk"/><text x="338" y="180" class="m">worker · GETATTR</text>
  <rect x="320" y="206" width="180" height="40" rx="5" fill="#ffffff" stroke="#9aa3ad" stroke-dasharray="4 3"/><text x="338" y="230" class="s">slot free / credit unused</text>
  <path d="M282,150 L316,80" class="ln"/><path d="M282,156 L316,126" class="ln"/><path d="M282,162 L316,176" class="ln"/>
  <text x="320" y="298" class="l">in flight ≤ slots (v4.1), credits (SMB),</text>
  <text x="320" y="314" class="l">or a fixed cap (v3, v4.0)</text>

  <rect x="560" y="106" width="130" height="90" rx="6" class="q"/>
  <text x="580" y="130" class="m">writer queue</text>
  <text x="572" y="150" class="s">bounded; whole</text><text x="572" y="164" class="s">messages; signs</text><text x="572" y="178" class="s">in send order</text>
  <path d="M502,76 L556,130" class="ln"/><path d="M502,126 L556,142" class="ln"/><path d="M502,176 L556,160" class="ln"/>

  <rect x="740" y="130" width="130" height="60" rx="6" fill="#ffffff" stroke="#5b6472" stroke-width="1.3"/>
  <text x="776" y="156" class="m">socket</text><text x="756" y="174" class="s">replies, any order</text>
  <path d="M692,160 L736,160" class="ln"/>

  <path d="M620,198 C620,300 210,300 210,194" class="ex"/>
  <text x="300" y="346" class="e">queue full (client not reading) → reader stops reading this connection → TCP window pushes back</text>
  <text x="300" y="364" class="e">write deadline passed → connection closed. No worker ever waits on the client.</text>
</svg>
