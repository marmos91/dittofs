<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 444" width="900" height="444" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a58"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.ok{font-size:11px;font-weight:600;fill:#4c8a58}
      .no{font-size:12px;font-weight:700;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.4}
      .dr{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .gl{stroke:#4c8a58;stroke-width:1.8;fill:none;marker-end:url(#g)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .life{stroke:#9aa3ad;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="444" fill="#ffffff"/>
  <text x="16" y="26" class="t">The node builds the table first, and only at Start hands it the filesystem as its Sink, and the admission lock.</text>

  <text x="24" y="54" class="h">node.New builds</text>
  <rect x="24" y="64" width="180" height="70" rx="6" class="st"/>
  <text x="36" y="83" class="m">metadata.Open</text>
  <text x="36" y="100" class="s">the store; the table uses only</text>
  <text x="36" y="115" class="s">its OpenRecords view</text>
  <path d="M206,99 L232,99" class="ln"/>
  <rect x="234" y="64" width="232" height="70" rx="6" class="pr"/>
  <text x="246" y="83" class="m">openstate.New(Deps)</text>
  <text x="246" y="100" class="s">Records, Budget, Clock, Rand, Metrics,</text>
  <text x="246" y="115" class="s">Logger. No Sink; starts nothing</text>
  <path d="M468,99 L494,99" class="ln"/>
  <rect x="496" y="64" width="200" height="72" rx="6" class="sv"/>
  <text x="508" y="83" class="m">vfs.New(Deps)</text>
  <text x="508" y="100" class="s">*vfs.Filesystem holds *Table and</text>
  <text x="508" y="115" class="s">hands each area only its views:</text>
  <text x="508" y="128" class="s">e.g. Data: Opens and Checks</text>
  <path d="M698,99 L724,99" class="ln"/>
  <rect x="726" y="64" width="150" height="70" rx="6" class="pr"/>
  <text x="738" y="83" class="h">adapters</text>
  <text x="738" y="100" class="s">reach the table only</text>
  <text x="738" y="115" class="s">through vfs.Service</text>

  <text x="24" y="180" class="h">Node.Start, in build order</text>
  <rect x="24" y="190" width="442" height="84" rx="6" class="pr"/>
  <text x="36" y="209" class="m">table.Start(ctx, sink, order)</text>
  <text x="410" y="209" class="s">step 5</text>
  <text x="36" y="227" class="s">sink and order are the built *vfs.Filesystem's; starts the one deadline</text>
  <text x="36" y="242" class="s">goroutine on Deps.Clock. Then the filesystem's Start calls ServeShard per</text>
  <text x="36" y="257" class="s">shard: installs its persistent opens, enters grace, arms its timers</text>
  <path d="M468,232 L494,232" class="ln"/>
  <rect x="496" y="190" width="200" height="84" rx="6" class="sv"/>
  <text x="508" y="209" class="m">Filesystem.Start</text>
  <text x="650" y="209" class="s">step 6</text>
  <text x="508" y="227" class="s">ServeShard each shard; builds</text>
  <text x="508" y="242" class="s">the pseudo-filesystem; (cluster)</text>
  <text x="508" y="257" class="s">then Serve and the gateway</text>
  <path d="M698,232 L724,232" class="ln"/>
  <rect x="726" y="190" width="150" height="84" rx="6" class="pr"/>
  <text x="738" y="209" class="h">adapters serve</text>
  <text x="738" y="227" class="s">step 9, after the first</text>
  <text x="738" y="242" class="s">reconcile; no client</text>
  <text x="738" y="257" class="s">arrives before</text>
  <path d="M590,136 L590,150 L330,150 L330,188" class="cb"/>
  <text x="600" y="152" class="s">the built filesystem: Sink and order</text>

  <text x="24" y="304" class="h">Node.Stop, in reverse</text>
  <rect x="24" y="314" width="150" height="70" rx="6" class="pr"/>
  <text x="36" y="333" class="h">adapters stop</text>
  <text x="36" y="350" class="s">each drains, delivering</text>
  <text x="36" y="365" class="s">closes and unlocks</text>
  <path d="M176,349 L196,349" class="ln"/>
  <rect x="198" y="314" width="196" height="70" rx="6" class="dr"/>
  <text x="210" y="333" class="h">(cluster) handover</text>
  <text x="210" y="350" class="s">shards handed over while</text>
  <text x="210" y="365" class="s">Serve still receives; then Serve</text>
  <path d="M396,349 L416,349" class="ln"/>
  <rect x="418" y="314" width="150" height="70" rx="6" class="sv"/>
  <text x="430" y="333" class="m">Drain, Stop</text>
  <text x="430" y="350" class="s">the filesystem; revokes</text>
  <text x="430" y="365" class="s">nothing</text>
  <path d="M570,349 L590,349" class="ln"/>
  <rect x="592" y="314" width="150" height="70" rx="6" class="pr"/>
  <text x="604" y="333" class="m">table.Stop</text>
  <text x="604" y="350" class="s">stops the timers;</text>
  <text x="604" y="365" class="s">no drain of its own</text>
  <path d="M744,349 L764,349" class="ln"/>
  <rect x="766" y="314" width="110" height="70" rx="6" class="st"/>
  <text x="778" y="333" class="h">engine, then</text>
  <text x="778" y="350" class="s">the store, last</text>

  <text x="16" y="412" class="s">Why the Sink comes at Start: the filesystem is built after the table and holds it, so a Sink in Deps would make the two constructors need each other.</text>
  <text x="16" y="428" class="s">Open state left in memory at a stop is not drained or revoked: the next start's grace recovers it (§4.2).</text>
</svg>
