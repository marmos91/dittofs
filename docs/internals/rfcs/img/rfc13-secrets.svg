<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 442" width="900" height="442" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#1b1f24}.s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .pd{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .rf{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="442" fill="#ffffff"/>
  <text x="16" y="26" class="t">Secrets are sealed per role, and a credential rotates in two phases without changing a record.</text>

  <rect x="24" y="56" width="220" height="92" rx="6" class="pr"/>
  <text x="38" y="78" class="h">protocol-only node</text>
  <text x="38" y="98" class="s">bootstrap names the protocol</text>
  <text x="38" y="114" class="s">wrapping key only</text>
  <text x="38" y="134" class="s">authentication</text>

  <rect x="316" y="44" width="268" height="180" rx="8" class="st"/>
  <text x="330" y="64" class="h">metadata store KV — Secret records</text>
  <rect x="330" y="76" width="240" height="62" rx="5" class="pr"/>
  <text x="342" y="94" class="m">sealed under protocol key</text>
  <text x="342" y="112" class="s">password hashes, NT hashes,</text>
  <text x="342" y="128" class="s">keytabs, IdP bind credentials</text>
  <rect x="330" y="148" width="240" height="62" rx="5" class="sv"/>
  <text x="342" y="166" class="m">sealed under storage key</text>
  <text x="342" y="184" class="s">remote-tier credentials,</text>
  <text x="342" y="200" class="s">references to master keys</text>

  <rect x="656" y="120" width="220" height="92" rx="6" class="sv"/>
  <text x="670" y="142" class="h">storage node</text>
  <text x="670" y="162" class="s">bootstrap names the storage</text>
  <text x="670" y="178" class="s">wrapping key</text>
  <text x="670" y="198" class="s">remote tier, material provider</text>

  <path d="M246,92 L326,104" class="ln"/><text x="252" y="84" class="s">unseals</text>
  <path d="M246,134 L326,172" class="ex"/><text x="38" y="170" class="e">reads storage-sealed records,</text><text x="38" y="186" class="e">cannot open them</text>
  <path d="M654,174 L574,178" class="ln"/><text x="596" y="166" class="s">unseals</text>

  <text x="24" y="250" class="s">Wrapping keys live outside the KV, in a host file or an external key service, so a copy of the store alone reveals no secret.</text>
  <text x="24" y="266" class="s">The two roles' keys merge only when every node runs both roles, the single-node default.</text>

  <text x="24" y="300" class="h">rotating the bucket's credential — the reference in the remote store's record never changes</text>
  <rect x="24" y="314" width="200" height="88" rx="6" class="sv"/>
  <text x="38" y="334" class="h">1 · seal v2</text>
  <text x="38" y="352" class="s">new value under the same</text>
  <text x="38" y="368" class="s">reference, a new version;</text>
  <text x="38" y="384" class="s">v1 stays resolvable</text>
  <rect x="244" y="314" width="200" height="88" rx="6" class="sv"/>
  <text x="258" y="334" class="h">2 · spread</text>
  <text x="258" y="352" class="s">generation raised; each node</text>
  <text x="258" y="368" class="s">resolves again within 5 s,</text>
  <text x="258" y="384" class="s">proves it (§5.2), reports v2</text>
  <rect x="464" y="314" width="200" height="88" rx="6" class="pd"/>
  <text x="478" y="334" class="h">3 · wait</text>
  <text x="478" y="352" class="s">until every node using the</text>
  <text x="478" y="368" class="s">reference reports v2</text>
  <rect x="684" y="314" width="192" height="88" rx="6" class="st"/>
  <text x="698" y="334" class="h">4 · retire v1</text>
  <text x="698" y="352" class="s">provider deletes v1; the</text>
  <text x="698" y="368" class="s">control plane reports the old</text>
  <text x="698" y="384" class="s">credential may be revoked</text>
  <path d="M226,358 L240,358" class="ln"/><path d="M446,358 L460,358" class="ln"/><path d="M666,358 L680,358" class="ln"/>
  <text x="24" y="426" class="e">Revoking v1 at its service before step 4 fails the nodes that still hold it.</text>
</svg>
