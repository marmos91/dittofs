<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 674" width="960" height="674" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .ada{fill:#eceff2;stroke:#9aa4b2;stroke-width:1.2}
      .vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}
      .meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
      .data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}
      .ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
      .node{fill:#ffffff;stroke:#5b6472;stroke-width:1.2}
      .role{font-size:11px;font-weight:700;fill:#5b6472;letter-spacing:.04em}
      .arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .arr2{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#a);marker-start:url(#b)}
      .rep{stroke:#4c8a58;stroke-width:1.4;fill:none;stroke-dasharray:5 3;marker-end:url(#g)}
      .kv{stroke:#b08a3e;stroke-width:1.2;fill:none;stroke-dasharray:3 3}
      .al{font-size:10.5px;fill:#5b6472}
      .pri{fill:#4c8a58}.pt{font-size:11px;font-weight:700;fill:#ffffff}
      .rp{fill:#ffffff;stroke:#4c8a58;stroke-width:1.2}.rt{font-size:11px;font-weight:700;fill:#4c8a58}
    </style>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6472"/></marker>
    <marker id="b" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#5b6472"/></marker>
    <marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c8a58"/></marker>
  </defs>
  <rect width="960" height="674" fill="#ffffff"/>
  <text x="16" y="26" class="t">A cluster: identical nodes over an external metadata store and one bucket</text>

  <!-- clients -->
  <rect x="134" y="44" width="200" height="34" rx="17" class="ext"/>
  <text x="234" y="65" class="l" text-anchor="middle">alice-pc — SMB</text>
  <rect x="439" y="44" width="200" height="34" rx="17" class="ext"/>
  <text x="539" y="65" class="l" text-anchor="middle">build01 — NFS</text>
  <path d="M234,79 L234,108" class="arr"/>
  <path d="M539,79 L539,108" class="arr"/>
  <text x="660" y="66" class="al">clients connect to floating addresses of the</text>
  <text x="660" y="80" class="al">cluster, held by any node (RFC 15 §5.3)</text>

  <!-- nodes -->
  <rect x="40" y="110" width="270" height="226" rx="6" class="node"/>
  <text x="54" y="130" class="h">node S1 · every component</text>
  <rect x="54" y="138" width="106" height="22" rx="11" class="pri"/><text x="107" y="153" class="pt" text-anchor="middle">primary: A</text>
  <rect x="168" y="138" width="128" height="22" rx="11" class="rp"/><text x="232" y="153" class="rt" text-anchor="middle">replica: B, C</text>
  <rect x="172" y="168" width="124" height="26" rx="4" class="ada"/><text x="182" y="185" class="s">NFS / SMB adapters</text>
  <rect x="54" y="168" width="110" height="26" rx="4" class="vfs"/><text x="64" y="185" class="s">vfs.Gateway</text>
  <rect x="54" y="202" width="242" height="26" rx="4" class="vfs"/><text x="64" y="219" class="s">vfs.Serve · vfs.Filesystem — decides</text>
  <rect x="54" y="236" width="242" height="26" rx="4" class="data"/><text x="64" y="253" class="s">open state · metadata transactions</text>
  <rect x="54" y="270" width="242" height="26" rx="4" class="data"/><text x="64" y="287" class="s">journal · engine · syncer · GC</text>
  <text x="54" y="318" class="s">orders every change to shard A's files</text>

  <rect x="345" y="110" width="270" height="226" rx="6" class="node"/>
  <text x="359" y="130" class="h">node S2 · every component</text>
  <rect x="359" y="138" width="106" height="22" rx="11" class="pri"/><text x="412" y="153" class="pt" text-anchor="middle">primary: B</text>
  <rect x="473" y="138" width="128" height="22" rx="11" class="rp"/><text x="537" y="153" class="rt" text-anchor="middle">replica: A, C</text>
  <rect x="477" y="168" width="124" height="26" rx="4" class="ada"/><text x="487" y="185" class="s">NFS / SMB adapters</text>
  <rect x="359" y="168" width="110" height="26" rx="4" class="vfs"/><text x="369" y="185" class="s">vfs.Gateway</text>
  <rect x="359" y="202" width="242" height="26" rx="4" class="vfs"/><text x="369" y="219" class="s">vfs.Serve · vfs.Filesystem — decides</text>
  <rect x="359" y="236" width="242" height="26" rx="4" class="data"/><text x="369" y="253" class="s">open state · metadata transactions</text>
  <rect x="359" y="270" width="242" height="26" rx="4" class="data"/><text x="369" y="287" class="s">journal · engine · syncer · GC</text>
  <text x="359" y="318" class="s">gateway node for build01</text>

  <rect x="650" y="110" width="270" height="226" rx="6" class="node"/>
  <text x="664" y="130" class="h">node S3 · every component</text>
  <rect x="664" y="138" width="106" height="22" rx="11" class="pri"/><text x="717" y="153" class="pt" text-anchor="middle">primary: C</text>
  <rect x="778" y="138" width="128" height="22" rx="11" class="rp"/><text x="842" y="153" class="rt" text-anchor="middle">replica: A, B</text>
  <rect x="782" y="168" width="124" height="26" rx="4" class="ada"/><text x="792" y="185" class="s">NFS / SMB adapters</text>
  <rect x="664" y="168" width="110" height="26" rx="4" class="vfs"/><text x="674" y="185" class="s">vfs.Gateway</text>
  <rect x="664" y="202" width="242" height="26" rx="4" class="vfs"/><text x="674" y="219" class="s">vfs.Serve · vfs.Filesystem — decides</text>
  <rect x="664" y="236" width="242" height="26" rx="4" class="data"/><text x="674" y="253" class="s">open state · metadata transactions</text>
  <rect x="664" y="270" width="242" height="26" rx="4" class="data"/><text x="674" y="287" class="s">journal · engine · syncer · GC</text>
  <text x="664" y="318" class="s">orders every change to shard C's files</text>

  <!-- forward: S2's gateway to S1's server -->
  <path d="M358,181 C330,181 320,212 298,214" class="arr"/>

  <!-- replication -->
  <path d="M296,283 L357,283" class="rep"/>
  <path d="M601,283 L662,283" class="rep"/>
  <path d="M357,293 L296,293" class="rep"/>
  <path d="M662,293 L601,293" class="rep"/>


  <!-- shared metadata -->
  <rect x="40" y="386" width="470" height="104" rx="12" class="meta"/>
  <text x="54" y="408" class="h">metadata store (RFC 16) — not a DittoFS node</text>
  <text x="54" y="426" class="s">an external transactional store; every node reads and writes it:</text>
  <text x="54" y="441" class="s">files, refs, blocks, shares, settings, shard records (who is</text>
  <text x="54" y="456" class="s">primary, at which epoch), node leases, slot table — changed</text>
  <text x="54" y="471" class="s">only by compare-and-swap (RFC 11)</text>
  <path d="M175,337 L175,384" class="kv"/>
  <path d="M480,337 L400,384" class="kv"/>
  <path d="M785,337 L480,384" class="kv"/>

  <!-- bucket -->
  <rect x="540" y="386" width="380" height="104" rx="12" class="ext"/>
  <text x="554" y="408" class="h">remote tier (RFC 4) — S3 bucket</text>
  <text x="554" y="426" class="s">one bucket shared by every node; each node uploads and</text>
  <text x="554" y="441" class="s">fetches the blocks of the shards it is primary for.</text>
  <text x="554" y="456" class="s">Moving a shard moves no object.</text>
  <path d="M250,337 L600,384" class="arr2"/>
  <path d="M560,337 L700,384" class="arr2"/>
  <path d="M860,337 L860,384" class="arr2"/>

  <!-- legend -->
  <rect x="16" y="510" width="928" height="148" rx="6" class="ext"/>
  <text x="32" y="532" class="l"><tspan font-weight="700">Shards.</tspan> Shard A is <tspan font-family="ui-monospace,Menlo,monospace">profiles/alice/</tspan>, B is <tspan font-family="ui-monospace,Menlo,monospace">profiles/bob/</tspan>, C is <tspan font-family="ui-monospace,Menlo,monospace">builds</tspan>. Each has exactly one primary at a time; its replicas hold its journal.</text>
  <text x="32" y="554" class="l"><tspan font-weight="700">S1 lost.</tspan> S2 takes shard A over at a higher epoch; gateways re-route there. A stale S1 is refused by the epoch.</text>
  <text x="32" y="576" class="l"><tspan font-weight="700">A gateway node lost.</tspan> Another node takes its addresses; open state is untouched, because it lives at the primaries.</text>
  <text x="32" y="598" class="l"><tspan font-weight="700" fill="#4c8a58">Green dashed arrows:</tspan> journal records ship to the shard's replicas; a write is acknowledged once the whole replica set holds it (RFC 10).</text>
  <text x="32" y="620" class="l"><tspan font-weight="700">Grey arrow:</tspan> S2's gateway forwards a write to shard A with an envelope; vfs.Serve at S1 checks fence and dedup, then vfs.Filesystem decides.</text>
  <text x="32" y="642" class="l"><tspan font-weight="700">One machine</tspan> is the single-node install: no gateway, and the adapters call vfs.Filesystem directly.</text>
</svg>
