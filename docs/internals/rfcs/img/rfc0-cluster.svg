<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" width="960" height="740" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .ada{fill:#eceff2;stroke:#9aa4b2;stroke-width:1.2}
      .vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}
      .meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
      .data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}
      .ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
      .node{fill:#ffffff;stroke:#5b6472;stroke-width:1.2}
      .role{font-size:11px;font-weight:700;fill:#5b6472;letter-spacing:.04em}
      .arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .arr2{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#a);marker-start:url(#b)}
      .rep{stroke:#4c8a58;stroke-width:1.4;fill:none;stroke-dasharray:5 3;marker-end:url(#g)}
      .kv{stroke:#b08a3e;stroke-width:1.2;fill:none;stroke-dasharray:3 3}
      .al{font-size:10.5px;fill:#5b6472}
      .pri{fill:#4c8a58}.pt{font-size:11px;font-weight:700;fill:#ffffff}
      .rp{fill:#ffffff;stroke:#4c8a58;stroke-width:1.2}.rt{font-size:11px;font-weight:700;fill:#4c8a58}
    </style>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6472"/></marker>
    <marker id="b" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#5b6472"/></marker>
    <marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4c8a58"/></marker>
  </defs>
  <rect width="960" height="740" fill="#ffffff"/>
  <text x="16" y="26" class="t">A cluster: same binary, roles split across nodes, shards spread over storage nodes</text>

  <!-- clients -->
  <rect x="150" y="44" width="200" height="34" rx="17" class="ext"/>
  <text x="250" y="65" class="l" text-anchor="middle">build01 — NFS</text>
  <rect x="560" y="44" width="200" height="34" rx="17" class="ext"/>
  <text x="660" y="65" class="l" text-anchor="middle">alice-pc — SMB</text>
  <path d="M250,79 L250,108" class="arr"/>
  <path d="M660,79 L660,108" class="arr"/>
  <text x="372" y="96" class="al">clients connect to floating addresses of the cluster, never to a machine (RFC 15 §5.3)</text>

  <!-- protocol nodes -->
  <text x="16" y="152" class="role">PROTOCOL</text>
  <rect x="110" y="110" width="330" height="96" rx="6" class="node"/>
  <text x="124" y="130" class="h">node P1 · role protocol</text>
  <rect x="124" y="138" width="140" height="26" rx="4" class="ada"/>
  <text x="134" y="155" class="s">NFS / SMB adapters</text>
  <rect x="272" y="138" width="154" height="26" rx="4" class="vfs"/>
  <text x="282" y="155" class="s">filesystem service</text>
  <text x="124" y="184" class="s">sessions, slots, reply cache: in memory only</text>
  <text x="124" y="198" class="s">holds no file state; forwards each call</text>

  <rect x="520" y="110" width="330" height="96" rx="6" class="node"/>
  <text x="534" y="130" class="h">node P2 · role protocol</text>
  <rect x="534" y="138" width="140" height="26" rx="4" class="ada"/>
  <text x="544" y="155" class="s">NFS / SMB adapters</text>
  <rect x="682" y="138" width="154" height="26" rx="4" class="vfs"/>
  <text x="692" y="155" class="s">filesystem service</text>
  <text x="534" y="184" class="s">takes P1's addresses over if P1 is lost;</text>
  <text x="534" y="198" class="s">the client opens a new session and goes on</text>

  <!-- forwarding -->
  <path d="M200,207 L170,276" class="arr"/>
  <path d="M300,207 L440,276" class="arr"/>
  <path d="M680,207 L470,276" class="arr" style="stroke-dasharray:4 3"/>
  <text x="208" y="244" class="al">route envelope: request ID,</text>
  <text x="208" y="257" class="al">shard, epoch (RFC 15 §4.3)</text>
  <text x="590" y="244" class="al">a call goes to the primary of the file's shard</text>

  <!-- storage nodes -->
  <text x="16" y="350" class="role" style="fill:#4c8a58">STORAGE</text>
  <!-- S1 -->
  <rect x="110" y="278" width="240" height="150" rx="6" class="node"/>
  <text x="124" y="298" class="h">node S1 · role storage</text>
  <rect x="124" y="306" width="96" height="22" rx="11" class="pri"/><text x="172" y="321" class="pt" text-anchor="middle">primary: A</text>
  <rect x="228" y="306" width="108" height="22" rx="11" class="rp"/><text x="282" y="321" class="rt" text-anchor="middle">replica: B, C</text>
  <rect x="124" y="336" width="212" height="24" rx="4" class="data"/>
  <text x="134" y="352" class="s">engine · open state · syncer · GC</text>
  <rect x="124" y="366" width="212" height="24" rx="4" class="data"/>
  <text x="134" y="382" class="s">journal on local NVMe (RFC 1)</text>
  <text x="124" y="410" class="s">orders every change to shard A's files</text>
  <!-- S2 -->
  <rect x="360" y="278" width="240" height="150" rx="6" class="node"/>
  <text x="374" y="298" class="h">node S2 · role storage</text>
  <rect x="374" y="306" width="96" height="22" rx="11" class="pri"/><text x="422" y="321" class="pt" text-anchor="middle">primary: B</text>
  <rect x="478" y="306" width="108" height="22" rx="11" class="rp"/><text x="532" y="321" class="rt" text-anchor="middle">replica: A, C</text>
  <rect x="374" y="336" width="212" height="24" rx="4" class="data"/>
  <text x="384" y="352" class="s">engine · open state · syncer · GC</text>
  <rect x="374" y="366" width="212" height="24" rx="4" class="data"/>
  <text x="384" y="382" class="s">journal on local NVMe (RFC 1)</text>
  <text x="374" y="410" class="s">orders every change to shard B's files</text>
  <!-- S3 -->
  <rect x="610" y="278" width="240" height="150" rx="6" class="node"/>
  <text x="624" y="298" class="h">node S3 · role storage</text>
  <rect x="624" y="306" width="96" height="22" rx="11" class="pri"/><text x="672" y="321" class="pt" text-anchor="middle">primary: C</text>
  <rect x="728" y="306" width="108" height="22" rx="11" class="rp"/><text x="782" y="321" class="rt" text-anchor="middle">replica: A, B</text>
  <rect x="624" y="336" width="212" height="24" rx="4" class="data"/>
  <text x="634" y="352" class="s">engine · open state · syncer · GC</text>
  <rect x="624" y="366" width="212" height="24" rx="4" class="data"/>
  <text x="634" y="382" class="s">journal on local NVMe (RFC 1)</text>
  <text x="624" y="410" class="s">orders every change to shard C's files</text>

  <!-- replication -->
  <path d="M336,378 L372,378" class="rep"/>
  <path d="M586,378 L622,378" class="rep"/>
  <path d="M372,390 L336,390" class="rep"/>
  <path d="M622,390 L586,390" class="rep"/>
  

  <!-- shared metadata -->
  <text x="16" y="530" class="role">SHARED</text>
  <rect x="110" y="476" width="400" height="104" rx="12" class="meta"/>
  <text x="124" y="498" class="h">replicated metadata store (RFC 16)</text>
  <text x="124" y="516" class="s">one transactional database every node uses:</text>
  <text x="124" y="531" class="s">files, refs, blocks, shares, users, settings</text>
  <text x="124" y="551" class="s">shard records (who is primary, at which epoch), node leases,</text>
  <text x="124" y="566" class="s">slot table — changed only by compare-and-swap (RFC 11)</text>
  <path d="M230,429 L230,474" class="kv"/>
  <path d="M410,429 L410,474" class="kv"/>
  <path d="M640,429 L480,474" class="kv"/>
  <path d="M200,207 C40,300 60,470 108,500" class="kv"/>
  <text x="34" y="452" class="al">resolve shares,</text>
  <text x="34" y="465" class="al">find primaries</text>

  <!-- bucket -->
  <rect x="540" y="476" width="310" height="104" rx="12" class="ext"/>
  <text x="554" y="498" class="h">remote tier (RFC 4) — S3 bucket</text>
  <text x="554" y="516" class="s">one bucket shared by every storage node;</text>
  <text x="554" y="531" class="s">each node uploads and fetches the blocks of</text>
  <text x="554" y="546" class="s">the shards it is primary for. Moving a shard</text>
  <text x="554" y="561" class="s">moves no object.</text>
  <path d="M330,429 L548,476" class="arr2"/>
  <path d="M560,429 L640,474" class="arr2"/>
  <path d="M760,429 L760,474" class="arr2"/>

  <!-- legend -->
  <rect x="16" y="600" width="928" height="126" rx="6" class="ext"/>
  <text x="32" y="622" class="l"><tspan font-weight="700">Shards.</tspan> Shard A is <tspan font-family="ui-monospace,Menlo,monospace">profiles/alice/</tspan>, B is <tspan font-family="ui-monospace,Menlo,monospace">profiles/bob/</tspan>, C is <tspan font-family="ui-monospace,Menlo,monospace">builds</tspan>. Each has exactly one primary at a time; its replicas hold its journal.</text>
  <text x="32" y="644" class="l"><tspan font-weight="700">S1 lost.</tspan> S2 takes shard A over at a higher epoch from the journal it already holds; P1 forwards there. A stale S1 is refused by the epoch.</text>
  <text x="32" y="666" class="l"><tspan font-weight="700">P1 lost.</tspan> P2 takes its addresses; opens, locks and leases are untouched, because they live at the storage primaries.</text>
  <text x="32" y="688" class="l"><tspan font-weight="700" fill="#4c8a58">Green dashed arrows:</tspan> journal records ship to the shard's replicas; a write is acknowledged once the whole replica set holds it (RFC 10).</text>
  <text x="32" y="710" class="l"><tspan font-weight="700">One machine, both roles</tspan> is the single-node install: the same picture with every arrow a function call.</text>
</svg>
