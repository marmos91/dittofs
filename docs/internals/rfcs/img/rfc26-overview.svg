<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.blue{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}.green{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
.grey{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}.amber{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
.red{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}.w{fill:#ffffff;stroke:#5b6472;stroke-width:1}
.arr{stroke:#5b6472;stroke-width:1.4;fill:none;marker-end:url(#h)}
.garr{stroke:#4c8a58;stroke-width:1.6;fill:none;marker-end:url(#hg)}
.gt{font-size:11px;fill:#4c8a58}.rt{font-size:11px;fill:#b04a4a}
</style>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker>
<marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4c8a58"/></marker></defs>
<rect width="900" height="570" fill="#ffffff"/>
<text x="16" y="26" class="t">A catalog backup copies metadata only; a copying backup also copies the blocks, into another bucket.</text>

<rect x="16" y="44" width="300" height="104" rx="5" class="green"/>
<text x="28" y="64" class="h">installation A · namespace ns-photos</text>
<text x="28" y="82" class="s">metadata store: share photos,</text>
<text x="28" y="98" class="s">snapshot 12 complete</text>
<rect x="28" y="108" width="276" height="30" rx="4" class="amber"/>
<text x="38" y="127" class="s">use record on 12: it cannot be deleted</text>

<path d="M316 96 H578 V258" class="arr"/>
<text x="332" y="88" class="s">copying backup: the same metadata, plus blocks</text>
<path d="M150 148 V186 H322 V230" class="arr"/>
<text x="160" y="178" class="s">catalog backup: metadata only</text>

<rect x="16" y="200" width="420" height="196" rx="6" class="grey"/>
<text x="28" y="220" class="h">bucket dfs-data</text>
<rect x="28" y="232" width="180" height="150" rx="4" class="w"/>
<text x="40" y="252" class="m">ns-photos/</text>
<text x="40" y="270" class="s">the namespace's blocks:</text>
<text x="40" y="286" class="s">the chunks its refs name</text>
<rect x="220" y="232" width="204" height="150" rx="4" class="blue"/>
<text x="232" y="252" class="h">location same-bucket</text>
<text x="232" y="268" class="s">a folder beside the namespaces</text>
<text x="232" y="292" class="m">export, kind backup</text>
<text x="232" y="310" class="s">tree and refs, chunk records</text>
<text x="232" y="326" class="s">as location hints, key</text>
<text x="232" y="342" class="s">records wrapped, all sealed</text>
<text x="232" y="366" class="m">state: complete</text>

<rect x="464" y="200" width="420" height="196" rx="6" class="grey"/>
<text x="476" y="220" class="h">bucket vault (not the namespace's bucket)</text>
<rect x="476" y="232" width="396" height="150" rx="4" class="blue"/>
<text x="488" y="250" class="h">location vault</text>
<rect x="488" y="260" width="180" height="112" rx="4" class="w"/>
<text x="498" y="278" class="m">export, backup-copy</text>
<text x="498" y="296" class="s">same records; chunk</text>
<text x="498" y="312" class="s">records name folder</text>
<text x="498" y="328" class="s">blocks; plus a manifest</text>
<text x="498" y="344" class="s">of the blocks it needs</text>
<text x="498" y="362" class="m">state: complete</text>
<rect x="680" y="260" width="180" height="112" rx="4" class="w"/>
<text x="690" y="278" class="m">blocks/ns-photos/</text>
<text x="690" y="296" class="s">the block folder: one</text>
<text x="690" y="312" class="s">per namespace and location;</text>
<text x="690" y="328" class="s">blocks byte for byte,</text>
<text x="690" y="344" class="s">names kept</text>

<path d="M118 382 V414 H770 V374" class="arr"/>
<text x="232" y="432" class="s">copying backup: each block its base lacks, copied whole as sealed bytes (never re-sealed)</text>

<rect x="16" y="448" width="868" height="66" rx="5" class="w"/>
<text x="28" y="468" class="gt">catalog backup survives losing the metadata store. It does not survive losing the bucket: it holds no data.</text>
<text x="28" y="485" class="gt">copying backup survives losing the metadata store and the bucket; at an immutable location, a stolen credential too.</text>
<text x="28" y="502" class="rt">neither survives losing the master key that wraps the namespace's export key.</text>

<text x="16" y="536" class="l">Restore always makes a new share. From the catalog backup: a staged import whose refs name chunks still in dfs-data.</text>
<text x="16" y="554" class="l">From the copying backup's folder: the blocks are read, decoded and re-encoded into a new namespace.</text>
</svg>
