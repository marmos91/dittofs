<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a58"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.ok{font-size:11px;font-weight:600;fill:#4c8a58}
      .no{font-size:12px;font-weight:700;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.4}
      .dr{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4}
      .dd{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4;stroke-dasharray:5 3}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .gl{stroke:#4c8a58;stroke-width:1.8;fill:none;marker-end:url(#g)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .life{stroke:#9aa3ad;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="16" y="26" class="t">Who is who: a client holds opens; an owner's locks under one open are a lock state.</text>

  <rect x="24" y="44" width="560" height="226" rx="8" class="zone"/>
  <text x="36" y="63" class="h">client build01</text>
  <text x="140" y="63" class="s">one running client instance, ClientID 7 (§2.1)</text>

  <rect x="40" y="76" width="528" height="180" rx="6" class="zone"/>
  <text x="52" y="94" class="h">file a.txt</text>
  <text x="122" y="94" class="s">all of it held against the file, at its primary (§3)</text>

  <rect x="56" y="106" width="232" height="60" rx="6" class="pr"/>
  <text x="68" y="124" class="h">open o1</text>
  <text x="68" y="141" class="s">opened by process 1: read+write</text>
  <text x="68" y="156" class="s">deny none (§2.2)</text>
  <rect x="320" y="106" width="232" height="60" rx="6" class="pr"/>
  <text x="332" y="124" class="h">open o2</text>
  <text x="332" y="141" class="s">opened by process 2: read</text>
  <text x="332" y="156" class="s">deny none</text>

  <rect x="56" y="184" width="232" height="58" rx="6" class="dr"/>
  <text x="68" y="202" class="h">lock state of owner P1 under o1</text>
  <text x="68" y="219" class="s">lock: bytes 0–99, exclusive</text>
  <text x="68" y="234" class="s">owner P1 is a name build01 chose</text>
  <path d="M172,168 L172,182" class="ln"/>
  <rect x="320" y="184" width="232" height="58" rx="6" class="bad"/>
  <text x="332" y="202" class="no">P2 asks bytes 50–149 under o2</text>
  <text x="332" y="219" class="s">refused: another owner's lock</text>
  <text x="332" y="234" class="s">two owners conflict as two clients</text>
  <path d="M436,168 L436,182" class="ln"/>

  <rect x="608" y="44" width="268" height="104" rx="8" class="st"/>
  <text x="620" y="63" class="h">a state reference (§2.11)</text>
  <text x="620" y="81" class="s">names one open, one lock state or one</text>
  <text x="620" y="96" class="s">caching grant; opaque to the client and</text>
  <text x="620" y="111" class="s">resolved only at the primary, by shard,</text>
  <text x="620" y="126" class="s">then token</text>
  <path d="M606,120 L554,132" class="cb"/>
  <path d="M606,140 L594,140 L594,176 L304,176 L304,200 L290,200" class="cb"/>

  <rect x="608" y="166" width="268" height="104" rx="8" class="zone"/>
  <text x="620" y="185" class="h">host hostB, a lock under no open</text>
  <text x="620" y="203" class="s">an NLM host holds its lock by owner</text>
  <text x="620" y="218" class="s">alone; it ends by unlock, the host's</text>
  <text x="620" y="233" class="s">restart or a revoke (§2.3)</text>

  <text x="24" y="300" class="h">How each protocol spells them</text>
  <rect x="24" y="310" width="852" height="140" rx="6" class="st"/>
  <text x="36" y="330" class="h">entity</text><text x="200" y="330" class="h">NFSv4</text><text x="440" y="330" class="h">SMB</text><text x="680" y="330" class="h">NLM</text>
  <path d="M30,338 L870,338" class="life"/>
  <text x="36" y="356" class="s">client</text><text x="200" y="356" class="s">client ID, by owner string</text><text x="440" y="356" class="s">ClientGuid: the machine</text><text x="680" y="356" class="s">host name and address</text>
  <text x="36" y="374" class="s">open</text><text x="200" y="374" class="s">open stateid, per open-owner</text><text x="440" y="374" class="s">FileId</text><text x="680" y="374" class="s">none: locks need no open</text>
  <text x="36" y="392" class="s">lock owner</text><text x="200" y="392" class="s">lock-owner, chosen by the client</text><text x="440" y="392" class="s">the open itself</text><text x="680" y="392" class="s">svid and owner handle</text>
  <text x="36" y="410" class="s">lock state</text><text x="200" y="410" class="s">lock stateid</text><text x="440" y="410" class="s">named by the open's FileId</text><text x="680" y="410" class="s">none</text>
  <text x="36" y="428" class="s">state reference</text><text x="200" y="428" class="s">stateid: shard, instance, token</text><text x="440" y="428" class="s">FileId, persistent half</text><text x="680" y="428" class="s">none</text>
</svg>
