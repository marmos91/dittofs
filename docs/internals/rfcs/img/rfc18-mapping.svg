<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.w{font-size:11px;fill:#b07a2a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .bi{stroke:#3d444d;stroke-width:1.3;fill:none;marker-start:url(#a);marker-end:url(#a)}
    </style>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="16" y="26" class="t">One principal, many spellings: each stored with the record, and as one index row back.</text>

  <rect x="350" y="180" width="200" height="60" rx="6" class="sv"/>
  <text x="364" y="204" class="m">PrincipalID</text><text x="364" y="224" class="s">minted, never reissued</text>

  <rect x="60" y="70" width="220" height="56" rx="5" class="pr"/>
  <text x="74" y="92" class="m">uid 1500 · gid 1500</text><text x="74" y="112" class="s">AUTH_SYS, NFSv3 attributes</text>
  <text x="64" y="144" class="w">allocated, never defaulted</text>

  <rect x="620" y="70" width="240" height="56" rx="5" class="pr"/>
  <text x="634" y="92" class="m">S-1-5-21-a-b-c-1107</text><text x="634" y="112" class="s">SMB descriptors, PAC, lsarpc</text>
  <text x="624" y="144" class="w">RID from a counter; never changes</text>

  <rect x="60" y="300" width="220" height="56" rx="5" class="pr"/>
  <text x="74" y="322" class="m">alice@CORP.EXAMPLE</text><text x="74" y="342" class="s">Kerberos tickets</text>

  <rect x="350" y="300" width="200" height="56" rx="5" class="pr"/>
  <text x="364" y="322" class="m">alice</text><text x="364" y="342" class="s">NTLM, lsarpc, management API</text>

  <rect x="620" y="300" width="240" height="56" rx="5" class="pr"/>
  <text x="634" y="322" class="m">alice@corp.example</text><text x="634" y="342" class="s">NFSv4 owner, owner_group</text>

  <path d="M346,190 L284,130" class="bi"/>
  <path d="M554,190 L616,130" class="bi"/>
  <path d="M370,244 L280,298" class="bi"/>
  <path d="M450,244 L450,296" class="bi"/>
  <path d="M530,244 L620,298" class="bi"/>

  <text x="16" y="394" class="s">wire → principal: the index row (Find) · principal → wire: the record (Spell). An adapter derives no spelling from another.</text>
  <text x="16" y="414" class="e">No principal behind a spelling: an AUTH_SYS uid acts as anonymous; a name or owner string is refused; a SID is unknown.</text>
</svg>
