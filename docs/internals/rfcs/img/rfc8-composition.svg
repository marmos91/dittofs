<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" width="900" height="712" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}.meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
.data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}.ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
.p{fill:#ffffff;stroke:#1b1f24;stroke-width:1.1}.k{fill:#fbefd9;stroke:#a8741f;stroke-width:1.3}
.arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#h)}
.lend{stroke:#4a7fb5;stroke-width:1.2;stroke-dasharray:5 3;fill:none;marker-end:url(#b)}
</style>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a7fb5"/></marker></defs>
<rect width="900" height="712" fill="#ffffff"/>
<text x="16" y="26" class="t">Who builds, owns, starts and closes what: solid arrows own or call, dashed arrows lend through Deps.</text>

<rect x="20" y="40" width="860" height="48" rx="5" class="k"/>
<text x="34" y="60" class="h">node.New (RFC 23 §2.1) builds and owns; the node (RFC 23 §2.2) starts, stops and sets shares</text>
<text x="34" y="78" class="s">start: store → remotes → syncer → engine.Start(shares) opens journals → GC → open state → identity → vfs.Server → adapters; stop reverses</text>

<path d="M170 90V106" class="arr"/><path d="M450 90V106" class="arr"/><path d="M730 90V106" class="arr"/>

<rect x="20" y="108" width="300" height="58" rx="5" class="p"/>
<text x="32" y="128" class="h">node (RFC 23 §2.1, §2.2)</text>
<text x="32" y="144" class="s">starts and stops the engine, sets and</text>
<text x="32" y="158" class="s">stops shares, pre-warm pages, upload drain</text>

<rect x="340" y="108" width="220" height="58" rx="5" class="p"/>
<text x="352" y="128" class="h">snapshot cut (RFC 12 §2.3)</text>
<text x="352" y="144" class="s">per shard, at the primary:</text>
<text x="352" y="158" class="s">prepare, then close the gate</text>

<rect x="580" y="108" width="300" height="58" rx="5" class="vfs"/>
<text x="592" y="128" class="h">*vfs.Server (RFC 17), holds *Engine</text>
<text x="592" y="144" class="s">the only caller of the content methods,</text>
<text x="592" y="158" class="s">at the file's primary</text>

<path d="M40 168V216" class="arr"/>
<text x="48" y="186" class="m">Start · Bind · Unbind · Drop</text>
<text x="48" y="201" class="m">PreWarm · WaitOffloaded · Close</text>
<path d="M360 168V216" class="arr"/>
<text x="368" y="194" class="m">PrepareCut · CommitCut</text>
<path d="M600 168V216" class="arr"/>
<text x="608" y="186" class="m">Write · Commit · Read · Delete</text>
<text x="608" y="201" class="s">and the other content methods (§12.1)</text>

<rect x="20" y="218" width="860" height="234" rx="5" class="data"/>
<text x="34" y="240" class="h">*engine.Engine (RFC 8): built by New(Deps), which opens nothing; started and stopped by the node</text>

<rect x="36" y="252" width="404" height="190" rx="4" class="ext"/>
<text x="48" y="272" class="h">engine-wide, owned by the engine</text>
<text x="48" y="292" class="l">journals, one per device</text>
<text x="60" y="306" class="s">opened by Start through Deps.Open, after the floor and identity</text>
<text x="48" y="326" class="l">work queue per journal</text>
<text x="60" y="340" class="s">one shared-scheduler instance (§6.1.1), rebuilt at Start</text>
<text x="48" y="360" class="l">offload passes</text>
<text x="60" y="374" class="s">one state machine per pass; joined by Close</text>
<text x="48" y="394" class="l">verifier inputs, self-fence, per-file state</text>
<text x="60" y="408" class="s">speculator and policy functions: memory only (§3.3)</text>
<text x="48" y="430" class="s">closes only what it opened: journals, handles, flows</text>

<path d="M444 300H470" class="arr"/>
<rect x="472" y="252" width="392" height="190" rx="4" class="ext"/>
<text x="484" y="272" class="h">share table: copy-on-write, read without a lock</text>
<rect x="488" y="282" width="360" height="108" rx="4" class="p"/>
<text x="500" y="300" class="h">storage binding (unexported), one per share</text>
<text x="500" y="318" class="m">journal handles</text><text x="640" y="318" class="s">from the journal's Share</text>
<text x="500" y="334" class="m">syncer flow</text><text x="640" y="334" class="s">opened by Start or Bind</text>
<text x="500" y="350" class="m">settings, budgets</text><text x="640" y="350" class="s">refused if invalid</text>
<text x="500" y="366" class="m">policy, health</text><text x="640" y="366" class="s">memory, disposable</text>
<text x="500" y="382" class="m">state</text><text x="640" y="382" class="s">adding → serving → removing</text>
<text x="484" y="406" class="s">Drop closes handle and flow, forgets the tag;</text>
<text x="484" y="420" class="s">Close closes handles and keeps tags. A failed</text>
<text x="484" y="434" class="s">Bind undoes in reverse and publishes nothing.</text>

<path d="M85 494V456" class="lend"/><text x="91" y="478" class="s">views</text>
<path d="M225 494V456" class="lend"/><text x="231" y="478" class="s">Cut, fold</text>
<path d="M355 494V456" class="lend"/><text x="361" y="478" class="s">gate</text>
<path d="M490 494V456" class="lend"/><text x="496" y="478" class="s">one flow per share</text>
<path d="M825 494V456" class="lend"/><text x="831" y="478" class="s">Clock</text>

<rect x="20" y="496" width="130" height="54" rx="5" class="meta"/>
<text x="32" y="514" class="h">metadata store</text>
<text x="32" y="530" class="s">RFC 16, RFC 6</text>
<text x="32" y="543" class="s">Blocks, Refs</text>

<rect x="160" y="496" width="130" height="54" rx="5" class="data"/>
<text x="172" y="514" class="h">carver</text>
<text x="172" y="530" class="s">RFC 2: Cut, the</text>
<text x="172" y="543" class="s">assembler's fold</text>

<rect x="300" y="496" width="110" height="54" rx="5" class="p"/>
<text x="312" y="514" class="h">cut gate</text>
<text x="312" y="530" class="s">RFC 12 §2.3</text>
<text x="312" y="543" class="s">one per shard</text>

<rect x="420" y="496" width="140" height="54" rx="5" class="data"/>
<text x="432" y="514" class="h">syncer</text>
<text x="432" y="530" class="s">RFC 3, shared pools</text>
<text x="432" y="543" class="s">one flow per share</text>

<path d="M592 523H562" class="arr"/>
<rect x="594" y="496" width="166" height="54" rx="5" class="ext"/>
<text x="606" y="514" class="h">remote block stores</text>
<text x="606" y="530" class="s">RFC 4, 5; ref-counted</text>
<text x="606" y="543" class="s">reached via the syncer</text>

<rect x="770" y="496" width="110" height="54" rx="5" class="ext"/>
<text x="782" y="514" class="h">clock</text>
<text x="782" y="530" class="s">metrics, logger</text>
<text x="782" y="543" class="s">one per node</text>

<text x="20" y="568" class="s">Built and owned by the root, lent to the engine through Deps (§2.6); the engine never closes them.</text>

<rect x="20" y="582" width="860" height="100" rx="5" class="ext"/>
<text x="34" y="602" class="h">engine lifecycle (§2.5)</text>
<rect x="34" y="612" width="150" height="62" rx="4" class="p"/>
<text x="44" y="632" class="m">New(Deps)</text><text x="44" y="648" class="s">validates settings;</text><text x="44" y="662" class="s">opens nothing</text>
<path d="M186 643H206" class="arr"/>
<rect x="208" y="612" width="190" height="62" rx="4" class="p"/>
<text x="218" y="632" class="m">Start(ctx, shares)</text><text x="218" y="648" class="s">§2.5 steps 1–8 over the</text><text x="218" y="662" class="s">shares; all or nothing</text>
<path d="M400 643H420" class="arr"/>
<rect x="422" y="612" width="240" height="62" rx="4" class="data"/>
<text x="432" y="632" class="h">serving</text><text x="432" y="648" class="m">Bind · Unbind</text><text x="432" y="662" class="m">Drop</text>
<path d="M664 643H684" class="arr"/>
<rect x="686" y="612" width="180" height="62" rx="4" class="p"/>
<text x="696" y="632" class="m">Close(ctx)</text><text x="696" y="646" class="s">refuse calls, last group</text><text x="696" y="658" class="s">commit, join; then flows,</text><text x="696" y="670" class="s">handles and journals</text>

<text x="16" y="702" class="s">One owner per box. A join past its bound leaves what it depends on open and reports, rather than close it under a live loop (§2.5).</text>
</svg>
