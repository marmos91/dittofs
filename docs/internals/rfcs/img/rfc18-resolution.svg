<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 812" width="900" height="812" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a58"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.z{font-size:11px;font-weight:700;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .dr{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .gl{stroke:#4c8a58;stroke-width:1.8;fill:none;marker-end:url(#g)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.3;fill:none;marker-end:url(#r)}
      .lane{stroke:#c3c9d0;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="812" fill="#ffffff"/>
  <text x="16" y="26" class="t">One request: the gateway carries the Identity unread; the primary admits, resolves, then authorises.</text>

  <rect x="96" y="38" width="226" height="76" rx="8" class="zone"/>
  <text x="108" y="54" class="z">GATEWAY NODE</text>
  <rect x="340" y="38" width="352" height="76" rx="8" class="zone"/>
  <text x="352" y="54" class="z">THE FILE'S PRIMARY</text>

  <rect x="10" y="62" width="74" height="44" rx="5" class="pr"/><text x="20" y="80" class="h">client</text><text x="20" y="97" class="s">NFS or SMB</text>
  <rect x="104" y="62" width="94" height="44" rx="5" class="pr"/><text x="114" y="80" class="h">adapter</text><text x="114" y="97" class="s">wire only</text>
  <rect x="210" y="62" width="104" height="44" rx="5" class="dr"/><text x="220" y="80" class="m">vfs.Gateway</text><text x="220" y="97" class="s">routes, no auth</text>
  <rect x="348" y="62" width="104" height="44" rx="5" class="dr"/><text x="358" y="80" class="m">vfs.Serve</text><text x="358" y="97" class="s">fence, dedup</text>
  <rect x="460" y="62" width="110" height="44" rx="5" class="sv"/><text x="470" y="80" class="m">*vfs.Server</text><text x="470" y="97" class="s">decides the call</text>
  <rect x="578" y="62" width="106" height="44" rx="5" class="sv"/><text x="588" y="80" class="m">Resolver</text><text x="588" y="97" class="s">identity (§6.1)</text>
  <rect x="704" y="62" width="88" height="44" rx="5" class="st"/><text x="714" y="80" class="h">store</text><text x="714" y="97" class="s">and directory</text>
  <rect x="800" y="62" width="92" height="44" rx="5" class="st"/><text x="810" y="80" class="m">Authorize</text><text x="810" y="97" class="s">the chokepoint</text>

  <line x1="47" y1="116" x2="47" y2="740" class="lane"/>
  <line x1="151" y1="116" x2="151" y2="740" class="lane"/>
  <line x1="262" y1="116" x2="262" y2="740" class="lane"/>
  <line x1="400" y1="116" x2="400" y2="740" class="lane"/>
  <line x1="515" y1="116" x2="515" y2="740" class="lane"/>
  <line x1="631" y1="116" x2="631" y2="740" class="lane"/>
  <line x1="748" y1="116" x2="748" y2="740" class="lane"/>
  <line x1="846" y1="116" x2="846" y2="740" class="lane"/>

  <path d="M49,146 L147,146" class="ln"/>
  <text x="53" y="140" class="s">1 a request</text>
  <text x="53" y="160" class="e">past Expires:</text><text x="53" y="174" class="e">refused here</text>

  <path d="M153,192 L258,192" class="ln"/>
  <text x="157" y="186" class="m">2 call(id, …)</text>
  <text x="157" y="206" class="s">the same Identity,</text><text x="157" y="220" class="s">every call</text>

  <path d="M264,240 L396,240" class="gl"/>
  <text x="268" y="234" class="s">3 envelope, Identity</text>
  <text x="268" y="254" class="s">as a value, on an</text><text x="268" y="268" class="s">authenticated channel</text>

  <rect x="340" y="280" width="120" height="38" rx="5" class="dr"/>
  <text x="348" y="296" class="s">4 node and shard</text><text x="348" y="311" class="s">epoch, hop 0; dedup</text>
  <text x="340" y="334" class="e">stale → refused</text>

  <path d="M402,366 L511,366" class="ln"/>
  <text x="406" y="360" class="s">5 the checked call</text>

  <rect x="446" y="380" width="138" height="52" rx="5" class="sv"/>
  <text x="454" y="396" class="s">6 admit: share state,</text><text x="454" y="411" class="s">MinProof, MinProtection,</text><text x="454" y="426" class="s">client rules</text>
  <text x="446" y="446" class="e">below MinProof or</text><text x="446" y="460" class="e">MinProtection: refused</text>

  <path d="M517,484 L627,484" class="ln"/>
  <text x="521" y="478" class="m">7 Resolve</text><text x="521" y="498" class="s">(id, share)</text>

  <path d="M633,518 L744,518" class="ln"/>
  <text x="637" y="512" class="s">8 record, index,</text><text x="637" y="532" class="s">groups, grants</text>

  <rect x="560" y="546" width="168" height="38" rx="5" class="sv"/>
  <text x="568" y="562" class="s">9 map · squash · groups</text><text x="568" y="577" class="s">· grant · flags</text>
  <text x="560" y="600" class="e">store or directory error, disabled,</text><text x="560" y="614" class="e">over the group cap: refused,</text><text x="560" y="628" class="e">never guest, never anonymous</text>

  <path d="M629,652 L519,652" class="ln"/>
  <text x="525" y="646" class="m">10 Caller</text>

  <path d="M517,680 L842,680" class="ln"/>
  <text x="640" y="674" class="m">11 Files.Authorize(caller, h)</text>
  <text x="640" y="694" class="s">RFC 19 decides the file</text>

  <rect x="446" y="706" width="138" height="24" rx="5" class="sv"/>
  <text x="454" y="722" class="s">12 open state, engine</text>

  <path d="M513,752 L153,752" class="cb"/>
  <text x="160" y="746" class="s">13 the answer, back the same way</text>
  <path d="M149,752 L51,752" class="ln"/>
  <text x="53" y="746" class="s">14 on the wire</text>

  <text x="16" y="784" class="s">A call whose primary is the gateway node goes to its own Serve through the checked vfs.Service, fenced the same. On a single node</text>
  <text x="16" y="800" class="s">there is no gateway and no Serve: the adapter calls the *vfs.Server, which runs 6 to 12 itself. Adapters map, squash and grant nothing.</text>
</svg>
