<text x="353" y="120" class="gt">offload, eager</text>
<path d="M435 166V210" class="arr"/>
<text x="427" y="194" class="s" text-anchor="end">Export: un-offloaded tail</text>
<path d="M690 166V210" class="arr"/>
<text x="698" y="186" class="s">live stream from J,</text>
<text x="698" y="200" class="s">counts for acks</text>
<text x="255.0" y="256" class="s" text-anchor="middle">offloaded: skipped</text>
<text x="435.0" y="256" class="s" text-anchor="middle">copied / copying</text>
<text x="690" y="256" class="s" text-anchor="middle">held since J</text>
<path d="M14 276H886" class="lane"/>
<path d="M36 294V556" class="arr"/>
<text x="26" y="572" class="s">time</text>
<rect x="56" y="294" width="130" height="22" rx="4" class="meta"/>
<text x="121" y="309" class="s" text-anchor="middle">metadata store</text>
<text x="202" y="306" class="h">CAS adds D to the shard record at join point J, learner=yes</text>
<text x="202" y="321" class="s">J is the next version the primary assigns; writes never pause</text>
<rect x="56" y="340" width="130" height="22" rx="4" class="data"/>
<text x="121" y="355" class="s" text-anchor="middle">primary → D</text>
<text x="202" y="352" class="h">the live stream starts first: every op after J goes to D</text>
<text x="202" y="367" class="s">D counts for acks from J on, like any replica</text>
<rect x="56" y="386" width="130" height="22" rx="4" class="data"/>
<text x="121" y="401" class="s" text-anchor="middle">primary → D</text>
<text x="202" y="398" class="h">then Export snapshots the tail ≤ J</text>
<text x="202" y="413" class="s">it skips extents already offloaded and copies only the rest</text>
<rect x="56" y="432" width="130" height="22" rx="4" class="data"/>
<text x="121" y="447" class="s" text-anchor="middle">primary → remote</text>
<text x="202" y="444" class="h">meanwhile the primary offloads eagerly</text>
<text x="202" y="459" class="s">every offloaded extent is one D no longer needs copied</text>
<rect x="56" y="478" width="130" height="22" rx="4" class="meta"/>
<text x="121" y="493" class="s" text-anchor="middle">metadata store</text>
<text x="202" y="490" class="h">every version ≤ J copied or offloaded: CAS clears learner</text>
<text x="202" y="505" class="s">the primary checks coverage before it asks</text>
<rect x="56" y="524" width="130" height="22" rx="4" class="a"/>
<text x="121" y="539" class="s" text-anchor="middle">node D</text>
<text x="202" y="536" class="h">D may now take over</text>
<text x="202" y="551" class="s">until now it counted for acks but was not a takeover candidate</text>
