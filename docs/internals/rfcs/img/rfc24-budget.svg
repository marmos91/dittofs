<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" width="900" height="482" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.k{font-size:11px;fill:#1b1f24}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .am{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .bd{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="482" fill="#ffffff"/>
  <text x="16" y="26" class="t">One memory limit, divided once: three quarters in eight pools, each with a rule at its ceiling.</text>
  <text x="24" y="50" class="s">the process memory limit L, sixteenths</text>
  <rect x="24.0" y="58" width="53.2" height="34" class="sv"/>
  <text x="27.5" y="79" class="m">receive</text>
  <rect x="77.2" y="58" width="53.2" height="34" class="sv"/>
  <text x="87.4" y="79" class="m">reply</text>
  <rect x="130.5" y="58" width="53.2" height="34" class="am"/>
  <text x="143.9" y="79" class="m">hold</text>
  <rect x="183.8" y="58" width="53.2" height="34" class="am"/>
  <text x="197.2" y="79" class="m">conn</text>
  <rect x="237.0" y="58" width="53.2" height="34" class="am"/>
  <text x="250.4" y="79" class="m">open</text>
  <rect x="290.2" y="58" width="159.8" height="34" class="st"/>
  <text x="323.9" y="79" class="m">metadata store</text>
  <rect x="450.0" y="58" width="106.5" height="34" class="pr"/>
  <text x="460.4" y="79" class="m">journal index</text>
  <rect x="556.5" y="58" width="106.5" height="34" class="pr"/>
  <text x="580.0" y="79" class="m">transfers</text>
  <rect x="663.0" y="58" width="213.0" height="34" fill="#ffffff" stroke="#9aa3ad" stroke-dasharray="4 3"/>
  <text x="743.1" y="79" class="m">unpooled</text>
  <text x="24" y="122" class="h">pool</text><text x="190" y="122" class="h">share</text><text x="250" y="122" class="h">floor</text><text x="330" y="122" class="h">at its ceiling</text>
  <rect x="24" y="134" width="150" height="26" rx="4" class="sv"/>
  <text x="34" y="151" class="m">receive</text>
  <text x="190" y="151" class="k">1/16</text><text x="250" y="151" class="k">16 MiB</text>
  <text x="330" y="151" class="k">waits: the reader stops, the socket is not read, TCP pushes back</text>
  <rect x="24" y="166" width="150" height="26" rx="4" class="sv"/>
  <text x="34" y="183" class="m">reply</text>
  <text x="190" y="183" class="k">1/16</text><text x="250" y="183" class="k">16 MiB</text>
  <text x="330" y="183" class="k">waits to the call's deadline, then ErrDelay · DelayResources</text>
  <rect x="24" y="198" width="150" height="26" rx="4" class="am"/>
  <text x="34" y="215" class="m">hold</text>
  <text x="190" y="215" class="k">1/16</text><text x="250" y="215" class="k">none</text>
  <text x="330" y="215" class="e">refuses at once: ErrDelay · DelayHoldBudget (RFC 17)</text>
  <rect x="24" y="230" width="150" height="26" rx="4" class="am"/>
  <text x="34" y="247" class="m">connection state</text>
  <text x="190" y="247" class="k">1/16</text><text x="250" y="247" class="k">4 MiB</text>
  <text x="330" y="247" class="e">refuses: closed at accept; a session refused or given fewer slots</text>
  <rect x="24" y="262" width="150" height="26" rx="4" class="am"/>
  <text x="34" y="279" class="m">open state</text>
  <text x="190" y="279" class="k">1/16</text><text x="250" y="279" class="k">4 MiB</text>
  <text x="330" y="279" class="e">refuses new state: DelayResources; never a close or unlock; a reclaim past its allowance</text>
  <rect x="24" y="294" width="150" height="26" rx="4" class="st"/>
  <text x="34" y="311" class="m">metadata store</text>
  <text x="190" y="311" class="k">3/16</text><text x="250" y="311" class="k">64 MiB</text>
  <text x="330" y="311" class="k">evicts; never refuses</text>
  <rect x="24" y="326" width="150" height="26" rx="4" class="pr"/>
  <text x="34" y="343" class="m">journal index</text>
  <text x="190" y="343" class="k">1/8</text><text x="250" y="343" class="k">none</text>
  <text x="330" y="343" class="k">the index's own refusal, answered retry-later (RFC 1)</text>
  <rect x="24" y="358" width="150" height="26" rx="4" class="pr"/>
  <text x="34" y="375" class="m">transfers</text>
  <text x="190" y="375" class="k">1/8</text><text x="250" y="375" class="k">8 per half</text>
  <text x="330" y="375" class="k">syncer workers wait; a full queue is refused (RFC 3)</text>
  <rect x="24" y="390" width="150" height="26" rx="4" fill="#ffffff" stroke="#9aa3ad" stroke-dasharray="4 3"/>
  <text x="34" y="407" class="m">unpooled</text>
  <text x="190" y="407" class="k">1/4</text><text x="250" y="407" class="k">—</text>
  <text x="330" y="407" class="k">stacks, collector headroom, page-cache margin; nobody reserves it</text>
  <rect x="24" y="430" width="12" height="12" class="sv"/><text x="42" y="440" class="s">waits</text>
  <rect x="100" y="430" width="12" height="12" class="am"/><text x="118" y="440" class="s">refuses retry-later</text>
  <rect x="250" y="430" width="12" height="12" class="st"/><text x="268" y="440" class="s">evicts</text>
  <rect x="330" y="430" width="12" height="12" class="pr"/><text x="348" y="440" class="s">the owning RFC's own rule, sized here</text>
  <text x="24" y="464" class="s">On an 8 GiB container: 512 MiB for each of the five small pools, 1.5 GiB metadata store, 1 GiB index, 1 GiB transfers, 2 GiB unpooled.</text>
</svg>
