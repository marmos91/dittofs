<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 12px; fill: #1b1f24 }
      .mb { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 12px; font-weight: 700; fill: #1b1f24 }
      .box   { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.2 }
      .shared{ fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.6 }
      .uniq  { fill: #f7ecdc; stroke: #b5874a; stroke-width: 1.4 }
      .arrow { stroke: #5b6472; stroke-width: 1.2; fill: none; marker-end: url(#a) }
      .thin  { stroke: #c3cad3; stroke-width: 1 }
    </style>
  </defs>
  <rect width="900" height="452" fill="#ffffff"/>

  <text x="16" y="26" class="t">A file owns an ordered list of refs. The chunks they name are shared.</text>

  <!-- v1 -->
  <text x="16" y="72" class="l">report-v1.pdf</text>
  <text x="16" y="88" class="s">refs, in offset order</text>
  <g>
    <rect x="150" y="56" width="132" height="40" rx="3" class="box"/>
    <text x="160" y="72" class="s">ref 0  off 0</text><text x="160" y="88" class="m">a91f…</text>
    <rect x="290" y="56" width="132" height="40" rx="3" class="box"/>
    <text x="300" y="72" class="s">ref 1  off 3.1M</text><text x="300" y="88" class="m">7c02…</text>
    <rect x="430" y="56" width="132" height="40" rx="3" class="box"/>
    <text x="440" y="72" class="s">ref 2  off 6.4M</text><text x="440" y="88" class="m">e5d8…</text>
  </g>

  <!-- v2 -->
  <text x="16" y="182" class="l">report-v2.pdf</text>
  <text x="16" y="198" class="s">middle region edited</text>
  <g>
    <rect x="150" y="166" width="132" height="40" rx="3" class="box"/>
    <text x="160" y="182" class="s">ref 0  off 0</text><text x="160" y="198" class="m">a91f…</text>
    <rect x="290" y="166" width="132" height="40" rx="3" class="box"/>
    <text x="300" y="182" class="s">ref 1  off 3.1M</text><text x="300" y="198" class="m">3b44…</text>
    <rect x="430" y="166" width="132" height="40" rx="3" class="box"/>
    <text x="440" y="182" class="s">ref 2  off 6.5M</text><text x="440" y="198" class="m">e5d8…</text>
  </g>

  <line x1="150" y1="240" x2="884" y2="240" class="thin"/>
  <text x="16" y="244" class="l">chunks</text>
  <text x="16" y="260" class="s">content-addressed,</text>
  <text x="16" y="274" class="s">reference-counted</text>

  <!-- chunk pool -->
  <g>
    <rect x="150" y="300" width="150" height="56" rx="3" class="shared"/>
    <text x="162" y="322" class="mb">a91f…</text><text x="162" y="342" class="s">refcount 2</text>
    <rect x="316" y="300" width="150" height="56" rx="3" class="uniq"/>
    <text x="328" y="322" class="mb">7c02…</text><text x="328" y="342" class="s">refcount 1 — v1 only</text>
    <rect x="482" y="300" width="150" height="56" rx="3" class="uniq"/>
    <text x="494" y="322" class="mb">3b44…</text><text x="494" y="342" class="s">refcount 1 — v2 only</text>
    <rect x="648" y="300" width="150" height="56" rx="3" class="shared"/>
    <text x="660" y="322" class="mb">e5d8…</text><text x="660" y="342" class="s">refcount 2</text>
  </g>

  <!-- v1 arrows -->
  <path d="M216,98 L222,296" class="arrow"/>
  <path d="M356,98 L386,296" class="arrow"/>
  <path d="M496,98 L716,296" class="arrow"/>
  <!-- v2 arrows -->
  <path d="M216,208 L224,296" class="arrow"/>
  <path d="M356,208 L552,296" class="arrow"/>
  <path d="M496,208 L720,296" class="arrow"/>

  <text x="150" y="392" class="l">Boundaries are content-defined, so editing the middle re-cut only the middle chunk.</text>
  <text x="150" y="412" class="l">Its two neighbours kept their hashes and are still shared — that is the dedup.</text>
  <text x="150" y="432" class="s">With fixed-size chunks the edit would have shifted every boundary after it, changing every hash downstream.</text>
</svg>
