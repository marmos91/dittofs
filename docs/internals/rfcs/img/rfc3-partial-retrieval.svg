<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why  { font-size: 11px; fill: #b04a4a }
      .ok   { font-size: 11px; font-weight: 600; fill: #2f6f4f }
      .ch { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
    </style>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>

  <text x="16" y="26" class="t">A range is safe exactly when the caller can name a hash for it.</text>
  <text x="16" y="46" class="s">One stored block object, framed from six chunks. The block has a hash; so does every chunk.</text>

  <text x="16" y="96" class="rl">block object</text>
  <rect x="150" y="80" width="42" height="34" rx="3" fill="#f4f6f8" stroke="#9aa4b2" stroke-width="1.1"/><text x="158" y="102" class="m">hdr</text>
  <rect x="192" y="80" width="108" height="34" rx="3" class="ch"/><text x="234" y="102" class="m">c1</text>
  <rect x="300" y="80" width="84"  height="34" rx="3" class="ch"/><text x="330" y="102" class="m">c2</text>
  <rect x="384" y="80" width="130" height="34" rx="3" class="ch"/><text x="440" y="102" class="m">c3</text>
  <rect x="514" y="80" width="96"  height="34" rx="3" class="ch"/><text x="550" y="102" class="m">c4</text>
  <rect x="610" y="80" width="118" height="34" rx="3" class="ch"/><text x="660" y="102" class="m">c5</text>
  <rect x="728" y="80" width="86"  height="34" rx="3" class="ch"/><text x="760" y="102" class="m">c6</text>

  <path d="M384,140 L384,132 L514,132 L514,140" fill="none" stroke="#2f6f4f" stroke-width="1.6"/>
  <text x="384" y="162" class="ok">chunk-aligned range, hash of c3 supplied by the caller</text>
  <text x="384" y="180" class="s">recompute over the returned bytes, compare, return or fail &#8212; the caller already had the hash</text>

  <path d="M266,222 L266,214 L452,214 L452,222" fill="none" stroke="#b04a4a" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="266" y="244" class="why">arbitrary byte range: part of c1, all of c2, part of c3</text>
  <text x="266" y="262" class="s">nothing in the system hashes these bytes, so nothing can be compared against &#8212; the range is returned on trust</text>

  <line x1="16" y1="292" x2="884" y2="292" stroke="#c3cad3"/>
  <text x="16" y="316" class="rl">The rule this produces</text>
  <text x="16" y="338" class="l">The mechanism &#8212; a ranged read of the stored object &#8212; is needed either way: it is what the chunk read is</text>
  <text x="16" y="356" class="l">built from. What must not be exported is the unverifiable form of it.</text>
  <text x="16" y="382" class="why">A range the caller cannot name a hash for is a range the component cannot vouch for, and its bytes reach the journal as durable.</text>
</svg>
