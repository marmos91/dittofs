<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .ada{fill:#eceff2;stroke:#9aa4b2;stroke-width:1.2}
      .vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}
      .meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
      .data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}
      .ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
      .node{fill:#ffffff;stroke:#5b6472;stroke-width:1.2}
      .seam{fill:#fff4d6;stroke:#b08a3e;stroke-width:1.6}
      .role{font-size:11px;font-weight:700;fill:#5b6472;letter-spacing:.04em}
      .arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .kv{stroke:#b08a3e;stroke-width:1.2;fill:none;stroke-dasharray:3 3;marker-end:url(#k)}
      .al{font-size:10.5px;fill:#5b6472}
    </style>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6472"/></marker>
    <marker id="k" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b08a3e"/></marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="16" y="26" class="t">The cut is vfs.Service: the gateway forwards, the filesystem at the primary decides</text>

  <!-- clients -->
  <rect x="40" y="42" width="300" height="30" rx="15" class="ext"/>
  <text x="190" y="62" class="l" text-anchor="middle">NFS and SMB clients, at floating addresses</text>
  <path d="M190,73 L190,96" class="arr"/>

  <!-- gateway node -->
  <text x="360" y="62" class="role">GATEWAY NODE — where the call arrives</text>
  <rect x="40" y="98" width="300" height="52" rx="5" class="ada"/>
  <text x="54" y="118" class="h">adapter (RFC 20)</text>
  <text x="54" y="136" class="s">signs in (RFC 18) · wire only · calls vfs.Service</text>
  <path d="M190,151 L190,172" class="arr"/>
  <rect x="40" y="174" width="300" height="76" rx="5" class="vfs"/>
  <text x="54" y="194" class="h">vfs.Gateway — forwards, decides nothing</text>
  <text x="54" y="212" class="s">routes by handle through vfs.Router (shard records)</text>
  <text x="54" y="227" class="s">primary local: calls the local vfs.Service</text>
  <text x="54" y="242" class="s">else stamps the envelope · retry · trace · metrics</text>

  <!-- local shortcut -->
  <path d="M100,251 L100,452" class="arr"/>
  <text x="108" y="350" class="al">local: checked, then a function call</text>

  <!-- remote path -->
  <path d="M341,212 L420,212" class="arr"/>
  <rect x="422" y="182" width="230" height="60" rx="6" class="seam"/>
  <text x="436" y="202" class="h">envelope → vfs.Transport</text>
  <text x="436" y="218" class="s">request ID · shard, epoch · node, node epoch</text>
  <text x="436" y="232" class="s">hop 0 · on a node channel (§4.3, §4.4)</text>
  <path d="M653,212 L700,212" class="arr"/>

  <!-- primary -->
  <text x="702" y="88" class="role">PRIMARY OF THE FILE'S SHARD</text>
  <rect x="702" y="174" width="242" height="76" rx="5" class="vfs"/>
  <text x="716" y="194" class="h">vfs.Serve — checks, then calls</text>
  <text x="716" y="212" class="s">fence: node epoch, shard epoch, hop 0</text>
  <text x="716" y="227" class="s">dedup by request ID</text>
  <text x="716" y="242" class="s">then the local vfs.Service</text>
  <path d="M823,251 L823,280 L520,280 L520,450" class="arr"/>

  <!-- server (shared by both paths) -->
  <rect x="40" y="454" width="904" height="62" rx="6" class="node"/>
  <text x="54" y="474" class="h">vfs.Filesystem at the primary — decides everything (RFC 17)</text>
  <text x="54" y="492" class="s">admission to the share · identity resolution · flavour and squash · ordering</text>
  <text x="54" y="507" class="s">calls open state (RFC 14), the metadata store's views (RFC 16) and the engine (RFC 8): all on this one node</text>

  <!-- under the server -->
  <rect x="560" y="320" width="184" height="48" rx="12" class="meta"/>
  <text x="574" y="340" class="h">replicated metadata store</text>
  <text x="574" y="356" class="s">external (RFC 16)</text>
  <rect x="760" y="320" width="184" height="48" rx="12" class="ext"/>
  <text x="774" y="340" class="h">remote tier — S3 bucket</text>
  <text x="774" y="356" class="s">objects (RFC 4)</text>
  <path d="M652,452 L652,370" class="kv"/>
  <path d="M852,452 L852,370" class="kv"/>
  <text x="560" y="410" class="al">only vfs.Filesystem's components call these</text>

  <!-- legend -->
  <rect x="16" y="532" width="928" height="96" rx="6" class="ext"/>
  <text x="32" y="552" class="l"><tspan font-weight="700">Why here, not under the VFS:</tspan> open state lives in one place; a WRITE is one forwarded call, not several engine calls;</text>
  <text x="32" y="570" class="l">the engine interface is chatty; and one epoch fences everything the filesystem does for the call.</text>
  <text x="32" y="592" class="l"><tspan font-weight="700">Every node is alike</tspan>: each runs the adapters, vfs.Gateway, vfs.Serve and vfs.Filesystem; it is the gateway for its clients and primary of its shards.</text>
  <text x="32" y="614" class="l"><tspan font-weight="700">Single node:</tspan> the adapters call vfs.Filesystem directly; no vfs.Gateway, no vfs.Serve, no envelope.</text>
</svg>
