<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .ada{fill:#eceff2;stroke:#9aa4b2;stroke-width:1.2}
      .vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}
      .meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
      .data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}
      .ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
      .node{fill:#ffffff;stroke:#5b6472;stroke-width:1.2}
      .seam{fill:#fff4d6;stroke:#b08a3e;stroke-width:1.6}
      .role{font-size:11px;font-weight:700;fill:#5b6472;letter-spacing:.04em}
      .arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .kv{stroke:#b08a3e;stroke-width:1.2;fill:none;stroke-dasharray:3 3;marker-end:url(#k)}
      .al{font-size:10.5px;fill:#5b6472}
    </style>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6472"/></marker>
    <marker id="k" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b08a3e"/></marker>
  </defs>
  <rect width="960" height="660" fill="#ffffff"/>
  <text x="16" y="26" class="t">The cut: one seam between the two DittoFS tiers; the metadata store is neither</text>

  <!-- clients -->
  <rect x="300" y="42" width="360" height="30" rx="15" class="ext"/>
  <text x="480" y="62" class="l" text-anchor="middle">NFS and SMB clients, at floating addresses</text>
  <path d="M480,73 L480,98" class="arr"/>

  <!-- protocol tier -->
  <text x="16" y="160" class="role">PROTOCOL</text>
  <rect x="110" y="100" width="560" height="150" rx="6" class="node"/>
  <text x="124" y="120" class="h">protocol node · role protocol (RFC 15 §2.1)</text>
  <rect x="124" y="130" width="160" height="26" rx="4" class="ada"/><text x="134" y="147" class="s">NFS / SMB adapters</text>
  <rect x="292" y="130" width="180" height="26" rx="4" class="vfs"/><text x="302" y="147" class="s">filesystem service (RFC 17)</text>
  <rect x="480" y="130" width="176" height="26" rx="4" class="ada"/><text x="490" y="147" class="s">router · shard-record cache</text>
  <rect x="124" y="162" width="260" height="26" rx="4" class="ada"/><text x="134" y="179" class="s">sessions · slot tables · reply caches</text>
  <rect x="392" y="162" width="264" height="26" rx="4" class="ada"/><text x="402" y="179" class="s">client lease owner · back channel (RFC 14)</text>
  <rect x="124" y="194" width="260" height="26" rx="4" class="ada"/><text x="134" y="211" class="s">floating addresses · SMB Witness</text>
  <rect x="392" y="194" width="264" height="26" rx="4" class="ada"/><text x="402" y="211" class="s">pNFS metadata-server endpoint</text>
  <text x="124" y="240" class="s">no file state · no bucket credentials · one call may span shards, so it is split here</text>

  <!-- seam -->
  <rect x="110" y="276" width="560" height="44" rx="6" class="seam"/>
  <text x="124" y="294" class="h">the shard service — the only interface between the tiers</text>
  <text x="124" y="311" class="s">calls served at a shard's primary · control-plane calls · prepares; node channel + route envelope</text>
  <path d="M390,251 L390,274" class="arr"/>
  <path d="M390,321 L390,344" class="arr"/>

  <!-- storage tier -->
  <text x="16" y="420" class="role" style="fill:#4c8a58">STORAGE</text>
  <rect x="110" y="346" width="560" height="182" rx="6" class="node"/>
  <text x="124" y="366" class="h">storage node · role storage · primary or replica of shards (RFC 11)</text>
  <rect x="124" y="376" width="260" height="26" rx="4" class="data"/><text x="134" y="393" class="s">open state · locks · grants · layouts (RFC 14)</text>
  <rect x="392" y="376" width="264" height="26" rx="4" class="data"/><text x="402" y="393" class="s">namespace (RFC 7) · block metadata (RFC 6)</text>
  <rect x="124" y="408" width="260" height="26" rx="4" class="data"/><text x="134" y="425" class="s">journal (RFC 1, 28) · replication (RFC 10)</text>
  <rect x="392" y="408" width="264" height="26" rx="4" class="data"/><text x="402" y="425" class="s">engine · carver · syncer · transforms</text>
  <rect x="124" y="440" width="260" height="26" rx="4" class="data"/><text x="134" y="457" class="s">remote tier (RFC 4) · GC (RFC 9)</text>
  <rect x="392" y="440" width="264" height="26" rx="4" class="data"/><text x="402" y="457" class="s">snapshot cut gate · repair scheduler</text>
  <rect x="124" y="472" width="260" height="26" rx="4" class="data"/><text x="134" y="489" class="s">control plane · management API</text>
  <rect x="392" y="472" width="264" height="26" rx="4" class="data"/><text x="402" y="489" class="s">catalog backups · namespace migration</text>
  <text x="124" y="518" class="s">journal devices · bucket credentials · runs every metadata transaction</text>

  <!-- metadata store -->
  <text x="700" y="250" class="role">EXTERNAL</text>
  <rect x="700" y="262" width="244" height="150" rx="12" class="meta"/>
  <text x="714" y="284" class="h">replicated metadata store</text>
  <text x="714" y="302" class="s">not a DittoFS node (RFC 16)</text>
  <text x="714" y="324" class="s">files, refs, blocks, shares,</text>
  <text x="714" y="339" class="s">settings, shard records, node</text>
  <text x="714" y="354" class="s">leases, slot table, client</text>
  <text x="714" y="369" class="s">records, durable opens,</text>
  <text x="714" y="384" class="s">request records</text>
  <path d="M671,175 C700,180 760,200 790,260" class="kv"/>
  <text x="700" y="196" class="al">reads; writes only node,</text>
  <text x="700" y="209" class="al">client and health records</text>
  <path d="M671,440 C720,440 780,430 800,414" class="kv"/>
  <text x="700" y="462" class="al">every metadata transaction</text>

  <!-- bucket -->
  <rect x="700" y="490" width="244" height="40" rx="12" class="ext"/>
  <text x="714" y="514" class="h">remote tier — S3 bucket</text>
  <path d="M671,505 L698,505" class="arr"/>

  <!-- legend -->
  <rect x="16" y="550" width="928" height="96" rx="6" class="ext"/>
  <text x="32" y="572" class="l"><tspan font-weight="700">One process, both roles</tspan> is the default and the single node: the seam is a function call, and nothing here costs anything.</text>
  <text x="32" y="594" class="l"><tspan font-weight="700">A write</tspan> crosses client → protocol node → primary → each replica before its acknowledgement, then primary → bucket.</text>
  <text x="32" y="616" class="l"><tspan font-weight="700">Metadata logic</tspan> runs on storage nodes; the store only keeps and orders records. Adapters never see the seam (RFC 17).</text>
  <text x="32" y="638" class="l"><tspan font-weight="700">Protocol nodes</tspan> scale with connections and hold no state; storage nodes scale with write bandwidth and journal capacity.</text>
</svg>
