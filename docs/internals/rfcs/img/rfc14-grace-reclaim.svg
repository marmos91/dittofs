<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a58"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.ok{font-size:11px;font-weight:600;fill:#4c8a58}
      .no{font-size:12px;font-weight:700;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.4}
      .dr{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .gl{stroke:#4c8a58;stroke-width:1.8;fill:none;marker-end:url(#g)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .life{stroke:#9aa3ad;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="460" fill="#ffffff"/>
  <text x="16" y="26" class="t">One shard over time: a loss opens a grace instance, only named clients reclaim, then grant resumes.</text>

  <rect x="24" y="44" width="150" height="52" rx="6" class="sv"/>
  <text x="36" y="63" class="h">instance k: normal</text>
  <text x="36" y="80" class="s">state minted under k</text>
  <path d="M184,40 L184,410" class="life"/>
  <text x="190" y="54" class="no">loss</text>
  <text x="190" y="70" class="s">the table is gone; the start</text>
  <text x="190" y="84" class="s">sets GraceInstance = k+1, the</text>
  <text x="190" y="98" class="s">new incarnation (§4.4)</text>
  <rect x="356" y="44" width="350" height="52" rx="6" class="dr"/>
  <text x="368" y="63" class="h">grace, instance k+1: at most one lease period, 90 s</text>
  <text x="368" y="80" class="s">ends early once every named client has finished</text>
  <path d="M716,40 L716,410" class="life"/>
  <rect x="726" y="44" width="150" height="52" rx="6" class="sv"/>
  <text x="738" y="63" class="h">normal again</text>
  <text x="738" y="80" class="s">new state is granted</text>

  <text x="24" y="132" class="h">a request</text>
  <text x="196" y="132" class="h">answered during grace</text>
  <text x="728" y="132" class="h">after grace</text>

  <rect x="24" y="142" width="852" height="44" rx="5" class="st"/>
  <text x="36" y="160" class="s">reclaim, from a client</text>
  <text x="36" y="175" class="s">whose record names the shard</text>
  <text x="196" y="160" class="ok">accepted: only what it held, authorised like a new open against the file as it is now</text>
  <text x="196" y="175" class="s">a shard that lost nothing answers with the state it still holds</text>
  <text x="728" y="167" class="e">refused: out of grace</text>

  <rect x="24" y="192" width="852" height="44" rx="5" class="st"/>
  <text x="36" y="210" class="s">reclaim of volatile state,</text>
  <text x="36" y="225" class="s">past the reclaim allowance</text>
  <text x="196" y="210" class="e">ErrDelay (DelayResources): retried within grace</text>
  <text x="196" y="225" class="s">a durable or persistent open and its locks are never refused for memory</text>
  <text x="728" y="217" class="e">refused: out of grace</text>

  <rect x="24" y="242" width="852" height="44" rx="5" class="bad"/>
  <text x="36" y="260" class="s">reclaim, from a client</text>
  <text x="36" y="275" class="s">no record names here</text>
  <text x="196" y="267" class="e">ErrNoReclaim: it held nothing here, so it cannot take state first</text>
  <text x="728" y="267" class="e">refused</text>

  <rect x="24" y="292" width="852" height="44" rx="5" class="bad"/>
  <text x="36" y="310" class="s">new open, lock or grant;</text>
  <text x="36" y="325" class="s">I/O a lost lock might forbid</text>
  <text x="196" y="310" class="e">ErrGrace, whether or not it seems to conflict: what it would be checked against is lost</text>
  <text x="196" y="325" class="s">a retry-later; a request held pending outlives grace and is granted at its end</text>
  <text x="728" y="317" class="ok">granted, or a conflict</text>

  <rect x="24" y="342" width="852" height="44" rx="5" class="dr"/>
  <text x="36" y="360" class="s">a StateRef minted under k</text>
  <text x="36" y="375" class="s">that the table no longer holds</text>
  <text x="196" y="367" class="e">ErrStaleState: its Instance is older than k+1, so the client reclaims instead of dropping it</text>
  <text x="728" y="367" class="e">ErrStaleState</text>

  <text x="16" y="428" class="h">A client has finished when it</text>
  <text x="186" y="428" class="s">sends an explicit completion for k+1 (e.g. RECLAIM_COMPLETE), or reconnects or times out every persistent</text>
  <text x="16" y="444" class="s">open of its own; a client whose protocol has no completion signal never finishes, and grace then runs the full lease period.</text>
</svg>
