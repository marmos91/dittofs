<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .pre { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.1 }
      .idx { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.2 }
      .rec { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .arr { stroke: #4a7fb5; stroke-width: 1.3; fill: none }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a7fb5"/></marker>
  </defs>
  <rect width="900" height="330" fill="#ffffff"/>

  <text x="16" y="26" class="t">A block: a header that indexes its chunks, then the chunk bodies.</text>
  <text x="16" y="46" class="s">Written and read by the block codec. The store keeps the bytes and never parses them.</text>

  <text x="16" y="96" class="rl">header</text>
  <rect x="80"  y="76" width="130" height="34" rx="3" class="pre"/><text x="92"  y="97" class="m">marker, version</text>
  <rect x="210" y="76" width="100" height="34" rx="3" class="pre"/><text x="222" y="97" class="m">header len</text>
  <rect x="310" y="76" width="100" height="34" rx="3" class="pre"/><text x="322" y="97" class="m">block name</text>
  <rect x="410" y="76" width="200" height="34" rx="3" class="idx"/><text x="422" y="97" class="m">chunk 0: hash, off, len</text>
  <rect x="610" y="76" width="200" height="34" rx="3" class="idx"/><text x="622" y="97" class="m">chunk 1: hash, off, len</text>
  <rect x="810" y="76" width="74"  height="34" rx="3" class="idx"/><text x="838" y="97" class="m">…</text>

  <text x="80"  y="128" class="s">wrong version or</text>
  <text x="80"  y="142" class="s">not a block: fails</text>
  <text x="210" y="128" class="s">header in one</text>
  <text x="210" y="142" class="s">request</text>
  <text x="310" y="128" class="s">wrong key:</text>
  <text x="310" y="142" class="s">detected</text>
  <text x="410" y="128" class="s">the chunk index: the plaintext hash to verify</text>
  <text x="410" y="142" class="s">against, and where the body sits in this block</text>

  <text x="16" y="222" class="rl">bodies</text>
  <rect x="80"  y="202" width="230" height="34" rx="3" class="rec"/><text x="92"  y="223" class="m">body 0</text>
  <rect x="310" y="202" width="150" height="34" rx="3" class="rec"/><text x="322" y="223" class="m">body 1</text>
  <rect x="460" y="202" width="350" height="34" rx="3" class="rec"/><text x="472" y="223" class="m">body 2</text>
  <rect x="810" y="202" width="74"  height="34" rx="3" class="rec"/><text x="838" y="223" class="m">…</text>

  <path d="M710,110 C710,170 385,165 385,200" class="arr" marker-end="url(#a)"/>
  <text x="640" y="176" class="l">off, len of chunk 1 → one ranged get</text>

  <text x="16" y="270" class="l">Each body is one chunk, transformed if a chain is configured, and decodable on its own: a corrupt body loses</text>
  <text x="16" y="288" class="l">one chunk, not the block. Offsets describe the encoded block, so they differ from the chunk's offsets in the</text>
  <text x="16" y="306" class="l">journal; block metadata records these.</text>
</svg>
