<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.4}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.2}
      .am{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.4}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="16" y="26" class="t">No emitter waits on an event; every event lost becomes a gap record in its stream.</text>

  <rect x="24" y="44" width="852" height="236" rx="8" class="zone"/>
  <text x="36" y="62" class="s">one node: access, quota and logon streams</text>

  <rect x="40" y="80" width="150" height="62" rx="5" class="sv"/>
  <text x="52" y="100" class="h">emitters</text>
  <text x="52" y="116" class="s">service: access, quota</text>
  <text x="52" y="130" class="s">authenticator, at logon</text>

  <rect x="214" y="80" width="140" height="62" rx="5" class="pr"/>
  <text x="226" y="100" class="h">sink</text>
  <text x="226" y="116" class="s">stamps node, boot, seq;</text>
  <text x="226" y="130" class="s">returns at once</text>

  <rect x="378" y="80" width="150" height="62" rx="5" class="pr"/>
  <text x="390" y="100" class="h">ring per stream, fixed</text>
  <text x="390" y="116" class="s">access 16,384 entries;</text>
  <text x="390" y="130" class="s">quota, logon 4,096 each</text>

  <rect x="552" y="80" width="140" height="62" rx="5" class="pr"/>
  <text x="564" y="100" class="h">writer</text>
  <text x="564" y="116" class="s">one per stream, batches,</text>
  <text x="564" y="130" class="s">synced every second</text>

  <rect x="716" y="80" width="146" height="62" rx="5" class="st"/>
  <text x="728" y="100" class="h">spool files</text>
  <text x="728" y="116" class="s">JSON lines, 64 MiB</text>
  <text x="728" y="130" class="s">or 1 h each, 0600</text>

  <path d="M192,111 L210,111" class="ln"/><path d="M356,111 L374,111" class="ln"/>
  <path d="M530,111 L548,111" class="ln"/><path d="M694,111 L712,111" class="ln"/>

  <path d="M453,144 L453,176" class="ex"/>
  <rect x="378" y="180" width="150" height="58" rx="5" class="bad"/>
  <text x="390" y="198" class="h">ring full: drop</text>
  <text x="390" y="214" class="m">events_dropped_total</text>
  <text x="390" y="228" class="s">range of seq remembered</text>
  <path d="M530,209 L622,209 L622,146" class="ex"/>
  <text x="540" y="228" class="e">gap record written</text>
  <text x="540" y="242" class="e">in sequence order</text>

  <path d="M789,144 L789,176" class="ex"/>
  <rect x="716" y="180" width="146" height="58" rx="5" class="bad"/>
  <text x="728" y="198" class="h">trimmed</text>
  <text x="728" y="214" class="s">past the byte bound:</text>
  <text x="728" y="228" class="s">deleted, gap recorded</text>
  <text x="40" y="262" class="s">At start: a "restart" gap record for the last unsynced second of the previous process. A file past its age retires with no gap.</text>

  <rect x="24" y="296" width="852" height="74" rx="8" class="zone"/>
  <text x="36" y="314" class="s">admin stream: no ring, no spool</text>
  <rect x="40" y="322" width="230" height="40" rx="5" class="st"/>
  <text x="52" y="346" class="h">control plane's audit records</text>
  <rect x="294" y="322" width="320" height="40" rx="5" class="pr"/>
  <text x="306" y="340" class="h">admin: RFC 23's audit, pulled by position</text>
  <text x="306" y="354" class="s">no ring, no spool; the consumer keeps it</text>
  <path d="M272,342 L290,342" class="ln"/>
  <path d="M616,342 L760,342 L760,388" class="ln"/>
  <text x="622" y="334" class="s">durable; read through the API</text>

  <rect x="40" y="392" width="390" height="62" rx="5" class="am"/>
  <text x="52" y="412" class="h">shipper tails the files</text>
  <text x="52" y="428" class="s">to the archive, write-once if required;</text>
  <text x="52" y="442" class="s">the spool is a buffer, not the archive</text>
  <rect x="470" y="392" width="390" height="62" rx="5" class="am"/>
  <text x="482" y="412" class="h">management API: the spool and the audit</text>
  <text x="482" y="428" class="s">access, logon, admin: the right to read the audit;</text>
  <text x="482" y="442" class="s">quota: operator; never a log, metric or health answer</text>
  <path d="M876,111 L886,111 L886,384 L235,384 L235,388" class="ln"/>
  <path d="M664,384 L664,388" class="ln"/>
</svg>
