<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 526" width="900" height="526" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}.meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
.data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}.ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
.p{fill:#ffffff;stroke:#1b1f24;stroke-width:1.1}.k{fill:#fbefd9;stroke:#a8741f;stroke-width:1.3}.r{fill:#f8e3e6;stroke:#a33a4d;stroke-width:1.3}
.a{fill:#eaf4ec;stroke:#2f6f4f;stroke-width:1.3}
.arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#h)}.dash{stroke:#a33a4d;stroke-width:1.2;stroke-dasharray:5 3;fill:none;marker-end:url(#hr)}
.lane{stroke:#c3cad3;stroke-width:1;stroke-dasharray:3 3}
.garr{stroke:#2f6f4f;stroke-width:1.6;fill:none;marker-end:url(#hg)}.line{stroke:#5b6472;stroke-width:1.3;fill:none}
.rt{font-size:11px;fill:#a33a4d}.gt{font-size:11px;fill:#2f6f4f}
.tail{fill:#ffffff;stroke:#9aa4b2;stroke-width:1;stroke-dasharray:3 2}
.cp{stroke:#1b1f24;stroke-width:2}.jp{stroke:#a8741f;stroke-width:1.6;stroke-dasharray:4 3}
</style><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker><marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a33a4d"/></marker><marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6f4f"/></marker></defs>
<rect width="900" height="526" fill="#ffffff"/>
<text x="16" y="26" class="t">A snapshot hold: dirty content overwritten after the cut stays in the journal until offloaded to history.</text>
<text x="223" y="60" class="h" text-anchor="middle">t0 · v1 offloaded</text>
<text x="369" y="60" class="h" text-anchor="middle">t1 · v2 written</text>
<text x="515" y="60" class="h" text-anchor="middle">t2 · cut 1</text>
<text x="661" y="60" class="h" text-anchor="middle">t3 · v3 overwrites</text>
<text x="807" y="60" class="h" text-anchor="middle">t4 · offload</text>
<rect x="16" y="72" width="126" height="116" rx="5" class="data"/>
<text x="26" y="94" class="h">journal</text>
<text x="26" y="110" class="s">primary and replicas</text>
<rect x="16" y="198" width="126" height="132" rx="5" class="meta"/>
<text x="26" y="220" class="h">metadata store</text>
<text x="26" y="236" class="s">refs, cut records</text>
<rect x="16" y="340" width="126" height="84" rx="5" class="ext"/>
<text x="26" y="362" class="h">remote store</text>
<text x="26" y="378" class="s">the namespace's</text>
<text x="26" y="392" class="s">folder in the bucket</text>
<rect x="154" y="72" width="138" height="116" rx="4" class="p"/>
<text x="162" y="92" class="s">nothing held</text>
<text x="162" y="108" class="s">for this range</text>
<rect x="300" y="72" width="138" height="116" rx="4" class="p"/>
<text x="308" y="92" class="s">v2 dirty, existence</text>
<text x="308" y="108" class="s">committed under</text>
<text x="308" y="124" class="s">cut 0: born 0</text>
<rect x="446" y="72" width="138" height="116" rx="4" class="k"/>
<text x="454" y="92" class="s">v2 dirty, held:</text>
<text x="454" y="108" class="s">hold mark covers v2,</text>
<text x="454" y="124" class="s">replicated</text>
<rect x="592" y="72" width="138" height="116" rx="4" class="k"/>
<text x="600" y="92" class="s">v3 dirty, live;</text>
<text x="600" y="108" class="s">v2 superseded but</text>
<text x="600" y="124" class="s">kept by the hold</text>
<rect x="738" y="72" width="138" height="116" rx="4" class="a"/>
<text x="746" y="92" class="s">v2 and v3 offloaded;</text>
<text x="746" y="108" class="s">hold released; both</text>
<text x="746" y="124" class="s">copies reclaimable</text>
<rect x="154" y="198" width="138" height="132" rx="4" class="p"/>
<text x="162" y="218" class="s">r1 live, born 0</text>
<text x="162" y="234" class="s">→ chunk c1</text>
<rect x="300" y="198" width="138" height="132" rx="4" class="p"/>
<text x="308" y="218" class="s">r1 live</text>
<text x="308" y="234" class="s">(v2 not offloaded)</text>
<rect x="446" y="198" width="138" height="132" rx="4" class="p"/>
<text x="454" y="218" class="s">Cut k 1, klatest 1</text>
<text x="454" y="234" class="s">LiveCut 1</text>
<text x="454" y="250" class="s">snapshot 1: holding</text>
<rect x="592" y="198" width="138" height="132" rx="4" class="p"/>
<text x="600" y="218" class="s">r1 live; v3's</text>
<text x="600" y="234" class="s">existence commit</text>
<text x="600" y="250" class="s">reads cut 1: born 1</text>
<rect x="738" y="198" width="138" height="132" rx="4" class="a"/>
<text x="746" y="218" class="s">r1 dropped (died 0)</text>
<text x="746" y="234" class="s">h2 history: born 0,</text>
<text x="746" y="250" class="s">died 1 → c2</text>
<text x="746" y="266" class="s">r3 live, born 1 → c3</text>
<text x="746" y="282" class="s">snapshot 1: complete</text>
<rect x="154" y="340" width="138" height="84" rx="4" class="p"/>
<text x="162" y="360" class="s">c1 counted by r1</text>
<rect x="300" y="340" width="138" height="84" rx="4" class="p"/>
<text x="308" y="360" class="s">c1</text>
<rect x="446" y="340" width="138" height="84" rx="4" class="p"/>
<text x="454" y="360" class="s">c1</text>
<rect x="592" y="340" width="138" height="84" rx="4" class="p"/>
<text x="600" y="360" class="s">c1</text>
<rect x="738" y="340" width="138" height="84" rx="4" class="a"/>
<text x="746" y="360" class="s">c2 counted by h2</text>
<text x="746" y="376" class="s">c3 counted by r3</text>
<text x="746" y="392" class="s">c1 at 0: GC's</text>
<text x="16" y="452" class="l">Without the hold, v3 would replace v2 in the journal at t3, and the offload would ship v3 alone:</text>
<text x="16" y="470" class="l">snapshot 1's bytes would exist nowhere. The hold keeps v2 only until it is offloaded straight to history.</text>
<text x="16" y="494" class="s">After t4 the protection is in the remote store: h2 is a counted ref, so GC keeps c2 while snapshot 1 lives.</text>
<text x="16" y="510" class="s">v2 is committed before v3 over the same range, so r1's successor is v2 (born 0): r1 dies at 0, which no cut sees, and is dropped.</text>
</svg>
