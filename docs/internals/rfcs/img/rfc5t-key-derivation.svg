<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:600;fill:#1b1f24}.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.env{fill:#f4f6f8;stroke:#9aa4b2;stroke-width:1.2}.c{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.3}.a{fill:#eaf4ec;stroke:#2f6f4f;stroke-width:1.3}
.p{fill:#ffffff;stroke:#1b1f24;stroke-width:1.1}.k{fill:#fbefd9;stroke:#a8741f;stroke-width:1.3}.r{fill:#f8e3e6;stroke:#a33a4d;stroke-width:1.3}
.ar{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#h)}.dash{stroke:#9aa4b2;stroke-width:1.1;stroke-dasharray:4 3;fill:none}
</style><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d444d"/></marker></defs>
<rect width="900" height="360" fill="#ffffff"/>
<text x="16" y="26" class="t">Encrypting one chunk: envelope keys, then a misuse-resistant AEAD.</text>
<text x="16" y="46" class="s">Every derivation has its own versioned label. Only wrapped keys are stored; master keys stay with the provider.</text>
<rect x="16" y="72" width="180" height="48" rx="3" class="k"/><text x="28" y="92" class="h">master key</text><text x="28" y="108" class="s">in the material provider</text>
<path d="M196 96H236" class="ar"/><text x="28" y="136" class="s">unwraps each namespace key</text>
<rect x="238" y="64" width="200" height="30" rx="3" class="k"/><text x="248" y="84" class="m">namespace data key</text>
<rect x="238" y="98" width="200" height="30" rx="3" class="k"/><text x="248" y="118" class="m">namespace header key</text>
<rect x="238" y="132" width="200" height="30" rx="3" class="k"/><text x="248" y="152" class="m">namespace chunking key</text>
<text x="238" y="182" class="s">each stored wrapped, with a fingerprint</text>
<path d="M438 79H488" class="ar"/>
<rect x="490" y="60" width="394" height="42" rx="3" class="p"/><text x="502" y="78" class="h">AES-256-GCM-SIV (RFC 8452)</text><text x="502" y="94" class="s">IV derived from the exact bytes sealed, so any input is safe</text>
<path d="M438 113H488" class="ar"/>
<rect x="490" y="106" width="394" height="30" rx="3" class="c"/><text x="502" y="126" class="s">keys the chunk hashes written in block headers (sealed)</text>
<path d="M438 147H488" class="ar"/>
<rect x="490" y="140" width="394" height="30" rx="3" class="a"/><text x="502" y="160" class="s">keys the chunk boundaries (RFC 2 §6)</text>
<text x="16" y="220" class="h">Why not AES-GCM with a fixed nonce</text>
<text x="16" y="240" class="l">A key derived from the chunk hash assumed one input per key. But encryption seals compression's output, which changes for</text>
<text x="16" y="258" class="l">the same chunk when the level changes, a declined chunk is later compressed, or the library is upgraded — and relocation</text>
<text x="16" y="276" class="l">re-encodes by design. Two inputs under one key and nonce leak their XOR and the authentication key. GCM-SIV is deterministic</text>
<text x="16" y="294" class="l">for equal inputs and safe for different ones.</text>
<text x="16" y="330" class="s">Rotating a master key re-wraps the namespace keys and rewrites no data. Rotating the data key is new material, retired by census.</text>
</svg>
