<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a58"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.ok{font-size:11px;font-weight:600;fill:#4c8a58}
      .no{font-size:12px;font-weight:700;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.4}
      .dr{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .gl{stroke:#4c8a58;stroke-width:1.8;fill:none;marker-end:url(#g)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .life{stroke:#9aa3ad;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="510" fill="#ffffff"/>
  <text x="16" y="26" class="t">A conflict with a caching grant starts the recall and answers ErrDelay at once: no worker waits.</text>

  <rect x="20" y="40" width="120" height="36" rx="5" class="pr"/><text x="34" y="62" class="h">build01 (NFS)</text>
  <rect x="190" y="40" width="120" height="36" rx="5" class="pr"/><text x="210" y="62" class="h">NFS adapter</text>
  <rect x="380" y="40" width="140" height="36" rx="5" class="sv"/><text x="396" y="62" class="h">service, at primary</text>
  <rect x="590" y="40" width="120" height="36" rx="5" class="pr"/><text x="610" y="62" class="h">SMB adapter</text>
  <rect x="760" y="40" width="120" height="36" rx="5" class="pr"/><text x="778" y="62" class="h">alice-pc (lease)</text>
  <path d="M80,78 L80,346" class="life"/><path d="M250,78 L250,346" class="life"/><path d="M450,78 L450,346" class="life"/>
  <path d="M650,78 L650,346" class="life"/><path d="M820,78 L820,346" class="life"/>

  <text x="96" y="100" class="m">WRITE notes.txt</text><path d="M80,106 L248,106" class="ln"/>
  <text x="318" y="124" class="m">Write</text><path d="M250,130 L448,130" class="ln"/>
  <text x="510" y="148" class="m">RecallGrant</text><path d="M450,154 L648,154" class="ln"/>
  <text x="696" y="172" class="m">lease break</text><path d="M650,178 L818,178" class="ln"/>
  <text x="272" y="172" class="m">ErrDelay, at once</text><path d="M450,178 L252,178" class="ln"/>
  <text x="102" y="196" class="m">NFS4ERR_DELAY /</text><path d="M250,202 L82,202" class="ln"/>
  <text x="102" y="216" class="m">NFS3ERR_JUKEBOX</text>
  <text x="458" y="210" class="ok">no worker waits</text>
  <text x="680" y="220" class="m">acknowledge</text><path d="M820,226 L652,226" class="ln"/>
  <text x="520" y="244" class="m">AckBreak</text><path d="M650,250 L452,250" class="ln"/>
  <text x="96" y="270" class="m">retry shortly</text><path d="M80,276 L248,276" class="ln"/>
  <text x="318" y="294" class="m">Write</text><path d="M250,300 L448,300" class="ln"/>
  <text x="268" y="318" class="ok">OK: the write goes ahead</text><path d="M450,324 L252,324" class="gl"/>
  <text x="140" y="342" class="ok">OK</text><path d="M250,346 L82,346" class="gl"/>

  <rect x="24" y="366" width="420" height="104" rx="6" class="dr"/>
  <text x="36" y="386" class="h">If alice-pc never acknowledges</text>
  <text x="36" y="404" class="s">The break is forced at its deadline, 35 s for SMB: the lease</text>
  <text x="36" y="419" class="s">drops to none and the retried write proceeds. Her opens stay,</text>
  <text x="36" y="434" class="s">with their locks and deny modes. A revoked NFS delegation's</text>
  <text x="36" y="449" class="s">later writes are refused. The client is offered no more</text>
  <text x="36" y="464" class="s">grants, and the others it holds are recalled.</text>

  <rect x="456" y="366" width="420" height="104" rx="6" class="pr"/>
  <text x="468" y="386" class="h">If the conflicting caller speaks SMB</text>
  <text x="468" y="404" class="s">SMB has no retry signal, so the SMB adapter sends the interim</text>
  <text x="468" y="419" class="s">(pending) response and re-drives the call itself, in its</text>
  <text x="468" y="434" class="s">request pipeline. The hold may run to smb_pending_deadline,</text>
  <text x="468" y="449" class="s">which must exceed the 35 s break deadline, so the request</text>
  <text x="468" y="464" class="s">completes when the break resolves rather than just before.</text>

  <text x="16" y="496" class="s">A client that holds grants and never answers costs each conflicting operation a retry interval, never a pinned worker.</text>
</svg>
