<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a58"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.ok{font-size:11px;font-weight:600;fill:#4c8a58}
      .no{font-size:12px;font-weight:700;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.4}
      .dr{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .gl{stroke:#4c8a58;stroke-width:1.8;fill:none;marker-end:url(#g)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .life{stroke:#9aa3ad;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="436" fill="#ffffff"/>
  <text x="16" y="26" class="t">A state reference names its shard, so a call with no file handle reaches the right primary.</text>

  <rect x="24" y="44" width="852" height="92" rx="6" class="st"/>
  <text x="36" y="63" class="h">StateRef, minted by open state (e.g. carried as a stateid; the adapter spells it)</text>
  <rect x="36" y="74" width="132" height="50" rx="4" class="pr"/>
  <text x="46" y="93" class="m">Type</text><text x="46" y="110" class="s">open, lock state, grant</text>
  <rect x="176" y="74" width="108" height="50" rx="4" class="pr"/>
  <text x="186" y="93" class="m">Shard</text><text x="186" y="110" class="s">routes the call</text>
  <rect x="292" y="74" width="170" height="50" rx="4" class="pr"/>
  <text x="302" y="93" class="m">Instance</text><text x="302" y="110" class="s">low 5 bits of its grace instance</text>
  <rect x="470" y="74" width="200" height="50" rx="4" class="pr"/>
  <text x="480" y="93" class="m">Token</text><text x="480" y="110" class="s">≥ 64 random bits, unique in Shard</text>
  <rect x="678" y="74" width="186" height="50" rx="4" class="pr"/>
  <text x="688" y="93" class="m">Seq</text><text x="688" y="110" class="s">the one presented; 0: current</text>

  <rect x="24" y="152" width="250" height="88" rx="6" class="pr"/>
  <text x="36" y="171" class="h">a call with no file handle</text>
  <text x="36" y="189" class="m">TestState  FreeState</text>
  <text x="36" y="205" class="m">AckRecall  Unwatch</text>
  <text x="36" y="226" class="s">GrantID and WatchID name a shard too</text>
  <path d="M276,196 L318,196" class="ln"/>
  <rect x="320" y="152" width="200" height="88" rx="6" class="sv"/>
  <text x="332" y="171" class="h">route by Shard</text>
  <text x="332" y="189" class="s">to that shard's primary,</text>
  <text x="332" y="204" class="s">from the ID alone: no handle,</text>
  <text x="332" y="219" class="s">no file lookup</text>
  <path d="M522,196 L564,196" class="ln"/>
  <rect x="566" y="152" width="310" height="88" rx="6" class="st"/>
  <text x="578" y="171" class="h">the primary's index: Token → record, file</text>
  <text x="578" y="189" class="s">a request whose handle names another file:</text>
  <text x="578" y="204" class="e">ErrBadState</text>
  <text x="578" y="226" class="s">Seq judged in the step that resolves it (§2.2)</text>

  <path d="M640,242 L640,270" class="ln"/>
  <path d="M800,242 L800,270" class="ln"/>
  <rect x="566" y="272" width="146" height="62" rx="6" class="sv"/>
  <text x="578" y="291" class="ok">found</text>
  <text x="578" y="308" class="s">Seq current or zero:</text>
  <text x="578" y="323" class="s">answered as in use</text>
  <rect x="726" y="272" width="150" height="62" rx="6" class="bad"/>
  <text x="738" y="291" class="no">found, Seq older</text>
  <text x="738" y="308" class="e">ErrOldState; newer:</text>
  <text x="738" y="323" class="e">ErrBadState</text>

  <path d="M566,212 L540,212 L540,300 L276,300" class="ex"/>
  <text x="440" y="292" class="e">a miss</text>
  <rect x="24" y="262" width="250" height="72" rx="6" class="dr"/>
  <text x="36" y="281" class="h">stale: ErrStaleState</text>
  <text x="36" y="298" class="s">the shard is in grace, or Instance is</text>
  <text x="36" y="313" class="s">not the shard's current: it may name lost</text>
  <text x="36" y="328" class="s">state, so the client reclaims</text>
  <rect x="24" y="346" width="250" height="72" rx="6" class="bad"/>
  <text x="36" y="365" class="no">bad: ErrBadState</text>
  <text x="36" y="382" class="s">every other miss: expired, freed, a</text>
  <text x="36" y="397" class="s">removed share's, forged; nothing maps</text>
  <text x="36" y="412" class="s">released state back to its client</text>
  <path d="M300,300 L300,382 L276,382" class="ex"/>

  <rect x="320" y="352" width="556" height="66" rx="6" class="zone"/>
  <text x="332" y="371" class="s">Only a reference in its client's revoked set is answered ErrRevoked, until FreeState.</text>
  <text x="332" y="388" class="s">A guess must hit 64 random bits; a ClientID or OpenID has no room for them and is</text>
  <text x="332" y="405" class="s">honoured only with its principal and session (§2.11).</text>
</svg>
