<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.g{font-size:11px;fill:#4c8a58}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .am{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="16" y="26" class="t">What a client can reach: NFSv3 with three auxiliary services, or NFSv4 alone, all over TCP.</text>

  <rect x="24" y="44" width="416" height="214" rx="8" class="zone"/>
  <text x="36" y="62" class="s">NFSv3 holds no state: mounting and locking are auxiliary services</text>
  <rect x="40" y="74" width="384" height="36" rx="5" class="sv"/><text x="52" y="96" class="m">NFS v3</text><text x="130" y="96" class="s">RFC 1813: names, attributes, data</text>
  <rect x="40" y="118" width="384" height="36" rx="5" class="sv"/><text x="52" y="140" class="m">MOUNT v3</text><text x="130" y="140" class="s">hands out a share's root handle (§6.3)</text>
  <rect x="40" y="162" width="384" height="36" rx="5" class="sv"/><text x="52" y="184" class="m">NLM v4</text><text x="130" y="184" class="s">byte-range locks (§6.1)</text>
  <rect x="40" y="206" width="384" height="36" rx="5" class="sv"/><text x="52" y="228" class="m">NSM v1</text><text x="130" y="228" class="s">crash notification, SM_NOTIFY (§6.2)</text>

  <rect x="460" y="44" width="416" height="214" rx="8" class="zone"/>
  <text x="472" y="62" class="s">NFSv4: one program; each COMPOUND names its minor version</text>
  <rect x="476" y="74" width="384" height="36" rx="5" class="sv"/><text x="488" y="96" class="m">v4.0</text><text x="540" y="96" class="s">RFC 7530: no sessions; owners number requests (§4)</text>
  <rect x="476" y="118" width="384" height="36" rx="5" class="sv"/><text x="488" y="140" class="m">v4.1</text><text x="540" y="140" class="s">RFC 8881: sessions (§3); pNFS in a cluster only</text>
  <rect x="476" y="162" width="384" height="36" rx="5" class="am"/><text x="488" y="184" class="m">v4.2</text><text x="540" y="184" class="s">RFC 7862, 8276: the subset of §9.3, rest NOTSUPP</text>
  <rect x="476" y="206" width="384" height="36" rx="5" class="bad"/><text x="488" y="228" class="m">v4.3+</text><text x="540" y="228" class="e">NFS4ERR_MINOR_VERS_MISMATCH, nothing run</text>

  <rect x="40" y="272" width="384" height="36" rx="5" class="bad"/><text x="52" y="294" class="m">NFS v2</text><text x="130" y="294" class="e">not served: PROG_MISMATCH naming 3–4</text>
  <rect x="476" y="272" width="384" height="36" rx="5" class="bad"/><text x="488" y="294" class="m">UDP</text><text x="540" y="294" class="e">no NFS, MOUNT, NLM or NSM over UDP (§2.2)</text>

  <rect x="24" y="322" width="852" height="46" rx="6" class="st"/>
  <text x="36" y="341" class="l">TCP only, one fixed 1 MiB transfer size (§2.3). The minor version is the client's choice per COMPOUND.</text>
  <text x="36" y="359" class="s">The port mapper answers on UDP and TCP and reaches no file; SM_NOTIFY is the only UDP the server sends.</text>
</svg>
