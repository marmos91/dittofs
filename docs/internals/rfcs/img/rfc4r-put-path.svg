<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .h  { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .io  { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.1 }
      .up  { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.2 }
      .opt { fill: #fdf6e3; stroke: #b08a2e; stroke-width: 1.2; stroke-dasharray: 5 3 }
      .dn  { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .line { stroke: #b04a4a; stroke-width: 1.5; stroke-dasharray: 6 4 }
      .arr { stroke: #5b6472; stroke-width: 1.3; fill: none }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
  </defs>
  <rect width="900" height="350" fill="#ffffff"/>

  <text x="16" y="26" class="t">A put streams: lengths and checksum first, then header and bodies, one chunk in memory.</text>

  <rect x="16" y="50" width="150" height="46" rx="3" class="io"/><text x="28" y="70" class="l">journal chunks</text><text x="28" y="86" class="s">offered bytes, stable</text>

  <rect x="200" y="42" width="300" height="30" rx="3" class="up"/><text x="212" y="62" class="l">LengthOf(n) per chunk: no encoding needed</text>
  <rect x="200" y="78" width="300" height="46" rx="3" class="opt"/><text x="212" y="96" class="h">measuring pass, only when needed</text><text x="212" y="113" class="s">encode, keep length and checksum, discard</text>
  <path d="M166,66 L198,58" class="arr" marker-end="url(#a)"/>
  <path d="M166,82 L198,98" class="arr" marker-end="url(#a)"/>

  <rect x="540" y="56" width="344" height="46" rx="3" class="up"/><text x="552" y="76" class="h">header: name, chunk hashes, offsets</text><text x="552" y="92" class="s">total length and checksum known before byte one</text>
  <path d="M500,58 L538,72" class="arr" marker-end="url(#a)"/>
  <path d="M500,100 L538,86" class="arr" marker-end="url(#a)"/>

  <rect x="200" y="150" width="684" height="40" rx="3" class="up"/>
  <text x="212" y="175" class="l">Put(name, stream, size, checksum): header, then each chunk encoded as it is sent</text>
  <path d="M712,102 L712,148" class="arr" marker-end="url(#a)"/>
  <path d="M91,96 L91,170 L198,170" class="arr" marker-end="url(#a)"/>

  <line x1="16" y1="214" x2="884" y2="214" class="line"/>
  <text x="16" y="208" class="s">the store contract</text>

  <rect x="200" y="232" width="684" height="40" rx="3" class="dn"/>
  <text x="212" y="257" class="l">remote store: one request, no copy of the body, with the integrity check its profile chose</text>
  <path d="M540,190 L540,230" class="arr" marker-end="url(#a)"/>

  <text x="16" y="302" class="l">Encoding is deterministic, so both passes produce the same bytes. A mismatch in transit is ErrCorrupt,</text>
  <text x="16" y="320" class="l">and the syncer's retry asks the journal for the chunks again and sends the same bytes once more.</text>
</svg>
