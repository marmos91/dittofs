<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.g{font-size:11px;fill:#4c8a58}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .am{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="384" fill="#ffffff"/>
  <text x="16" y="26" class="t">A shard's loss tells each kind of client to reclaim; a protocol node's loss tells none.</text>

  <rect x="24" y="48" width="210" height="200" rx="6" class="am"/>
  <text x="38" y="72" class="h">the shard of builds</text>
  <text x="38" y="92" class="l">primary fails over,</text>
  <text x="38" y="110" class="l">or restarts</text>
  <text x="38" y="140" class="h">new grace instance</text>
  <text x="38" y="160" class="s">anything but a reclaim:</text>
  <text x="38" y="176" class="m">NFS4ERR_GRACE</text>
  <text x="38" y="192" class="m">NLM4_DENIED_GRACE_PERIOD</text>
  <text x="38" y="224" class="s">every other shard serves</text>
  <text x="38" y="238" class="s">normally</text>

  <rect x="270" y="48" width="310" height="60" rx="5" class="pr"/>
  <text x="282" y="66" class="h">NFSv4.1 client</text>
  <text x="282" y="82" class="s">every SEQUENCE reply carries</text>
  <text x="282" y="98" class="m">SEQ4_STATUS_RESTART_RECLAIM_NEEDED</text>
  <rect x="270" y="118" width="310" height="60" rx="5" class="pr"/>
  <text x="282" y="136" class="h">NFSv4.0 client</text>
  <text x="282" y="152" class="m">RENEW: NFS4ERR_STALE_CLIENTID</text>
  <text x="282" y="168" class="s">lost shard's stateids: NFS4ERR_STALE_STATEID</text>
  <rect x="270" y="188" width="310" height="60" rx="5" class="pr"/>
  <text x="282" y="206" class="h">NLM host (NFSv3)</text>
  <text x="282" y="222" class="s">NSM state number raised, durably, first</text>
  <text x="282" y="238" class="s">SM_NOTIFY by UDP, from the floating address</text>

  <path d="M236,78 L266,78" class="ln"/><path d="M236,148 L266,148" class="ln"/><path d="M236,218 L266,218" class="ln"/>
  <path d="M582,78 L608,78" class="ln"/><path d="M582,148 L608,148" class="ln"/><path d="M582,218 L608,218" class="ln"/>

  <rect x="612" y="48" width="264" height="60" rx="5" class="sv"/>
  <text x="624" y="66" class="l">reclaims in every shard;</text>
  <text x="624" y="82" class="s">RECLAIM_COMPLETE closes reclaim</text>
  <text x="624" y="98" class="s">for this grace instance only</text>
  <rect x="612" y="118" width="264" height="60" rx="5" class="sv"/>
  <text x="624" y="136" class="l">repeats SETCLIENTID + confirm:</text>
  <text x="624" y="152" class="s">same client ID, marks cleared,</text>
  <text x="624" y="168" class="s">then reclaims</text>
  <rect x="612" y="188" width="264" height="60" rx="5" class="sv"/>
  <text x="624" y="206" class="l">statd reclaims its locks;</text>
  <text x="624" y="222" class="s">NLM never signals completion,</text>
  <text x="624" y="238" class="s">so the shard runs its whole grace</text>

  <rect x="24" y="276" width="852" height="60" rx="6" class="st"/>
  <text x="38" y="298" class="l">A protocol node's loss alone is not a restart: no open, lock or delegation is lost, no grace runs, no SM_NOTIFY is sent.</text>
  <text x="38" y="318" class="s">An NFSv4.1 client is answered NFS4ERR_BADSESSION and opens a new session under its client ID (§3.2).</text>

  <text x="16" y="366" class="s">A grace instance never repeats, on one node too: every start raises the incarnation of each shard it serves, so a single-node restart opens a new one.</text>
</svg>
