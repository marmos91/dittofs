<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:600;fill:#1b1f24}.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.env{fill:#f4f6f8;stroke:#9aa4b2;stroke-width:1.2}.c{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.3}.a{fill:#eaf4ec;stroke:#2f6f4f;stroke-width:1.3}
.p{fill:#ffffff;stroke:#1b1f24;stroke-width:1.1}.k{fill:#fbefd9;stroke:#a8741f;stroke-width:1.3}.r{fill:#f8e3e6;stroke:#a33a4d;stroke-width:1.3}
.ar{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#h)}.dash{stroke:#9aa4b2;stroke-width:1.1;stroke-dasharray:4 3;fill:none}
</style><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d444d"/></marker></defs>
<rect width="900" height="330" fill="#ffffff"/>
<text x="16" y="26" class="t">The chain runs in one fixed order; the envelope records what ran.</text>
<text x="16" y="46" class="s">Stages are fixed by code: compress, then encrypt, then redundancy. A stage may decline a chunk; a chain or envelope out of order is refused.</text>
<text x="16" y="84" class="h">Write</text>
<rect x="16" y="96" width="112" height="44" rx="3" class="p"/><text x="28" y="116" class="h">chunk</text><text x="28" y="131" class="s">hashed first</text>
<path d="M128 118H158" class="ar"/>
<rect x="160" y="96" width="140" height="44" rx="3" class="a"/><text x="172" y="116" class="h">1 compress</text><text x="172" y="131" class="s">declines if no gain</text>
<path d="M300 118H330" class="ar"/>
<rect x="332" y="96" width="140" height="44" rx="3" class="k"/><text x="344" y="116" class="h">2 encrypt</text><text x="344" y="131" class="s">GCM-SIV</text>
<path d="M472 118H502" class="ar"/>
<rect x="504" y="96" width="140" height="44" rx="3" class="c"/><text x="516" y="116" class="h">3 redundancy</text><text x="516" y="131" class="s">optional</text>
<path d="M644 118H674" class="ar"/>
<rect x="676" y="96" width="208" height="44" rx="3" class="env"/><text x="688" y="116" class="h">body</text><text x="688" y="131" class="m">envelope: v1 ‖ applied IDs</text>
<text x="16" y="184" class="h">Read</text>
<rect x="676" y="196" width="208" height="44" rx="3" class="env"/><text x="688" y="216" class="h">body</text><text x="688" y="231" class="s">envelope says what to undo</text>
<path d="M676 218H646" class="ar"/>
<rect x="332" y="196" width="312" height="44" rx="3" class="p"/><text x="344" y="216" class="h">undo the listed stages, in reverse</text><text x="344" y="231" class="s">registry lookup by ID; configuration not consulted</text>
<path d="M332 218H302" class="ar"/>
<rect x="16" y="196" width="284" height="44" rx="3" class="r"/><text x="28" y="216" class="h">check the plaintext hash</text><text x="28" y="231" class="s">this check, not any stage's own, decides</text>
<text x="16" y="276" class="l">Adding an algorithm registers a new transform ID in an existing stage; stored bodies keep their envelopes and stay readable.</text>
<text x="16" y="296" class="l">A stage that declined is absent from the envelope. An envelope listing stages out of order, twice, or unknown is malformed.</text>
</svg>
