<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .h  { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .io   { fill: #f4f6f8; stroke: #9aa4b2; stroke-width: 1.1 }
      .step { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .skip { fill: #ffffff; stroke: #9aa4b2; stroke-width: 1.2; stroke-dasharray: 5 4 }
      .chk  { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.3 }
      .arr  { stroke: #5b6472; stroke-width: 1.3; fill: none }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>

  <text x="16" y="26" class="t">The chain: configured order on write, the envelope's order on read.</text>
  <text x="16" y="46" class="s">Example chain: transform A, B, C. B declines this chunk (compression on incompressible data, say).</text>

  <text x="16" y="92" class="h">write</text>
  <rect x="70"  y="72" width="92"  height="34" rx="3" class="io"/><text x="86" y="93" class="l">chunk</text>
  <rect x="190" y="72" width="100" height="34" rx="3" class="chk"/><text x="202" y="93" class="l">hash taken</text>
  <rect x="318" y="72" width="80"  height="34" rx="3" class="step"/><text x="352" y="93" class="h">A</text>
  <rect x="426" y="72" width="80"  height="34" rx="3" class="skip"/><text x="438" y="93" class="l">B declines</text>
  <rect x="534" y="72" width="80"  height="34" rx="3" class="step"/><text x="568" y="93" class="h">C</text>
  <rect x="642" y="72" width="238" height="34" rx="3" class="io"/><text x="654" y="93" class="m">envelope [A, C] ‖ C(A(chunk))</text>
  <path d="M162,89 L188,89" class="arr" marker-end="url(#a)"/>
  <path d="M290,89 L316,89" class="arr" marker-end="url(#a)"/>
  <path d="M398,89 L424,89" class="arr" marker-end="url(#a)"/>
  <path d="M506,89 L532,89" class="arr" marker-end="url(#a)"/>
  <path d="M614,89 L640,89" class="arr" marker-end="url(#a)"/>

  <text x="16" y="182" class="h">read</text>
  <rect x="70"  y="162" width="238" height="34" rx="3" class="io"/><text x="82" y="183" class="m">envelope [A, C] ‖ body</text>
  <rect x="336" y="162" width="94"  height="34" rx="3" class="step"/><text x="352" y="183" class="l">undo C</text>
  <rect x="458" y="162" width="94"  height="34" rx="3" class="step"/><text x="474" y="183" class="l">undo A</text>
  <rect x="580" y="162" width="130" height="34" rx="3" class="chk"/><text x="592" y="183" class="l">hash checked</text>
  <rect x="738" y="162" width="92"  height="34" rx="3" class="io"/><text x="754" y="183" class="l">chunk</text>
  <path d="M308,179 L334,179" class="arr" marker-end="url(#a)"/>
  <path d="M430,179 L456,179" class="arr" marker-end="url(#a)"/>
  <path d="M552,179 L578,179" class="arr" marker-end="url(#a)"/>
  <path d="M710,179 L736,179" class="arr" marker-end="url(#a)"/>

  <text x="16" y="248" class="l">Reading follows the envelope, not the configuration: a body written before B was added, or after C was</text>
  <text x="16" y="266" class="l">removed, reads the same way. Material a transform needs (keys, dictionaries) comes from the store.</text>
  <text x="16" y="298" class="l">Any order reads back correctly, because every step is invertible and the plaintext hash decides at the end.</text>
  <text x="16" y="316" class="l">A poor order is only ineffective, and shows in each transform's metrics.</text>
  <text x="16" y="352" class="s">The syncer and the remote store see only the finished body; the chain runs inside the block codec.</text>
</svg>
