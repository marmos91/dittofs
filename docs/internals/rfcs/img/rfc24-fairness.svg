<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.k{font-size:11px;fill:#1b1f24}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .am{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .bd{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
    <rect width="900" height="400" fill="#ffffff"/>
  <text x="16" y="26" class="t">Turns across clients at the buffer pools; a cap per share at the service's admission.</text>
  <rect x="24" y="44" width="410" height="300" rx="8" class="zone"/>
  <text x="36" y="64" class="h">receive pool: turns by client address</text>
  <text x="36" y="80" class="s">one waiting reader per connection, one queue per address</text>
  <rect x="40" y="104" width="180" height="40" rx="5" class="pr"/>
  <text x="52" y="121" class="m">build01</text><text x="52" y="136" class="s">4 connections, 1 MiB writes</text>
  <path d="M222,124 L268,124 L268,124" class="ln"/>
  <rect x="40" y="158" width="180" height="40" rx="5" class="pr"/>
  <text x="52" y="175" class="m">alice-pc</text><text x="52" y="190" class="s">1 connection, 64 KiB writes</text>
  <path d="M222,178 L268,178 L268,178" class="ln"/>
  <rect x="40" y="212" width="180" height="40" rx="5" class="pr"/>
  <text x="52" y="229" class="m">bob-pc</text><text x="52" y="244" class="s">1 connection, GETATTR</text>
  <path d="M222,232 L268,232 L268,232" class="ln"/>
  <rect x="272" y="104" width="148" height="148" rx="6" class="sv"/>
  <text x="284" y="126" class="m">next free bytes</text>
  <text x="284" y="146" class="s">deficit round robin,</text>
  <text x="284" y="162" class="s">quantum: the largest</text>
  <text x="284" y="178" class="s">class, so each waiting</text>
  <text x="284" y="194" class="s">address is granted</text>
  <text x="284" y="210" class="s">once per round</text>
  <text x="284" y="230" class="k">build01 → alice-pc</text>
  <text x="284" y="245" class="k">→ bob-pc → build01 …</text>
  <text x="36" y="282" class="s">no address holds more than 3/4 of the pool while another waits;</text>
  <text x="36" y="298" class="s">alone on an idle node, one client may use all of it</text>
  <text x="36" y="324" class="s">a waiting reader holds no request: the socket stays unread</text>
  <rect x="452" y="44" width="424" height="300" rx="8" class="zone"/>
  <text x="464" y="64" class="h">reply pool past half full: the share cap</text>
  <text x="464" y="80" class="s">bytes of calls the service admitted, per share</text>
  <rect x="468" y="96" width="294" height="30" class="am"/>
  <rect x="762" y="96" width="70" height="30" class="sv"/>
  <rect x="468" y="96" width="392" height="30" fill="none" stroke="#5b6472" stroke-width="1.3"/>
  <text x="480" y="116" class="m">builds: 3/4 of the pool</text>
  <text x="768" y="116" class="m">profiles</text>
  <text x="468" y="142" class="s">cold reads on a hung remote, each holding a 1 MiB reply until its deadline</text>
  <rect x="468" y="164" width="170" height="40" rx="5" class="pr"/>
  <text x="480" y="181" class="m">build01 READ</text><text x="480" y="196" class="s">share builds</text>
  <path d="M640,184 L680,184" class="ex"/>
  <rect x="684" y="164" width="176" height="40" rx="5" class="bd"/>
  <text x="694" y="181" class="e">ErrDelay · DelayResources</text><text x="694" y="196" class="e">NFS3ERR_JUKEBOX, at once</text>
  <rect x="468" y="220" width="170" height="40" rx="5" class="pr"/>
  <text x="480" y="237" class="m">alice-pc WRITE</text><text x="480" y="252" class="s">share profiles</text>
  <path d="M640,240 L680,240" class="ln"/>
  <rect x="684" y="220" width="176" height="40" rx="5" class="sv"/>
  <text x="694" y="237" class="k">admitted</text><text x="694" y="252" class="s">the pool's last quarter is free</text>
  <text x="464" y="282" class="s">the refusal frees the call's buffers at once, and is never held</text>
  <text x="464" y="298" class="s">below half full the cap does not bind</text>
  <text x="464" y="324" class="s">below the service each share has its own rule already (RFC 1, 3, 8)</text>
  <text x="16" y="376" class="s">The receive pool cannot see shares: it is charged before the request is read. The share is known only at admission, so the cap lives there.</text>
</svg>
