<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" width="900" height="390" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}.meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
.data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}.ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
.p{fill:#ffffff;stroke:#1b1f24;stroke-width:1.1}.k{fill:#fbefd9;stroke:#a8741f;stroke-width:1.3}.r{fill:#f8e3e6;stroke:#a33a4d;stroke-width:1.3}
.a{fill:#eaf4ec;stroke:#2f6f4f;stroke-width:1.3}
.arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#h)}.dash{stroke:#a33a4d;stroke-width:1.2;stroke-dasharray:5 3;fill:none;marker-end:url(#h)}
.lane{stroke:#c3cad3;stroke-width:1;stroke-dasharray:3 3}
</style><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker></defs>
<rect width="900" height="390" fill="#ffffff"/>
<text x="16" y="26" class="t">A held extent: Dirty, offered, durable, released — and a fill brings it back clean and durable.</text>
<rect x="30" y="140" width="180" height="74" rx="5" class="r"/><text x="44" y="164" class="h">Dirty</text><text x="44" y="182" class="s">held only here;</text><text x="44" y="198" class="s">offloaded bit unset</text>
<rect x="250" y="140" width="180" height="74" rx="5" class="k"/><text x="264" y="164" class="h">Offered</text><text x="264" y="182" class="s">frozen in a pass's offer;</text><text x="264" y="198" class="s">still not evictable</text>
<rect x="470" y="140" width="180" height="74" rx="5" class="a"/><text x="484" y="164" class="h">Durable (held, clean)</text><text x="484" y="182" class="s">committed; bit set;</text><text x="484" y="198" class="s">evictable</text>
<rect x="690" y="140" width="180" height="74" rx="5" class="ext"/><text x="704" y="164" class="h">Released</text><text x="704" y="182" class="s">not held; resolves</text><text x="704" y="198" class="s">Remote on a read</text>
<path d="M210 168H248" class="arr"/><text x="212" y="160" class="s">offer</text>
<path d="M430 168H468" class="arr"/><text x="424" y="132" class="s">commit, then report</text>
<path d="M650 168H688" class="arr"/><text x="652" y="160" class="s">evict</text>
<path d="M340 216C340 262 120 262 120 218" class="dash"/><text x="140" y="276" class="s">pass failed or block not reported: back to Dirty</text>
<path d="M780 138C780 90 560 90 560 136" class="arr"/><text x="590" y="84" class="s">fill: a read's verified chunks, if FillPolicy says so</text>
<path d="M780 216C780 350 60 350 60 218" class="arr"/><text x="330" y="346" class="s">a write over any state stages a new Dirty version beside it</text>
<text x="16" y="372" class="s">Only Durable may be released, and only a commit makes an extent Durable. Nothing but durability decides eviction (§10.4).</text>
</svg>
