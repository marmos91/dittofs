<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <pattern id="gap" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f4f6f8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c3cad3" stroke-width="2"/>
    </pattern>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .held { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.5 }
      .none { fill: url(#gap); stroke: #9aa4b2; stroke-width: 1.1; stroke-dasharray: 4 3 }
      .tick { stroke: #9aa4b2; stroke-width: 1 }
      .why  { font-size: 11px; fill: #b04a4a }
    </style>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>

  <text x="16" y="26" class="t">A file's held extents are disjoint and need not be adjacent.</text>
  <text x="16" y="46" class="s">report.pdf — logical size 10 MiB. Scale: 65 px per MiB.</text>

  <g class="tick">
    <line x1="150" y1="72" x2="150" y2="86"/><line x1="280" y1="72" x2="280" y2="86"/>
    <line x1="410" y1="72" x2="410" y2="86"/><line x1="540" y1="72" x2="540" y2="86"/>
    <line x1="605" y1="72" x2="605" y2="86"/><line x1="670" y1="72" x2="670" y2="86"/>
    <line x1="800" y1="72" x2="800" y2="86"/>
  </g>
  <text x="144" y="68" class="m">0</text>
  <text x="270" y="68" class="m">2M</text>
  <text x="400" y="68" class="m">4M</text>
  <text x="530" y="68" class="m">6M</text>
  <text x="595" y="68" class="m">7M</text>
  <text x="660" y="68" class="m">8M</text>
  <text x="786" y="68" class="m">10M</text>

  <text x="16" y="112" class="rl">journal holds</text>
  <text x="16" y="128" class="s">3 extents, 5 MiB</text>
  <rect x="150" y="94" width="130" height="42" rx="3" class="held"/><text x="188" y="120" class="m">held</text>
  <rect x="280" y="94" width="130" height="42" rx="3" class="none"/>
  <rect x="410" y="94" width="130" height="42" rx="3" class="held"/><text x="448" y="120" class="m">held</text>
  <rect x="540" y="94" width="65"  height="42" rx="3" class="none"/>
  <rect x="605" y="94" width="65"  height="42" rx="3" class="held"/><text x="612" y="120" class="m">held</text>
  <rect x="670" y="94" width="130" height="42" rx="3" class="none"/>

  <text x="16" y="188" class="rl">ReadAt(0, 10 MiB)</text>
  <text x="16" y="204" class="s">returns</text>
  <rect x="150" y="168" width="650" height="34" rx="3" fill="#fbfcfd" stroke="#c3cad3"/>
  <text x="162" y="190" class="m">n = 5 MiB into p</text>
  <text x="330" y="190" class="m">missing = [2M,4M) [6M,7M) [8M,10M)</text>

  <text x="150" y="230" class="l">The bytes of p covering the missing extents are left untouched. They are not zeroed.</text>

  <line x1="16" y1="256" x2="884" y2="256" stroke="#c3cad3"/>
  <text x="16" y="282" class="rl">Why is each gap a gap?</text>

  <rect x="280" y="296" width="130" height="46" rx="3" class="none"/>
  <text x="288" y="316" class="why">never written</text>
  <text x="288" y="332" class="s">a hole — zeros</text>
  <rect x="540" y="296" width="65" height="46" rx="3" class="none"/>
  <text x="528" y="316" class="why">evicted</text>
  <text x="530" y="332" class="s">fetch it</text>
  <rect x="670" y="296" width="130" height="46" rx="3" class="none"/>
  <text x="678" y="316" class="why">bytes lost</text>
  <text x="678" y="332" class="s">read must fail</text>

  <text x="16" y="372" class="l">To the journal these three are the same observation: it does not hold the extent.</text>
  <text x="16" y="392" class="l">It reports the absence and makes no judgement — the engine resolves each against metadata.</text>
  <text x="16" y="414" class="s">This is why ReadAt reports missing extents instead of returning zeros: zeros would answer a question the journal cannot answer.</text>
</svg>
