<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}.meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
.data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}.ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
.p{fill:#ffffff;stroke:#1b1f24;stroke-width:1.1}.k{fill:#fbefd9;stroke:#a8741f;stroke-width:1.3}.r{fill:#f8e3e6;stroke:#a33a4d;stroke-width:1.3}
.a{fill:#eaf4ec;stroke:#2f6f4f;stroke-width:1.3}
.arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#h)}.dash{stroke:#a33a4d;stroke-width:1.2;stroke-dasharray:5 3;fill:none;marker-end:url(#hr)}
.lane{stroke:#c3cad3;stroke-width:1;stroke-dasharray:3 3}
.garr{stroke:#2f6f4f;stroke-width:1.6;fill:none;marker-end:url(#hg)}.line{stroke:#5b6472;stroke-width:1.3;fill:none}
.rt{font-size:11px;fill:#a33a4d}.gt{font-size:11px;fill:#2f6f4f}
.tail{fill:#ffffff;stroke:#9aa4b2;stroke-width:1;stroke-dasharray:3 2}
.cp{stroke:#1b1f24;stroke-width:2}.jp{stroke:#a8741f;stroke-width:1.6;stroke-dasharray:4 3}
</style><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker><marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a33a4d"/></marker><marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6f4f"/></marker></defs>
<rect width="900" height="620" fill="#ffffff"/>
<text x="16" y="26" class="t">Moving a namespace between installations: pre-seed, freeze, release, claim, drop.</text>
<rect x="155" y="44" width="190" height="30" rx="4" class="vfs"/>
<text x="250" y="64" class="h" text-anchor="middle">installation A</text>
<path d="M250 76V560" class="lane"/>
<rect x="420" y="44" width="200" height="30" rx="4" class="k"/>
<text x="520" y="64" class="h" text-anchor="middle">bucket · namespace folder</text>
<path d="M520 76V560" class="lane"/>
<rect x="675" y="44" width="190" height="30" rx="4" class="data"/>
<text x="770" y="64" class="h" text-anchor="middle">installation B</text>
<path d="M770 76V560" class="lane"/>
<rect x="14" y="84" width="872" height="118" rx="4" fill="#dce9f7" fill-opacity="0.45" stroke="none"/>
<text x="24" y="104" class="h">pre-seed</text>
<text x="24" y="120" class="s">A serves</text>
<rect x="14" y="208" width="872" height="150" rx="4" fill="#f8e3e6" fill-opacity="0.45" stroke="none"/>
<text x="24" y="228" class="h">freeze</text>
<text x="24" y="244" class="s">minutes</text>
<rect x="14" y="364" width="872" height="40" rx="4" fill="#fbefd9" fill-opacity="0.45" stroke="none"/>
<text x="24" y="384" class="h">release</text>
<rect x="14" y="410" width="872" height="106" rx="4" fill="#eaf4ec" fill-opacity="0.45" stroke="none"/>
<text x="24" y="430" class="h">claim</text>
<text x="24" y="446" class="s">B serves</text>
<rect x="14" y="522" width="872" height="36" rx="4" fill="#f9fafb" fill-opacity="0.45" stroke="none"/>
<text x="24" y="542" class="h">drop</text>
<text x="160" y="106" class="s">base cut per share; GC deletes</text>
<text x="160" y="120" class="s">paused; clients keep writing</text>
<path d="M252 150H766" class="arr"/>
<text x="262" y="145" class="s">move-base export: tree, refs, history, chunks, blocks</text>
<text x="680" y="176" class="s">staged; nothing published,</text>
<text x="680" y="190" class="s">nothing served</text>
<text x="160" y="230" class="s">pre-drain until dirty bytes are small;</text>
<text x="160" y="244" class="s">then state moving (durable): gates</text>
<text x="160" y="258" class="s">closed, drain dirty and held content;</text>
<text x="160" y="272" class="s">stop and join writers and GC</text>
<path d="M252 312H766" class="arr"/>
<text x="262" y="307" class="s">move-delta export: what changed since the base cuts</text>
<text x="680" y="336" class="s">staged on top of the base</text>
<path d="M252 390H516" class="arr"/>
<text x="262" y="385" class="s">claim: released, with the digest</text>
<text x="680" y="430" class="s">verify material, scope, FileIDs;</text>
<text x="680" y="444" class="s">recompute counts; publish</text>
<path d="M768 470H524" class="arr"/>
<text x="532" y="465" class="s">claim: owned by B, next epoch</text>
<text x="680" y="496" class="s">wait out A's claim checks, then serve;</text>
<text x="680" y="510" class="s">clients reconnect to B</text>
<text x="160" y="544" class="s">drop A's records; release nothing</text>
<rect x="425" y="236" width="190" height="48" rx="4" class="p"/>
<text x="435" y="254" class="s">blocks stay where they are;</text>
<text x="435" y="270" class="s">no block is ever copied</text>
<text x="16" y="586" class="l">The freeze covers only the delta and the drain: its length follows the changes since the base, not the namespace's size.</text>
<text x="16" y="604" class="s">Before release A may abort and reopen; after it, only an operator who knows B never published may send it back.</text>
</svg>
