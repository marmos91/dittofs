<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:13px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;fill:#1b1f24}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.4}
      .on{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.4}
      .dr{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4}
      .ln{stroke:#3d444d;stroke-width:1.4;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="16" y="26" class="t">The adapter's four states, and one connection's life inside "serving".</text>

  <text x="40" y="62" class="h">the adapter</text>
  <rect x="40" y="76" width="150" height="48" rx="6" class="st"/><text x="62" y="105" class="m">configured</text>
  <rect x="270" y="76" width="150" height="48" rx="6" class="on"/><text x="306" y="105" class="m">serving</text>
  <rect x="500" y="76" width="150" height="48" rx="6" class="dr"/><text x="530" y="105" class="m">draining</text>
  <rect x="730" y="76" width="140" height="48" rx="6" class="st"/><text x="764" y="105" class="m">stopped</text>
  <path d="M192,100 L266,100" class="ln"/><text x="206" y="92" class="s">start</text>
  <path d="M422,100 L496,100" class="ln"/><text x="440" y="92" class="s">stop</text>
  <path d="M652,100 L726,100" class="ln"/><text x="652" y="70" class="s">drained or</text><text x="652" y="84" class="s">deadline</text>
  <path d="M310,126 C300,160 390,160 380,126" class="ln"/><text x="296" y="170" class="s">reconfigure: add or drop a listener</text>

  <text x="40" y="146" class="s">settings checked;</text><text x="40" y="160" class="s">no socket open</text>
  <text x="500" y="146" class="s">no new connection; acks and flushes</text>
  <text x="500" y="160" class="s">served, others moved; admitted answered</text>
  <text x="730" y="146" class="s">state dropped;</text><text x="730" y="160" class="s">Disconnect per session</text>

  <line x1="40" y1="196" x2="860" y2="196" stroke="#d0d5db" stroke-width="1"/>

  <text x="40" y="226" class="h">one connection</text>
  <rect x="40" y="244" width="120" height="44" rx="6" class="st"/><text x="72" y="271" class="m">accept</text>
  <rect x="200" y="244" width="130" height="44" rx="6" class="st"/><text x="224" y="271" class="m">negotiate</text>
  <rect x="370" y="244" width="150" height="44" rx="6" class="st"/><text x="388" y="271" class="m">authenticate</text>
  <rect x="560" y="244" width="120" height="44" rx="6" class="on"/><text x="596" y="271" class="m">serve</text>
  <rect x="740" y="244" width="120" height="44" rx="6" class="st"/><text x="778" y="271" class="m">close</text>
  <path d="M162,266 L196,266" class="ln"/>
  <path d="M332,266 L366,266" class="ln"/>
  <path d="M522,266 L556,266" class="ln"/>
  <path d="M682,266 L736,266" class="ln"/>
  <path d="M600,290 C590,330 650,330 640,290" class="ln"/><text x="566" y="340" class="s">the pipeline, per request</text>

  <text x="40" y="312" class="s">counted against the</text><text x="40" y="326" class="s">node's connection limit</text>
  <text x="200" y="312" class="s">version / dialect;</text><text x="200" y="326" class="s">nothing else accepted</text>
  <text x="370" y="312" class="s">handshake → security context;</text><text x="370" y="326" class="s">no ID mapping here</text>
  <text x="740" y="312" class="s">client, idle, violation,</text><text x="740" y="326" class="s">drain or Revoked</text>

  <text x="40" y="372" class="l">The service learns of a client at Connect — not at accept. A connection is the adapter's; a client is the service's.</text>
</svg>
