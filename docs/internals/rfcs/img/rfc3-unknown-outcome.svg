<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:600;fill:#1b1f24}.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.env{fill:#f4f6f8;stroke:#9aa4b2;stroke-width:1.2}.c{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.3}.a{fill:#eaf4ec;stroke:#2f6f4f;stroke-width:1.3}
.p{fill:#ffffff;stroke:#1b1f24;stroke-width:1.1}.k{fill:#fbefd9;stroke:#a8741f;stroke-width:1.3}.r{fill:#f8e3e6;stroke:#a33a4d;stroke-width:1.3}
.ar{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#h)}.dash{stroke:#9aa4b2;stroke-width:1.1;stroke-dasharray:4 3;fill:none}
</style><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d444d"/></marker></defs>
<rect width="900" height="350" fill="#ffffff"/>
<text x="16" y="26" class="t">A put whose response was lost: retry within the attempt, or leave the object to its intent.</text>
<text x="16" y="46" class="s">The name is minted once per put attempt, and an intent for it is recorded before the put.</text>
<rect x="16" y="70" width="200" height="56" rx="3" class="p"/><text x="28" y="92" class="h">put name N</text><text x="28" y="110" class="s">response lost</text>
<path d="M216 98H254" class="ar"/>
<rect x="256" y="64" width="190" height="22" rx="3" class="env"/><text x="266" y="80" class="s">not stored</text>
<rect x="256" y="90" width="190" height="22" rx="3" class="env"/><text x="266" y="106" class="s">stored</text>
<rect x="256" y="116" width="190" height="22" rx="3" class="env"/><text x="266" y="132" class="s">still arriving</text>
<text x="256" y="156" class="s">indistinguishable to the caller</text>
<path d="M446 90C500 90 500 84 540 84" class="ar"/>
<rect x="542" y="64" width="342" height="44" rx="3" class="a"/><text x="554" y="84" class="h">same attempt: retry under N</text><text x="554" y="100" class="s">same plan, same bytes; converges to one object</text>
<path d="M446 120C500 120 500 160 540 160" class="ar"/>
<rect x="542" y="138" width="342" height="44" rx="3" class="k"/><text x="554" y="158" class="h">restart or re-offer: mint N′</text><text x="554" y="174" class="s">N is never put again; its intent names it</text>
<path d="M713 182V206" class="ar"/>
<rect x="542" y="208" width="342" height="44" rx="3" class="r"/><text x="554" y="228" class="h">N's intent is abandoned, N deleted</text><text x="554" y="244" class="s">once its owner epoch is superseded; no listing needed</text>
<text x="16" y="296" class="l">Only a commit that finds N's intent and deletes it creates N's block record, so an abandoned N can never become durable.</text>
<text x="16" y="316" class="l">A delete of N that lands late reaches nothing: N is never put again once it could be deleted.</text>
</svg>
