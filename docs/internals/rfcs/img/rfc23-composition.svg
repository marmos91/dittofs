<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#1b1f24}.s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.4;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="16" y="26" class="t">A node starts bottom-up and stops top-down; the API outlives the adapters it reports on.</text>

  <text x="44" y="54" class="h">start, step</text>
  <text x="726" y="54" class="h">stop, step</text>

  <path d="M30,440 L30,66" class="ln"/>
  <path d="M874,66 L874,440" class="ln"/>

  <rect x="200" y="64" width="500" height="44" rx="6" class="pr"/>
  <text x="214" y="83" class="l">adapters: configured → serving</text>
  <text x="214" y="99" class="s">protocol role · readiness turns true when all are serving</text>
  <text x="44" y="90" class="s">5 · adapters last</text>
  <text x="726" y="83" class="s">1 readiness false</text>
  <text x="726" y="99" class="s">2 drain and stop</text>

  <rect x="200" y="120" width="500" height="44" rx="6" class="pr"/>
  <text x="214" y="146" class="l">router · filesystem service</text>
  <text x="44" y="146" class="s">5 · protocol role</text>
  <text x="726" y="146" class="s">2 after the adapters</text>

  <rect x="200" y="176" width="500" height="44" rx="6" class="sv"/>
  <text x="214" y="195" class="l">operation runner · management API</text>
  <text x="214" y="211" class="s">storage role · the runner resumes the operations it holds</text>
  <text x="44" y="202" class="s">4 · storage role</text>
  <text x="726" y="195" class="s">3 API stops</text>
  <text x="726" y="211" class="s">4 runner releases claims</text>

  <rect x="200" y="232" width="500" height="44" rx="6" class="sv"/>
  <text x="214" y="251" class="l">shard placement · content subsystem · a context per share</text>
  <text x="214" y="267" class="s">in RFC 8's order</text>
  <text x="44" y="258" class="s">4 · storage role</text>
  <text x="726" y="251" class="s">5 hand shards over,</text>
  <text x="726" y="267" class="s">join, close</text>

  <rect x="200" y="288" width="500" height="44" rx="6" class="sv"/>
  <text x="214" y="307" class="l">runtime: load</text>
  <text x="214" y="323" class="s">node record and versions · generations · provisioning file</text>
  <text x="44" y="314" class="s">3</text>

  <rect x="200" y="344" width="500" height="44" rx="6" class="st"/>
  <text x="214" y="363" class="l">metadata store</text>
  <text x="214" y="379" class="s">health endpoints answer from here: live, not ready</text>
  <text x="44" y="370" class="s">2</text>
  <text x="726" y="370" class="s">6 closes last</text>

  <rect x="200" y="400" width="500" height="44" rx="6" class="bad"/>
  <text x="214" y="419" class="l">refuse what cannot work</text>
  <text x="214" y="435" class="e">a start creates nothing</text>
  <text x="44" y="426" class="s">1</text>
</svg>
