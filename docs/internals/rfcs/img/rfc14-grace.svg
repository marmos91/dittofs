<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a58"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.ok{font-size:11px;font-weight:600;fill:#4c8a58}
      .no{font-size:12px;font-weight:700;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.4}
      .dr{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .gl{stroke:#4c8a58;stroke-width:1.8;fill:none;marker-end:url(#g)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .life{stroke:#9aa3ad;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="16" y="26" class="t">(cluster) N1 takes shard A's table with it: only A runs grace, and each recorded client is told to reclaim.</text>

  <path d="M180,50 L180,320" class="zone"/><path d="M290,50 L290,320" class="zone"/><path d="M700,50 L700,320" class="zone"/>
  <path d="M860,50 L860,128" class="zone"/>
  <text x="180" y="46" class="s" text-anchor="middle">N1 dies</text>
  <text x="296" y="46" class="s">N2 serves A: incarnation raised, a new grace instance</text>
  <text x="700" y="46" class="s" text-anchor="middle">grace ends early</text>
  <text x="860" y="46" class="s" text-anchor="middle">cap: 90 s</text>

  <text x="16" y="70" class="h">N1, primary of A</text>
  <rect x="150" y="58" width="30" height="20" rx="3" class="sv"/>
  <path d="M174,62 L186,74 M186,62 L174,74" stroke="#b04a4a" stroke-width="2"/>
  <text x="300" y="72" class="e">its table was in memory, so it is lost</text>

  <text x="16" y="116" class="h">N2, new primary</text>
  <path d="M150,112 L290,112" class="life"/>
  <rect x="290" y="102" width="410" height="20" rx="3" class="dr"/>
  <text x="300" y="116" class="h">grace for A: only reclaims are granted</text>
  <rect x="700" y="102" width="180" height="20" rx="3" class="sv"/>
  <text x="710" y="116" class="ok">granting</text>
  <text x="300" y="138" class="s">begins only after N1's node lease has lapsed, plus the drift bound</text>

  <text x="16" y="162" class="h">shard B's primary</text>
  <rect x="150" y="150" width="730" height="20" rx="3" class="sv"/>
  <text x="300" y="164" class="ok">keeps granting throughout: grace is per shard</text>

  <text x="16" y="218" class="h">alice-pc (SMB)</text>
  <path d="M150,214 L880,214" class="life"/>
  <circle cx="300" cy="214" r="4" fill="#3d444d"/>
  <text x="308" y="206" class="s">connection broken</text>
  <circle cx="440" cy="214" r="4" fill="#4c8a58"/>
  <text x="448" y="206" class="ok">reconnects, reclaims its persistent open</text>

  <text x="16" y="262" class="h">build01 (NFSv4.1)</text>
  <path d="M150,258 L880,258" class="life"/>
  <circle cx="300" cy="258" r="4" fill="#3d444d"/>
  <text x="308" y="250" class="s">next SEQUENCE: reclaim needed</text>
  <circle cx="495" cy="258" r="4" fill="#4c8a58"/>
  <text x="503" y="250" class="ok">reclaims, RECLAIM_COMPLETE</text>

  <text x="16" y="306" class="h">another client</text>
  <path d="M150,302 L880,302" class="life"/>
  <circle cx="330" cy="302" r="4" fill="#b04a4a"/>
  <text x="338" y="294" class="e">new LOCK: ErrGrace</text>
  <circle cx="720" cy="302" r="4" fill="#4c8a58"/>
  <text x="728" y="294" class="ok">retry: granted</text>

  <rect x="24" y="336" width="420" height="96" rx="6" class="dr"/>
  <text x="36" y="355" class="h">How each client is told to reclaim</text>
  <text x="36" y="372" class="s">NFSv4.1: ClientStatus.ReclaimNeeded, next reply</text>
  <text x="36" y="387" class="s">NFSv4.0: ErrStaleClient until it confirms again</text>
  <text x="36" y="402" class="s">SMB: connection broken; RFC 21 and RFC 22 spell each</text>
  <text x="36" y="417" class="s">NLM: restart notice after the NSM number rises</text>

  <rect x="456" y="336" width="420" height="96" rx="6" class="pr"/>
  <text x="468" y="355" class="h">When grace ends</text>
  <text x="468" y="372" class="s">Early, once every client its records name has finished:</text>
  <text x="468" y="387" class="s">NFSv4.1 by RECLAIM_COMPLETE, SMB by reconnecting or</text>
  <text x="468" y="402" class="s">letting each Timeout pass. An NFSv4.0 client or NLM host</text>
  <text x="468" y="417" class="s">never finishes, so then grace runs the full 90 s.</text>

  <text x="16" y="454" class="s">Only a loss runs grace: a handover or a batch move ships the table, keeps the grace instance and tells no client (§10).</text>
</svg>
