<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .wn{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="530" fill="#ffffff"/>
  <text x="16" y="26" class="t">A DittoCluster puts each tier in its own Kubernetes shape; the operator owns only the two pools.</text>

  <rect x="400" y="44" width="320" height="28" rx="5" class="pr"/>
  <text x="560" y="62" class="h" text-anchor="middle">clients: NFS and SMB</text>
  <path d="M560,74 L560,90" class="ln"/>
  <rect x="330" y="92" width="460" height="40" rx="5" class="pr"/>
  <text x="342" y="108" class="h">client addressing — one mode per cluster</text>
  <text x="342" y="124" class="s">service: a LoadBalancer VIP · floatingIPs: addresses the operator moves</text>
  <path d="M560,134 L560,148" class="ln"/>

  <rect x="20" y="92" width="196" height="358" rx="6" class="wn"/>
  <text x="32" y="112" class="h">DittoCluster</text>
  <text x="32" y="128" class="s">the resource the operator</text>
  <text x="32" y="142" class="s">reconciles</text>
  <text x="32" y="170" class="m">metadataStore</text>
  <text x="32" y="184" class="s">address + credential Secret</text>
  <text x="32" y="210" class="m">bucket</text>
  <text x="32" y="224" class="s">endpoint + credential Secret</text>
  <text x="32" y="250" class="m">protocol</text>
  <text x="32" y="264" class="s">min, max, resources,</text>
  <text x="32" y="278" class="s">placement, autoscaling target</text>
  <text x="32" y="304" class="m">storage</text>
  <text x="32" y="318" class="s">size, journal volume class</text>
  <text x="32" y="332" class="s">and size, failure-domain</text>
  <text x="32" y="346" class="s">label, scaling policy</text>
  <text x="32" y="372" class="m">addressing</text>
  <text x="32" y="386" class="s">service or floatingIPs</text>
  <text x="32" y="414" class="s">lease, dwell, replica count:</text>
  <text x="32" y="428" class="s">store settings, not fields</text>
  <path d="M216,200 L238,200" class="ln"/>
  <path d="M216,380 L238,380" class="ln"/>

  <rect x="240" y="150" width="640" height="100" rx="8" class="zone"/>
  <text x="252" y="168" class="h">Deployment: protocol pool — at least 2 pods, scaled by an HPA</text>
  <text x="252" y="182" class="s">no file state, no persistent volume, no bucket credential; spread across failure domains</text>
  <rect x="256" y="194" width="130" height="40" rx="5" class="pr"/><text x="321" y="218" class="m" text-anchor="middle">protocol pod</text>
  <rect x="404" y="194" width="130" height="40" rx="5" class="pr"/><text x="469" y="218" class="m" text-anchor="middle">protocol pod</text>
  <rect x="552" y="194" width="130" height="40" rx="5" class="pr"/><text x="617" y="218" class="m" text-anchor="middle">protocol pod</text>
  <rect x="700" y="194" width="130" height="40" rx="5" class="pr"/><text x="765" y="218" class="m" text-anchor="middle">protocol pod</text>

  <path d="M440,252 L440,288" class="ln"/>
  <text x="450" y="274" class="s">node channel: gRPC over mTLS</text>
  <path d="M774,252 L774,288" class="ln"/>

  <rect x="240" y="290" width="400" height="180" rx="8" class="zone"/>
  <text x="252" y="308" class="h">StatefulSet: storage pool</text>
  <text x="252" y="322" class="s">PDB maxUnavailable: 1 · Parallel · one pod per host</text>
  <rect x="254" y="332" width="116" height="100" rx="5" class="sv"/>
  <text x="312" y="350" class="m" text-anchor="middle">storage pod</text>
  <rect x="262" y="360" width="100" height="62" rx="4" class="st"/>
  <text x="270" y="376" class="s">journal volume</text><text x="270" y="392" class="s">local NVMe</text><text x="270" y="408" class="s">node ID + cert</text>
  <rect x="382" y="332" width="116" height="100" rx="5" class="sv"/>
  <text x="440" y="350" class="m" text-anchor="middle">storage pod</text>
  <rect x="390" y="360" width="100" height="62" rx="4" class="st"/>
  <text x="398" y="376" class="s">journal volume</text><text x="398" y="392" class="s">local NVMe</text><text x="398" y="408" class="s">node ID + cert</text>
  <rect x="510" y="332" width="116" height="100" rx="5" class="sv"/>
  <text x="568" y="350" class="m" text-anchor="middle">storage pod</text>
  <rect x="518" y="360" width="100" height="62" rx="4" class="st"/>
  <text x="526" y="376" class="s">journal volume</text><text x="526" y="392" class="s">local NVMe</text><text x="526" y="408" class="s">node ID + cert</text>
  <text x="252" y="454" class="s">spread by the failure-domain label; each node's setting equals it</text>

  <path d="M642,325 L662,325" class="ln"/>
  <rect x="664" y="290" width="216" height="76" rx="6" class="st"/>
  <text x="676" y="308" class="h">metadata store</text>
  <text x="676" y="324" class="s">replicated, under its own operator</text>
  <text x="676" y="340" class="s">referenced, never owned</text>
  <text x="676" y="356" class="s">credential on every pod</text>
  <path d="M642,420 L662,420" class="ln"/>
  <rect x="664" y="390" width="216" height="60" rx="6" class="st"/>
  <text x="676" y="408" class="h">bucket</text>
  <text x="676" y="424" class="s">outside the cluster</text>
  <text x="676" y="440" class="s">credential on storage pods only</text>

  <text x="16" y="496" class="l">Protocol pods hold nothing and come and go. A storage pod is its volume: a fresh volume is a new node.</text>
  <text x="16" y="516" class="s">Ready is false while either pool has no live pod or the metadata store is unreachable.</text>
</svg>
