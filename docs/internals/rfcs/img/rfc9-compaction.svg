<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
      .ada{fill:#eceff2;stroke:#9aa4b2;stroke-width:1.2}
      .vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}
      .meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
      .data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}
      .ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
      .live{fill:#8cc79a;stroke:#4c8a58;stroke-width:1}
      .dead{fill:#e3e6ea;stroke:#b3bac4;stroke-width:1}
      .role{font-size:11px;font-weight:700;fill:#5b6472;letter-spacing:.04em}
      .arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6472"/></marker>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="16" y="26" class="t">Compaction reads only live chunks, puts one new block, and its move retires the sources.</text>

  <!-- sources -->
  <text x="20" y="52" class="role">SOURCES · 12 MiB STORED, 1.7 MiB LIVE</text>
  <rect x="20" y="60" width="276" height="66" rx="5" class="ext"/>
  <text x="32" y="80" class="h">B1 · 4 MiB · live 2 of 12</text>
  <g transform="translate(32,92)">
    <rect x="0" y="0" width="18" height="18" class="dead"/><rect x="21" y="0" width="18" height="18" class="live"/><rect x="42" y="0" width="18" height="18" class="dead"/><rect x="63" y="0" width="18" height="18" class="dead"/><rect x="84" y="0" width="18" height="18" class="dead"/><rect x="105" y="0" width="18" height="18" class="dead"/><rect x="126" y="0" width="18" height="18" class="dead"/><rect x="147" y="0" width="18" height="18" class="live"/><rect x="168" y="0" width="18" height="18" class="dead"/><rect x="189" y="0" width="18" height="18" class="dead"/><rect x="210" y="0" width="18" height="18" class="dead"/><rect x="231" y="0" width="18" height="18" class="dead"/>
  </g>
  <rect x="312" y="60" width="276" height="66" rx="5" class="ext"/>
  <text x="324" y="80" class="h">B2 · 4 MiB · live 2 of 12</text>
  <g transform="translate(324,92)">
    <rect x="0" y="0" width="18" height="18" class="dead"/><rect x="21" y="0" width="18" height="18" class="dead"/><rect x="42" y="0" width="18" height="18" class="dead"/><rect x="63" y="0" width="18" height="18" class="live"/><rect x="84" y="0" width="18" height="18" class="dead"/><rect x="105" y="0" width="18" height="18" class="dead"/><rect x="126" y="0" width="18" height="18" class="dead"/><rect x="147" y="0" width="18" height="18" class="dead"/><rect x="168" y="0" width="18" height="18" class="dead"/><rect x="189" y="0" width="18" height="18" class="live"/><rect x="210" y="0" width="18" height="18" class="dead"/><rect x="231" y="0" width="18" height="18" class="dead"/>
  </g>
  <rect x="604" y="60" width="276" height="66" rx="5" class="ext"/>
  <text x="616" y="80" class="h">B3 · 4 MiB · live 3 of 12</text>
  <g transform="translate(616,92)">
    <rect x="0" y="0" width="18" height="18" class="live"/><rect x="21" y="0" width="18" height="18" class="dead"/><rect x="42" y="0" width="18" height="18" class="dead"/><rect x="63" y="0" width="18" height="18" class="dead"/><rect x="84" y="0" width="18" height="18" class="live"/><rect x="105" y="0" width="18" height="18" class="dead"/><rect x="126" y="0" width="18" height="18" class="dead"/><rect x="147" y="0" width="18" height="18" class="dead"/><rect x="168" y="0" width="18" height="18" class="dead"/><rect x="189" y="0" width="18" height="18" class="dead"/><rect x="210" y="0" width="18" height="18" class="live"/><rect x="231" y="0" width="18" height="18" class="dead"/>
  </g>

  <path d="M158,128 L158,158" class="arr"/>
  <path d="M450,128 L450,158" class="arr"/>
  <path d="M742,128 L742,158" class="arr"/>

  <!-- steps -->
  <text x="20" y="152" class="role">COMPACTOR</text>
  <rect x="20" y="160" width="164" height="92" rx="5" class="vfs"/>
  <text x="32" y="180" class="h">1 · plan</text>
  <text x="32" y="198" class="s">compaction index ranks</text>
  <text x="32" y="213" class="s">B1, B2, B3; LiveChunks</text>
  <text x="32" y="228" class="s">yields 7 records</text>
  <text x="32" y="243" class="s">nothing written</text>

  <rect x="194" y="160" width="164" height="92" rx="5" class="data"/>
  <text x="206" y="180" class="h">2 · ranged reads</text>
  <text x="206" y="198" class="s">one GET per live chunk</text>
  <text x="206" y="213" class="s">via the syncer flow,</text>
  <text x="206" y="228" class="s">verified by the codec</text>
  <text x="206" y="243" class="s">1.7 MiB read, not 12</text>

  <rect x="368" y="160" width="164" height="92" rx="5" class="meta"/>
  <text x="380" y="180" class="h">3–4 · assemble, mint</text>
  <text x="380" y="198" class="s">7 chunks into target T</text>
  <text x="380" y="213" class="s">mint T from a fresh nonce</text>
  <text x="380" y="228" class="s">record put intent I(T)</text>
  <text x="380" y="243" class="s">under its shard epoch</text>

  <rect x="542" y="160" width="164" height="92" rx="5" class="data"/>
  <text x="554" y="180" class="h">5 · one put</text>
  <text x="554" y="198" class="s">whole block T, current</text>
  <text x="554" y="213" class="s">transform chain</text>
  <text x="554" y="228" class="s">no multipart,</text>
  <text x="554" y="243" class="s">no server-side copy</text>

  <rect x="716" y="160" width="164" height="92" rx="5" class="meta"/>
  <text x="728" y="180" class="h">6 · move, one txn</text>
  <text x="728" y="198" class="s">consume I(T)</text>
  <text x="728" y="213" class="s">repoint 7 chunk records</text>
  <text x="728" y="228" class="s">live: T = 7, B1–B3 = 0</text>
  <text x="728" y="243" class="s">B1–B3 retired here</text>

  <path d="M185,206 L192,206" class="arr"/>
  <path d="M359,206 L366,206" class="arr"/>
  <path d="M533,206 L540,206" class="arr"/>
  <path d="M707,206 L714,206" class="arr"/>

  <!-- result -->
  <path d="M798,254 L798,284" class="arr"/>
  <path d="M624,254 L624,270 L170,270 L170,284" class="arr"/>

  <text x="20" y="280" class="role">RESULT</text>
  <rect x="20" y="288" width="300" height="70" rx="5" class="data"/>
  <text x="32" y="308" class="h">T · 1.7 MiB · live 7 of 7</text>
  <g transform="translate(32,320)">
    <rect x="0" y="0" width="18" height="18" class="live"/><rect x="21" y="0" width="18" height="18" class="live"/><rect x="42" y="0" width="18" height="18" class="live"/><rect x="63" y="0" width="18" height="18" class="live"/><rect x="84" y="0" width="18" height="18" class="live"/><rect x="105" y="0" width="18" height="18" class="live"/><rect x="126" y="0" width="18" height="18" class="live"/>
  </g>
  <text x="200" y="334" class="s">refs unchanged</text>

  <rect x="716" y="288" width="164" height="70" rx="5" class="ext"/>
  <text x="728" y="308" class="h">7 · trash (§3.7)</text>
  <text x="728" y="326" class="s">dead records keep B1–B3</text>
  <text x="728" y="341" class="s">until not_before</text>

  <path d="M715,323 L682,323" class="arr"/>
  <rect x="518" y="288" width="164" height="70" rx="5" class="ext"/>
  <text x="530" y="308" class="h">deleter</text>
  <text x="530" y="326" class="s">verify CR empty, then</text>
  <text x="530" y="341" class="s">batch delete, prune</text>

  <path d="M517,323 L484,323" class="arr"/>
  <rect x="340" y="288" width="144" height="70" rx="5" class="ext"/>
  <text x="352" y="308" class="h">remote bytes</text>
  <text x="352" y="326" class="s">12 MiB → 1.7 MiB</text>
  <text x="352" y="341" class="s">once B1–B3 are gone</text>

  <!-- legend and notes -->
  <rect x="20" y="384" width="14" height="14" class="live"/>
  <text x="42" y="396" class="l">live chunk: refcount &gt; 0, read and moved</text>
  <rect x="330" y="384" width="14" height="14" class="dead"/>
  <text x="352" y="396" class="l">dead chunk: refcount 0, never read</text>
  <text x="20" y="428" class="s">The compactor deletes nothing; its move retires the sources. A crash before step 6 leaves an intent, and the abandoned target is collected (§5);</text>
  <text x="20" y="446" class="s">a crash after it leaves B1–B3 retired, like any block. A reader holding B2 re-resolves the chunk to T (§4.3).</text>
</svg>
