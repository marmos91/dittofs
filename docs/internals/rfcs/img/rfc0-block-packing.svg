<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 478" width="900" height="478" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .h  { font-size: 13px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .ok   { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
      .over { fill: #d7ecd9; stroke: #4c8a58; stroke-width: 1.4 }
      .bad  { fill: #f8dcdc; stroke: #b04a4a; stroke-width: 1.4 }
      .tgt  { stroke: #b04a4a; stroke-width: 1.4; stroke-dasharray: 5 4 }
      .brace{ stroke: #5b6472; stroke-width: 1.2; fill: none }
      .good { font-size: 20px; font-weight: 700; fill: #4c8a58 }
      .no   { font-size: 20px; font-weight: 700; fill: #b04a4a }
    </style>
  </defs>
  <rect width="900" height="478" fill="#ffffff"/>

  <text x="16" y="26" class="t">A block ends at a chunk boundary. It overshoots the target rather than splitting a chunk.</text>

  <!-- ============ panel A ============ -->
  <text x="16" y="62" class="h">What happens</text>
  <text x="16" y="80" class="s">chunks are appended until the running total reaches the target</text>

  <!-- scale: 1 MiB = 62px, origin x=60 -->
  <line x1="60" y1="150" x2="60" y2="176" stroke="#9aa4b2"/>
  <text x="52" y="192" class="m">0</text>
  <line x1="556" y1="96" x2="556" y2="182" class="tgt"/>
  <text x="520" y="92" class="s" fill="#b04a4a">target 8 MiB</text>

  <rect x="60"  y="108" width="192" height="42" rx="3" class="ok"/>
  <text x="70"  y="126" class="m">a91f…</text><text x="70" y="142" class="s">3.1 MiB</text>
  <rect x="252" y="108" width="74"  height="42" rx="3" class="ok"/>
  <text x="260" y="126" class="m">7c02…</text><text x="260" y="142" class="s">1.2</text>
  <rect x="326" y="108" width="149" height="42" rx="3" class="ok"/>
  <text x="336" y="126" class="m">3b44…</text><text x="336" y="142" class="s">2.4 MiB</text>
  <rect x="475" y="108" width="180" height="42" rx="3" class="over"/>
  <text x="485" y="126" class="m">e5d8…</text><text x="485" y="142" class="s">2.9 MiB — crosses the target</text>

  <!-- brace for the block -->
  <path d="M60,162 L60,170 L655,170 L655,162" class="brace"/>
  <text x="290" y="188" class="l">one block — 9.6 MiB</text>
  <text x="663" y="134" class="good">✓</text>
  <text x="663" y="174" class="s">overshoot</text>
  <text x="663" y="188" class="s">1.6 MiB</text>

  <text x="60" y="216" class="l">The fourth chunk began below the target, so it goes in. The block closes after it, whole.</text>

  <line x1="16" y1="240" x2="884" y2="240" stroke="#c3cad3"/>

  <!-- ============ panel B ============ -->
  <text x="16" y="270" class="h">What is forbidden</text>
  <text x="16" y="288" class="s">cutting the crossing chunk at exactly 8 MiB to make the block an exact size</text>

  <line x1="556" y1="304" x2="556" y2="390" class="tgt"/>

  <rect x="60"  y="316" width="192" height="42" rx="3" class="ok"/>
  <text x="70"  y="334" class="m">a91f…</text><text x="70" y="350" class="s">3.1 MiB</text>
  <rect x="252" y="316" width="74"  height="42" rx="3" class="ok"/>
  <text x="260" y="334" class="m">7c02…</text><text x="260" y="350" class="s">1.2</text>
  <rect x="326" y="316" width="149" height="42" rx="3" class="ok"/>
  <text x="336" y="334" class="m">3b44…</text><text x="336" y="350" class="s">2.4 MiB</text>
  <rect x="475" y="316" width="81"  height="42" rx="3" class="bad"/>
  <text x="483" y="334" class="m">e5d8</text><text x="483" y="350" class="s">1.3</text>
  <rect x="556" y="316" width="99"  height="42" rx="3" class="bad"/>
  <text x="564" y="334" class="m">…8 (rest)</text><text x="564" y="350" class="s">1.6</text>

  <path d="M60,370 L60,378 L556,378 L556,370" class="brace"/>
  <text x="240" y="394" class="l">block 1 — exactly 8 MiB</text>
  <path d="M556,370 L556,378 L655,378 L655,370" class="brace"/>
  <text x="570" y="394" class="l">block 2 …</text>
  <text x="663" y="342" class="no">✗</text>

  <text x="60" y="424" class="l">One chunk would then live in two blocks, and three things break:</text>
  <text x="76" y="442" class="s">its hash would address content that is in two places, so one hash is no longer one locator;</text>
  <text x="76" y="458" class="s">reading it would need two GETs; and a refcount would have to track parts of a chunk rather than the chunk.</text>
</svg>
