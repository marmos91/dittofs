<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .why  { font-size: 11px; fill: #b04a4a }
      .ok   { font-size: 11px; font-weight: 600; fill: #2f6f4f }
      .pt { fill: #eaf4ec; stroke: #2f6f4f; stroke-width: 1.4 }
      .tr { fill: #dce9f7; stroke: #4a7fb5; stroke-width: 1.4 }
    </style>
    <marker id="a8t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="900" height="424" fill="#ffffff"/>

  <text x="16" y="26" class="t">Identity is taken before the chain, and checked after it is undone.</text>
  <text x="16" y="46" class="s">The chain may be empty, one layer, or several. Nothing above the contract can tell which.</text>

  <text x="16" y="100" class="rl">write</text>
  <rect x="96"  y="82" width="128" height="34" rx="3" class="pt"/><text x="112" y="104" class="m">plaintext</text>
  <line x1="224" y1="99" x2="256" y2="99" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a8t)"/>
  <rect x="260" y="82" width="120" height="34" rx="3" class="tr"/><text x="276" y="104" class="m">compress</text>
  <line x1="380" y1="99" x2="412" y2="99" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a8t)"/>
  <rect x="416" y="82" width="120" height="34" rx="3" class="tr"/><text x="432" y="104" class="m">encrypt</text>
  <line x1="536" y1="99" x2="568" y2="99" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a8t)"/>
  <rect x="572" y="82" width="150" height="34" rx="3" class="tr"/><text x="588" y="104" class="m">body of a record</text>

  <path d="M160,116 L160,140 L300,140" fill="none" stroke="#2f6f4f" stroke-width="1.6" marker-end="url(#a8t)"/>
  <rect x="304" y="126" width="180" height="30" rx="3" class="pt"/><text x="320" y="146" class="m">hash, and the key</text>
  <text x="496" y="146" class="ok">taken here &#8212; over plaintext, before any layer</text>

  <text x="16" y="212" class="rl">read</text>
  <rect x="96"  y="194" width="150" height="34" rx="3" class="tr"/><text x="112" y="216" class="m">body of a record</text>
  <line x1="246" y1="211" x2="278" y2="211" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a8t)"/>
  <rect x="282" y="194" width="120" height="34" rx="3" class="tr"/><text x="298" y="216" class="m">decrypt</text>
  <line x1="402" y1="211" x2="434" y2="211" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a8t)"/>
  <rect x="438" y="194" width="130" height="34" rx="3" class="tr"/><text x="454" y="216" class="m">decompress</text>
  <line x1="568" y1="211" x2="600" y2="211" stroke="#5b6472" stroke-width="1.4" marker-end="url(#a8t)"/>
  <rect x="604" y="194" width="128" height="34" rx="3" class="pt"/><text x="620" y="216" class="m">plaintext</text>

  <path d="M668,228 L668,250 L432,250" fill="none" stroke="#2f6f4f" stroke-width="1.6" marker-end="url(#a8t)"/>
  <text x="96" y="278" class="ok">compared against the hash the caller supplied &#8212; no byte is returned before it matches</text>

  <line x1="16" y1="302" x2="884" y2="302" stroke="#c3cad3"/>
  <text x="16" y="326" class="rl">Why identity cannot be taken one step later</text>
  <text x="16" y="348" class="l">A hash over transformed bytes depends on the compression level, the encryption key and the library version.</text>
  <text x="16" y="366" class="l">Identical content would stop sharing a key, deduplication would silently stop working, and changing a setting</text>
  <text x="16" y="384" class="l">would re-key the corpus.</text>
  <text x="16" y="412" class="why">The two halves are written in different places and will drift unless the equality &#8212; read(get(seal(x))) == x &#8212; is pinned by a test.</text>
</svg>
