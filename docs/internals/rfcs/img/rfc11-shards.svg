<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 562" width="900" height="562" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}.meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
.data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}.ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
.p{fill:#ffffff;stroke:#1b1f24;stroke-width:1.1}.k{fill:#fbefd9;stroke:#a8741f;stroke-width:1.3}.r{fill:#f8e3e6;stroke:#a33a4d;stroke-width:1.3}
.a{fill:#eaf4ec;stroke:#2f6f4f;stroke-width:1.3}
.arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#h)}.dash{stroke:#a33a4d;stroke-width:1.2;stroke-dasharray:5 3;fill:none;marker-end:url(#hr)}
.lane{stroke:#c3cad3;stroke-width:1;stroke-dasharray:3 3}
.garr{stroke:#2f6f4f;stroke-width:1.6;fill:none;marker-end:url(#hg)}.line{stroke:#5b6472;stroke-width:1.3;fill:none}
.rt{font-size:11px;fill:#a33a4d}.gt{font-size:11px;fill:#2f6f4f}
.tail{fill:#ffffff;stroke:#9aa4b2;stroke-width:1;stroke-dasharray:3 2}
.cp{stroke:#1b1f24;stroke-width:2}.jp{stroke:#a8741f;stroke-width:1.6;stroke-dasharray:4 3}
</style><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker><marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a33a4d"/></marker><marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6f4f"/></marker></defs>
<rect width="900" height="562" fill="#ffffff"/>
<text x="16" y="26" class="t">A share split into shards: each has one primary node and replicas; front-ends forward to it.</text>
<rect x="300" y="44" width="110" height="26" rx="4" class="ext"/>
<text x="355" y="61" class="s" text-anchor="middle">NFS client</text>
<rect x="455" y="44" width="110" height="26" rx="4" class="ext"/>
<text x="510" y="61" class="s" text-anchor="middle">SMB client</text>
<rect x="610" y="44" width="110" height="26" rx="4" class="ext"/>
<text x="665" y="61" class="s" text-anchor="middle">NFS client</text>
<rect x="765" y="44" width="110" height="26" rx="4" class="ext"/>
<text x="820" y="61" class="s" text-anchor="middle">SMB client</text>
<rect x="20" y="44" width="240" height="300" rx="5" class="ext"/>
<text x="32" y="64" class="h">share /data — its shards</text>
<rect x="34" y="78" width="12" height="12" rx="2" class="data"/>
<text x="52" y="88" class="m" xml:space="preserve">/data</text>
<text x="52" y="104" class="s">shard S · per share (default)</text>
<rect x="52" y="122" width="12" height="12" rx="2" class="k"/>
<text x="70" y="132" class="m" xml:space="preserve">/data/proj</text>
<text x="70" y="148" class="s">shard P · subtree, chosen by hand</text>
<rect x="52" y="166" width="12" height="12" rx="2" class="data"/>
<text x="70" y="176" class="m" xml:space="preserve">/data/users</text>
<text x="70" y="192" class="s">marked per-child; stays in S</text>
<rect x="70" y="210" width="12" height="12" rx="2" class="a"/>
<text x="88" y="220" class="m" xml:space="preserve">u1/</text>
<text x="88" y="236" class="s">shard U1 · slot → C</text>
<rect x="70" y="250" width="12" height="12" rx="2" class="a"/>
<text x="88" y="260" class="m" xml:space="preserve">u2/</text>
<text x="88" y="276" class="s">shard U2 · slot → A</text>
<rect x="70" y="290" width="12" height="12" rx="2" class="a"/>
<text x="88" y="300" class="m" xml:space="preserve">u3/</text>
<text x="88" y="316" class="s">shard U3 · slot → D</text>
<path d="M40 98V300" class="line"/>
<path d="M58 186V304" class="line"/>
<rect x="290" y="100" width="130" height="180" rx="5" class="ext"/>
<text x="298" y="118" class="h">node A</text>
<rect x="300" y="128" width="110" height="40" rx="4" class="vfs"/>
<text x="355" y="145" class="s" text-anchor="middle">front-end</text>
<text x="355" y="159" class="s" text-anchor="middle">(protocol role)</text>
<rect x="300" y="180" width="110" height="86" rx="4" class="data"/>
<text x="355" y="197" class="s" text-anchor="middle">storage role</text>
<text x="308" y="220" class="s">primary: S, U2</text>
<text x="308" y="238" class="s">replica: P, U3</text>
<text x="308" y="256" class="s">one journal</text>
<path d="M355 72V126" class="arr"/>
<rect x="445" y="100" width="130" height="180" rx="5" class="ext"/>
<text x="453" y="118" class="h">node B</text>
<rect x="455" y="128" width="110" height="40" rx="4" class="vfs"/>
<text x="510" y="145" class="s" text-anchor="middle">front-end</text>
<text x="510" y="159" class="s" text-anchor="middle">(protocol role)</text>
<rect x="455" y="180" width="110" height="86" rx="4" class="data"/>
<text x="510" y="197" class="s" text-anchor="middle">storage role</text>
<text x="463" y="220" class="s">primary: P</text>
<text x="463" y="238" class="s">replica: S, U2</text>
<text x="463" y="256" class="s">one journal</text>
<path d="M510 72V126" class="arr"/>
<rect x="600" y="100" width="130" height="180" rx="5" class="ext"/>
<text x="608" y="118" class="h">node C</text>
<rect x="610" y="128" width="110" height="40" rx="4" class="vfs"/>
<text x="665" y="145" class="s" text-anchor="middle">front-end</text>
<text x="665" y="159" class="s" text-anchor="middle">(protocol role)</text>
<rect x="610" y="180" width="110" height="86" rx="4" class="data"/>
<text x="665" y="197" class="s" text-anchor="middle">storage role</text>
<text x="618" y="220" class="s">primary: U1</text>
<text x="618" y="238" class="s">replica: S, P, U3</text>
<text x="618" y="256" class="s">one journal</text>
<path d="M665 72V126" class="arr"/>
<rect x="755" y="100" width="130" height="180" rx="5" class="ext"/>
<text x="763" y="118" class="h">node D</text>
<rect x="765" y="128" width="110" height="40" rx="4" class="vfs"/>
<text x="820" y="145" class="s" text-anchor="middle">front-end</text>
<text x="820" y="159" class="s" text-anchor="middle">(protocol role)</text>
<rect x="765" y="180" width="110" height="86" rx="4" class="data"/>
<text x="820" y="197" class="s" text-anchor="middle">storage role</text>
<text x="773" y="220" class="s">primary: U3</text>
<text x="773" y="238" class="s">replica: U1, U2</text>
<text x="773" y="256" class="s">one journal</text>
<path d="M820 72V126" class="arr"/>
<path d="M455 170C420 176 420 214 412 214" class="garr"/>
<text x="356" y="300" class="gt">B's front-end forwards a write to /data/x</text>
<text x="356" y="314" class="gt">to S's primary, node A</text>
<rect x="20" y="356" width="860" height="150" rx="5" class="meta"/>
<text x="34" y="376" class="h">metadata store — one shard record per shard, never per file; changed only by compare-and-swap</text>
<rect x="36" y="386" width="420" height="110" rx="4" class="p"/>
<text x="48" y="406" class="m" xml:space="preserve">S:  epoch 5  primary (A, node epoch 3)  replicas B, C</text>
<text x="48" y="425" class="m" xml:space="preserve">P:  epoch 3  primary (B, node epoch 5)  replicas C, D</text>
<text x="48" y="444" class="m" xml:space="preserve">U1: epoch 6  primary (C, node epoch 2)  replicas D, A</text>
<text x="48" y="463" class="m" xml:space="preserve">U2: epoch 6  primary (A, node epoch 3)  replicas B, D</text>
<text x="48" y="482" class="m" xml:space="preserve">U3: epoch 7  primary (D, node epoch 4)  replicas A, C</text>
<rect x="476" y="386" width="388" height="110" rx="4" class="p"/>
<text x="488" y="406" class="h">with each file (not a shard record)</text>
<text x="488" y="426" class="m" xml:space="preserve">File.Shard = U1</text>
<text x="488" y="444" class="m" xml:space="preserve">F_x(f), F_o(f) = (U1, epoch 6)</text>
<text x="488" y="468" class="s">a file's shard is set at create and changes</text>
<text x="488" y="484" class="s">only by a move, never by rename</text>
<text x="16" y="530" class="l">Any client may write anywhere; each write is ordered by the one primary of its file's shard.</text>
<text x="16" y="548" class="s">Per-child shards hash into slots that the slot table assigns to nodes; the compare-and-swap, not the table, decides.</text>
</svg>
