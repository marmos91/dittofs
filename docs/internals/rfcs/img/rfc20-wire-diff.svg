<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .bx{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .ref{fill:#f2ecf7;stroke:#7a5a96;stroke-width:1.3}
      .us{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .ok{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="16" y="26" class="t">A wire test: one script, two servers, compared field by field after normalisation.</text>

  <rect x="24" y="150" width="120" height="60" rx="6" class="bx"/>
  <text x="44" y="176" class="m">script</text><text x="38" y="194" class="s">exact requests</text>

  <rect x="200" y="70" width="150" height="54" rx="6" class="ref"/><text x="214" y="94" class="m">reference server</text><text x="214" y="112" class="s">fresh share, same tree</text>
  <rect x="200" y="236" width="150" height="54" rx="6" class="us"/><text x="214" y="260" class="m">DittoFS</text><text x="214" y="278" class="s">fresh share, same tree</text>
  <path d="M146,170 L196,104" class="ln"/><path d="M146,190 L196,256" class="ln"/>

  <rect x="400" y="70" width="110" height="54" rx="6" class="bx"/><text x="414" y="94" class="m">capture</text><text x="414" y="112" class="s">pcap</text>
  <rect x="400" y="236" width="110" height="54" rx="6" class="bx"/><text x="414" y="260" class="m">capture</text><text x="414" y="278" class="s">pcap</text>
  <path d="M352,97 L396,97" class="ln"/><path d="M352,263 L396,263" class="ln"/>

  <rect x="550" y="150" width="140" height="60" rx="6" class="bx"/>
  <text x="564" y="174" class="m">dissect</text><text x="564" y="192" class="s">→ fields, per request</text>
  <path d="M512,97 L560,148" class="ln"/><path d="M512,263 L560,212" class="ln"/>

  <rect x="550" y="234" width="140" height="56" rx="6" class="bx"/>
  <text x="564" y="258" class="m">normalise</text><text x="564" y="276" class="s">IDs, times → tokens</text>
  <path d="M620,212 L620,230" class="ln"/>

  <rect x="740" y="234" width="130" height="56" rx="6" class="bx"/>
  <text x="764" y="258" class="m">compare</text><text x="754" y="276" class="s">every other field</text>
  <path d="M692,262 L736,262" class="ln"/>

  <rect x="740" y="60" width="130" height="44" rx="6" class="ok"/><text x="756" y="86" class="m">equal → green</text>
  <rect x="740" y="120" width="150" height="56" rx="6" class="ok"/><text x="752" y="142" class="m">differs, listed</text><text x="752" y="160" class="s">entry cites an RFC rule</text>
  <rect x="740" y="320" width="130" height="56" rx="6" class="bad"/><text x="752" y="342" class="m">differs, unlisted</text><text x="752" y="360" class="s">red + both captures</text>
  <path d="M805,232 L805,108" class="ln"/><path d="M790,232 L790,180" class="ln"/><path d="M805,292 L805,316" class="ln"/>

</svg>
