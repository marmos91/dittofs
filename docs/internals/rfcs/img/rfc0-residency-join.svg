<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
      .ora{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}
      .cell{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
      .ok{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}
      .bad{fill:#f8dcdc;stroke:#b04a4a;stroke-width:1.4}
      .neu{fill:#eceff2;stroke:#9aa4b2;stroke-width:1.2}
    </style>
  </defs>
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="16" y="26" class="t">Residency is not stored anywhere. It is what the two answers imply.</text>

  <rect x="150" y="52" width="300" height="56" rx="5" class="ora"/>
  <text x="166" y="74" class="h">metadata store</text>
  <text x="166" y="95" class="s">does this range exist, and is its block durable?</text>

  <rect x="480" y="52" width="270" height="56" rx="5" class="ora"/>
  <text x="496" y="74" class="h">journal</text>
  <text x="496" y="95" class="s">do I hold these bytes?</text>

  <text x="150" y="146" class="h">metadata says</text>
  <text x="470" y="146" class="h">journal says</text>
  <text x="620" y="146" class="h">therefore</text>
  <text x="760" y="146" class="h">the read</text>

  <g class="m">
    <rect x="150" y="158" width="300" height="40" class="cell"/><text x="162" y="183">no chunk covers the offset</text>
    <rect x="470" y="158" width="130" height="40" class="cell"/><text x="482" y="183">—</text>
    <rect x="620" y="158" width="120" height="40" class="neu"/><text x="632" y="183">Absent</text>
    <rect x="760" y="158" width="124" height="40" class="neu"/><text x="772" y="183">zeros</text>

    <rect x="150" y="202" width="300" height="40" class="cell"/><text x="162" y="227">exists, not durable</text>
    <rect x="470" y="202" width="130" height="40" class="cell"/><text x="482" y="227">present</text>
    <rect x="620" y="202" width="120" height="40" class="ok"/><text x="632" y="227">Dirty</text>
    <rect x="760" y="202" width="124" height="40" class="ok"/><text x="772" y="227">serve local</text>

    <rect x="150" y="246" width="300" height="40" class="cell"/><text x="162" y="271">exists, durable</text>
    <rect x="470" y="246" width="130" height="40" class="cell"/><text x="482" y="271">present</text>
    <rect x="620" y="246" width="120" height="40" class="ok"/><text x="632" y="271">Resident</text>
    <rect x="760" y="246" width="124" height="40" class="ok"/><text x="772" y="271">serve local</text>

    <rect x="150" y="290" width="300" height="40" class="cell"/><text x="162" y="315">exists, durable</text>
    <rect x="470" y="290" width="130" height="40" class="cell"/><text x="482" y="315">absent</text>
    <rect x="620" y="290" width="120" height="40" class="ok"/><text x="632" y="315">Remote</text>
    <rect x="760" y="290" width="124" height="40" class="ok"/><text x="772" y="315">get, fill</text>

    <rect x="150" y="334" width="300" height="40" class="cell"/><text x="162" y="359">exists, not durable</text>
    <rect x="470" y="334" width="130" height="40" class="cell"/><text x="482" y="359">absent</text>
    <rect x="620" y="334" width="120" height="40" class="bad"/><text x="632" y="359">Lost</text>
    <rect x="760" y="334" width="124" height="40" class="bad"/><text x="772" y="359">FAIL</text>
  </g>

  <text x="16" y="400" class="l">The journal's silence is the same observation in rows 1, 4 and 5. One source cannot tell them apart;</text>
  <text x="16" y="420" class="l">that ambiguity resolved to zeros, and is the shape of every residency incident in this system's history.</text>
  <text x="16" y="438" class="s">Nothing writes the right-hand columns. State you store can go stale; state you derive cannot.</text>
</svg>
