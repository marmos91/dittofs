<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}.sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
.st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}.pe{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
.rf{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}.box{fill:#ffffff;stroke:#5b6472;stroke-width:1}
.arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#h)}
.rarr{stroke:#b04a4a;stroke-width:1.3;fill:none;marker-end:url(#hr)}
.garr{stroke:#4c8a58;stroke-width:1.5;fill:none;marker-end:url(#hg)}
.aarr{stroke:#b07a2a;stroke-width:1.3;fill:none;marker-end:url(#ha)}
.lane{stroke:#c3cad3;stroke-width:1;stroke-dasharray:3 3}
.rt{font-size:11px;fill:#b04a4a}.gt{font-size:11px;fill:#4c8a58}.at{font-size:11px;fill:#b07a2a}
</style>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker>
<marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b04a4a"/></marker>
<marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4c8a58"/></marker>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b07a2a"/></marker>
</defs>
<rect width="900" height="476" fill="#ffffff"/>
<text x="16" y="26" class="t">One table per file, at its primary: both protocols' requests are checked in one place.</text>
<rect x="20" y="44" width="250" height="52" rx="4" class="pr"/>
<text x="145" y="64" class="h" text-anchor="middle">alice-pc (SMB)</text>
<text x="145" y="83" class="s" text-anchor="middle">open: read+write, deny write, lease L1</text>
<rect x="325" y="44" width="250" height="52" rx="4" class="pr"/>
<text x="450" y="64" class="h" text-anchor="middle">second desktop (SMB)</text>
<text x="450" y="83" class="s" text-anchor="middle">open: write, same file</text>
<rect x="630" y="44" width="250" height="52" rx="4" class="pr"/>
<text x="755" y="64" class="h" text-anchor="middle">build01 (NFS)</text>
<text x="755" y="83" class="s" text-anchor="middle">READ, WRITE, LOCK</text>
<path d="M145 96V124" class="arr"/><path d="M450 96V124" class="arr"/><path d="M755 96V124" class="arr"/>
<rect x="20" y="126" width="860" height="28" rx="4" class="sv"/>
<text x="450" y="144" class="l" text-anchor="middle">filesystem service routes every request to the file's primary</text>
<path d="M330 154V180" class="arr"/>
<rect x="20" y="182" width="620" height="226" rx="6" class="sv"/>
<text x="34" y="202" class="h">N1, primary: the table for ODFC_alice.vhdx (in memory)</text>
<rect x="34" y="214" width="592" height="26" rx="3" class="box"/>
<text x="46" y="231" class="m">client alice-pc</text><text x="186" y="231" class="m">open o1: read+write, deny write, persistent</text>
<rect x="34" y="246" width="592" height="26" rx="3" class="box"/>
<text x="46" y="263" class="m">grant L1: read+write+handle, epoch 3</text><text x="500" y="263" class="m">locks: none</text>
<text x="46" y="298" class="l">second desktop's open vs o1's deny mode</text>
<path d="M300 294H398" class="rarr"/>
<rect x="402" y="282" width="224" height="22" rx="4" class="rf"/>
<text x="514" y="297" class="s" text-anchor="middle">sharing violation, never downgraded</text>
<text x="46" y="330" class="l">same app instance, higher version?</text>
<path d="M300 326H398" class="aarr"/>
<rect x="402" y="314" width="224" height="22" rx="4" class="pe"/>
<text x="514" y="329" class="s" text-anchor="middle">close o1 and its lease, then grant</text>
<text x="46" y="366" class="s">The same process runs the file's I/O: nothing lands between</text>
<text x="46" y="382" class="s">a conflict check and the write it admits.</text>
<rect x="690" y="206" width="190" height="80" rx="4" class="st"/>
<text x="785" y="226" class="h" text-anchor="middle">metadata store</text>
<text x="785" y="245" class="s" text-anchor="middle">one record: persistent</text>
<text x="785" y="260" class="s" text-anchor="middle">open o1 with its lease</text>
<path d="M626 227H686" class="arr"/>
<rect x="690" y="300" width="190" height="64" rx="4" class="box"/>
<text x="702" y="320" class="s">An ordinary open of a file</text>
<text x="702" y="336" class="s">that has a name writes</text>
<text x="702" y="352" class="s">no record at all.</text>
<rect x="20" y="420" width="860" height="40" rx="4" class="pe"/>
<text x="34" y="437" class="h">N1 restarts: the table is gone, so N1 runs a grace period</text>
<text x="34" y="452" class="s">For one lease period it refuses every new open, lock or grant; alice-pc reclaims o1, whose record survived.</text>
</svg>
