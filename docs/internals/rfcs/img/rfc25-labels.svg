<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .big{font-size:20px;font-weight:700;fill:#1b1f24}.bigr{font-size:20px;font-weight:700;fill:#b04a4a}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.4}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.2}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.6}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.3;fill:none;marker-end:url(#r)}
    </style>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="16" y="26" class="t">A share label multiplies a histogram by 10,000; per-share figures are worst-20 gauges.</text>

  <rect x="24" y="48" width="260" height="150" rx="6" class="sv"/>
  <text x="36" y="68" class="h">operation latency, as specified</text>
  <text x="36" y="88" class="m">vfs_op_seconds{op,</text>
  <text x="36" y="102" class="m">  protocol, outcome}</text>
  <text x="36" y="124" class="s">~45 ops × 3 protocols × 3 outcomes</text>
  <text x="36" y="138" class="s">× 21 series per histogram</text>
  <text x="36" y="172" class="big">8,505 series</text>
  <text x="36" y="190" class="s">within the 10,000 per metric</text>

  <path d="M286,123 L312,123" class="ex"/>
  <rect x="316" y="48" width="260" height="150" rx="6" class="bad"/>
  <text x="328" y="68" class="h">the same, with a share label</text>
  <text x="328" y="88" class="m">vfs_op_seconds{op, protocol,</text>
  <text x="328" y="102" class="m">  outcome, share}</text>
  <text x="328" y="124" class="s">8,505 × 10,000 shares</text>
  <text x="328" y="172" class="bigr">85,050,000 series</text>
  <text x="328" y="190" class="e">forbidden on every counter and histogram</text>

  <rect x="608" y="48" width="268" height="150" rx="6" class="sv"/>
  <text x="620" y="68" class="h">a per-share figure, as a gauge</text>
  <text x="620" y="88" class="m">engine_dirty_bytes{share}</text>
  <text x="620" y="106" class="s">the worst 20 shares, chosen at each export</text>
  <text x="620" y="122" class="m">engine_dirty_bytes</text>
  <text x="620" y="138" class="s">the sum over every share, unlabelled</text>
  <text x="620" y="172" class="big">21 series</text>
  <text x="620" y="190" class="s">every share: the management API</text>

  <text x="24" y="232" class="h">Labels by kind</text>
  <rect x="24" y="244" width="270" height="134" rx="6" class="sv"/>
  <text x="36" y="264" class="h">closed sets: any metric</text>
  <text x="36" y="282" class="s">op, protocol, outcome, result, reason,</text>
  <text x="36" y="296" class="s">kind, direction, state, role, cause,</text>
  <text x="36" y="310" class="s">stage, pool</text>
  <text x="36" y="330" class="s">values named in the owning RFC;</text>
  <text x="36" y="344" class="s">alerted counters exported from start at 0</text>

  <rect x="314" y="244" width="270" height="134" rx="6" class="st"/>
  <text x="326" y="264" class="h">entity labels: any metric, capped</text>
  <text x="326" y="282" class="s">store, namespace, journal, location,</text>
  <text x="326" y="296" class="s">transform; node, about another node</text>
  <text x="326" y="316" class="s">64 values per metric per node; the rest</text>
  <text x="326" y="330" class="s">summed into _other, and a condition raised</text>
  <text x="326" y="350" class="s">share and shard: gauges only, worst 20</text>

  <rect x="604" y="244" width="272" height="134" rx="6" class="bad"/>
  <text x="616" y="264" class="h">forbidden on every metric</text>
  <text x="616" y="282" class="s">client, principal, user, group, file,</text>
  <text x="616" y="296" class="s">path, name, session, connection,</text>
  <text x="616" y="310" class="s">request, handle, key or snapshot IDs,</text>
  <text x="616" y="324" class="s">anything a client or user chooses</text>
  <text x="616" y="350" class="e">who did it: an event; which file: a log</text>
  <text x="616" y="364" class="e">line or span attribute, by FileID</text>
</svg>
