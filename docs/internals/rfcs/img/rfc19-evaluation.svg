<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a;font-weight:600}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
      .am{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>
  <text x="16" y="26" class="t">One request runs ten steps in a fixed order; bob's GENERIC_WRITE open is refused at the walk.</text>

  <text x="40" y="54" class="h">step</text>
  <text x="290" y="54" class="h">rule</text>
  <text x="566" y="54" class="h">bob opens release/notes.txt over SMB</text>

  <rect x="24" y="64" width="250" height="30" rx="5" class="sv"/><text x="36" y="84" class="h">1  map the request</text>
  <text x="290" y="84" class="s">generic bits → entry rights</text><text x="566" y="84" class="m">GENERIC_WRITE → 0x00120116</text>

  <rect x="24" y="102" width="250" height="30" rx="5" class="sv"/><text x="36" y="122" class="h">2  share ceiling</text>
  <text x="290" y="122" class="s">the caller's grant level, narrowed by admission</text><text x="566" y="122" class="m">read-write: every entry right</text>

  <rect x="24" y="140" width="250" height="30" rx="5" class="sv"/><text x="36" y="160" class="h">3  privilege</text>
  <text x="290" y="160" class="s">a privileged caller skips 5 and 6</text><text x="566" y="160" class="m">not privileged</text>

  <rect x="24" y="178" width="250" height="30" rx="5" class="sv"/><text x="36" y="198" class="h">4  system security</text>
  <text x="290" y="198" class="s">an identity with admin only</text><text x="566" y="198" class="m">not asked</text>

  <rect x="24" y="216" width="250" height="30" rx="5" class="sv"/><text x="36" y="236" class="h">5  owner's implicit rights</text>
  <text x="290" y="236" class="s">read and write the ACL</text><text x="566" y="236" class="m">bob is not the owner</text>

  <rect x="24" y="254" width="250" height="30" rx="5" class="bad"/><text x="36" y="274" class="h">6  the walk</text>
  <text x="290" y="274" class="s">stored order, first decision wins</text><text x="566" y="274" class="e">entry 1, deny bob 0x116, decides first</text>

  <rect x="24" y="292" width="250" height="30" rx="5" class="sv"/><text x="36" y="312" class="h">7  the parent</text>
  <text x="290" y="312" class="s">delete through delete a child</text><text x="566" y="312" class="m">delete not asked</text>

  <rect x="24" y="330" width="250" height="30" rx="5" class="sv"/><text x="36" y="350" class="h">8  the flags</text>
  <text x="290" y="350" class="s">immutable, append-only refuse</text><text x="566" y="350" class="m">none set</text>

  <rect x="24" y="368" width="250" height="30" rx="5" class="bad"/><text x="36" y="388" class="h">9  intersect, decide</text>
  <text x="290" y="388" class="s">want within G, the granted set?</text><text x="566" y="388" class="e">no → ErrAccess, STATUS_ACCESS_DENIED</text>

  <rect x="24" y="406" width="250" height="30" rx="5" class="am"/><text x="36" y="426" class="h">10  audit selection</text>
  <text x="290" y="426" class="s">a matching entry selects one event</text><text x="566" y="426" class="m">a failed-write entry: one event</text>

  <path d="M14,79 L14,416" class="ln"/>
  <text x="16" y="466" class="s">Privilege skips 5 and 6, and the ceiling still applies at 9, so a privileged caller on a read share stays read-only.</text>
  <text x="16" y="486" class="s">The same open over NFSv4 runs the same ten steps against the same stored entries and is refused NFS4ERR_ACCESS.</text>
</svg>
