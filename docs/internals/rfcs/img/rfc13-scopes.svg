<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 434" width="900" height="434" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#1b1f24}.s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .pd{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .rf{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="434" fill="#ffffff"/>
  <text x="16" y="26" class="t">Five scopes. A setting sits at the smallest thing it must be the same across.</text>

  <rect x="16" y="42" width="868" height="378" rx="8" class="zone"/>
  <text x="28" y="60" class="h">installation</text>
  <text x="112" y="60" class="s">what every node and namespace shares: the syncer's pool sizes' defaults, GC's schedule</text>

  <rect x="32" y="76" width="226" height="96" rx="6" class="st"/>
  <text x="46" y="98" class="h">node N1</text>
  <text x="46" y="118" class="s">one host's resources:</text>
  <text x="46" y="136" class="s">its journals, one per device,</text>
  <text x="46" y="154" class="s">and each one's maximum footprint</text>

  <rect x="32" y="190" width="226" height="112" rx="6" class="zone"/>
  <text x="46" y="212" class="h">no scope</text>
  <text x="46" y="232" class="s">bootstrap facts, held by the host</text>
  <text x="46" y="250" class="s">fixed values, changed in a release</text>
  <text x="46" y="268" class="s">derived values, e.g. the carver's</text>
  <text x="46" y="286" class="s">bounds from Target</text>

  <rect x="280" y="76" width="588" height="76" rx="6" class="st"/>
  <text x="294" y="98" class="h">remote store — the store configuration its namespaces share</text>
  <text x="294" y="118" class="s">endpoint · bucket dfs-data · credential reference · storage class</text>
  <text x="294" y="136" class="s">transform chain · block target · material provider · master keys</text>

  <path d="M424,154 L424,184" class="ln"/><path d="M810,154 L810,184" class="ln"/>
  <text x="440" y="174" class="s">each namespace opens its own store under its own prefix</text>

  <rect x="280" y="188" width="288" height="78" rx="6" class="sv"/>
  <text x="294" y="208" class="h">namespace</text>
  <text x="294" y="226" class="s">prefix · chunk-ID key · chunking key</text>
  <text x="294" y="242" class="s">data keys · Target · whether the chain</text>
  <text x="294" y="258" class="s">encrypts · the counting domain</text>
  <rect x="588" y="188" width="280" height="78" rx="6" class="sv"/>
  <text x="602" y="208" class="h">another namespace</text>
  <text x="602" y="226" class="s">its own prefix, keys and Target,</text>
  <text x="602" y="242" class="s">on the same store configuration</text>

  <path d="M350,268 L350,298" class="ln"/><path d="M498,268 L498,298" class="ln"/><path d="M728,268 L728,298" class="ln"/>
  <rect x="284" y="302" width="132" height="34" rx="5" class="pr"/><text x="320" y="323" class="m">profiles</text>
  <rect x="432" y="302" width="132" height="34" rx="5" class="pr"/><text x="458" y="323" class="m">another share</text>
  <rect x="662" y="302" width="132" height="34" rx="5" class="pr"/><text x="712" y="323" class="m">a share</text>
  <text x="284" y="356" class="s">share — what a client sees: case sensitivity, name length, atime, per-share journal limit,</text>
  <text x="284" y="372" class="s">snapshot policy. While it holds content, its namespace binding changes only by a re-home.</text>

  <text x="32" y="400" class="s">Deduplication compares chunks across a namespace, so what decides a chunk's boundaries or identity is a namespace setting:</text>
  <text x="32" y="414" class="s">a share-level Target would let two shares of one namespace cut the same file differently and stop deduplicating each other.</text>
</svg>
