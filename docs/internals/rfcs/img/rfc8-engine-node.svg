<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}.meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
.data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}.ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
.p{fill:#ffffff;stroke:#1b1f24;stroke-width:1.1}.k{fill:#fbefd9;stroke:#a8741f;stroke-width:1.3}.r{fill:#f8e3e6;stroke:#a33a4d;stroke-width:1.3}
.a{fill:#eaf4ec;stroke:#2f6f4f;stroke-width:1.3}
.arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#h)}.dash{stroke:#a33a4d;stroke-width:1.2;stroke-dasharray:5 3;fill:none;marker-end:url(#h)}
.lane{stroke:#c3cad3;stroke-width:1;stroke-dasharray:3 3}
</style><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker></defs>
<rect width="900" height="590" fill="#ffffff"/>
<text x="16" y="26" class="t">One engine per node: share contexts, five policy components, four modules, one queue per journal.</text>
<rect x="20" y="44" width="860" height="44" rx="5" class="vfs"/>
<text x="34" y="64" class="h">filesystem service — vfs.Service (RFC 17)</text>
<text x="34" y="80" class="s">the facade's only caller: Write, Commit, Read, Truncate, Deallocate, Release, Clone, Overlay, Allocation, PreWarm</text>
<path d="M450 90V110" class="arr"/>
<rect x="20" y="112" width="860" height="276" rx="5" class="data"/>
<text x="34" y="134" class="h">engine (RFC 8) — a library in the process, on every node with the storage role</text>
<rect x="36" y="146" width="264" height="132" rx="4" class="ext"/>
<text x="48" y="166" class="h">share contexts (§2.3)</text>
<text x="48" y="186" class="l">share A: settings, scope, budgets</text>
<text x="48" y="204" class="l">share B: settings, scope, budgets</text>
<text x="48" y="222" class="l">… one per share served here</text>
<text x="48" y="246" class="s">scope = namespace ID; every share</text>
<text x="48" y="262" class="s">has a remote block store</text>
<rect x="316" y="146" width="268" height="132" rx="4" class="ext"/>
<text x="328" y="166" class="h">policy (§3.1): decide, no I/O</text>
<text x="328" y="186" class="m">OffloadScheduler</text>
<text x="328" y="203" class="m">EvictionPolicy</text>
<text x="328" y="220" class="m">FillPolicy</text>
<text x="328" y="237" class="m">CapacityGovernor</text>
<text x="328" y="254" class="m">HealthTracker</text>
<rect x="600" y="146" width="264" height="132" rx="4" class="ext"/>
<text x="612" y="166" class="h">modules: act, persist nothing</text>
<text x="612" y="186" class="l">work queue (§6.1)</text>
<text x="612" y="204" class="l">offload pipeline (§6.3)</text>
<text x="612" y="222" class="l">dedup oracle (§6.5)</text>
<text x="612" y="240" class="l">speculator (§7.4)</text>
<text x="612" y="262" class="s">block assembler: RFC 2 §5</text>
<rect x="36" y="292" width="408" height="80" rx="4" class="k"/>
<text x="48" y="312" class="h">work queue — journal of device 1</text>
<text x="48" y="330" class="s">dirty · age tick · pressure · put done/failed</text>
<text x="48" y="346" class="s">commit done · retry due · removal pending</text>
<text x="48" y="362" class="s">in memory; rebuilt from durable state at start</text>
<rect x="456" y="292" width="408" height="80" rx="4" class="k"/>
<text x="468" y="312" class="h">work queue — journal of device 2</text>
<text x="468" y="330" class="s">the same events, for the shares on device 2</text>
<text x="468" y="346" class="s">fair between shares by budget weight</text>
<text x="468" y="362" class="s">writers only post; posting never blocks</text>
<path d="M130 390V410" class="arr"/><path d="M340 390V410" class="arr"/><path d="M560 390V410" class="arr"/><path d="M770 390V410" class="arr"/>
<rect x="20" y="412" width="200" height="64" rx="5" class="data"/>
<text x="34" y="434" class="h">journal, per device</text>
<text x="34" y="452" class="s">RFC 1, replicated by RFC 10</text>
<text x="34" y="467" class="s">stage, offer, report, release</text>
<rect x="240" y="412" width="200" height="64" rx="5" class="data"/>
<text x="254" y="434" class="h">carver and assembler</text>
<text x="254" y="452" class="s">RFC 2: chunks, then blocks</text>
<text x="254" y="467" class="s">pure; no state between calls</text>
<rect x="460" y="412" width="200" height="64" rx="5" class="data"/>
<text x="474" y="434" class="h">syncer</text>
<text x="474" y="452" class="s">RFC 3: puts and fetches</text>
<text x="474" y="467" class="s">shared pools, one flow per share</text>
<rect x="680" y="412" width="200" height="64" rx="5" class="meta"/>
<text x="694" y="434" class="h">metadata store</text>
<text x="694" y="452" class="s">RFC 6 block metadata, RFC 16</text>
<text x="694" y="467" class="s">existence, refs, intents</text>
<path d="M120 478V498" class="arr"/><path d="M560 478V498" class="arr"/><path d="M780 478V498" class="arr"/>
<rect x="20" y="500" width="200" height="50" rx="5" class="ext"/>
<text x="34" y="521" class="h">journal devices</text>
<text x="34" y="539" class="s">local, per node</text>
<rect x="460" y="500" width="200" height="50" rx="5" class="ext"/>
<text x="474" y="521" class="h">remote block store</text>
<text x="474" y="539" class="s">RFC 4, 5; one per share</text>
<rect x="680" y="500" width="200" height="50" rx="5" class="ext"/>
<text x="694" y="521" class="h">transactional KV</text>
<text x="694" y="539" class="s">one database, all roles</text>
<text x="16" y="576" class="s">No lock or queue on the request path spans files or shares; background work runs per journal and is fed by events.</text>
</svg>
