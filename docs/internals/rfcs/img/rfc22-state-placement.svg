<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b07a2a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
      .cl{fill:#ffffff;stroke:#5b6472;stroke-width:1.3}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .in{fill:#ffffff;stroke:#4a6f96;stroke-width:1}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.4}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .bk{stroke:#b07a2a;stroke-width:1.5;fill:none;stroke-dasharray:5 3;marker-end:url(#b)}
    </style>
  </defs>
  <rect width="900" height="486" fill="#ffffff"/>
  <text x="16" y="26" class="t">A session lives in one gateway node's memory; the open it made lives at the file's primary.</text>

  <rect x="120" y="46" width="220" height="40" rx="5" class="cl"/>
  <text x="136" y="64" class="h">alice-pc</text><text x="136" y="79" class="s">Windows, SMB 3.1.1, \\dittofs\profiles</text>
  <rect x="560" y="46" width="220" height="40" rx="5" class="cl"/>
  <text x="576" y="64" class="h">second desktop</text><text x="576" y="79" class="s">alice again: CREATE ODFC_alice.vhdx</text>
  <path d="M230,88 L230,114" class="ln"/>
  <path d="M670,88 L670,114" class="ln"/>

  <rect x="24" y="116" width="420" height="190" rx="8" class="pr"/>
  <text x="40" y="138" class="h">P1 — gateway node</text>
  <text x="190" y="138" class="s">memory only; rebuilt on reconnect</text>
  <rect x="40" y="150" width="388" height="146" rx="5" class="in"/>
  <text x="52" y="168" class="l">connection: a session's channels are all on P1</text>
  <rect x="56" y="178" width="360" height="110" rx="5" class="in"/>
  <text x="68" y="196" class="l">session: alice's keys, credits — never stored</text>
  <rect x="72" y="206" width="328" height="74" rx="5" class="in"/>
  <text x="84" y="224" class="m">tree connect \\dittofs\profiles</text>
  <rect x="88" y="234" width="296" height="38" rx="4" class="in"/>
  <text x="100" y="257" class="m">FileId, volatile half: P1's table</text>

  <rect x="456" y="116" width="420" height="190" rx="8" class="pr"/>
  <text x="472" y="138" class="h">P2 — gateway node</text>
  <text x="472" y="166" class="l">The CREATE conflicts with alice-pc's handle caching.</text>
  <text x="472" y="194" class="l">1  answers STATUS_PENDING at once, frees its worker</text>
  <text x="472" y="218" class="l">2  re-runs the CREATE once the break has ended</text>
  <text x="472" y="242" class="l">3  alice-pc's deny mode refuses it</text>
  <text x="472" y="276" class="s">without an ack, the break ends at its 35 s deadline</text>
  <text x="472" y="292" class="s">and the lease drops to no caching; the open stays</text>

  <path d="M120,356 L120,310" class="bk"/>
  <text x="130" y="336" class="s">lease break, ack</text>
  <path d="M330,308 L330,354" class="ln"/>
  <text x="340" y="336" class="s">reconnect routed by FileId</text>
  <path d="M670,308 L670,354" class="ln"/>
  <text x="680" y="336" class="s">CREATE routed to S1</text>

  <rect x="24" y="358" width="852" height="108" rx="8" class="st"/>
  <text x="40" y="380" class="h">S1 — primary of profiles/alice/: losing P1 or P2 loses none of this</text>
  <text x="40" y="404" class="l">RFC 14: the open (read+write, others may read but not write), its RWH lease, its durable identity</text>
  <text x="40" y="426" class="l">RFC 7: names, file IDs, attributes, streams</text>
  <text x="40" y="452" class="s">durable open: in S1's memory, gone if S1 fails   ·   persistent open: also stored, every write synced before it is acknowledged</text>
</svg>
