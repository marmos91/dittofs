<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 900 640" width="900" height="640" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}.meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
.data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}.ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
.p{fill:#ffffff;stroke:#1b1f24;stroke-width:1.1}.k{fill:#fbefd9;stroke:#a8741f;stroke-width:1.3}.r{fill:#f8e3e6;stroke:#a33a4d;stroke-width:1.3}
.a{fill:#eaf4ec;stroke:#2f6f4f;stroke-width:1.3}
.arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#h)}.dash{stroke:#a33a4d;stroke-width:1.2;stroke-dasharray:5 3;fill:none;marker-end:url(#h)}
.lane{stroke:#c3cad3;stroke-width:1;stroke-dasharray:3 3}
</style><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker></defs>
<rect width="900" height="640" fill="#ffffff"/>
<text x="16" y="26" class="t">One GC per node: a namespace is a context; all safety sits in block metadata's transactions.</text>

<rect x="20" y="42" width="860" height="40" rx="5" class="vfs"/>
<text x="34" y="60" class="h">node (RFC 23 §2.2) — node.New builds gc.New(Deps); the node drives Start · Add · Remove · Drain · Close</text>
<text x="34" y="75" class="s">starts GC after the content subsystem and the share contexts; drains and closes it before they are joined</text>
<path d="M450 84V100" class="arr"/>

<rect x="20" y="102" width="860" height="250" rx="5" class="data"/>
<text x="34" y="122" class="h">*gc.GC (this RFC) — holds no liveness state; every decision is a conditional transaction in Blocks</text>

<rect x="36" y="134" width="236" height="150" rx="4" class="ext"/>
<text x="48" y="153" class="h">namespace contexts</text>
<text x="48" y="172" class="l">ns A: View + held partitions</text>
<text x="48" y="189" class="l">ns B: View + held partitions</text>
<text x="48" y="206" class="l">… added and removed by the node</text>
<text x="48" y="230" class="s">View = Blocks, Remote, Store, Keys</text>
<text x="48" y="245" class="s">removed once its NS‖ns records are</text>
<text x="48" y="260" class="s">gone (drain step 3), or at Close</text>

<rect x="284" y="134" width="334" height="150" rx="4" class="ext"/>
<text x="296" y="153" class="h">sources (tenants: ns × partition)</text>
<text x="296" y="172" class="m">deleter  MarkDue→Marked→Delete→MarkGone→Prune</text>
<text x="296" y="189" class="m">compact  Fetch→Intend→Upload→Relocate</text>
<text x="296" y="206" class="m">collect  AbandonSuperseded · List merge</text>
<text x="296" y="223" class="m">audit    Audit · Recount · trip</text>
<text x="296" y="240" class="m">recheck  settings · claim · Keys · drift</text>
<text x="296" y="262" class="s">Rebuild from BD, BR, cursors; no state a restart needs</text>

<rect x="630" y="134" width="234" height="150" rx="4" class="ext"/>
<text x="642" y="153" class="h">lease keeper</text>
<text x="642" y="172" class="l">acquires partitions, renews at L/3</text>
<text x="642" y="189" class="l">epoch supersedes compactor intents</text>
<text x="642" y="206" class="l">holding is not a safety input</text>
<text x="642" y="230" class="s">releases at Remove and Close;</text>
<text x="642" y="245" class="s">an epoch is never lowered</text>

<rect x="36" y="296" width="828" height="44" rx="4" class="k"/>
<text x="48" y="315" class="h">work scheduler — GC's own instance, one per process (RFC 8 §6.1.1), shared by every namespace context; Deps.Sched</text>
<text x="48" y="331" class="s">batches, retries per item under I8, bounds concurrency per (namespace, source, partition), rate-limits deletes per store</text>

<path d="M120 354V392" class="arr"/>
<path d="M325 354V392" class="arr"/>
<path d="M525 354V392" class="arr"/>
<path d="M695 354V392" class="arr"/>
<path d="M825 354V392" class="arr"/>

<rect x="20" y="394" width="200" height="96" rx="4" class="meta"/>
<text x="32" y="413" class="h">Blocks (RFC 6 view)</text>
<text x="32" y="431" class="s">per namespace, over the one</text>
<text x="32" y="446" class="s">metadata store (RFC 16), shared</text>
<text x="32" y="461" class="s">retire · resurrect · verify · gates</text>
<text x="32" y="476" class="s">live in its transactions</text>

<rect x="230" y="394" width="190" height="96" rx="4" class="p"/>
<text x="242" y="413" class="h">Remote (RFC 4 store)</text>
<text x="242" y="431" class="s">direct: Delete, DeleteVersions,</text>
<text x="242" y="446" class="s">List, RecheckSetting, Get/Put-</text>
<text x="242" y="461" class="s">Control; ref-counted per config,</text>
<text x="242" y="476" class="s">never through the syncer pool</text>

<rect x="430" y="394" width="190" height="96" rx="4" class="p"/>
<text x="442" y="413" class="h">Flow (RFC 3 syncer)</text>
<text x="442" y="431" class="s">GC's background flow per store:</text>
<text x="442" y="446" class="s">Fetch, Upload (compactor),</text>
<text x="442" y="461" class="s">Small (Recheck calls); opened</text>
<text x="442" y="476" class="s">by OpenFlow, closed at Close</text>

<rect x="630" y="394" width="130" height="96" rx="4" class="p"/>
<text x="642" y="413" class="h">Keys (RFC 5)</text>
<text x="642" y="431" class="s">Repair, called once</text>
<text x="642" y="446" class="s">per Recheck; reads</text>
<text x="642" y="461" class="s">the keys object back</text>
<text x="642" y="476" class="s">under its key lock</text>

<rect x="770" y="394" width="110" height="96" rx="4" class="ext"/>
<text x="782" y="413" class="h">node services</text>
<text x="782" y="431" class="m">Clock</text>
<text x="782" y="448" class="m">Health</text>
<text x="782" y="465" class="m">Metrics</text>
<text x="782" y="482" class="m">Logger</text>

<line x1="20" y1="508" x2="880" y2="508" class="lane"/>
<text x="16" y="530" class="h">lifecycle</text>
<rect x="20" y="540" width="150" height="80" rx="4" class="ext"/>
<text x="30" y="558" class="h">New(Deps)</text>
<text x="30" y="575" class="s">validates Deps, refuses a</text>
<text x="30" y="590" class="s">nil field; starts nothing,</text>
<text x="30" y="605" class="s">opens no flow</text>
<path d="M172 580H192" class="arr"/>
<rect x="194" y="540" width="210" height="80" rx="4" class="a"/>
<text x="204" y="558" class="h">Start, then Add per namespace</text>
<text x="204" y="575" class="s">register sources; per Add: acquire</text>
<text x="204" y="590" class="s">leases, post BD then BR to store</text>
<text x="204" y="605" class="s">time; no delete before a Recheck</text>
<path d="M406 580H426" class="arr"/>
<rect x="428" y="540" width="240" height="80" rx="4" class="k"/>
<text x="438" y="558" class="h">Drain(ctx)</text>
<text x="438" y="575" class="s">stop posting; let batches commit or abort;</text>
<text x="438" y="590" class="s">cancel deletes at the deadline (records stay</text>
<text x="438" y="605" class="s">deleted); a compaction abandons its intent</text>
<path d="M670 580H690" class="arr"/>
<rect x="692" y="540" width="188" height="80" rx="4" class="r"/>
<text x="702" y="558" class="h">Close</text>
<text x="702" y="575" class="s">release leases, epochs kept;</text>
<text x="702" y="590" class="s">close flows; closes nothing</text>
<text x="702" y="605" class="s">handed in. Crash: safe</text>
</svg>
