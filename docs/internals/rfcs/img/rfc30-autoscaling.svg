<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .wn{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .rf{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="16" y="26" class="t">The protocol pool follows load; the storage pool changes only when the operator's controller decides.</text>

  <rect x="16" y="40" width="424" height="372" rx="8" class="zone"/>
  <text x="28" y="60" class="h">Protocol pool: a HorizontalPodAutoscaler</text>
  <rect x="32" y="72" width="392" height="60" rx="5" class="pr"/>
  <text x="44" y="90" class="h">signals</text>
  <text x="44" y="106" class="s">active client connections per pod (a custom metric)</text>
  <text x="44" y="122" class="s">CPU as a second target</text>
  <path d="M228,134 L228,146" class="ln"/>
  <rect x="32" y="148" width="392" height="44" rx="5" class="pr"/>
  <text x="44" y="166" class="h">scale up, between min and max</text>
  <text x="44" y="182" class="s">a new pod serves once ready: it holds no file state</text>
  <path d="M228,194 L228,206" class="ln"/>
  <rect x="32" y="208" width="392" height="44" rx="5" class="pr"/>
  <text x="44" y="226" class="h">new connections spread over the new pods</text>
  <text x="44" y="242" class="s">existing connections stay where they are</text>
  <path d="M228,254 L228,266" class="ln"/>
  <rect x="32" y="268" width="392" height="60" rx="5" class="wn"/>
  <text x="44" y="286" class="h">scale down slowly</text>
  <text x="44" y="302" class="s">stabilization window of at least 10 minutes,</text>
  <text x="44" y="318" class="s">because each removal drains its clients first</text>
  <rect x="32" y="348" width="392" height="44" rx="5" class="sv"/>
  <text x="44" y="366" class="h">Outcome: more front-ends</text>
  <text x="44" y="382" class="s">no shard moved, no storage pod touched</text>

  <rect x="460" y="40" width="424" height="372" rx="8" class="zone"/>
  <text x="472" y="60" class="h">Storage pool: the operator's storage controller</text>
  <rect x="476" y="72" width="392" height="76" rx="5" class="st"/>
  <text x="488" y="90" class="h">signals</text>
  <text x="488" y="106" class="s">journal fill above a threshold across most pods</text>
  <text x="488" y="122" class="s">write bandwidth near the journal devices' rate</text>
  <text x="488" y="138" class="s">under-replicated shards repair cannot place</text>
  <path d="M672,150 L672,162" class="ln"/>
  <rect x="476" y="164" width="392" height="44" rx="5" class="sv"/>
  <text x="488" y="182" class="h">raise the StatefulSet by one</text>
  <text x="488" y="198" class="s">the new pod joins with a fresh node ID</text>
  <path d="M672,210 L672,222" class="ln"/>
  <rect x="476" y="224" width="392" height="44" rx="5" class="sv"/>
  <text x="488" y="242" class="h">slot table recomputed; about 1/N of shards move</text>
  <text x="488" y="258" class="s">at a paced rate; no bucket bytes copied</text>
  <path d="M672,270 L672,282" class="ln"/>
  <rect x="476" y="284" width="392" height="44" rx="5" class="wn"/>
  <text x="488" y="302" class="h">cooldown before the next change</text>
  <text x="488" y="318" class="s">at least the shard dwell — 30 minutes as proposed</text>
  <rect x="476" y="348" width="392" height="44" rx="5" class="rf"/>
  <text x="488" y="366" class="h">never an HPA; no scaling on CPU or memory</text>
  <text x="488" y="382" class="s">scale-down only under an explicit policy, as a drain</text>

  <text x="16" y="440" class="l">Every storage pod added or removed moves shards, and a shard refuses a second planned move within the dwell:</text>
  <text x="16" y="458" class="s">an autoscaler following short load swings would keep the cluster rebalancing.</text>
</svg>
