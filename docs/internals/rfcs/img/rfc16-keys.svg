<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#1b1f24}.s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}
      .g{font-size:11px;fill:#4c8a58;font-weight:600}.w{font-size:11px;fill:#b07a2a;font-weight:600}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .wn{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .rf{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="630" fill="#ffffff"/>
  <text x="16" y="26" class="t">Every key leads with its scope: one file's records share a prefix, content sits under its namespace.</text>
  <text x="40" y="50" class="s">key (first part = kind)</text><text x="390" y="50" class="s">holds</text>
  <text x="620" y="50" class="s">written by</text><text x="790" y="50" class="s">kind code</text>

  <rect x="24" y="60" width="852" height="194" rx="8" class="zone"/>
  <text x="36" y="78" class="h">Per file: F‖ShareID‖FileID, everything about one file</text><text x="790" y="78" class="m">F 0x01</text>
  <text x="40" y="100" class="m">F‖profiles‖f7</text><text x="390" y="100" class="l">File: size, times, …</text><text x="620" y="100" class="h">flush</text>
  <text x="40" y="120" class="m">F‖profiles‖f7‖ov‖4GiB</text><text x="390" y="120" class="l">overwrite record</text><text x="620" y="120" class="h">flush</text>
  <text x="40" y="140" class="m">F‖profiles‖f7‖ref‖…</text><text x="390" y="140" class="l">ref to chunk C</text><text x="620" y="140" class="h">offload</text>
  <text x="40" y="160" class="m">F‖profiles‖d9</text><text x="390" y="160" class="l">File: new directory</text><text x="620" y="160" class="h">mkdir</text>
  <text x="40" y="180" class="m">F‖profiles‖d1‖e‖digest‖downloads</text><text x="390" y="180" class="l">Entry, value "Downloads"</text><text x="620" y="180" class="h">mkdir</text>
  <text x="40" y="200" class="m">F‖profiles‖d1‖t‖…</text><text x="390" y="200" class="l">time delta for d1</text><text x="620" y="200" class="h">mkdir</text>
  <rect x="32" y="208" width="836" height="40" rx="4" class="wn"/>
  <text x="40" y="224" class="m">F‖profiles‖d1</text><text x="390" y="224" class="l">d1's File record</text><text x="620" y="224" class="w">guarded by mkdir</text>
  <text x="40" y="242" class="m">f7's fence record</text><text x="390" y="242" class="l">the (shard, epoch) commits carry</text><text x="620" y="242" class="w">guarded by flush</text>

  <rect x="24" y="264" width="852" height="72" rx="8" class="zone"/>
  <text x="36" y="282" class="h">Per share: S‖ShareID</text><text x="790" y="282" class="m">S 0x02</text>
  <text x="40" y="304" class="m">S‖profiles‖vf‖…</text><text x="390" y="304" class="l">version-floor entry, moved</text><text x="620" y="304" class="h">flush</text>
  <text x="40" y="324" class="m">S‖profiles‖ud‖…</text><text x="390" y="324" class="l">usage delta</text><text x="620" y="324" class="h">mkdir</text>

  <rect x="24" y="348" width="852" height="72" rx="8" class="zone"/>
  <text x="36" y="366" class="h">Per namespace: content-addressed, under the bucket namespace it is counted in</text><text x="790" y="366" class="m">0x10–0x17</text>
  <text x="40" y="388" class="m">I‖ns‖name</text><text x="390" y="388" class="l">put intent, before the put</text><text x="620" y="388" class="h">offload</text>
  <text x="40" y="408" class="m">C‖ns‖C · B‖ns‖K1 · CR‖ns‖C‖…</text><text x="390" y="408" class="l">chunk, block, ref index</text><text x="620" y="408" class="h">offload</text>

  <rect x="24" y="432" width="852" height="76" rx="8" class="zone"/>
  <text x="36" y="450" class="h">Server-wide</text><text x="790" y="450" class="m">0x20–0x3A</text>
  <text x="40" y="472" class="m">U‖… · SH‖A · CFG‖…</text><text x="390" y="472" class="l">users, shards, settings</text><text x="620" y="472" class="h">control plane</text>
  <rect x="32" y="480" width="836" height="22" rx="4" class="wn"/>
  <text x="40" y="495" class="m">N‖N1</text><text x="390" y="495" class="l">N1's node record</text><text x="620" y="495" class="w">guarded by flush</text>

  <rect x="24" y="520" width="852" height="50" rx="8" class="zone"/>
  <text x="36" y="538" class="h">Store</text><text x="790" y="538" class="m">0x00</text>
  <text x="40" y="560" class="m">\x00format</text><text x="390" y="560" class="l">store format and fold rules</text><text x="620" y="560" class="h">read first by Open</text>

  <text x="16" y="594" class="s">Labels stand for bytes: each kind and sub-kind is a one-byte code and each minted ID 16 raw bytes (§4.2.1); shares and files appear by name.</text>
  <text x="16" y="612" class="s">A share's files are one prefix to walk, but dropping them is not a range drop: the counts and CR reverse refs their refs name live outside it (§2.3.2).</text>
</svg>
