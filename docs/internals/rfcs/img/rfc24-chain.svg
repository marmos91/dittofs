<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.k{font-size:11px;fill:#1b1f24}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .am{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .bd{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
    <rect width="900" height="372" fill="#ffffff"/>
  <text x="16" y="26" class="t">Every link is bounded: a slow remote reaches the client as a closed window or a retry-later answer.</text>
  <text x="24" y="54" class="s">requests →</text>
  <rect x="24.0" y="64" width="110" height="48" rx="5" class="pr"/>
  <text x="34.0" y="84" class="m">client socket</text>
  <text x="34.0" y="101" class="s">TCP</text>
  <path d="M135.0,80 L146.6,80" class="ln"/>
  <rect x="147.6" y="64" width="110" height="48" rx="5" class="pr"/>
  <text x="157.6" y="84" class="m">frame</text>
  <text x="157.6" y="101" class="s">receive pool</text>
  <path d="M258.6,80 L270.2,80" class="ln"/>
  <rect x="271.2" y="64" width="110" height="48" rx="5" class="pr"/>
  <text x="281.2" y="84" class="m">admit</text>
  <text x="281.2" y="101" class="s">flow control · hold</text>
  <path d="M382.2,80 L393.8,80" class="ln"/>
  <rect x="394.8" y="64" width="110" height="48" rx="5" class="sv"/>
  <text x="404.8" y="84" class="m">service</text>
  <text x="404.8" y="101" class="s">share cap · opens</text>
  <path d="M505.8,80 L517.4,80" class="ln"/>
  <rect x="518.4" y="64" width="110" height="48" rx="5" class="sv"/>
  <text x="528.4" y="84" class="m">engine</text>
  <text x="528.4" y="101" class="s">pacing · capacity</text>
  <path d="M629.4,80 L641.0,80" class="ln"/>
  <rect x="642.0" y="64" width="110" height="48" rx="5" class="st"/>
  <text x="652.0" y="84" class="m">syncer</text>
  <text x="652.0" y="101" class="s">workers · queues</text>
  <path d="M753.0,80 L764.6,80" class="ln"/>
  <rect x="765.6" y="64" width="110" height="48" rx="5" class="st"/>
  <text x="775.6" y="84" class="m">remote store</text>
  <path d="M875.6,130 L24.0,130" class="ex"/>
  <text x="580" y="148" class="e">← backpressure: each link slows the one before it</text>
  <text x="24" y="176" class="h">at its bound</text>
  <text x="28.0" y="196" class="k">TCP window</text>
  <text x="28.0" y="211" class="k">closes</text>
  <text x="151.6" y="196" class="k">reader waits;</text>
  <text x="151.6" y="211" class="k">socket unread</text>
  <text x="275.2" y="196" class="k">connection</text>
  <text x="275.2" y="211" class="k">not read</text>
  <text x="398.8" y="196" class="e">refused:</text>
  <text x="398.8" y="211" class="e">DelayResources</text>
  <text x="522.4" y="196" class="k">write paced,</text>
  <text x="522.4" y="211" class="k">then ErrDelay</text>
  <text x="646.0" y="196" class="k">waits for a</text>
  <text x="646.0" y="211" class="k">worker; a full</text>
  <text x="646.0" y="226" class="k">queue refused</text>
  <text x="769.6" y="196" class="k">slows, throttles</text>
  <text x="769.6" y="211" class="k">or stops</text>
  <text x="24" y="270" class="h">the client sees</text>
  <path d="M24.0,280 L24.0,288 L381.2,288 L381.2,280" fill="none" stroke="#9aa3ad" stroke-width="1"/>
  <text x="28.0" y="306" class="s">a closed TCP window: it slows down</text>
  <path d="M394.8,280 L394.8,288 L504.8,288 L504.8,280" fill="none" stroke="#9aa3ad" stroke-width="1"/>
  <text x="398.8" y="306" class="s">a retry-later answer</text>
  <path d="M518.4,280 L518.4,288 L628.4,288 L628.4,280" fill="none" stroke="#9aa3ad" stroke-width="1"/>
  <text x="522.4" y="306" class="s">a slower ack</text>
  <path d="M642.0,280 L642.0,288 L875.6,288 L875.6,280" fill="none" stroke="#9aa3ad" stroke-width="1"/>
  <text x="646.0" y="306" class="s">nothing directly: it arrives as paced writes,</text>
  <text x="646.0" y="321" class="s">refused shares and full receive pools</text>
  <text x="16" y="356" class="s">A link waits while what it would hold is not yet held, and refuses once it is. No link holds work in an unbounded queue to answer it later.</text>
</svg>
