<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <pattern id="zeroed" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#fdf1e3"/><line x1="0" y1="0" x2="0" y2="7" stroke="#d9a441" stroke-width="2"/>
    </pattern>
    <pattern id="freed" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#c3cad3" stroke-width="2"/>
    </pattern>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.rl{font-size:12px;font-weight:600;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
      .blk{fill:#f4f6f8;stroke:#9aa4b2;stroke-width:1.2}
      .live{fill:#eceff2;stroke:#9aa4b2;stroke-width:1.1}
      .req{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}
      .ax{stroke:#5b6472;stroke-width:1.2;fill:none}
    </style>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="16" y="26" class="t">A punch frees whole blocks only. The rest of the range is zeroed but stays allocated.</text>
  <text x="16" y="46" class="s">Filesystem blocks of 4 KiB. Measured identically on ext4, XFS and btrfs.</text>

  <text x="16" y="88" class="rl">filesystem</text><text x="16" y="104" class="s">blocks</text>
  <g>
    <rect x="150" y="76" width="130" height="38" class="blk"/><text x="200" y="100" class="m">b0</text>
    <rect x="280" y="76" width="130" height="38" class="blk"/><text x="330" y="100" class="m">b1</text>
    <rect x="410" y="76" width="130" height="38" class="blk"/><text x="460" y="100" class="m">b2</text>
    <rect x="540" y="76" width="130" height="38" class="blk"/><text x="590" y="100" class="m">b3</text>
    <rect x="670" y="76" width="130" height="38" class="blk"/><text x="720" y="100" class="m">b4</text>
  </g>

  <text x="16" y="152" class="rl">released</text><text x="16" y="168" class="s">extent</text>
  <rect x="350" y="140" width="370" height="34" rx="3" class="req"/>
  <text x="470" y="162" class="m">Release(this extent)</text>

  <text x="16" y="230" class="rl">result</text>
  <rect x="150" y="212" width="200" height="38" class="live"/><text x="210" y="236" class="s">untouched</text>
  <rect x="350" y="212" width="60"  height="38" fill="url(#zeroed)" stroke="#d9a441"/>
  <rect x="410" y="212" width="260" height="38" fill="url(#freed)" stroke="#9aa4b2" stroke-dasharray="4 3"/>
  <text x="490" y="236" class="s">b2, b3 deallocated</text>
  <rect x="670" y="212" width="50"  height="38" fill="url(#zeroed)" stroke="#d9a441"/>
  <rect x="720" y="212" width="80"  height="38" class="live"/><text x="730" y="236" class="s">untouched</text>

  <path d="M350,258 L350,268 L410,268 L410,258" class="ax"/>
  <text x="300" y="286" class="s" fill="#a8791f">zeroed, still allocated</text>
  <path d="M670,258 L670,268 L720,268 L720,258" class="ax"/>
  <text x="640" y="286" class="s" fill="#a8791f">zeroed, still allocated</text>

  <line x1="16" y1="308" x2="884" y2="308" stroke="#c3cad3"/>
  <text x="16" y="332" class="l"><tspan font-weight="600">Zeroing never leaves the requested range</tspan>, so a punch cannot damage a neighbouring record at any alignment.</text>
  <text x="16" y="354" class="l">But an extent that covers no whole block frees <tspan font-weight="600">nothing</tspan> — which is why Release reports freed separately.</text>
  <text x="16" y="382" class="s">Measured: punch[4196,12388) freed 4096 bytes, one whole block.  punch[100,400) and punch[4096,4608) freed 0.</text>
  <text x="16" y="402" class="s">Align anyway: APFS rejects an unaligned F_PUNCHHOLE with EINVAL, and on Linux aligning frees exactly the same bytes.</text>
  <text x="16" y="422" class="s">Storage stranded in the zeroed edges comes back through repack, not through more punching.</text>
</svg>
