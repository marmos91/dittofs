<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.g{font-size:11px;fill:#4c8a58}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .am{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="16" y="26" class="t">A protocol node's loss takes the session and its reply cache, never the client's state.</text>

  <rect x="310" y="44" width="280" height="44" rx="6" class="am"/>
  <text x="326" y="64" class="h">build01 — Linux, NFSv4.1</text>
  <text x="326" y="80" class="s">mounts builds via the floating address</text>

  <path d="M370,90 L220,130" class="ex" stroke-dasharray="4 3"/>
  <text x="150" y="108" class="e">connection reset</text>
  <path d="M530,90 L680,130" class="ln"/>
  <text x="620" y="108" class="s">reconnects at once</text>

  <rect x="40" y="134" width="320" height="96" rx="6" class="bad"/>
  <text x="56" y="156" class="h">P1 — protocol node, dies</text>
  <text x="56" y="176" class="l">session 1: up to 64 slots</text>
  <text x="56" y="194" class="l">reply cache, in memory only</text>
  <text x="56" y="214" class="e">both lost with the node</text>

  <path d="M362,170 L536,170" class="ln"/>
  <text x="378" y="162" class="s">floating address moves</text>

  <rect x="540" y="134" width="320" height="96" rx="6" class="pr"/>
  <text x="556" y="156" class="h">P2 — protocol node, takes the address</text>
  <text x="556" y="176" class="m">NFS4ERR_BADSESSION first</text>
  <text x="556" y="194" class="l">session 2, same client ID</text>
  <text x="556" y="214" class="l">reply cache starts empty</text>

  <path d="M200,232 L200,276" class="ln" stroke-dasharray="4 3"/>
  <path d="M700,232 L700,276" class="ln"/>
  <text x="212" y="258" class="s">every call forwarded to the file's primary</text>
  <text x="712" y="258" class="s">same, after the move</text>

  <rect x="40" y="280" width="820" height="84" rx="6" class="sv"/>
  <text x="56" y="302" class="h">S1 — primary of builds</text>
  <text x="56" y="322" class="l">RFC 14: client record, opens, locks, delegations, stateids</text>
  <text x="56" y="342" class="l">RFC 7: names, file handles, attributes, directory cookies</text>
  <text x="520" y="322" class="g">untouched by P1's loss:</text>
  <text x="520" y="340" class="g">no grace period runs</text>

  <text x="16" y="394" class="l">Lost: exactly-once for the three requests in flight. Resent on session 2, in new slots, they run again:</text>
  <text x="16" y="414" class="s">rewrite of the same 1 MiB — harmless  ·  exclusive create — succeeds, the stored verifier matches  ·  MKDIR — "already exists" for a directory build01 made</text>
</svg>
