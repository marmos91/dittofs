<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 592" width="900" height="592" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}.meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
.data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}.ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
.p{fill:#ffffff;stroke:#1b1f24;stroke-width:1.1}.k{fill:#fbefd9;stroke:#a8741f;stroke-width:1.3}.r{fill:#f8e3e6;stroke:#a33a4d;stroke-width:1.3}
.a{fill:#eaf4ec;stroke:#2f6f4f;stroke-width:1.3}
.arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#h)}.dash{stroke:#a33a4d;stroke-width:1.2;stroke-dasharray:5 3;fill:none;marker-end:url(#hr)}
.lane{stroke:#c3cad3;stroke-width:1;stroke-dasharray:3 3}
.garr{stroke:#2f6f4f;stroke-width:1.6;fill:none;marker-end:url(#hg)}.line{stroke:#5b6472;stroke-width:1.3;fill:none}
.rt{font-size:11px;fill:#a33a4d}.gt{font-size:11px;fill:#2f6f4f}
.tail{fill:#ffffff;stroke:#9aa4b2;stroke-width:1;stroke-dasharray:3 2}
.cp{stroke:#1b1f24;stroke-width:2}.jp{stroke:#a8741f;stroke-width:1.6;stroke-dasharray:4 3}
</style><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker><marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a33a4d"/></marker><marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6f4f"/></marker></defs>
<rect width="900" height="592" fill="#ffffff"/>
<text x="16" y="26" class="t">Moving a batch of files from shard G to shard R: freeze, ship, commit on both epochs, discard.</text>
<rect x="20" y="44" width="180" height="30" rx="4" class="ext"/>
<text x="110" y="64" class="h" text-anchor="middle">node A · G's primary</text>
<path d="M110 76V536" class="lane"/>
<rect x="240" y="44" width="180" height="30" rx="4" class="data"/>
<text x="330" y="64" class="h" text-anchor="middle">node B · R's primary</text>
<path d="M330 76V536" class="lane"/>
<rect x="455" y="44" width="190" height="30" rx="4" class="data"/>
<text x="550" y="64" class="h" text-anchor="middle">nodes C, D · R's replicas</text>
<path d="M550 76V536" class="lane"/>
<rect x="705" y="44" width="150" height="30" rx="4" class="meta"/>
<text x="780" y="64" class="h" text-anchor="middle">metadata store</text>
<path d="M780 76V536" class="lane"/>
<text x="338" y="96" class="s">raise R to e8 (> G's e7)</text>
<path d="M332 112H776" class="arr"/>
<text x="560" y="107" class="s">CAS R: e8</text>
<path d="M332 132H546" class="arr"/>
<text x="342" y="127" class="s">install e8</text>
<rect x="14" y="152" width="872" height="40" rx="4" fill="#f8e3e6" fill-opacity="0.45" stroke="none"/>
<text x="24" y="176" class="h">1 freeze</text>
<text x="96" y="176" class="s">A stops acknowledging writes, granting open state and serving reads for f1–f3, recalls their layouts, drains</text>
<path d="M112 222H326" class="arr"/>
<text x="114" y="217" class="s">2 ship: Export f1–f3 + open state + dedup</text>
<path d="M332 246H546" class="arr"/>
<text x="342" y="241" class="s">re-version at e8</text>
<path d="M548 270H334" class="arr"/>
<text x="342" y="265" class="s">durable</text>
<path d="M332 304H776" class="arr"/>
<text x="560" y="299" class="s">3 commit, one txn:</text>
<rect x="550" y="314" width="320" height="64" rx="4" class="p"/>
<text x="560" y="330" class="s">only if G still e7 and R still e8 > 7</text>
<text x="560" y="346" class="s">f1–f3: shard G → R; fences (R, e8)</text>
<text x="560" y="362" class="s">move record (G, R): cursor += 3</text>
<path d="M778 394H334" class="arr"/>
<text x="560" y="389" class="s">ok</text>
<text x="338" y="416" class="s">4 install open state; serve f1–f3</text>
<path d="M328 436H114" class="arr"/>
<text x="122" y="431" class="s">committed</text>
<rect x="30" y="448" width="250" height="34" rx="4" class="r"/>
<text x="40" y="462" class="s">A refuses f1–f3 from now on:</text>
<text x="40" y="476" class="s">routing error, front-end re-routes</text>
<rect x="30" y="492" width="250" height="34" rx="4" class="k"/>
<text x="40" y="506" class="s">5 Discard G's entries on G's set:</text>
<text x="40" y="520" class="s">B, C (in both) keep R's entries</text>
<text x="16" y="560" class="l">G = {A; B, C}   R = {B; C, D}. Every file is in exactly one shard between batches.</text>
<text x="16" y="578" class="s">A crash resumes from the move record's cursor; a changed epoch discards R's copy, re-freezes, re-ships.</text>
</svg>
