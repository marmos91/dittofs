<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 694" width="900" height="694" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}.meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
.data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}.ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
.p{fill:#ffffff;stroke:#1b1f24;stroke-width:1.1}.k{fill:#fbefd9;stroke:#a8741f;stroke-width:1.3}.r{fill:#f8e3e6;stroke:#a33a4d;stroke-width:1.3}
.a{fill:#eaf4ec;stroke:#2f6f4f;stroke-width:1.3}
.arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#h)}.dash{stroke:#a33a4d;stroke-width:1.2;stroke-dasharray:5 3;fill:none;marker-end:url(#hr)}
.lane{stroke:#c3cad3;stroke-width:1;stroke-dasharray:3 3}
.garr{stroke:#2f6f4f;stroke-width:1.6;fill:none;marker-end:url(#hg)}.line{stroke:#5b6472;stroke-width:1.3;fill:none}
.rt{font-size:11px;fill:#a33a4d}.gt{font-size:11px;fill:#2f6f4f}
.tail{fill:#ffffff;stroke:#9aa4b2;stroke-width:1;stroke-dasharray:3 2}
.cp{stroke:#1b1f24;stroke-width:2}.jp{stroke:#a8741f;stroke-width:1.6;stroke-dasharray:4 3}
</style><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker><marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a33a4d"/></marker><marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6f4f"/></marker></defs>
<rect width="900" height="694" fill="#ffffff"/>
<text x="16" y="26" class="t">Takeover: claim by compare-and-swap, install the new epoch, seal, then serve.</text>
<rect x="20" y="44" width="140" height="30" rx="4" class="ext"/>
<text x="90" y="64" class="h" text-anchor="middle">old primary A</text>
<path d="M90 76V584" class="lane"/>
<rect x="225" y="44" width="150" height="30" rx="4" class="meta"/>
<text x="300" y="64" class="h" text-anchor="middle">metadata store</text>
<path d="M300 76V584" class="lane"/>
<rect x="440" y="44" width="180" height="30" rx="4" class="data"/>
<text x="530" y="64" class="h" text-anchor="middle">replica B (claimant)</text>
<path d="M530 76V584" class="lane"/>
<rect x="690" y="44" width="140" height="30" rx="4" class="data"/>
<text x="760" y="64" class="h" text-anchor="middle">replica C</text>
<path d="M760 76V584" class="lane"/>
<rect x="40" y="96" width="100" height="20" rx="4" class="r"/>
<text x="90" y="110" class="s" text-anchor="middle">A paused</text>
<text x="308" y="110" class="s">A's node lease lapses (store time)</text>
<path d="M526 142H304" class="arr"/>
<text x="316" y="137" class="s">claim: CAS to epoch e+1</text>
<text x="316" y="158" class="s">only a non-learner replica</text>
<text x="316" y="172" class="s">whose journal id matches</text>
<path d="M304 196H526" class="arr"/>
<text x="316" y="191" class="s">won</text>
<text x="538" y="218" class="s">install e+1 durably on self</text>
<path d="M532 240H756" class="arr"/>
<text x="548" y="235" class="s">install e+1</text>
<path d="M758 260H534" class="arr"/>
<text x="640" y="255" class="s">durable</text>
<text x="768" y="278" class="s">refuses &lt; e+1</text>
<path d="M92 306H756" class="dash"/>
<text x="108" y="301" class="rt">late op at epoch e (A resumes)</text>
<rect x="766" y="296" width="70" height="20" rx="4" class="r"/>
<text x="801" y="310" class="s" text-anchor="middle">refused</text>
<rect x="14" y="322" width="872" height="138" rx="4" fill="#fbefd9" fill-opacity="0.45" stroke="none"/>
<text x="24" y="340" class="h">seal</text>
<path d="M532 352H756" class="arr"/>
<text x="548" y="347" class="s">gather ops above</text>
<path d="M758 370H534" class="arr"/>
<text x="640" y="365" class="s">its ops</text>
<text x="538" y="390" class="s">union; base = max committed point</text>
<text x="538" y="406" class="s">re-issue uncertain range at e+1</text>
<path d="M532 428H756" class="arr"/>
<text x="548" y="423" class="s">re-issues</text>
<path d="M758 450H534" class="arr"/>
<text x="620" y="445" class="s">durable ack</text>
<path d="M92 482H296" class="dash"/>
<text x="108" y="477" class="rt">late commit (epoch e)</text>
<rect x="306" y="472" width="196" height="20" rx="4" class="r"/>
<text x="404" y="486" class="s" text-anchor="middle">refused: past A's lease expiry</text>
<path d="M526 516H304" class="arr"/>
<text x="316" y="511" class="s">re-apply existence, fenced</text>
<path d="M304 536H526" class="arr"/>
<text x="316" y="531" class="s">ok</text>
<text x="538" y="556" class="s">committed point := sealed point</text>
<path d="M532 576H756" class="arr"/>
<text x="548" y="571" class="s">committed point</text>
<rect x="420" y="594" width="300" height="40" rx="4" class="a"/>
<text x="432" y="611" class="h">B serves writes at epoch e+1</text>
<text x="432" y="627" class="s">open-state grace starts</text>
<text x="16" y="662" class="l">Nothing waits on the old primary: replicas refuse its epoch, the metadata store refuses its commits by store time.</text>
<text x="16" y="680" class="s">Every acknowledged write sits on every kept replica, so the union of their ops above the max committed point holds it.</text>
</svg>
