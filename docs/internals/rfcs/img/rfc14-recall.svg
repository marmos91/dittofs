<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}.sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
.st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}.pe{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
.rf{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}.box{fill:#ffffff;stroke:#5b6472;stroke-width:1}
.arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#h)}
.rarr{stroke:#b04a4a;stroke-width:1.3;fill:none;marker-end:url(#hr)}
.garr{stroke:#4c8a58;stroke-width:1.5;fill:none;marker-end:url(#hg)}
.aarr{stroke:#b07a2a;stroke-width:1.3;fill:none;marker-end:url(#ha)}
.lane{stroke:#c3cad3;stroke-width:1;stroke-dasharray:3 3}
.rt{font-size:11px;fill:#b04a4a}.gt{font-size:11px;fill:#4c8a58}.at{font-size:11px;fill:#b07a2a}
</style>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker>
<marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b04a4a"/></marker>
<marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4c8a58"/></marker>
<marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b07a2a"/></marker>
</defs>
<rect width="900" height="616" fill="#ffffff"/>
<text x="16" y="26" class="t">A recall ends by acknowledgement or at its deadline; the other client never waits on a worker.</text>
<rect x="40" y="44" width="160" height="30" rx="4" class="pr"/>
<text x="120" y="64" class="h" text-anchor="middle">build01 (holder)</text>
<rect x="370" y="44" width="160" height="30" rx="4" class="sv"/>
<text x="450" y="64" class="h" text-anchor="middle">primary</text>
<rect x="700" y="44" width="160" height="30" rx="4" class="pr"/>
<text x="780" y="64" class="h" text-anchor="middle">alice-pc (SMB)</text>
<path d="M120 76V560" class="lane"/><path d="M450 76V560" class="lane"/><path d="M780 76V560" class="lane"/>
<rect x="70" y="88" width="100" height="34" rx="4" class="box"/>
<text x="120" y="102" class="s" text-anchor="middle">write delegation</text>
<text x="120" y="116" class="s" text-anchor="middle">on config.json</text>
<path d="M776 108H454" class="arr"/>
<text x="470" y="102" class="s">open config.json for writing</text>
<text x="458" y="132" class="s">conflicts with the grant</text>
<path d="M446 156H124" class="arr"/>
<text x="140" y="150" class="s">recall, in the holder's own protocol</text>
<rect x="132" y="162" width="300" height="34" rx="4" class="pe"/>
<text x="142" y="176" class="s">deadline starts: NFS delegation, one lease period</text>
<text x="142" y="190" class="s">(90 s); SMB lease or oplock break, 35 s</text>
<path d="M454 216H776" class="arr"/>
<text x="470" y="210" class="s">ErrDelay: SMB pending reply, NFS DELAY</text>
<text x="470" y="236" class="s">the request holds no worker while it waits</text>
<rect x="14" y="254" width="872" height="104" rx="4" fill="#eef5ee" fill-opacity="0.6" stroke="none"/>
<text x="24" y="272" class="gt">acknowledged</text>
<path d="M124 290H446" class="arr"/>
<text x="140" y="284" class="s">buffered writes, as ordinary writes</text>
<path d="M124 318H446" class="arr"/>
<text x="140" y="312" class="s">DELEGRETURN, or the break acknowledgement</text>
<path d="M454 342H776" class="garr"/>
<text x="470" y="336" class="gt">open proceeds; nothing is merged</text>
<rect x="14" y="370" width="872" height="180" rx="4" fill="#f8eaea" fill-opacity="0.6" stroke="none"/>
<text x="24" y="388" class="rt">no answer by the deadline</text>
<rect x="60" y="398" width="120" height="22" rx="4" class="rf"/>
<text x="120" y="413" class="s" text-anchor="middle">network failed</text>
<rect x="240" y="400" width="420" height="50" rx="4" class="rf"/>
<text x="252" y="418" class="s">NFS delegation: revoked. SEQ4_STATUS_RECALLABLE_STATE_REVOKED</text>
<text x="252" y="434" class="s">until FREE_STATEID; the stateid joins the client's revoked set.</text>
<rect x="240" y="456" width="420" height="34" rx="4" class="pe"/>
<text x="252" y="477" class="s">SMB lease or oplock: downgraded to none; its opens stay open.</text>
<path d="M454 506H776" class="garr"/>
<text x="470" y="500" class="gt">open proceeds</text>
<path d="M124 530H446" class="rarr" stroke-dasharray="5 3"/>
<text x="140" y="524" class="rt">a late write under the grant (NFS)</text>
<rect x="456" y="519" width="200" height="22" rx="4" class="rf"/>
<text x="556" y="534" class="s" text-anchor="middle">refused: ErrRevoked</text>
<rect x="20" y="566" width="860" height="40" rx="4" class="pe"/>
<text x="32" y="583" class="h">Fence: build01 is offered no grants for 90 s</text>
<text x="32" y="598" class="s">Its other grants SHOULD be recalled. Each further revocation or timed-out break restarts the period.</text>
</svg>
