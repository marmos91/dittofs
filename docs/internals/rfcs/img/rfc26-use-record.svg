<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.blue{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}.green{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
.grey{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}.amber{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
.red{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}.w{fill:#ffffff;stroke:#5b6472;stroke-width:1}
.arr{stroke:#5b6472;stroke-width:1.4;fill:none;marker-end:url(#h)}
.rarr{stroke:#b04a4a;stroke-width:1.4;fill:none;marker-end:url(#hr)}
.rt{font-size:11px;fill:#b04a4a}.row{stroke:#c3cad3;stroke-width:1}
</style>
<marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker>
<marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b04a4a"/></marker></defs>
<rect width="900" height="470" fill="#ffffff"/>
<text x="16" y="26" class="t">A use record pins a snapshot while a reader needs its refs; a deletion checks it and fails closed.</text>

<rect x="16" y="48" width="220" height="56" rx="5" class="grey"/>
<text x="28" y="70" class="h">snapshot 12 · complete</text>
<text x="28" y="88" class="s">its refs keep the blocks counted</text>

<rect x="16" y="140" width="220" height="104" rx="5" class="amber"/>
<text x="28" y="160" class="h">use record on 12</text>
<text x="28" y="178" class="s">written in the transaction that</text>
<text x="28" y="194" class="s">starts the reader, which needs</text>
<text x="28" y="210" class="s">the snapshot complete; a deadline</text>
<text x="28" y="226" class="s">the reader renews while it runs</text>
<path d="M126 140 V106" class="arr"/>
<text x="134" y="128" class="s">holds</text>

<rect x="16" y="290" width="220" height="70" rx="5" class="red"/>
<text x="28" y="310" class="h">delete snapshot 12</text>
<text x="28" y="328" class="s">checks the use record, not the</text>
<text x="28" y="344" class="s">location: refused while one exists</text>
<path d="M126 290 V246" class="rarr"/>
<text x="134" y="272" class="rt">conflicts</text>

<text x="268" y="62" class="h">reader</text>
<text x="420" y="62" class="h">its use record is deleted …</text>
<line x1="264" y1="70" x2="884" y2="70" class="row"/>
<text x="268" y="90" class="l">clone or restore</text>
<text x="420" y="90" class="s">at publish, or on failure</text>
<line x1="264" y1="102" x2="884" y2="102" class="row"/>
<text x="268" y="122" class="l">catalog backup</text>
<text x="420" y="122" class="s">at expiry, or when a re-home of its share finishes (its parking then holds</text>
<text x="420" y="138" class="s">the blocks). Completion only clears the deadline: it holds no blocks of its own.</text>
<line x1="264" y1="150" x2="884" y2="150" class="row"/>
<text x="268" y="170" class="l">copying backup</text>
<text x="420" y="170" class="s">at complete: its blocks are then its own, in the block folder</text>
<line x1="264" y1="182" x2="884" y2="182" class="row"/>
<text x="268" y="202" class="l">move</text>
<text x="420" y="202" class="s">when B has published or A has aborted; it has no deadline</text>
<line x1="264" y1="214" x2="884" y2="214" class="row"/>
<text x="268" y="234" class="l">abandoned reader</text>
<text x="420" y="234" class="s">deadline past: a backup still writing with no export digest is marked failed</text>
<text x="420" y="250" class="s">(a clone's or restore's staging is dropped) and only then is it deleted.</text>
<text x="420" y="266" class="s">A backup whose record names a digest is completed instead, never re-exported.</text>
<line x1="264" y1="278" x2="884" y2="278" class="row"/>

<rect x="264" y="296" width="620" height="64" rx="5" class="green"/>
<text x="276" y="316" class="l">While it lives, the refs snapshot 12 sees keep every block the backup names counted,</text>
<text x="276" y="333" class="l">so GC sweeps none of them. A backup adds no second liveness mechanism.</text>
<text x="276" y="350" class="s">Deletion never reads the backup location, so an unreachable one makes it fail closed.</text>

<text x="16" y="394" class="h">Expiry runs in this order, never the reverse:</text>
<rect x="16" y="404" width="196" height="32" rx="4" class="amber"/>
<text x="26" y="424" class="s">mark expired: location, record</text>
<path d="M212 420 H234" class="arr"/>
<rect x="236" y="404" width="180" height="32" rx="4" class="w"/>
<text x="246" y="424" class="s">delete the use record, if any</text>
<path d="M416 420 H438" class="arr"/>
<rect x="440" y="404" width="140" height="32" rx="4" class="w"/>
<text x="450" y="424" class="s">remove the export</text>
<path d="M580 420 H602" class="arr"/>
<rect x="604" y="404" width="170" height="32" rx="4" class="w"/>
<text x="614" y="424" class="s">delete the backup record</text>
<text x="16" y="456" class="rt">The reverse order lets a crash leave a restorable backup whose blocks were swept; an expired backup is never restored.</text>
</svg>
