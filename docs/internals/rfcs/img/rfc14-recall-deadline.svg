<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 686" width="900" height="686" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a58"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.ok{font-size:11px;font-weight:600;fill:#4c8a58}
      .no{font-size:12px;font-weight:700;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.4}
      .dr{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .gl{stroke:#4c8a58;stroke-width:1.8;fill:none;marker-end:url(#g)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .life{stroke:#9aa3ad;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="686" fill="#ffffff"/>
  <text x="16" y="26" class="t">A recall nobody answers is revoked at its deadline; the conflicting open then proceeds.</text>

  <rect x="20" y="40" width="120" height="36" rx="5" class="pr"/><text x="32" y="62" class="h">build01 (holder)</text>
  <rect x="190" y="40" width="120" height="36" rx="5" class="pr"/><text x="210" y="62" class="h">NFS adapter</text>
  <rect x="380" y="40" width="140" height="36" rx="5" class="sv"/><text x="396" y="62" class="h">open state, primary</text>
  <rect x="590" y="40" width="120" height="36" rx="5" class="pr"/><text x="610" y="62" class="h">SMB adapter</text>
  <rect x="760" y="40" width="120" height="36" rx="5" class="pr"/><text x="790" y="62" class="h">alice-pc</text>
  <path d="M80,78 L80,532" class="life"/><path d="M250,78 L250,532" class="life"/><path d="M450,78 L450,532" class="life"/>
  <path d="M650,78 L650,532" class="life"/><path d="M820,78 L820,532" class="life"/>

  <text x="96" y="98" class="s">write delegation on config.json</text>
  <text x="664" y="100" class="m">CREATE config.json</text><path d="M820,106 L652,106" class="ln"/>
  <text x="520" y="124" class="m">Open, for write</text><path d="M650,130 L452,130" class="ln"/>
  <text x="312" y="148" class="m">RecallGrant</text><path d="M450,154 L252,154" class="ln"/>
  <text x="130" y="172" class="m">CB_RECALL</text><path d="M250,178 L82,178" class="ex"/>
  <text x="92" y="196" class="e">never answered:</text>
  <text x="92" y="211" class="e">its network failed</text>
  <text x="470" y="172" class="m">ErrDelay, at once</text><path d="M450,178 L648,178" class="ln"/>
  <text x="666" y="196" class="m">interim: pending</text><path d="M650,202 L818,202" class="ln"/>

  <rect x="442" y="190" width="16" height="140" rx="3" class="dr"/>
  <text x="466" y="246" class="s">recall deadline, from send:</text>
  <text x="466" y="261" class="s">one lease period, 90 s</text>
  <text x="466" y="282" class="ok">no worker waits</text>
  <text x="660" y="246" class="s">the adapter</text>
  <text x="660" y="261" class="s">re-drives it</text>

  <text x="276" y="346" class="m">Revoked (the grant)</text><path d="M450,352 L252,352" class="ex"/>
  <text x="470" y="346" class="e">deadline passed: revoked</text>
  <text x="510" y="370" class="m">Open, retried</text><path d="M650,376 L452,376" class="ln"/>
  <text x="480" y="394" class="ok">OK: the open is granted</text><path d="M450,400 L648,400" class="gl"/>
  <text x="726" y="418" class="ok">OK</text><path d="M650,424 L818,424" class="gl"/>

  <text x="92" y="450" class="m">WRITE, deleg stateid</text><path d="M80,456 L248,456" class="ln"/>
  <text x="330" y="474" class="m">Write</text><path d="M250,480 L448,480" class="ln"/>
  <text x="300" y="498" class="m">ErrRevoked</text><path d="M450,504 L252,504" class="ex"/>
  <text x="104" y="522" class="m">revoked</text><path d="M250,528 L82,528" class="ex"/>

  <rect x="24" y="550" width="420" height="96" rx="6" class="dr"/>
  <text x="36" y="569" class="h">The fence after a revoke</text>
  <text x="36" y="586" class="s">build01 is offered no grant at this primary for one lease</text>
  <text x="36" y="601" class="s">period, 90 s; each further revoke restarts it, and its other</text>
  <text x="36" y="616" class="s">grants end by their own recalls. Its RecallableRevoked</text>
  <text x="36" y="631" class="s">flag is set until it frees the reference.</text>

  <rect x="456" y="550" width="420" height="96" rx="6" class="pr"/>
  <text x="468" y="569" class="h">Had the holder been an SMB lease</text>
  <text x="468" y="586" class="s">The break is forced at 35 s and drops the lease to none.</text>
  <text x="468" y="601" class="s">The opens it covered stay, with their locks and deny</text>
  <text x="468" y="616" class="s">modes, and the holder may keep writing through them,</text>
  <text x="468" y="631" class="s">as Windows does: nothing it sends is refused.</text>

  <text x="16" y="670" class="s">The conflicting caller is answered at once and retries; the deadline is a timer at the primary, started when the recall is sent.</text>
</svg>
