<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a58"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.z{font-size:11px;font-weight:700;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.4}
      .dr{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.4}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .gl{stroke:#4c8a58;stroke-width:1.8;fill:none;marker-end:url(#g)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="450" fill="#ffffff"/>
  <text x="16" y="26" class="t">Adapters sign in, the gateway forwards, the filesystem decides.</text>

  <!-- a single node -->
  <rect x="16" y="40" width="226" height="370" rx="8" class="zone"/>
  <text x="28" y="58" class="z">A SINGLE NODE</text>
  <rect x="28" y="70" width="202" height="48" rx="5" class="pr"/>
  <text x="40" y="89" class="h">adapters</text><text x="40" y="106" class="s">wire only; sign in (RFC 18)</text>
  <path d="M129,120 L129,170" class="ln"/>
  <text x="137" y="150" class="m">vfs.Service</text>
  <rect x="28" y="172" width="202" height="76" rx="5" class="sv"/>
  <text x="40" y="191" class="m">*vfs.Filesystem</text>
  <text x="40" y="208" class="s">admission, identity, squash,</text>
  <text x="40" y="223" class="s">ordering, open state,</text>
  <text x="40" y="238" class="s">metadata and content</text>
  <path d="M129,250 L129,300" class="ln"/>
  <rect x="28" y="302" width="202" height="58" rx="5" class="st"/>
  <text x="40" y="321" class="h">below the filesystem</text>
  <text x="40" y="338" class="s">metadata store, engine,</text>
  <text x="40" y="352" class="s">open state, identity</text>
  <text x="28" y="388" class="s">no gateway, no Serve:</text>
  <text x="28" y="402" class="s">the adapters call the filesystem</text>

  <!-- node A: the gateway node -->
  <rect x="258" y="40" width="300" height="370" rx="8" class="zone"/>
  <text x="270" y="58" class="z">NODE A — THE GATEWAY NODE</text>
  <rect x="270" y="70" width="276" height="48" rx="5" class="pr"/>
  <text x="282" y="89" class="h">adapters</text><text x="282" y="106" class="s">hold a vfs.Service; cannot tell which</text>
  <path d="M408,120 L408,170" class="ln"/>
  <text x="416" y="150" class="m">vfs.Service</text>
  <rect x="270" y="172" width="276" height="62" rx="5" class="dr"/>
  <text x="282" y="191" class="m">*vfs.Gateway</text>
  <text x="282" y="208" class="s">routes each call to its file's primary;</text>
  <text x="282" y="223" class="s">no auth, no admission, no file logic</text>
  <rect x="284" y="252" width="118" height="40" rx="4" class="st"/>
  <text x="294" y="269" class="m">Router</text><text x="294" y="284" class="s">shard records</text>
  <rect x="418" y="252" width="128" height="40" rx="4" class="st"/>
  <text x="428" y="269" class="m">Transport</text><text x="428" y="284" class="s">node channel</text>
  <path d="M340,236 L340,250" class="ln"/><path d="M500,236 L500,250" class="ln"/>
  <path d="M270,203 L264,203 L264,350 L268,350" class="gl"/>
  <text x="284" y="309" class="s">local: the checked Service (fence, dedup)</text>
  <rect x="270" y="320" width="276" height="62" rx="5" class="sv"/>
  <text x="282" y="339" class="m">*vfs.Filesystem</text>
  <text x="282" y="356" class="s">this node's shards; and the leases of</text>
  <text x="282" y="371" class="s">the clients connected here</text>

  <!-- node B: the primary -->
  <rect x="574" y="40" width="310" height="370" rx="8" class="zone"/>
  <text x="586" y="58" class="z">NODE B — THE FILE'S PRIMARY</text>
  <path d="M548,272 L586,272 L586,200 L598,200" class="gl"/>
  <text x="600" y="164" class="s">route envelope, over Transport</text>
  <rect x="600" y="172" width="272" height="62" rx="5" class="dr"/>
  <text x="612" y="191" class="m">vfs.Serve</text>
  <text x="612" y="208" class="s">fence: node epoch, shard epoch, hop 0;</text>
  <text x="612" y="223" class="s">dedup by request ID</text>
  <path d="M736,236 L736,250" class="ln"/>
  <text x="744" y="248" class="m">vfs.Service</text>
  <rect x="600" y="252" width="272" height="62" rx="5" class="sv"/>
  <text x="612" y="271" class="m">*vfs.Filesystem</text>
  <text x="612" y="288" class="s">decides the call: admission, identity,</text>
  <text x="612" y="303" class="s">open state, quota, the engine's write</text>
  <path d="M736,316 L736,332" class="ln"/>
  <rect x="600" y="334" width="272" height="48" rx="5" class="st"/>
  <text x="612" y="353" class="h">below the filesystem</text>
  <text x="612" y="370" class="s">metadata store, engine, open state</text>
  <rect x="600" y="70" width="272" height="48" rx="5" class="pr"/>
  <text x="612" y="89" class="h">adapters, a gateway</text><text x="612" y="106" class="s">node B is a gateway node for its own clients</text>

  <text x="16" y="432" class="s">Every node builds the filesystem; a cluster node also builds Serve and the gateway, which holds Serve's checked vfs.Service, never a *vfs.Filesystem.</text>
</svg>
