<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3ad"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:13px;font-weight:700;fill:#1b1f24}
      .s{font-size:12px;fill:#5b6472}.e{font-size:12px;fill:#b04a4a}.z{font-size:11px;font-weight:700;fill:#5b6472}
      .k{font-size:12px;fill:#1b1f24}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;fill:#1b1f24}
      .ms{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .am{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .rd{fill:#fbecec;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.3;fill:none;marker-end:url(#r)}
      .lane{stroke:#c3c9d0;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
      .q{font-size:12px;fill:#8a929c}
      .k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#1b1f24}
      .lt{stroke:#9aa3ad;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#l)}
    </style>
  </defs>
  <rect width="900" height="750" fill="#ffffff"/>
  <text x="16" y="26" class="t">Creating a principal: the API checks and writes; every node learns of it from the principals generation.</text>

  <rect x="456" y="38" width="314" height="76" rx="8" class="zone"/>
  <text x="468" y="54" class="z">EVERY NODE</text>

  <rect x="10" y="62" width="100" height="44" rx="5" class="pr"/><text x="20" y="80" class="h">operator</text><text x="20" y="98" class="s">CLI, any client</text>
  <rect x="130" y="62" width="138" height="44" rx="5" class="st"/><text x="140" y="80" class="h">management API</text><text x="140" y="98" class="s">any node (RFC 23)</text>
  <rect x="290" y="62" width="144" height="44" rx="5" class="st"/><text x="300" y="80" class="h">metadata store</text><text x="300" y="98" class="m">ControlPlane</text>
  <rect x="464" y="62" width="126" height="44" rx="5" class="sv"/><text x="474" y="80" class="h">the node</text><text x="474" y="98" class="s">reconciles</text>
  <rect x="616" y="62" width="146" height="44" rx="5" class="sv"/><text x="626" y="80" class="h">identity</text><text x="626" y="98" class="s">caches, Authenticator</text>
  <rect x="778" y="62" width="114" height="44" rx="5" class="pr"/><text x="788" y="80" class="h">file client</text><text x="788" y="98" class="s">adapter, vfs</text>

  <line x1="60" y1="116" x2="60" y2="616" class="lane"/>
  <line x1="199" y1="116" x2="199" y2="616" class="lane"/>
  <line x1="362" y1="116" x2="362" y2="616" class="lane"/>
  <line x1="527" y1="116" x2="527" y2="616" class="lane"/>
  <line x1="689" y1="116" x2="689" y2="616" class="lane"/>
  <line x1="835" y1="116" x2="835" y2="616" class="lane"/>

  <path d="M62,146 L195,146" class="ln"/>
  <text x="66" y="140" class="k">1 POST /users</text>
  <text x="66" y="160" class="s">Idempotency-Key;</text><text x="66" y="174" class="s">uid, SID, email optional</text>

  <rect x="120" y="190" width="160" height="24" rx="5" class="st"/>
  <text x="128" y="206" class="s">2 the role check (RFC 23)</text>

  <rect x="120" y="222" width="160" height="66" rx="5" class="st"/>
  <text x="128" y="238" class="s">3 validate: no ID is</text><text x="128" y="253" class="s">defaulted, 0 and 65534</text><text x="128" y="268" class="s">refused; email valid</text><text x="128" y="283" class="s">or absent</text>
  <rect x="120" y="294" width="160" height="22" rx="5" class="rd"/>
  <text x="128" y="309" class="e">invalid: ErrInvalid</text>

  <path d="M201,340 L358,340" class="ln"/>
  <text x="205" y="334" class="m">4 PutUser(u, 0, alloc)</text>
  <text x="205" y="354" class="s">create-only, one transaction</text>

  <rect x="280" y="366" width="184" height="96" rx="5" class="st"/>
  <text x="288" y="382" class="s">the record and its index</text><text x="288" y="397" class="s">rows, unique per scheme;</text><text x="288" y="412" class="s">named IDs allocated, never</text><text x="288" y="427" class="s">reused, none for an API-only</text><text x="288" y="442" class="s">account; PGEN raised;</text><text x="288" y="457" class="s">the audit record</text>
  <rect x="280" y="468" width="184" height="34" rx="5" class="rd"/>
  <text x="288" y="482" class="e">a spelling held, or the</text><text x="288" y="496" class="e">record exists: refused</text>

  <path d="M197,520 L64,520" class="ln"/>
  <text x="66" y="514" class="s">5 created, ETag</text>

  <path d="M525,536 L366,536" class="ln"/>
  <text x="372" y="530" class="s">6 read PGEN, once a second</text>
  <path d="M364,556 L523,556" class="cb"/>
  <text x="372" y="572" class="s">the new value</text>

  <path d="M529,576 L685,576" class="ln"/>
  <text x="535" y="570" class="m">7 Apply(gen)</text>
  <text x="535" y="590" class="s">older entries not served</text>

  <path d="M833,604 L693,604" class="ln"/>
  <text x="699" y="598" class="s">8 next sign-in or call,</text><text x="699" y="614" class="s">via vfs.Service</text>

  <text x="16" y="642" class="s">Within a second of the commit (§7.2); the node whose API wrote it applies it at once. A Kerberos name binds by §4.2, NTLM once a</text>
  <text x="16" y="658" class="s">password is set, an AUTH_SYS uid by the uid index.</text>

  <line x1="16" y1="670" x2="884" y2="670" stroke="#d6dbe0" stroke-width="1"/>
  <text x="16" y="688" class="z">OTHER OPERATOR PATH</text>
  <path d="M62,718 L358,718" class="lt"/>
  <text x="66" y="712" class="q">PATCH /users/{id}, If-Match</text>
  <text x="372" y="722" class="q">link an OIDC subject: the oidc spelling allocates nothing and gives no file access</text>
  <text x="16" y="742" class="q">Identity's own mints (a directory user at first lookup, a machine at first sign-in) go through Minter.CreateUser, never the API.</text>
</svg>
