<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3ad"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.z{font-size:11px;font-weight:700;fill:#5b6472}
      .q{font-size:11px;fill:#8a929c}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#3d444d}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .lt{stroke:#9aa3ad;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#l)}
      .ex{stroke:#b04a4a;stroke-width:1.3;fill:none;marker-end:url(#r)}
      .lane{stroke:#c3c9d0;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="710" fill="#ffffff"/>
  <text x="16" y="26" class="t">Creating a principal: the API checks and writes; every node learns of it from the principals generation.</text>

  <rect x="456" y="38" width="314" height="76" rx="8" class="zone"/>
  <text x="468" y="54" class="z">EVERY NODE</text>

  <rect x="12" y="62" width="96" height="44" rx="5" class="pr"/><text x="22" y="80" class="h">operator</text><text x="22" y="97" class="s">CLI, any client</text>
  <rect x="136" y="62" width="126" height="44" rx="5" class="sv"/><text x="146" y="80" class="h">management API</text><text x="146" y="97" class="s">any node (RFC 23)</text>
  <rect x="294" y="62" width="136" height="44" rx="5" class="st"/><text x="304" y="80" class="h">metadata store</text><text x="304" y="97" class="m">ControlPlane</text>
  <rect x="464" y="62" width="126" height="44" rx="5" class="sv"/><text x="474" y="80" class="h">the node</text><text x="474" y="97" class="s">reconciles (§2.3)</text>
  <rect x="616" y="62" width="146" height="44" rx="5" class="sv"/><text x="626" y="80" class="h">identity</text><text x="626" y="97" class="s">caches, Authenticator</text>
  <rect x="790" y="62" width="98" height="44" rx="5" class="pr"/><text x="800" y="80" class="h">file client</text><text x="800" y="97" class="s">via an adapter</text>

  <line x1="60" y1="116" x2="60" y2="598" class="lane"/>
  <line x1="199" y1="116" x2="199" y2="598" class="lane"/>
  <line x1="362" y1="116" x2="362" y2="598" class="lane"/>
  <line x1="527" y1="116" x2="527" y2="598" class="lane"/>
  <line x1="689" y1="116" x2="689" y2="598" class="lane"/>
  <line x1="839" y1="116" x2="839" y2="598" class="lane"/>

  <path d="M62,146 L195,146" class="ln"/>
  <text x="66" y="140" class="k">1 POST /users</text>
  <text x="66" y="160" class="s">Idempotency-Key;</text><text x="66" y="174" class="s">uid, SID, email optional</text>

  <rect x="128" y="186" width="142" height="38" rx="5" class="sv"/>
  <text x="136" y="202" class="s">2 role: operator, or admin</text><text x="136" y="217" class="s">for an account with a role</text>
  <text x="128" y="238" class="e">no right: refused</text>

  <rect x="128" y="250" width="142" height="66" rx="5" class="sv"/>
  <text x="136" y="266" class="s">3 validate: no ID is</text><text x="136" y="281" class="s">defaulted, 65534 refused;</text><text x="136" y="296" class="s">email a valid address</text><text x="136" y="311" class="s">or absent</text>
  <text x="128" y="330" class="e">invalid: ErrInvalid</text>

  <path d="M201,356 L358,356" class="ln"/>
  <text x="205" y="350" class="m">4 PutUser(u, expect 0)</text>
  <text x="205" y="370" class="s">create-only; one transaction</text>

  <rect x="290" y="380" width="144" height="80" rx="5" class="st"/>
  <text x="298" y="396" class="s">the record, its index rows</text><text x="298" y="411" class="s">(unique per scheme), a</text><text x="298" y="426" class="s">missing uid, gid, SID</text><text x="298" y="441" class="s">allocated, never reused;</text><text x="298" y="455" class="s">PGEN raised, audit record</text>
  <text x="290" y="474" class="e">spelling held, or exists: refused</text>

  <path d="M197,490 L64,490" class="ln"/>
  <text x="66" y="484" class="s">5 created, its ETag</text>

  <path d="M364,512 L523,512" class="ln"/>
  <text x="372" y="506" class="s">6 PGEN, read once a</text><text x="372" y="526" class="s">second on every node</text>

  <path d="M529,540 L685,540" class="ln"/>
  <text x="535" y="534" class="m">7 Apply(gen)</text>
  <text x="535" y="554" class="s">older entries not served</text>

  <path d="M837,580 L693,580" class="ln"/>
  <text x="699" y="574" class="s">8 next sign-in or</text><text x="699" y="594" class="s">call binds to it</text>

  <text x="16" y="620" class="s">Within a second of the commit (§7.2): a Kerberos name by §4.2, NTLM once a password is set, an AUTH_SYS uid by the uid index.</text>

  <line x1="16" y1="634" x2="884" y2="634" stroke="#d6dbe0" stroke-width="1"/>
  <text x="16" y="652" class="z">OTHER PATHS</text>
  <path d="M687,666 L366,666" class="lt"/>
  <text x="372" y="660" class="q">a directory or machine principal, minted by identity</text>
  <text x="700" y="670" class="q">at first sign-in or lookup:</text><text x="700" y="684" class="q">Minter.CreateUser, not the API</text>
  <path d="M62,690 L195,690" class="lt"/><path d="M201,690 L358,690" class="lt"/>
  <text x="66" y="684" class="q">PATCH /users/{id}</text>
  <text x="205" y="684" class="q">If-Match</text>
  <text x="372" y="694" class="q">link an OIDC subject: its oidc spelling allocates nothing, gives no file access</text>
</svg>
