<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}.z{font-size:11px;font-weight:700;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .am{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.3;fill:none;marker-end:url(#r)}
      .lane{stroke:#c3c9d0;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="650" fill="#ffffff"/>
  <text x="16" y="26" class="t">Sign-in: one round at a time, on the node holding the connection; it binds the proof to one principal.</text>

  <rect x="112" y="38" width="424" height="76" rx="8" class="zone"/>
  <text x="124" y="54" class="z">THE NODE HOLDING THE CONNECTION — NEVER FORWARDED</text>

  <rect x="14" y="62" width="80" height="44" rx="5" class="pr"/><text x="24" y="80" class="h">client</text><text x="24" y="97" class="s">NFS or SMB</text>
  <rect x="122" y="62" width="100" height="44" rx="5" class="pr"/><text x="132" y="80" class="h">adapter</text><text x="132" y="97" class="s">wire only</text>
  <rect x="250" y="62" width="130" height="44" rx="5" class="sv"/><text x="260" y="80" class="m">*vfs.Server</text><text x="260" y="97" class="s">behind vfs.Service</text>
  <rect x="400" y="62" width="126" height="44" rx="5" class="sv"/><text x="410" y="80" class="m">Authenticator</text><text x="410" y="97" class="s">identity (§3.1)</text>
  <rect x="604" y="62" width="142" height="44" rx="5" class="st"/><text x="614" y="80" class="h">metadata store</text><text x="614" y="97" class="s">Secrets, index, records</text>
  <rect x="766" y="62" width="122" height="44" rx="5" class="am"/><text x="776" y="80" class="h">directory, DC</text><text x="776" y="97" class="s">outside the node</text>

  <line x1="54" y1="116" x2="54" y2="580" class="lane"/>
  <line x1="172" y1="116" x2="172" y2="580" class="lane"/>
  <line x1="315" y1="116" x2="315" y2="580" class="lane"/>
  <line x1="463" y1="116" x2="463" y2="580" class="lane"/>
  <line x1="675" y1="116" x2="675" y2="580" class="lane"/>
  <line x1="827" y1="116" x2="827" y2="580" class="lane"/>

  <path d="M56,146 L168,146" class="ln"/>
  <text x="60" y="140" class="s">1 AP-REQ or NTLM</text><text x="60" y="160" class="s">AUTHENTICATE</text>

  <path d="M174,180 L311,180" class="ln"/>
  <text x="180" y="174" class="m">2 SignIn(step)</text><text x="180" y="194" class="s">one round, local</text>

  <path d="M317,214 L459,214" class="ln"/>
  <text x="323" y="208" class="m">3 AcceptKerberos</text><text x="323" y="228" class="m">  or VerifyNTLM</text>

  <path d="M465,248 L671,248" class="ln"/>
  <text x="472" y="242" class="s">4 key: keytab or NT hash</text><text x="472" y="262" class="s">Secret records (RFC 13 §7)</text>

  <path d="M465,282 L823,282" class="cb"/>
  <text x="684" y="276" class="s">or pass-through:</text><text x="684" y="296" class="s">the DC verifies it</text>

  <rect x="398" y="304" width="130" height="38" rx="5" class="sv"/>
  <text x="408" y="320" class="s">5 verify the ticket</text><text x="408" y="335" class="s">and PAC, or NTLMv2</text>

  <path d="M465,372 L671,372" class="ln"/>
  <text x="472" y="366" class="s">6 bind to one principal:</text><text x="472" y="386" class="s">krb row, user name, user SID</text>

  <path d="M465,406 L823,406" class="cb"/>
  <text x="684" y="400" class="s">no record: the</text><text x="684" y="420" class="s">directory, cached</text>

  <path d="M465,440 L671,440" class="ln"/>
  <text x="472" y="434" class="m">7 Minter.CreateUser</text><text x="472" y="454" class="s">a new machine or directory one</text>

  <path d="M463,464 L463,478" class="ex"/>
  <text x="472" y="476" class="e">wrong credential, unknown user,</text>
  <text x="472" y="490" class="e">disabled, throttled → ErrLogonFailure</text>

  <path d="M461,514 L319,514" class="ln"/>
  <text x="323" y="508" class="m">8 Proof, Keys</text><text x="323" y="528" class="s">or the error</text>

  <path d="M313,546 L176,546" class="ln"/>
  <text x="180" y="540" class="m">9 SignInResult</text><text x="180" y="560" class="s">Identity; Keys beside it</text>

  <path d="M170,578 L58,578" class="ln"/>
  <text x="60" y="572" class="s">10 AP-REP, session</text>
  <text x="60" y="594" class="e">error: logon failure,</text><text x="60" y="608" class="e">never guest, anonymous</text>

  <rect x="190" y="572" width="300" height="24" rx="5" class="pr"/>
  <text x="200" y="588" class="s">the adapter keeps it in the connection's security context</text>

  <rect x="14" y="616" width="874" height="26" rx="5" class="sv"/>
  <text x="24" y="633" class="m">Identity { Principal · Proof Secret|Ticket · Protection None, raised per request · Evidence: the Proof }</text>
</svg>
