<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:13px;font-weight:700;fill:#1b1f24}
      .s{font-size:12px;fill:#5b6472}.e{font-size:12px;fill:#b04a4a}.z{font-size:11px;font-weight:700;fill:#5b6472}
      .k{font-size:12px;fill:#1b1f24}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:600;fill:#1b1f24}
      .ms{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .am{fill:#fbf3e4;stroke:#b07a2a;stroke-width:1.3}
      .rd{fill:#fbecec;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .cb{stroke:#3d444d;stroke-width:1.2;fill:none;stroke-dasharray:5 3;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.3;fill:none;marker-end:url(#r)}
      .lane{stroke:#c3c9d0;stroke-width:1;stroke-dasharray:3 3}
      .zone{fill:none;stroke:#9aa3ad;stroke-width:1;stroke-dasharray:4 3}
    </style>
  </defs>
  <rect width="900" height="740" fill="#ffffff"/>
  <text x="16" y="26" class="t">Sign-in: one round at a time, on the node holding the connection; it binds the evidence to one principal.</text>

  <rect x="112" y="38" width="424" height="76" rx="8" class="zone"/>
  <text x="124" y="54" class="z">THE NODE HOLDING THE CONNECTION — NEVER FORWARDED</text>
  <rect x="14" y="62" width="84" height="44" rx="5" class="pr"/><text x="24" y="80" class="h">client</text><text x="24" y="98" class="s">NFS or SMB</text>
  <rect x="122" y="62" width="100" height="44" rx="5" class="pr"/><text x="132" y="80" class="h">adapter</text><text x="132" y="98" class="s">wire only</text>
  <rect x="246" y="62" width="138" height="44" rx="5" class="sv"/><text x="256" y="80" class="m">*vfs.Server</text><text x="256" y="98" class="s">behind vfs.Service</text>
  <rect x="398" y="62" width="130" height="44" rx="5" class="sv"/><text x="408" y="80" class="m">Authenticator</text><text x="408" y="98" class="s">identity (§3.1)</text>
  <rect x="592" y="62" width="166" height="44" rx="5" class="st"/><text x="602" y="80" class="h">store, secret provider</text><text x="602" y="98" class="s">records, index, Secrets</text>
  <rect x="770" y="62" width="120" height="44" rx="5" class="am"/><text x="780" y="80" class="h">directory, DC</text><text x="780" y="98" class="s">outside the node</text>

  <line x1="54" y1="116" x2="54" y2="620" class="lane"/>
  <line x1="172" y1="116" x2="172" y2="620" class="lane"/>
  <line x1="315" y1="116" x2="315" y2="620" class="lane"/>
  <line x1="463" y1="116" x2="463" y2="620" class="lane"/>
  <line x1="675" y1="116" x2="675" y2="620" class="lane"/>
  <line x1="830" y1="116" x2="830" y2="620" class="lane"/>

  <rect x="180" y="122" width="124" height="48" rx="5" class="pr"/>
  <text x="186" y="136" class="s">NTLM NEGOTIATE,</text><text x="186" y="150" class="s">CHALLENGE: here;</text><text x="186" y="164" class="s">the step carries it</text>

  <path d="M56,182 L168,182" class="ln"/>
  <text x="60" y="176" class="s">1 AP-REQ, or</text><text x="60" y="196" class="s">AUTHENTICATE</text>

  <path d="M174,212 L311,212" class="ln"/>
  <text x="180" y="206" class="m">2 SignIn(step)</text><text x="180" y="226" class="s">one round, local</text>

  <path d="M317,242 L459,242" class="ln"/>
  <text x="323" y="236" class="m">3 SignIn(step)</text><text x="323" y="256" class="s">passed straight through</text>

  <rect x="473" y="264" width="188" height="34" rx="5" class="rd"/>
  <text x="481" y="278" class="e">3a throttled (name, address):</text><text x="481" y="292" class="e">ErrLogonFailure, unchecked</text>

  <path d="M465,322 L671,322" class="ln"/>
  <text x="472" y="316" class="s">4 keytab or NT hash</text><text x="472" y="336" class="s">from the secret provider</text>

  <path d="M465,352 L826,352" class="cb"/>
  <text x="684" y="346" class="s">or pass-through:</text><text x="684" y="366" class="s">the DC verifies it</text>

  <rect x="398" y="374" width="130" height="38" rx="5" class="sv"/>
  <text x="408" y="390" class="s">5 verify the ticket</text><text x="408" y="405" class="s">and PAC, or NTLMv2</text>

  <path d="M465,434 L671,434" class="ln"/>
  <text x="472" y="428" class="s">6 bind to one principal:</text><text x="472" y="448" class="s">krb row, name, user SID</text>

  <path d="M465,464 L826,464" class="cb"/>
  <text x="684" y="458" class="s">no record: the</text><text x="684" y="478" class="s">directory, cached</text>

  <path d="M465,494 L671,494" class="ln"/>
  <text x="472" y="488" class="m">7 Minter.CreateUser</text><text x="472" y="508" class="s">a machine or directory one</text>

  <path d="M463,516 L463,530" class="ex"/>
  <text x="472" y="530" class="e">wrong credential, unknown user,</text>
  <text x="472" y="545" class="e">disabled → ErrLogonFailure</text>

  <path d="M461,568 L319,568" class="ln"/>
  <text x="323" y="562" class="m">8 SignInResult</text><text x="323" y="582" class="s">or the error</text>

  <path d="M313,598 L176,598" class="ln"/>
  <text x="180" y="592" class="m">9 SignInResult</text><text x="180" y="612" class="s">Identity; Keys beside it</text>

  <path d="M170,628 L58,628" class="ln"/>
  <text x="60" y="622" class="s">10 AP-REP</text>
  <rect x="200" y="620" width="340" height="24" rx="5" class="pr"/>
  <text x="210" y="636" class="s">the adapter keeps it in the connection's security context</text>
  <text x="60" y="648" class="e">errors: logon failure,</text><text x="60" y="662" class="e">never guest or anonymous</text>

  <rect x="14" y="674" width="874" height="26" rx="5" class="sv"/>
  <text x="24" y="691" class="ms">Identity { Proof Secret|Ticket · Protection None, raised per request · Evidence { Name, Principal, SIDs, DenyOnly, Expires } }</text>
  <text x="16" y="724" class="s">AUTH_SYS and AUTH_NONE never sign in: the adapter builds a Claimed or None Identity directly (§3.2).</text>
</svg>
