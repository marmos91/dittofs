<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<defs><style>
.t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
.l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
.vfs{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.6}.meta{fill:#f3e8d4;stroke:#b08a3e;stroke-width:1.4}
.data{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.4}.ext{fill:#f9fafb;stroke:#c3cad3;stroke-width:1}
.p{fill:#ffffff;stroke:#1b1f24;stroke-width:1.1}.k{fill:#fbefd9;stroke:#a8741f;stroke-width:1.3}.r{fill:#f8e3e6;stroke:#a33a4d;stroke-width:1.3}
.a{fill:#eaf4ec;stroke:#2f6f4f;stroke-width:1.3}
.arr{stroke:#5b6472;stroke-width:1.3;fill:none;marker-end:url(#h)}.dash{stroke:#a33a4d;stroke-width:1.2;stroke-dasharray:5 3;fill:none;marker-end:url(#hr)}
.lane{stroke:#c3cad3;stroke-width:1;stroke-dasharray:3 3}
.garr{stroke:#2f6f4f;stroke-width:1.6;fill:none;marker-end:url(#hg)}.line{stroke:#5b6472;stroke-width:1.3;fill:none}
.rt{font-size:11px;fill:#a33a4d}.gt{font-size:11px;fill:#2f6f4f}
.tail{fill:#ffffff;stroke:#9aa4b2;stroke-width:1;stroke-dasharray:3 2}
.cp{stroke:#1b1f24;stroke-width:2}.jp{stroke:#a8741f;stroke-width:1.6;stroke-dasharray:4 3}
</style><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6472"/></marker><marker id="hr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a33a4d"/></marker><marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6f4f"/></marker></defs>
<rect width="900" height="530" fill="#ffffff"/>
<text x="16" y="26" class="t">A shard's replica set: one primary orders writes, replicas hold copies, the record lives in the metadata store.</text>
<rect x="20" y="44" width="860" height="122" rx="5" class="meta"/>
<text x="34" y="62" class="h">metadata store — the only consensus; a shard record changes only by compare-and-swap</text>
<rect x="36" y="72" width="500" height="84" rx="4" class="p"/>
<text x="48" y="90" class="h">shard record U</text>
<text x="48" y="108" class="m" xml:space="preserve">primary=A  epoch=7  count=3  floor=2</text>
<text x="48" y="124" class="m" xml:space="preserve">replicas: (B, jB, inc 1, J=0,       learner=no)</text>
<text x="48" y="140" class="m" xml:space="preserve">           (C, jC, inc 2, J=v(7,40), learner=yes)</text>
<rect x="556" y="72" width="308" height="84" rx="4" class="p"/>
<text x="568" y="90" class="h">node leases (store time)</text>
<text x="568" y="108" class="m" xml:space="preserve">A: node epoch 3, expires T+9s</text>
<text x="568" y="124" class="m" xml:space="preserve">B: node epoch 5, expires T+8s</text>
<text x="568" y="140" class="m" xml:space="preserve">C: node epoch 2, expires T+9s</text>
<rect x="20" y="250" width="110" height="150" rx="5" class="ext"/>
<text x="30" y="272" class="h">remote tier</text>
<text x="30" y="300" class="s">content ≤</text>
<text x="30" y="316" class="s">committed point,</text>
<text x="30" y="332" class="s">from the primary</text>
<text x="30" y="348" class="s">only</text>
<rect x="180" y="250" width="200" height="150" rx="5" class="ext"/>
<text x="192" y="272" class="h">node A · primary</text>
<text x="192" y="288" class="s">epoch 7; orders, accepts</text>
<text x="192" y="306" class="s">journal jA</text>
<rect x="200" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="216" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="232" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="248" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="264" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="280" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="296" y="314" width="16" height="22" rx="0" class="k"/>
<rect x="312" y="314" width="16" height="22" rx="0" class="k"/>
<rect x="328" y="314" width="16" height="22" rx="0" class="k"/>
<path d="M296 308V344" class="cp"/>
<text x="296" y="358" class="s" text-anchor="middle">committed</text>
<text x="192" y="386" class="s">offers ≤ committed only</text>
<rect x="430" y="250" width="200" height="150" rx="5" class="ext"/>
<text x="442" y="272" class="h">node B · replica</text>
<text x="442" y="288" class="s">persists committed point</text>
<text x="442" y="306" class="s">journal jB</text>
<rect x="450" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="466" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="482" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="498" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="514" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="530" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="546" y="314" width="16" height="22" rx="0" class="k"/>
<rect x="562" y="314" width="16" height="22" rx="0" class="k"/>
<path d="M546 308V344" class="cp"/>
<text x="546" y="358" class="s" text-anchor="middle">committed</text>
<text x="442" y="386" class="s">refuses Apply ≤ committed</text>
<rect x="680" y="250" width="200" height="150" rx="5" class="ext"/>
<text x="692" y="272" class="h">node C · learner</text>
<text x="692" y="288" class="s">joined at J; counts for acks</text>
<text x="692" y="306" class="s">journal jC</text>
<rect x="700" y="314" width="16" height="22" rx="0" class="tail"/>
<rect x="716" y="314" width="16" height="22" rx="0" class="tail"/>
<rect x="732" y="314" width="16" height="22" rx="0" class="tail"/>
<rect x="748" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="764" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="780" y="314" width="16" height="22" rx="0" class="data"/>
<rect x="796" y="314" width="16" height="22" rx="0" class="k"/>
<rect x="812" y="314" width="16" height="22" rx="0" class="k"/>
<rect x="828" y="314" width="16" height="22" rx="0" class="k"/>
<path d="M796 308V344" class="cp"/>
<text x="796" y="358" class="s" text-anchor="middle">committed</text>
<path d="M748 308V344" class="jp"/>
<text x="748" y="358" class="s" text-anchor="middle">J</text>
<text x="692" y="386" class="s">may not take over yet</text>
<path d="M230 248V170" class="arr"/>
<text x="238" y="205" class="s">commits (fenced)</text>
<path d="M330 250V222H780V246" class="arr"/>
<path d="M530 222V246" class="arr"/>
<text x="400" y="215" class="s">operations + committed point</text>
<path d="M780 400V420H300V404" class="arr"/>
<path d="M530 400V420" class="line"/>
<text x="560" y="436" class="s">acks (durable)</text>
<path d="M178 325H132" class="arr"/>
<text x="135" y="318" class="s">offload</text>
<rect x="20" y="456" width="16" height="14" rx="0" class="data"/>
<text x="44" y="467" class="s">≤ committed point: every journal in the replica set holds it, byte-identical</text>
<rect x="20" y="478" width="16" height="14" rx="0" class="k"/>
<text x="44" y="489" class="s">above it: uncertain — journals may differ until the primary commits it or a new primary seals</text>
<rect x="20" y="500" width="16" height="14" rx="0" class="tail"/>
<text x="44" y="511" class="s">learner tail ≤ J: copied to it or offloaded before it may take over</text>
</svg>
