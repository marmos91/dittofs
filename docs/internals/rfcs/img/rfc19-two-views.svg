<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;font-weight:600;fill:#1b1f24;white-space:pre}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.6}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .bad{fill:#f8eaea;stroke:#b04a4a;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a);marker-start:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.1;fill:none;marker-end:url(#r)}
    </style>
  </defs>
  <rect width="900" height="480" fill="#ffffff"/>
  <text x="16" y="26" class="t">One stored ACL, two spellings: the translation changes names and flag bits, never rights or order.</text>

  <rect x="24" y="46" width="410" height="134" rx="6" class="pr"/>
  <text x="38" y="68" class="h">SMB security descriptor — alice-pc, Security tab</text>
  <text x="38" y="94" class="m">D  bob's SID        0x00000116  OI CI</text>
  <text x="38" y="114" class="m">A  alice's SID      0x001F01FF  OI CI</text>
  <text x="38" y="134" class="m">A  builders' SID    0x001301BF  OI CI</text>
  <text x="38" y="160" class="s">principals as SIDs; inherited flag is 0x10; control: protected</text>

  <rect x="466" y="46" width="410" height="134" rx="6" class="pr"/>
  <text x="480" y="68" class="h">NFSv4 acl — build01, nfs4_getfacl</text>
  <text x="480" y="94" class="m">D:fd:bob@example.com:waNT</text>
  <text x="480" y="114" class="m">A:fd:alice@example.com:rwaDdxtTnNcCoy</text>
  <text x="480" y="134" class="m">A:fdg:builders@example.com:rwadxtTnNcy</text>
  <text x="480" y="160" class="s">principals as who; inherited flag is 0x80; g from the kind</text>

  <path d="M229,184 L330,212" class="ln"/>
  <path d="M671,184 L570,212" class="ln"/>

  <rect x="190" y="214" width="520" height="50" rx="6" class="sv"/>
  <text x="206" y="236" class="h">one shared translation, used by both adapters (§5)</text>
  <text x="206" y="254" class="s">spells principals and flag bits; kinds, rights and order cross unchanged</text>

  <path d="M450,266 L450,290" class="ln"/>

  <rect x="190" y="292" width="520" height="116" rx="6" class="st"/>
  <text x="206" y="314" class="h">stored ACL of builds/release — principals by ID, in sent order</text>
  <text x="206" y="340" class="m">1  deny   bob       0x00000116  file + dir inherit</text>
  <text x="206" y="360" class="m">2  allow  alice     0x001F01FF  file + dir inherit</text>
  <text x="206" y="380" class="m">3  allow  builders  0x001301BF  file + dir inherit</text>
  <text x="206" y="400" class="s">flags: protected · Mode implied: 0770</text>

  <path d="M190,350 L120,350 L120,420" class="ex"/>
  <rect x="24" y="424" width="852" height="40" rx="6" class="bad"/>
  <text x="38" y="448" class="e">bob writes, over SMB or NFSv4: entry 1 is walked first and refuses write data → STATUS_ACCESS_DENIED · NFS4ERR_ACCESS</text>
</svg>
