<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:13px;font-weight:700;fill:#1b1f24}
      .l{font-size:12px;fill:#3d444d}.s{font-size:11px;fill:#5b6472}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#1b1f24}
      .fast{fill:#d7ecd9;stroke:#4c8a58;stroke-width:1.5}
      .mid{fill:#dce9f7;stroke:#4a7fb5;stroke-width:1.5}
      .slow{fill:#f4f6f8;stroke:#9aa4b2;stroke-width:1.5}
      .a{stroke:#b04a4a;stroke-width:1.5;fill:none;marker-end:url(#d)}
    </style>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="16" y="26" class="t">Three sources, in decreasing speed and increasing authority.</text>
  <text x="16" y="46" class="s">Any failure demotes to the next. All three must produce an identical placement index.</text>

  <rect x="40" y="76" width="250" height="96" rx="5" class="fast"/>
  <text x="56" y="100" class="h">placement cache</text>
  <text x="56" y="120" class="s">one stat per segment</text>
  <text x="56" y="138" class="s">valid only after a clean</text>
  <text x="56" y="154" class="s">shutdown, segment set unchanged</text>

  <rect x="325" y="76" width="250" height="96" rx="5" class="mid"/>
  <text x="341" y="100" class="h">segment catalogs</text>
  <text x="341" y="120" class="s">one small read per sealed segment</text>
  <text x="341" y="138" class="s">+ a scan of each active segment</text>
  <text x="341" y="154" class="s">always available if written</text>

  <rect x="610" y="76" width="250" height="96" rx="5" class="slow"/>
  <text x="626" y="100" class="h">full scan</text>
  <text x="626" y="120" class="s">touches every record header</text>
  <text x="626" y="138" class="s">cost grows with content held</text>
  <text x="626" y="154" class="s">always works</text>

  <path d="M295,124 L320,124" class="a"/>
  <path d="M580,124 L605,124" class="a"/>
  <text x="212" y="196" class="s" fill="#b04a4a">checksum bad · unclean shutdown · a segment's length changed</text>
  <text x="560" y="196" class="s" fill="#b04a4a">catalog absent or unverifiable</text>

  <line x1="16" y1="228" x2="884" y2="228" stroke="#c3cad3"/>
  <text x="16" y="254" class="l">The active segments are always scanned — they carry no catalog. That bounds the unavoidable work at</text>
  <text x="16" y="274" class="l"><tspan font-weight="600">segment size × append streams</tspan>, whatever the total size of the local tier.</text>
  <text x="16" y="304" class="l">The scan is cheap because <tspan font-weight="600">the records already are the index</tspan>: a header carries FileID, offset,</text>
  <text x="16" y="324" class="l">length and version, and the payload is skipped by its stated length.</text>
  <text x="16" y="354" class="s">This is why no second durable log of the index is permitted — it would duplicate what the records already say.</text>
</svg>
