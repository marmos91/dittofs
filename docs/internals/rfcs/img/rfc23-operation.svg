<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d444d"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b04a4a"/></marker>
    <style>
      .t{font-size:15px;font-weight:600;fill:#1b1f24}.h{font-size:12px;font-weight:700;fill:#1b1f24}
      .s{font-size:11px;fill:#5b6472}.e{font-size:11px;fill:#b04a4a}
      .k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#3d444d}
      .pr{fill:#e8f0f8;stroke:#4a6f96;stroke-width:1.3}
      .sv{fill:#eef5ee;stroke:#4c8a58;stroke-width:1.3}
      .st{fill:#eceff2;stroke:#5b6472;stroke-width:1.3}
      .ln{stroke:#3d444d;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .ex{stroke:#b04a4a;stroke-width:1.3;fill:none;marker-end:url(#r)}
      .lane{stroke:#c3c9d0;stroke-width:1;stroke-dasharray:3 3}
    </style>
  </defs>
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="16" y="26" class="t">Long work is an operation. Its progress is the owner's own cursor, so a crash loses none of it.</text>

  <rect x="40" y="44" width="140" height="32" rx="5" class="pr"/><text x="80" y="65" class="h">client</text>
  <rect x="260" y="44" width="160" height="32" rx="5" class="sv"/><text x="282" y="65" class="h">API, any node</text>
  <rect x="490" y="44" width="160" height="32" rx="5" class="st"/><text x="510" y="65" class="h">metadata store</text>
  <rect x="720" y="44" width="160" height="32" rx="5" class="sv"/><text x="738" y="65" class="h">owner: coordinator</text>
  <line x1="110" y1="78" x2="110" y2="450" class="lane"/>
  <line x1="340" y1="78" x2="340" y2="450" class="lane"/>
  <line x1="570" y1="78" x2="570" y2="450" class="lane"/>
  <line x1="800" y1="78" x2="800" y2="450" class="lane"/>

  <path d="M112,104 L336,104" class="ln"/>
  <text x="122" y="98" class="k">DELETE share, Idempotency-Key</text>

  <path d="M342,134 L566,134" class="ln"/>
  <text x="352" y="128" class="s">one transaction: the mark,</text>
  <text x="352" y="150" class="s">operation record, audit record</text>

  <path d="M338,176 L114,176" class="ln"/>
  <text x="122" y="170" class="k">202, Location: /operations/op_3c</text>

  <path d="M798,212 L574,212" class="ln"/>
  <text x="590" y="206" class="s">each step in its own cursor</text>
  <text x="590" y="228" class="k">files 41,200 / ~90,000</text>

  <path d="M800,250 L800,272" class="ex"/>
  <text x="812" y="266" class="e">crash</text>
  <text x="812" y="290" class="s">restarts and</text>
  <text x="812" y="304" class="s">resumes from</text>
  <text x="812" y="318" class="s">the cursor</text>
  <path d="M798,330 L574,330" class="ln"/>
  <text x="590" y="324" class="s">steps continue, recorded</text>

  <path d="M112,364 L336,364" class="ln"/>
  <text x="122" y="358" class="k">GET /operations/op_3c?wait=30s</text>
  <path d="M342,382 L566,382" class="ln"/>
  <text x="352" y="398" class="s">read the cursor</text>
  <path d="M338,420 L114,420" class="ln"/>
  <text x="122" y="414" class="k">running · phase files · 63,900</text>
  <text x="122" y="440" class="s">same answer from any node, before and after the crash</text>
</svg>
