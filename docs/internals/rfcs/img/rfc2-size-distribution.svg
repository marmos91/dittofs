<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <defs>
    <style>
      .t  { font-size: 15px; font-weight: 600; fill: #1b1f24 }
      .rl { font-size: 12px; font-weight: 600; fill: #1b1f24 }
      .l  { font-size: 12px; fill: #3d444d }
      .s  { font-size: 11px; fill: #5b6472 }
      .m  { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 11px; fill: #1b1f24 }
      .tick { stroke: #9aa4b2; stroke-width: 1 }
      .why  { font-size: 11px; fill: #b04a4a }
      .ok   { font-size: 11px; font-weight: 600; fill: #2f6f4f }
      .dash { stroke: #5b6472; stroke-width: 1; stroke-dasharray: 3 3 }
    </style>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#5b6472" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="900" height="510" fill="#ffffff"/>

  <text x="16" y="26" class="t">The mask pair encodes an 8 KiB target. The profile declares 4 MiB. Min decides everything.</text>
  <text x="16" y="46" class="s">Chunk size, log scale. Measured over 256 MiB of incompressible data, default profile.</text>

  <text x="96"  y="150" class="why">8 KiB &#8212; where</text>
  <text x="96"  y="164" class="why">the masks fire</text>
  <line x1="156" y1="172" x2="156" y2="186" class="dash"/>

  <rect x="591" y="112" width="12" height="78" fill="#4a7fb5"/>
  <text x="622" y="124" class="ok">every chunk lands here</text>
  <text x="622" y="142" class="s">mean 1,078,800 &#183; min 1,048,896 &#183; max 1,210,151</text>
  <text x="622" y="160" class="s">n = 248, and none reached Avg</text>

  <line x1="150" y1="190" x2="850" y2="190" stroke="#1b1f24" stroke-width="1.4"/>
  <g class="tick">
    <line x1="150" y1="190" x2="150" y2="200"/>
    <line x1="341" y1="190" x2="341" y2="200"/>
    <line x1="595" y1="190" x2="595" y2="200"/>
    <line x1="723" y1="190" x2="723" y2="200"/>
    <line x1="850" y1="190" x2="850" y2="200"/>
  </g>
  <text x="136" y="218" class="m">8K</text>
  <text x="329" y="218" class="m">64K</text>
  <text x="585" y="218" class="m">1M</text>
  <text x="713" y="218" class="m">4M</text>
  <text x="836" y="218" class="m">16M</text>

  <text x="566" y="238" class="s">Min</text>
  <text x="705" y="238" class="s">Avg</text>
  <text x="832" y="238" class="s">Max</text>

  <line x1="723" y1="242" x2="723" y2="258" class="dash"/>
  <line x1="850" y1="242" x2="850" y2="258" class="dash"/>
  <text x="640" y="276" class="why">neither is ever reached &#8212; p &#8776; e&#8315;&#8313;&#8310;</text>

  <line x1="164" y1="312" x2="586" y2="312" stroke="#5b6472" stroke-width="1" marker-end="url(#a2)"/>
  <text x="212" y="332" class="s">128&#215; &#8212; the minimum gate fires long before the search can</text>

  <line x1="16" y1="360" x2="884" y2="360" stroke="#c3cad3"/>
  <text x="16" y="386" class="rl">Where 8 KiB comes from</text>

  <text x="16"  y="410" class="m">popcount(MaskS) = 15 = k + 2</text>
  <text x="290" y="410" class="m">popcount(MaskL) = 11 = k &#8722; 2</text>
  <text x="580" y="410" class="m">&#8658;  k = 13,  nl = 2</text>
  <text x="16"  y="432" class="m">target = 2^k = 2^13 = 8192 bytes</text>

  <text x="16" y="458" class="l">A correct FastCDC normalisation-level-2 pair &#8212; for a profile nobody configured.</text>

  <text x="16"  y="482" class="m">mean = Min + 2^15 = 1,081,344 predicted</text>
  <text x="380" y="482" class="m">1,078,800 measured</text>
  <text x="600" y="482" class="m">0.24% apart</text>

  <text x="16" y="504" class="s">So the distribution is Min + Geom(2&#8315;&#185;&#8309;): content-defined chunking replaced by fixed-size chunking plus jitter.</text>
</svg>
